lavra + 0,5s de respiro (cartela de 6 palavras ≈ 2,9s). Cartela que sai antes de terminar a leitura = frustração e abandono.\n- A quebra entre cartelas é dramaturgia: quebre no ponto de tensão (\"eu abri a caixa / e me arrependi na hora\").\n- O fundo nunca compete com o texto: cenas calmas, texto com contraste garantido.\n\nCONTEXTO:\n- Conteúdo: [COLE A HISTÓRIA/LISTA/IDEIA]\n- Cenas de fundo disponíveis: [MEU B-ROLL / IMAGENS / PRODUTO EM CENA]\n- Duração alvo: [EX.: 30s]\n\nEntregue:\n\n1. SEQUÊNCIA DE CARTELAS em tabela:\nNº | TEXTO DA CARTELA (máx. 8 palavras) | TEMPO NA TELA (calculado pela regra) | CENA DE FUNDO (das minhas disponíveis) | POSIÇÃO DO TEXTO (centro / terço superior) | FUNÇÃO (gancho / tensão / virada / resolução / CTA)\n\n2. AS QUEBRAS\nAponte as 2 quebras de maior tensão da sequência e por que quebram ali.\n\n3. IDENTIDADE TIPOGRÁFICA\nDefina o padrão fixo do meu perfil: 1 fonte, 2 tamanhos (normal + ênfase), 1 cor + contorno/fundo de contraste, 1 posição padrão — e a regra: TODO vídeo de texto do perfil usa o mesmo padrão (é a identidade sem rosto).\n\n4. TESTE DO MUDO INVERTIDO\nConfirme: as cartelas em sequência, sem as cenas, contam a narrativa completa? (Neste formato, o texto sozinho deve funcionar — as cenas enriquecem.)","e":"de preenchimento:**\n• Conteúdo: história da entrevista perdida, versão sem voz\n• Cenas: b-roll do quarto, caixas, closet\n• Duração: 30s","u":"1. Respeite os tempos calculados na edição — o erro nº 1 do formato é cartela rápida demais.\n2. Defina a identidade tipográfica UMA vez e nunca mais mude por impulso.\n3. Cenas do #107 + cartelas deste prompt = o formato mais barato do faceless.\n4. O teste do mudo invertido é o controle de qualidade: reprove o vídeo que falhar.","p":"Multiplataforma"},{"n":"109","t":"Conteúdo Produzido com IA (pipeline zero-câmera)","m":9,"mn":"CONTEÚDO FACELESS","o":"Montar o pipeline 100% IA: para quem não tem o produto em mãos nem pode filmar — tudo gerado (Módulo 7 + Módulo 8) e montado no editor. Com a honestidade que esse cenário exige embutida: sem o produto em mãos, você não tem experiência para relatar — o prompt limita o conteúdo ao que as fontes reais sustentam (página do vendedor, avaliações) e proíbe encenar vivência que não houve. Use sabendo o custo: é o formato viável, não o ideal.","q":"Criadores faceless • Usuários que trabalham com IA • Afiliados sem produto em mãos","i":":**\n• Produto e as fontes reais que você tem (fotos da página, ficha, avaliações do #011)\n• Suas ferramentas de IA\n• A ideia do vídeo","c":"Atue como um produtor de vídeos 100% gerados por IA para social commerce — o pipeline de quem não pode filmar nada.\n\nREGRAS DE HONESTIDADE DESTE PIPELINE (obrigatórias):\n- Sem o produto em mãos, NÃO existe experiência pessoal: proibido roteirizar \"eu uso\", \"testei\", \"mudou minha rotina\" — isso seria depoimento falso.\n- O conteúdo se limita ao que as fontes reais sustentam: a ficha do produto, as fotos oficiais da página e as avaliações reais de compradores (citadas como \"compradores relatam...\").\n- Formatos compatíveis com este pipeline: apresentação de produto, curiosidade/educativo do nicho, listas, leitura de avaliações, problema→solução genérico. Formatos PROIBIDOS aqui: review pessoal, depoimento, teste, unboxing \"meu\".\n- Rotulagem de conteúdo gerado por IA: verificar as regras atuais no app antes de publicar.\n\nCONTEXTO:\n- Produto e fontes reais: [FICHA + FOTOS DA PÁGINA + AVALIAÇÕES COLADAS]\n- Minhas ferramentas: [EX.: Nano Banana, Kling, CapCut, voz de IA]\n- Ideia do vídeo: [COLE]\n\nEntregue:\n\n1. VALIDAÇÃO DA IDEIA\nA ideia é compatível com as regras acima? Se não (ex.: pede experiência pessoal), converta-a para a versão compatível mais próxima e explique a conversão.\n\n2. PIPELINE em tabela:\nETAPA | O QUE GERAR | FERRAMENTA E PROMPT DESTE EBOOK A USAR (#082–#103) | OBSERVAÇÃO DE FIDELIDADE (as fotos da página são a referência do produto)\n\n3. ROTEIRO COMPATÍVEL\nO roteiro do vídeo (formato padrão do Módulo 5) usando apenas as fontes reais — com as citações de avaliações marcadas como citações.\n\n4. O DEGRAU SEGUINTE\nEm 3 frases: por que conseguir o produto em mãos (comprando 1 unidade do que validar) multiplica as possibilidades — e qual seria o primeiro vídeo com produto real.","e":"de preenchimento:**\n• Produto: luminária de leitura; fotos da página, ficha, 15 avaliações\n• Ferramentas: Nano Banana, Kling, CapCut, voz de IA\n• Ideia: \"3 motivos pelos quais compradores amam essa luminária\"","u":"1. A validação da seção 1 é o portão: ideia incompatível não passa maquiada.\n2. Este pipeline serve para VALIDAR produtos antes de investir — deu sinal, compre 1 unidade e suba de nível (#025, #034).\n3. As avaliações citadas são sempre atribuídas (\"compradores relatam\"), nunca encenadas como suas.\n4. Confira a rotulagem de IA no app a cada publicação.","p":"Nano Banana"},{"n":"110","t":"Vídeo com Voz Artificial","m":9,"mn":"CONTEÚDO FACELESS","o":"Produzir narração com voz de IA que não soa robô: a escrita adaptada à voz sintética (pontuação como controle de entonação, frases curtas, armadilhas de pronúncia resolvidas), a escolha de voz coerente com o perfil e a mixagem que humaniza. Use quando não narra com a própria voz — sabendo que a regra de rotulagem de IA do app se aplica.","q":"Criadores faceless • Usuários que trabalham com IA","i":":**\n• A narração (do #105, se já tiver)\n• O tom do perfil\n• Palavras difíceis do seu conteúdo (nomes de produto, siglas)","c":"Atue como um especialista em narração com voz sintética (TTS) para vídeo curto.\n\nO que muda na escrita para voz de IA:\n- A pontuação é o controle de entonação: vírgula = pausa curta, ponto = pausa e queda de tom, interrogação = subida. Pontue MAIS do que a gramática pede.\n- Frases de no máximo 10 palavras (voz sintética se perde em frases longas).\n- Números por extenso (\"vinte e quatro horas\", não \"24h\"), siglas separadas se devem ser soletradas, e palavras estrangeiras/nomes de produto grafados foneticamente se a voz errar (\"air fryer\" → testar; se errar, \"érr fráier\").\n\nCONTEXTO:\n- Narração base: [COLE DO #105 OU O CONTEÚDO]\n- Tom do perfil: [CALMO / ENERGÉTICO / DIDÁTICO]\n- Palavras difíceis do meu conteúdo: [LISTE]\n\nEntregue:\n\n1. NARRAÇÃO ADAPTADA PARA TTS\nO texto reescrito com a pontuação de controle e as frases no limite — pronto para colar na ferramenta de voz.\n\n2. GLOSSÁRIO FONÉTICO\nAs palavras difíceis com a grafia fonética alternativa, para eu substituir SE a voz errar no teste.\n\n3. GUIA DE ESCOLHA DA VOZ\nOs 4 critérios para escolher a voz na minha ferramenta: idioma/sotaque coerente com o público, energia compatível com meu tom, naturalidade nas pausas (testar com a primeira frase), e CONSTÂNCIA — a mesma voz em todos os vídeos do perfil (a voz é a identidade sem rosto). Não cite vozes específicas de ferramentas: os catálogos mudam.\n\n4. HUMANIZAÇÃO NA MIXAGEM\n4 ajustes de edição que tiram o \"cheiro de robô\": trilha baixa constante por baixo (-20 a -25dB relativos), som ambiente sutil, cortar respiros artificiais longos, e NUNCA acelerar a voz sintética (o robô aparece na aceleração).\n\n5. LEMBRETE DE CONFORMIDADE\nVerificar no app as regras atuais de rotulagem de conteúdo/voz gerados por IA — e cumpri-las.","e":"de preenchimento:**\n• Narração: a do POV do umidificador (#105)\n• Tom: calmo\n• Palavras difíceis: \"umidificador ultrassônico\", \"aromaterapia\"","u":"1. Gere a primeira frase em 2–3 vozes candidatas e escolha ouvindo — depois, casamento: mesma voz para sempre.\n2. Teste o glossário fonético palavra a palavra antes do vídeo completo.\n3. A mixagem da seção 4 é metade da naturalidade — não publique a voz \"crua\".\n4. Rotulagem de IA: confira e cumpra, a cada vídeo.","p":"ChatGPT"},{"n":"111","t":"Storytelling Faceless","m":9,"mn":"CONTEÚDO FACELESS","o":"Contar a sua história real sem aparecer: a conversão do roteiro narrativo (#062) em produção filmável com celular — reencenação em POV e mãos, objetos da história como protagonistas, closes que carregam emoção sem rosto. A alternativa filmável ao #100 (que gera as cenas com IA): aqui, sua casa e suas mãos contam. Use para as histórias do seu plano de conexão.","q":"Criadores faceless • Criadores de conteúdo","i":":**\n• A história estruturada (#031/#062)\n• A narração ou as cartelas (com voz: #105; sem voz: #108)\n• O que você pode reencenar (objetos, lugares da história)","c":"Atue como um diretor de storytelling faceless — histórias contadas por mãos, objetos e pontos de vista, sem rosto em cena.\n\nPrincípio: sem o rosto, a emoção mora nos OBJETOS e nos GESTOS. A xícara fria conta o cansaço; a mão que hesita na maçaneta conta o medo; a caixa fechada há 2 meses conta a bagunça da vida. Sua tarefa: traduzir cada beat emocional da história em uma cena de objeto/gesto filmável.\n\nCONTEXTO:\n- História: [COLE DO #062]\n- Narração ou cartelas: [COLE — E INDIQUE: COM VOZ / SEM VOZ]\n- O que posso reencenar: [OBJETOS E LUGARES DA HISTÓRIA QUE TENHO — ex.: as caixas da mudança já não tenho; o closet sim]\n\nEntregue:\n\n1. TRADUÇÃO EMOCIONAL em tabela:\nBEAT DA HISTÓRIA | EMOÇÃO | CENA DE OBJETO/GESTO (filmável com o que tenho) | ENQUADRAMENTO (POV / close de mãos / plano do ambiente) | O QUE A NARRAÇÃO/CARTELA DIZ POR CIMA\nRegra: a cena nunca ilustra literalmente a frase (frase: \"eu me atrasei\" + cena: relógio = redundância; cena melhor: mãos revirando gaveta em pânico).\n\n2. O OBJETO-FIO\nEscolha 1 objeto da história para atravessar o vídeo inteiro (aparece no início, na virada e no fim, em estados diferentes) — o protagonista sem rosto.\n\n3. SUBSTITUIÇÕES\nPara os elementos da história que não tenho mais (ex.: as caixas), a reencenação aproximada honesta OU a solução visual alternativa (cartela, foto real da época se existir) — sem encenar o que quebraria a verdade da história.\n\n4. LISTA DE FILMAGEM\nOs planos agrupados por cenário, com os 2 takes de segurança do beat da virada.","e":"de preenchimento:**\n• História: a entrevista perdida\n• Narração: com voz (#105)\n• Posso reencenar: o closet, a camisa, o celular com alarme; caixas não tenho mais","u":"1. A tabela de tradução é o coração: cena que só ilustra a frase é cena desperdiçada.\n2. Filme o objeto-fio com capricho nos 3 estados — ele costura o vídeo.\n3. Grave a narração antes (#105) e filme ouvindo-a: o gesto sincroniza melhor.\n4. Compare com o #100 (versão IA): para histórias domésticas, a versão filmada quase sempre ganha em verdade.","p":"ChatGPT"},{"n":"112","t":"Vídeos de Curiosidade (produção faceless)","m":9,"mn":"CONTEÚDO FACELESS","o":"Produzir as curiosidades verificadas (#032) no formato faceless: a estrutura visual da revelação (pergunta → palpite errado → prova em cena), com prioridade absoluta para as curiosidades que você prova na câmera com teste caseiro — a versão do formato que não depende de fonte externa e rende os melhores closes. Use como conteúdo de alcance do perfil.","q":"Criadores faceless • Afiliados","i":":**\n• As curiosidades JÁ VERIFICADAS (#032 — só as checadas)\n• Quais você pode provar com teste caseiro\n• Recursos (voz, texto na tela, b-roll)","c":"Atue como um produtor de vídeos de curiosidade faceless. Regra de entrada: só trabalho com curiosidades que o criador declara já ter VERIFICADO — não checo por ele e não adiciono curiosidades novas.\n\nEstrutura visual do formato:\n- PERGUNTA-GANCHO em cena (0–3s): a pergunta instalada com imagem, não só texto\n- PALPITE ERRADO COMUM (3–7s): o que todo mundo acha — encenado ou em cartela\n- REVELAÇÃO (7–15s): a resposta\n- PROVA (15–25s): a demonstração — teste caseiro na câmera quando possível (a versão mais forte), ou a visualização da explicação\n- PONTE/CTA (últimos segundos): a conexão com o produto SE for natural (#032, seção 2) — ou o fechamento de valor puro\n\nCONTEXTO:\n- Curiosidades verificadas: [COLE — SÓ AS CHECADAS]\n- Posso provar com teste caseiro: [QUAIS E COMO]\n- Recursos: [VOZ / TEXTO NA TELA / MEU B-ROLL / PRODUTO EM MÃOS]\n\nEntregue:\n\n1. PRODUÇÃO POR CURIOSIDADE em tabela (para as 3 melhores):\nBLOCO DA ESTRUTURA | CENA (filmável com meus recursos) | NARRAÇÃO OU CARTELA | TEMPO\nPriorize no topo as que têm teste caseiro.\n\n2. O TESTE COMO ESPETÁCULO\nPara as testáveis: a encenação do teste que maximiza o momento de prova (o close certo, o ângulo, o elemento de comparação em cena).\n\n3. SÉRIE DE CURIOSIDADE\nComo padronizar essas produções numa série reconhecível (\"Você sabia?\" do meu nicho): a abertura fixa, a cartela padrão, a frequência — ponte para o #037.\n\n4. HONESTIDADE DO RESULTADO\nSe o teste caseiro contrariar a curiosidade: publica-se o resultado real (\"testei e não é bem assim\") — que é, aliás, um vídeo ainda melhor. Estruture também esse desfecho para as testáveis.","e":"de preenchimento:**\n• Curiosidades: \"faca cega causa mais acidentes\" (verificada em fonte de segurança doméstica); \"afiar no fundo da caneca funciona\" (testável)\n• Teste caseiro: a da caneca, com tomate como prova de corte\n• Recursos: voz própria, produto em mãos","u":"1. Só entram curiosidades checadas — a trava do #032 continua valendo aqui.\n2. Priorize as testáveis: prova própria > citação, sempre.\n3. A seção 4 não é enfeite: teste que desmente rende mais que teste que confirma.\n4. Série montada (seção 3) = alcance recorrente para o perfil inteiro.","p":"ChatGPT"},{"n":"113","t":"Demonstração Faceless (ofício de mãos + produto)","m":9,"mn":"CONTEÚDO FACELESS","o":"Dominar a técnica da demonstração só com as mãos: posição e \"atuação\" das mãos, os apoios de celular que substituem tripé, os ângulos que valorizam produto pequeno, e os erros clássicos (sombra da própria mão, foco caçando, unha por fazer em close). Converte o roteiro de demonstração (#060) na execução física do formato mais vendedor do faceless. Use como manual permanente de gravação.","q":"Criadores faceless • Afiliados • Vendedores","i":":**\n• O roteiro de demonstração (#060)\n• O produto (tamanho, tipo de manuseio)\n• Seu setup (celular, apoios, luz disponível)","c":"Atue como um diretor técnico de demonstrações \"mãos + produto\" para vídeo vertical. Sua especialidade: a execução física — mãos, câmera, luz — que separa a demonstração amadora da profissional, tudo com celular.\n\nCONTEXTO:\n- Roteiro da demonstração: [COLE DO #060]\n- Produto: [TAMANHO E COMO SE MANUSEIA — ex.: cabe na palma, exige as duas mãos, tem botão pequeno]\n- Meu setup: [CELULAR + O QUE TENHO DE APOIO E LUZ — ex.: janela, luminária, pilha de livros]\n\nEntregue:\n\n1. PLANTA DE GRAVAÇÃO por cena do roteiro, em tabela:\nCENA | POSIÇÃO DA CÂMERA (altura, ângulo, distância — descreva o apoio improvisado com o que tenho) | POSIÇÃO E AÇÃO DAS MÃOS | LUZ (de onde vem, o que evitar) | ARMADILHA DESTA CENA (o erro provável e a prevenção)\n\n2. A ATUAÇÃO DAS MÃOS\n6 regras do ofício: movimentos 30% mais lentos que o natural (câmera acelera a percepção), segurar sem cobrir o logo, apontar com o dedo o detalhe ANTES do close, mãos entram e saem do quadro com intenção (nunca \"flutuando\"), pele e unhas como estão — limpas e reais (não precisa manicure, precisa higiene), e ensaiar o gesto 2 vezes antes do take.\n\n3. OS 5 ERROS CLÁSSICOS DO FORMATO\nSombra da própria mão sobre o produto, foco caçando entre mão e fundo (travar foco no produto), produto pequeno perdido no quadro (aproximar mais do que parece necessário), tremor de segurar o celular com uma mão (apoiar sempre), e demonstrar de frente para si em vez de para a câmera — com a correção de cada um NO MEU setup.\n\n4. SETUP DE 5 MINUTOS\nO passo a passo de montagem do meu set com o que tenho, na ordem, para repetir idêntico em toda gravação (a repetição do set é identidade visual).","e":"de preenchimento:**\n• Roteiro: demonstração do abridor de potes (#060)\n• Produto: cabe na palma, gira com uma mão\n• Setup: celular, janela lateral, pilha de livros, luminária de mesa","u":"1. Monte o set pela seção 4 e fotografe-o montado — é o seu mapa de remontagem.\n2. Ensaie o gesto de cada cena 2 vezes; grave na 3ª.\n3. Revise os 5 erros clássicos ANTES de cada sessão até virarem reflexo.\n4. Este manual + o roteiro do #060 = a dupla permanente das suas demonstrações.","p":"ChatGPT"},{"n":"114","t":"Série Faceless de Ranking","m":9,"mn":"CONTEÚDO FACELESS","o":"Montar a máquina de episódios de ranking: a série faceless \"top 5 / do pior ao melhor\" com molde fixo (abertura, cartelas de contagem, ritmo) que transforma seu acervo de produtos e b-roll em episódios semanais produzidos em lote — a série mais barata de sustentar no faceless. Consome os conceitos de lista (#038) e fecha o módulo com produção recorrente.","q":"Criadores faceless • Afiliados","i":":**\n• O conceito de lista escolhido (#038)\n• Seu inventário (produtos e itens que conhece, b-roll disponível)\n• Frequência desejada e recursos (voz/texto)","c":"Atue como um produtor de séries de ranking faceless. Objetivo: um MOLDE de episódio tão definido que produzir o episódio 7 custe metade do episódio 1 — e o público reconheça a série em 2 segundos.\n\nCONTEXTO:\n- Conceito de lista: [COLE DO #038 — com a regra de posicionamento do produto]\n- Meu inventário: [PRODUTOS/ITENS QUE CONHEÇO + B-ROLL/IMAGENS QUE TENHO]\n- Frequência: [EX.: 1 episódio/semana] | Recursos: [VOZ PRÓPRIA / VOZ IA / TEXTO NA TELA]\n\nEntregue:\n\n1. O MOLDE DO EPISÓDIO em tabela:\nBLOCO | DURAÇÃO FIXA | O QUE ACONTECE | ELEMENTO FIXO DA SÉRIE (idêntico em todo episódio)\nEstrutura: abertura-assinatura (2s, sempre igual) → promessa do ranking (3s) → contagem regressiva com [TEMPO FIXO] por item, cada item com cartela de posição padronizada + cena/imagem + 1 frase de veredito → o nº 1 com 2x o tempo dos demais (o clímax) → CTA padrão da série.\n\n2. IDENTIDADE DA SÉRIE\nOs 5 elementos fixos: nome da série (curto, repetível), cartela de contagem (visual descrito), som/frase de transição entre posições, a abertura-assinatura, e o CTA de fechamento — todos definidos AGORA e imutáveis.\n\n3. OS 4 PRIMEIROS EPISÓDIOS\nCom meu inventário: tema de cada episódio, os itens ranqueados (com a posição do meu produto-link seguindo a regra do #038), e o \"item polêmico\" de cada um.\n\n4. PRODUÇÃO EM LOTE\nComo gravar/gerar 4 episódios numa sessão: as capturas comuns, a ordem de trabalho, e o que muda entre episódios (só o conteúdo — o molde nunca).\n\n5. TERMÔMETRO DA SÉRIE\nOs 2 sinais para acompanhar por episódio (retenção até o nº 1 e comentários discordando do ranking) e o que cada um pede.","e":"de preenchimento:**\n• Conceito: \"do menos ao mais útil da minha mesa de home office\" (#038)\n• Inventário: 8 itens de mesa que uso, b-roll da mesa (#107)\n• Frequência: 1/semana | Recursos: texto na tela","u":"1. Defina a identidade (seção 2) e congele — série que muda de cara a cada episódio não é série.\n2. Produza os 4 primeiros em lote antes de publicar o 1º.\n3. Comentário discordando do ranking é o combustível: responda com o #070.\n4. Série rodando = o piso de consistência do perfil garantido; o resto do calendário cria por cima.","p":"ChatGPT"},{"n":"115","t":"Analisador de Desempenho","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"O relatório periódico do perfil: você cola os números dos últimos vídeos e recebe o diagnóstico organizado — padrões por formato, ângulo e produto, a comparação contra a SUA linha de base (não contra números mágicos da internet), e a lista honesta do que os dados ainda não conseguem afirmar. É o primeiro prompt de todo ciclo de análise.","q":"Afiliados • Criadores de conteúdo • Vendedores • Criadores faceless","i":":**\n• A tabela dos seus vídeos do período (título/tema, formato, gancho usado, visualizações, retenção média, curtidas, comentários, cliques/vendas se tiver)\n• O período analisado\n• Seu contexto (tamanho da conta, há quanto tempo posta)","c":"Atue como um analista de dados de conteúdo para social commerce. Você trabalha APENAS com os números que eu colar — não estime, não complete, não compare com \"médias da plataforma\" que você não tem como conhecer.\n\nMEUS DADOS DO PERÍODO:\n[COLE A TABELA — para cada vídeo: tema, formato, gancho, produto, visualizações, retenção média ou % que assistiu até o fim, curtidas, comentários, salvamentos, cliques no link / vendas SE eu tiver esses dados]\nPERÍODO: [EX.: últimos 14 dias]\nCONTEXTO: [TAMANHO DA CONTA + HÁ QUANTO TEMPO POSTO + QUANTOS VÍDEOS POR SEMANA]\n\nEntregue:\n\n1. LINHA DE BASE\nCalcule as MINHAS médias do período (visualizações, retenção, engajamento por vídeo) — o régua contra a qual cada vídeo se mede. Deixe claro: a comparação é interna, não contra números externos.\n\n2. ACIMA E ABAIXO DA LINHA\nOs vídeos acima e abaixo da minha linha de base, com a distância percentual de cada um.\n\n3. PADRÕES (com o rigor da amostra)\nO que se repete entre os vídeos acima da linha? E entre os abaixo? Agrupe por formato, gancho, produto e tema. REGRA: padrão exige 3+ ocorrências; com menos, rotule como INDÍCIO A OBSERVAR, não como padrão.\n\n4. O QUE OS DADOS NÃO DIZEM\nListe explicitamente as perguntas que ESTA amostra não responde (ex.: \"se o formato X converte melhor — só 1 vídeo tem dado de clique\") — e o que coletar para responder.\n\n5. TRÊS DECISÕES\nAs 3 ações mais defensáveis pelos dados para o próximo ciclo, cada uma no formato: DECISÃO → EVIDÊNCIA QUE A SUSTENTA → COMO SABEREI SE FUNCIONOU. Sem prometer resultado: são apostas informadas.\n\nSe a minha tabela estiver incompleta demais para qualquer análise séria, diga isso e me devolva o modelo de tabela mínimo para eu preencher.","e":"de preenchimento:**\n• Tabela: 10 vídeos com tema, formato, retenção e views\n• Período: 14 dias\n• Contexto: conta de 400 seguidores, posto há 6 semanas, 5 vídeos/semana","u":"1. Monte a tabela direto do painel da plataforma — 15 minutos que valem o ciclo inteiro.\n2. Aceite os \"INDÍCIOS\" como indícios: a disciplina de amostra é o que separa análise de achismo.\n3. As \"três decisões\" entram no plano da próxima quinzena (#016/#121).\n4. Rode a cada 7–14 dias e guarde os relatórios: a comparação entre ciclos é onde a evolução aparece.","p":"Claude"},{"n":"116","t":"Identificador de Conteúdos Promissores","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"O detector de sinal: entre os vídeos do período, quais merecem investimento (variações, sequência, série) e quais foram sorte de distribuição — separados por critérios que resistem ao entusiasmo: desempenho relativo à linha de base, QUALIDADE do engajamento (comentário de intenção vale mais que curtida) e repetição do sinal. Use logo após o #115.","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\n• O relatório do #115 (ou a tabela de dados)\n• Os comentários dos vídeos acima da linha (colados)\n• Sua capacidade de produção da próxima quinzena","c":"Atue como um identificador de conteúdo promissor. Sua função: separar SINAL (o que merece investimento) de RUÍDO (pico de sorte) entre os vídeos que performaram acima da linha de base.\n\nCritérios de sinal, em ordem de peso:\n1. QUALIDADE DO ENGAJAMENTO: comentários de intenção (\"onde compra?\", \"preço?\", \"funciona pra X?\") > comentários de identificação (\"sou eu\") > curtidas. Salvamentos e compartilhamentos pesam mais que curtidas.\n2. RETENÇÃO RELATIVA: vídeo retido acima da minha média indica que o CONTEÚDO segurou (não só a distribuição empurrou).\n3. REPETIÇÃO: o mesmo elemento (gancho, formato, ângulo) acima da linha em 2+ vídeos vale mais que 1 pico isolado.\nUm pico de visualizações com engajamento raso e retenção média = provável distribuição de sorte, não conteúdo validado.\n\nCONTEXTO:\n- Relatório/dados: [COLE DO #115]\n- Comentários dos vídeos acima da linha: [COLE]\n- Minha capacidade na próxima quinzena: [EX.: 8 vídeos]\n\nEntregue:\n\n1. VEREDITO POR VÍDEO (os acima da linha), em tabela:\nVÍDEO | SINAIS A FAVOR (pelos critérios) | SINAIS CONTRA | VEREDITO: INVESTIR / OBSERVAR (repetir 1x e reavaliar) / PROVÁVEL SORTE\n\n2. O ELEMENTO VENCEDOR\nSe houver repetição: qual ELEMENTO específico (não o vídeo inteiro) os dados apontam como motor — rotulado como HIPÓTESE.\n\n3. PLANO DE INVESTIMENTO\nPara os vídeos \"INVESTIR\": a alocação da minha capacidade — quantos vídeos de variação (#069/#101), sequência (#080) ou série (#037) cada um recebe, dentro do meu limite de produção.\n\n4. A ARMADILHA DO PICO\nEm 3 frases: o erro de reorientar o perfil inteiro atrás de 1 vídeo que estourou — e o que fazer com um pico isolado (1 repetição controlada, não uma guinada).","e":"de preenchimento:**\n• Relatório: o do #115\n• Comentários: 20 colados dos 3 vídeos acima da linha\n• Capacidade: 8 vídeos","u":"1. Cole os comentários de verdade — a qualidade do engajamento é o critério que mais decide.\n2. Vereditos \"OBSERVAR\" ganham exatamente 1 repetição antes de nova avaliação.\n3. O \"elemento vencedor\" (não o vídeo) é o que se replica — leve-o ao #117 e ao #069.\n4. Releia a \"armadilha do pico\" no dia em que um vídeo seu estourar. Você vai precisar.","p":"Multiplataforma"},{"n":"117","t":"Criador de Novas Versões (consertar e relançar)","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"O remake orientado por dados: para o vídeo de sinal PARCIAL — reteve mas não converteu, prendeu no início e sangrou no meio — este prompt cruza os números com o roteiro, localiza a peça fraca e prescreve a nova versão consertada. Difere do #069 (que multiplica o que já funciona): aqui se conserta o que quase funcionou. Use nos vídeos \"OBSERVAR\" do #116.","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\n• O roteiro/descrição do vídeo publicado\n• Os números dele (com a curva de retenção descrita, se tiver)\n• Os comentários recebidos\n• O que você esperava que acontecesse","c":"Atue como um médico de vídeos: diagnóstico pela combinação sintoma (números) + anatomia (roteiro), e a prescrição da nova versão.\n\nCONTEXTO:\n- Roteiro/descrição do vídeo publicado: [COLE A TABELA OU DESCREVA CENA A CENA]\n- Números: [VISUALIZAÇÕES, RETENÇÃO (descreva a curva se tiver: onde cai), CURTIDAS, COMENTÁRIOS, CLIQUES/VENDAS SE HOUVER]\n- Comentários recebidos: [COLE]\n- O que eu esperava: [EX.: mais cliques / mais retenção no meio]\n\nEntregue:\n\n1. DIAGNÓSTICO POR SINTOMA\nCruze cada sintoma com a anatomia, usando o mapa:\n- Retenção despenca em 0–3s → problema de gancho (frase, cena ou incompatibilidade gancho×miniatura)\n- Cai no meio → o trecho correspondente do roteiro está lento, redundante ou quebrou a promessa\n- Alta retenção + baixo engajamento → faltou motivo para reagir (pergunta, polêmica leve, identificação)\n- Alta retenção + comentários + POUCOS cliques → CTA fraco/atrasado, ou público de curiosos (ângulo atrai quem não compra)\n- Tudo bem exceto visualizações → 1 repetição controlada antes de concluir (distribuição varia)\nAponte O TRECHO EXATO do roteiro correspondente a cada sintoma encontrado.\n\n2. A PEÇA FRACA\nA única mudança de maior alavancagem (uma — não cinco), com a evidência.\n\n3. A NOVA VERSÃO\nO roteiro consertado (tabela padrão do Módulo 5): a peça fraca reescrita, TODO O RESTO PRESERVADO — para o relançamento ser um teste limpo da correção.\n\n4. PROTOCOLO DE RELANÇAMENTO\nQuando publicar a nova versão (espaçamento do original), com qual legenda (#072, versão para repostagem) e o que comparar entre as duas para saber se o conserto funcionou.\n\nSe os números colados forem insuficientes para diagnóstico (sem retenção, por exemplo), diga qual dado coletar antes.","e":"de preenchimento:**\n• Roteiro: o 30s do dispenser\n• Números: retenção boa até 20s, queda no CTA; 14 \"onde compra?\", 3 cliques\n• Comentários: colados\n• Esperava: mais cliques","u":"1. Descreva a curva de retenção com o cuidado que puder — é o raio-X do diagnóstico.\n2. Uma peça consertada por versão: a regra do teste limpo vale aqui também.\n3. Compare original × conserto pelo protocolo — e registre a lição no seu caderno de aprendizados.\n4. Consertou e funcionou? Agora sim: #069 multiplica.","p":"Claude"},{"n":"118","t":"Melhorador de Retenção","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"A leitura especializada da curva de retenção: cada tipo de queda (o penhasco inicial, a sangria constante, o degrau no meio, o abandono pré-CTA) tem causa e conserto próprios. Você descreve a curva ponto a ponto; o prompt mapeia cada queda ao momento do vídeo e prescreve a correção — inclusive as que se resolvem só na edição, sem regravar. Use nos vídeos importantes do perfil.","q":"Criadores de conteúdo • Afiliados • Criadores faceless","i":":**\n• A curva de retenção descrita (os pontos e quedas que o painel mostra)\n• O roteiro/descrição sincronizada (o que acontece em cada segundo)\n• A duração do vídeo","c":"Atue como um especialista em retenção de vídeo curto. Trabalho: sobrepor a curva de retenção ao conteúdo segundo a segundo e prescrever o conserto de cada queda.\n\nTipologia das quedas (use no diagnóstico):\n- PENHASCO INICIAL (queda forte em 0–3s): gancho não cumpre a função — frase fraca, quadro parado, promessa vaga\n- SANGRIA CONSTANTE (declínio uniforme sem quedas marcadas): ritmo — cenas longas, fala redundante com a imagem, falta de mudança a cada 3–4s\n- DEGRAU (queda localizada no meio): o momento exato quebrou algo — promessa traída, digressão, cena confusa, transição brusca\n- ABANDONO PRÉ-CTA (queda nos segundos finais): o público sente o \"comercial chegando\" — CTA telegrafado ou conteúdo esgotado antes do fim\n- PLATÔ COM REPICO (sobe no fim): loop funcionando ou revezamento — sinal bom a entender e repetir\n\nCONTEXTO:\n- Curva descrita: [PONTO A PONTO — ex.: 100% → 72% aos 3s → declínio suave até 60% aos 15s → queda a 41% aos 19s → 35% no fim]\n- O que acontece no vídeo, sincronizado: [COLE O ROTEIRO COM TEMPOS ou descreva segundo a segundo]\n- Duração: [EX.: 28s]\n\nEntregue:\n\n1. LAUDO DA CURVA em tabela:\nTRECHO | QUEDA (tipo, da tipologia) | O QUE ACONTECE NO VÍDEO ALI | CAUSA PROVÁVEL | CONSERTO\nPara cada conserto, marque: RESOLVE NA EDIÇÃO (corte, acelerar trecho, adiantar cena) ou EXIGE REGRAVAR.\n\n2. O CORTE DE MAIOR RETORNO\nSe eu só puder fazer UMA intervenção: qual, e o ganho esperado (qualitativo — sem prometer números).\n\n3. A VERSÃO EDITADA\nA nova linha do tempo do vídeo com os consertos \"de edição\" aplicados (o que sai, o que encurta, o que muda de lugar) — executável hoje, sem câmera.\n\n4. LIÇÃO PARA OS PRÓXIMOS\nA regra de retenção que ESTE laudo ensina para os próximos roteiros (1 frase, para o meu caderno de aprendizados).","e":"de preenchimento:**\n• Curva: 100% → 68% aos 3s → estável até 12s → degrau a 45% aos 14s → 38% no fim\n• Sincronizado: aos 14s entra a explicação técnica do material\n• Duração: 26s","u":"1. Transcreva a curva do painel com paciência — a precisão do laudo depende da precisão dos pontos.\n2. Execute primeiro os consertos \"de edição\": retorno imediato sem custo de gravação.\n3. O \"corte de maior retorno\" primeiro; os demais, se sobrar fôlego.\n4. Acumule as \"lições\" num caderno — em 2 meses você terá o SEU manual de retenção.","p":"Claude"},{"n":"119","t":"Melhorador de Hook","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"O laboratório comparativo de ganchos: cruza os dados de retenção inicial (0–3s) de VÁRIOS vídeos com os ganchos usados em cada um, e revela qual MECANISMO funciona com o seu público — a resposta que o Módulo 4 plantou e só os dados colhem. Sai com o diagnóstico, as regras do seu público e os ganchos reescritos dos vídeos fracos. Use com 5+ vídeos de dados acumulados.","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\n• A tabela gancho × retenção inicial de 5+ vídeos (gancho usado, mecanismo do Módulo 4, % que passou dos 3s se tiver, ou retenção média)\n• O público do perfil","c":"Atue como um analista de ganchos orientado por dados. Trabalho: descobrir, pelos MEUS números, quais mecanismos de gancho funcionam com o MEU público — e reescrever os que não funcionam.\n\nMEUS DADOS (mínimo 5 vídeos):\n[TABELA: VÍDEO | GANCHO USADO (a frase/cena) | MECANISMO (curiosidade, problema, transformação, benefício, descoberta, prova social, comparação...) | RETENÇÃO INICIAL (% que passou dos 3s, ou a retenção média se for o que tenho)]\nMEU PÚBLICO: [COLE O RESUMO]\n\nRegra de rigor: com menos de 3 vídeos por mecanismo, as conclusões são INDÍCIOS — rotule assim e não deixe eu tratar indício como lei.\n\nEntregue:\n\n1. RANKING DE MECANISMOS\nOs mecanismos ordenados pelo desempenho médio nos MEUS dados, com a amostra de cada um explícita (ex.: \"problema: 3 vídeos, média 71%\") e o rótulo PADRÃO/INDÍCIO.\n\n2. AS REGRAS DO MEU PÚBLICO\n2 a 4 regras específicas extraídas dos dados (\"meu público responde a dor concreta e ignora curiosidade genérica\") — cada uma com a evidência e o rótulo de confiança.\n\n3. AUTÓPSIA DOS FRACOS\nPara cada gancho abaixo da média: o que nele contradiz as regras da seção 2, e a REESCRITA — o mesmo vídeo, o gancho refeito no mecanismo vencedor (pronto para regravar só a abertura ou relançar via #117).\n\n4. O PRÓXIMO EXPERIMENTO\nO mecanismo ainda sem amostra suficiente que mais merece teste no próximo ciclo, e os 2 ganchos para testá-lo (no padrão do prompt especialista correspondente do Módulo 4).\n\n5. ATUALIZAÇÃO DO ARSENAL\nAs 3 fórmulas do Módulo 4 que devem virar o meu padrão-casa daqui em diante, pelos dados.","e":"de preenchimento:**\n• Tabela: 8 vídeos com gancho, mecanismo e % aos 3s\n• Público: quem faz a própria faxina, 25–45","u":"1. Anote o mecanismo de cada gancho DESDE JÁ na sua tabela de registro (#022) — este prompt depende desse histórico.\n2. Regravar só a abertura de um vídeo bom é o conserto mais barato que existe: use a autópsia.\n3. As \"regras do meu público\" valem mais que qualquer lista de hooks da internet — são SUAS.\n4. Rode a cada mês: o ranking evolui com a amostra.","p":"Multiplataforma"},{"n":"120","t":"Melhorador de CTA","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"O diagnóstico da última milha: o vídeo prendeu, o público chegou ao fim — e o clique não veio. Este prompt cruza retenção final × cliques × comentários de intenção para localizar onde a conversão vaza (CTA fraco, atrasado, público de curiosos ou atrito na vitrine) e prescreve o teste certo para cada vazamento. Use nos vídeos de boa retenção e cliques decepcionantes.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Os números da ponta: visualizações, retenção final (% que chegou aos últimos segundos, se tiver), cliques no link, vendas (se tiver)\n• O CTA usado (a frase + onde/quando aparece)\n• Os comentários (para medir intenção)\n• O estado da vitrine/página (você conferiu?)","c":"Atue como um especialista em conversão de última milha no social commerce: o trecho entre \"assistiu até o fim\" e \"clicou\".\n\nCONTEXTO:\n- Números: [VISUALIZAÇÕES | RETENÇÃO FINAL SE TIVER | CLIQUES NO LINK | VENDAS SE TIVER]\n- CTA usado: [A FRASE EXATA + QUANDO APARECE (segundo) + ONDE (falado / texto / legenda / comentário fixado)]\n- Comentários do vídeo: [COLE — vou medir intenção por eles]\n- Vitrine conferida?: [O PRODUTO ESTÁ NO LUGAR CERTO, COM FOTO/TÍTULO DECENTES E PREÇO ATUAL? SIM/NÃO/NÃO SEI]\n\nEntregue:\n\n1. LOCALIZAÇÃO DO VAZAMENTO\nCom os dados disponíveis, aponte o diagnóstico mais provável (e os alternativos, se a evidência for ambígua):\n- CTA INVISÍVEL: chega tarde, só num canal (falado sem texto), ou genérico (\"link na bio\" sem direção)\n- CTA SEM PONTE: pede o clique sem conectar ao benefício que o vídeo acabou de provar\n- PÚBLICO DE CURIOSOS: retenção alta + comentários de entretenimento sem intenção = o ângulo atrai quem assiste, não quem compra (o problema é o ângulo, não o CTA)\n- ATRITO NA PRATELEIRA: intenção nos comentários (\"onde compra?\") + poucos cliques = as pessoas não ACHAM o caminho, ou a vitrine espanta (título/foto/preço) — cruzar com #081/#092\nPara cada diagnóstico, cite a evidência dos meus dados.\n\n2. O CONSERTO POR DIAGNÓSTICO\nA prescrição específica do vazamento apontado: o novo CTA (3 versões, do #071), o reposicionamento no tempo, o reforço multicanal (falado + texto + fixado), a troca de ângulo (#122) ou a arrumação da prateleira.\n\n3. O TESTE DA QUINZENA\nO experimento limpo para validar o conserto: o que muda, o que se mantém, o que comparar — no padrão de variável única.\n\n4. A MÉTRICA HONESTA\nDefina comigo a taxa que passo a acompanhar (cliques por visualização completa, quando os dados permitirem) e o lembrete: melhorar a taxa é o objetivo alcançável; venda depende também de preço, página e comprador — coisas fora do vídeo.","e":"de preenchimento:**\n• Números: 12.400 views, 34% no fim, 41 cliques\n• CTA: \"link na vitrine\", falado aos 27s, sem texto na tela\n• Comentários: 14 \"onde compra?\", 6 \"quanto?\"\n• Vitrine: não conferi","u":"1. Confira a vitrine ANTES de rodar — metade dos \"CTAs fracos\" é prateleira quebrada.\n2. \"Onde compra?\" nos comentários com cliques baixos = as pessoas não estão achando: reforce o caminho em todos os canais do vídeo.\n3. Um conserto por vez, protocolo de variável única, sempre.\n4. O diagnóstico \"público de curiosos\" dói — e é o mais valioso: manda de volta ao ângulo (#122), não ao CTA.","p":"ChatGPT"},{"n":"121","t":"Criador de Testes de Conteúdo","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"O desenhista de experimentos do canal: transforma as dúvidas acumuladas (\"será que meu público prefere X?\") e os indícios dos outros prompts em uma fila de testes priorizada — cada teste com hipótese, formato de execução, tamanho de amostra e critério de leitura definidos ANTES de gravar. Difere do #022 (protocolo de UM produto): aqui se testam as variáveis do CANAL, continuamente. Use ao planejar cada quinzena.","q":"Criadores de conteúdo • Afiliados • Usuários que trabalham com IA","i":":**\n• Suas dúvidas e os indícios acumulados (dos #115–#120)\n• O que já foi testado e concluído\n• Sua capacidade de produção quinzenal","c":"Atue como um desenhista de experimentos de conteúdo. Transformo dúvidas em testes com método: hipótese explícita, execução de variável única, amostra definida e leitura combinada antes — porque teste desenhado depois do resultado não é teste, é desculpa.\n\nCONTEXTO:\n- Minhas dúvidas e indícios: [LISTE — ex.: \"indício de que POV retém mais (2 vídeos)\", \"será que legendas longas ajudam?\", \"meu público prefere voz ou texto na tela?\"]\n- Já testado e concluído: [O QUE JÁ SEI, para não repetir]\n- Capacidade: [EX.: 10 vídeos/quinzena]\n\nEntregue:\n\n1. FILA DE TESTES PRIORIZADA em tabela:\nPRIORIDADE | HIPÓTESE (afirmação testável: \"vídeos com X retêm mais que com Y no meu público\") | POR QUE TESTAR AGORA (impacto se confirmada × facilidade de testar) | EXECUÇÃO (quantos vídeos, o que varia — UMA variável — e o que se mantém) | AMOSTRA MÍNIMA | LEITURA (qual número comparar e qual diferença me convence)\nEntre 4 e 6 testes na fila; os que couberem na minha capacidade marcados para ESTA quinzena.\n\n2. O DESENHO DETALHADO DO TESTE Nº 1\nO teste prioritário expandido: os vídeos um a um (tema, o valor da variável em cada), o calendário de publicação (espaçamento que evita contaminação), e a tabela de registro pronta para eu preencher.\n\n3. REGRAS DO LABORATÓRIO\nAs 4 regras fixas dos meus testes: variável única; amostra mínima respeitada antes de qualquer conclusão; resultado registrado mesmo quando frustra; e conclusão vale até dado novo — nada é lei eterna.\n\n4. O CADERNO DE CONCLUSÕES\nO modelo de registro permanente: HIPÓTESE | RESULTADO | CONFIANÇA (padrão/indício) | DATA — o ativo que os meses de teste constroem.","e":"de preenchimento:**\n• Dúvidas: POV vs mãos+produto; legendas curtas vs longas; melhor horário\n• Testado: gancho de problema > curiosidade (concluído no #119)\n• Capacidade: 10 vídeos","u":"1. A fila é viva: alimente-a com todo indício dos #115–#120 e das suas curiosidades.\n2. Um teste grande por quinzena; a produção normal continua em volta dele.\n3. O caderno de conclusões é o ativo mais valioso do seu perfil em 6 meses — trate-o assim.\n4. Teste que frustra também conclui: registre e siga.","p":"ChatGPT"},{"n":"122","t":"Encontrador de Novos Ângulos","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"O renovador de repertório: quando o produto continua bom mas o conteúdo cansou — os números caem, as ideias se repetem, o público de curiosos domina — este prompt cruza o que você JÁ usou com as minas ainda fechadas (dores secundárias, públicos B, benefícios escondidos, comentários não atendidos) e entrega os ângulos inexplorados com o primeiro vídeo de cada um. Use ao sinal de fadiga, antes de aposentar o produto.","q":"Afiliados • Criadores de conteúdo • Vendedores","i":":**\n• O produto e TODOS os ângulos/formatos já usados\n• Os mapas do produto (dores #007, públicos #008, benefícios #076 — o que tiver)\n• Os comentários acumulados\n• Os sinais de fadiga observados","c":"Atue como um explorador de ângulos de comunicação. Situação: produto validado, conteúdo fatigado. Trabalho: mapear o que JÁ foi minerado e apontar as galerias intactas.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Ângulos e formatos JÁ usados: [LISTE TUDO — dores atacadas, públicos falados, formatos]\n- Mapas disponíveis: [COLE — dores (#007), públicos (#008), benefícios em camadas (#076)]\n- Comentários acumulados: [COLE UMA AMOSTRA BOA]\n- Sinais de fadiga: [O QUE OS NÚMEROS MOSTRAM]\n\nEntregue:\n\n1. O MAPA DA MINA em tabela:\nFONTE DE ÂNGULO | JÁ EXPLORADO | INTACTO\nCruze sistematicamente: cada dor do mapa × cada público × cada camada de benefício × os formatos — e marque o que nunca virou vídeo. Inclua a fonte que quase todo mundo esquece: as perguntas e situações NOS COMENTÁRIOS que nenhum vídeo meu atendeu.\n\n2. OS 5 ÂNGULOS INTACTOS MAIS PROMISSORES\nPara cada um: o ângulo em 1 frase, a evidência de demanda (do mapa ou dos comentários), o público que ele fala, e POR QUE ainda não foi usado (ponto cego meu ou dificuldade real de execução — seja honesto).\n\n3. O PRIMEIRO VÍDEO DE CADA ÂNGULO\nO conceito de estreia de cada um dos 5 (formato + gancho + a cena central), apontando os prompts deste ebook que o desenvolvem.\n\n4. O ÂNGULO CONTRÁRIO\nO ângulo especial da fadiga: o vídeo que INVERTE minha comunicação padrão (\"por que eu quase parei de recomendar isso\" — com a ressalva honesta real) — o padrão quebrado que reacende a atenção de quem já viu tudo de mim. Estruture-o com o cuidado de honestidade que ele exige.\n\n5. VEREDITO DE APOSENTADORIA\nE a resposta que ninguém quer: pelos sinais, o produto merece a renovação — ou os ângulos intactos são fracos e a energia vale mais num produto novo? Diga com franqueza.","e":"de preenchimento:**\n• Produto: escova alisadora, 9 vídeos feitos\n• Já usado: pressa matinal (público A), economia vs. salão; demonstração e review\n• Mapas: colados\n• Fadiga: últimos 3 vídeos 40% abaixo da linha","u":"1. Liste TUDO que já usou — o mapa da mina só funciona completo.\n2. O \"porquê ainda não usei\" da seção 2 revela seus pontos cegos de criador: leia com atenção.\n3. O ângulo contrário é pólvora: só com ressalva verdadeira, nunca fabricada para chocar.\n4. Aceite o veredito de aposentadoria quando vier — apego a produto é o custo afundado do criador.","p":"Claude"},{"n":"123","t":"Transformador de 1 Vídeo em 10 Conteúdos","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"A máquina de derivação: um vídeo vencedor vira 10 conteúdos DIFERENTES — não versões (isso é o #069), mas peças novas que nascem dele: as respostas aos comentários que ele gerou, o bastidor, a parte 2 pedida, o corte de 15s, o ângulo do detalhe que os comentários elogiaram, a curiosidade que ele levantou. Use com todo vídeo que entrar em \"INVESTIR\" no #116.","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\n• O vídeo vencedor (roteiro/descrição)\n• Os comentários dele (a matéria-prima principal)\n• O material bruto que sobrou da gravação\n• Sua capacidade","c":"Atue como um estrategista de derivação de conteúdo. Um vídeo vencedor não é um ponto final: é uma mina. Trabalho: extrair 10 conteúdos NOVOS dele — cada um uma peça independente, não uma versão.\n\nCONTEXTO:\n- O vídeo vencedor: [COLE O ROTEIRO/DESCRIÇÃO + POR QUE VENCEU (do #116)]\n- Comentários dele: [COLE — a principal matéria-prima]\n- Material bruto que sobrou: [TAKES NÃO USADOS, ÂNGULOS EXTRAS, A LISTA DE CORTES DO #055 SE HOUVER]\n- Capacidade: [QUANTOS DESSES CONSIGO PRODUZIR]\n\nEntregue:\n\n1. AS 10 DERIVAÇÕES em tabela:\nNº | TIPO | CONCEITO (2 frases) | MATÉRIA-PRIMA (qual comentário/take/trecho alimenta) | ESFORÇO (baixo: só edição / médio: gravar pouco / alto: produção nova) | PROMPT DO EBOOK QUE DESENVOLVE\nDistribua entre os tipos: RESPOSTA A COMENTÁRIO (#070 — os 2 ou 3 melhores comentários viram vídeos), PARTE 2 (a continuação que os comentários pediram), CORTE CURTO (o momento de ouro em 15s standalone), BASTIDOR (como fiz / o que deu errado na gravação), ZOOM NO DETALHE (o elemento que os comentários mais citaram vira vídeo próprio), CURIOSIDADE DERIVADA (a pergunta implícita que o vídeo levantou, #032/#112), FORMATO TROCADO (a mesma essência em formato irmão — a demonstração que vira storytelling), e ENTRADA DE SÉRIE (o vencedor como episódio 1 retroativo, #037).\n\n2. ORDEM DE PRODUÇÃO\nAs derivações ordenadas por esforço×potencial, começando pelas de esforço BAIXO (as que saem hoje, da ilha de edição).\n\n3. CALENDÁRIO DE DERIVAÇÃO\nComo espalhar as derivações pelas próximas 2–3 semanas SEM parecer requentado: o espaçamento, a mistura com conteúdo novo, e a regra de parada (o sinal de que a mina esgotou).\n\n4. O FIO DE VOLTA\nComo cada derivação aponta de volta (comentário fixado, menção) para o vídeo original e para a vitrine — a teia que multiplica o vencedor.","e":"de preenchimento:**\n• Vencedor: o teste de 24h da garrafa (#065); venceu por prova + comentários céticos\n• Comentários: \"e com água quente?\", \"duvido que aguente queda\", \"qual o tamanho?\"\n• Sobrou: takes dos marcos, o termômetro em close\n• Capacidade: 6 derivações","u":"1. Os comentários mandam: as 3 primeiras derivações quase sempre são respostas (#070).\n2. Comece pelo esforço baixo — 2 ou 3 derivações saem no mesmo dia, da edição.\n3. Respeite a regra de parada: derivação com números caindo = mina esgotada, sem drama.\n4. Vencedor + 10 derivações + variações (#069) = um mês de calendário nascido de um vídeo.","p":"ChatGPT"},{"n":"124","t":"Criador de Plano de Escala","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"O plano de crescimento sem fantasia: quando o ciclo roda — produto validado, ângulos funcionando, rotina estável — escalar significa decisões concretas: aumentar frequência no que funciona, expandir para produtos adjacentes, sistematizar a produção, e saber a ordem certa. Com metas de processo (sob seu controle) e os sinais honestos de \"ainda não é hora\". Use quando os ciclos do módulo estiverem rodando há 4+ semanas.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• O estado atual (produtos validados, o que funciona, números médios, rotina)\n• Seus recursos (tempo, orçamento para ferramentas/produtos)\n• O caderno de conclusões (#121) e os relatórios recentes (#115)","c":"Atue como um estrategista de escala para criadores de social commerce — do tipo que fala de processo, não de sonho.\n\nDefinição de escala neste plano: fazer MAIS do que comprovadamente funciona, com MENOS custo por unidade, SEM quebrar a qualidade nem o criador. Escala não é promessa de renda: é engenharia de produção. Metas apenas de processo (vídeos, testes, sistemas) — nunca de faturamento.\n\nCONTEXTO:\n- Estado atual: [PRODUTOS VALIDADOS + O QUE FUNCIONA (do caderno #121) + NÚMEROS MÉDIOS + MINHA ROTINA ATUAL]\n- Recursos: [TEMPO DISPONÍVEL + ORÇAMENTO MENSAL PARA FERRAMENTAS E COMPRA DE PRODUTOS DE TESTE]\n- Relatórios recentes: [COLE O ESSENCIAL DO #115]\n\nEntregue:\n\n1. VEREDITO DE PRONTIDÃO\nAntes de tudo: o estado atual SUSTENTA escala? Os 4 pré-requisitos, checados um a um contra meus dados: (a) pelo menos 1 produto+ângulo com padrão (não indício) de desempenho; (b) rotina cumprida por 4+ semanas; (c) ciclo de análise rodando; (d) folga real de tempo ou orçamento para crescer. Se faltar algum: o plano vira \"plano de prontidão\" — o que construir primeiro.\n\n2. AS 3 ALAVANCAS (se pronto), em ordem para o MEU caso:\n- INTENSIDADE: mais volume no validado (frequência, variações #069/#101, derivações #123, sequências #080) — quanto a mais, sem estourar minha capacidade\n- EXPANSÃO: produtos adjacentes ao validado (mesmo público, mesma vitrine — critérios do Módulo 1 aplicados à adjacência) — quantos testar por mês\n- SISTEMA: o que sistematizar para o custo por vídeo cair (lotes maiores #017, biblioteca de b-roll #107, moldes de série #114, pipeline IA #020) — as 3 sistematizações de maior retorno\nCom a ordem certa entre as três e o porquê.\n\n3. O PLANO DE 30 DIAS em tabela:\nSEMANA | AÇÕES POR ALAVANCA | META DE PROCESSO | O QUE PODE DAR ERRADO E O AJUSTE\n\n4. OS FUSÍVEIS\nOs 3 sinais de que a escala está quebrando algo (qualidade caindo nos números, rotina estourando, engajamento diluindo) — e a instrução de cada fusível: o que reduzir primeiro.\n\n5. A FRASE DE REALIDADE\nFeche com 2 frases honestas: o que este plano PODE entregar (mais tentativas de qualidade por semana, custo menor por tentativa) e o que NENHUM plano garante (o resultado de cada tentativa).","e":"de preenchimento:**\n• Estado: 2 produtos validados, POV+problema é padrão, 5 vídeos/semana há 6 semanas\n• Recursos: +30 min/dia possíveis, R$ 150/mês\n• Relatórios: colados","u":"1. Aceite o veredito de prontidão — escalar cedo é a forma mais rápida de quebrar o que funcionava.\n2. Uma alavanca por vez, na ordem prescrita; as três juntas estouram qualquer rotina.\n3. Os fusíveis ficam escritos e visíveis — no calor da escala ninguém lembra deles de cabeça.\n4. Revise o plano a cada 30 dias com os dados novos do #115.","p":"ChatGPT"},{"n":"125","t":"Analisador de Comentários do Público","m":10,"mn":"ANÁLISE, TESTE E OTIMIZAÇÃO","o":"A escuta em escala: os comentários acumulados do perfil são a pesquisa de mercado que você já pagou com conteúdo — este prompt os classifica (intenção, dúvida, objeção, identificação, pedido), extrai a linguagem real do público, atualiza os seus mapas (#014, #077) e devolve a fila de conteúdos que o próprio público encomendou. Use mensalmente, com tudo colado.","q":"Afiliados • Criadores de conteúdo • Vendedores • Criadores faceless","i":":**\n• Os comentários acumulados (quanto mais, melhor — 50+ ideal), com o vídeo de origem quando possível\n• Seus mapas atuais (público #014, objeções #077)","c":"Atue como um analista de voz do público em comentários de social commerce. Os comentários são dados: classificáveis, quantificáveis, mineráveis. Trabalho apenas com o que foi colado — sem inventar sentimentos nem completar amostras.\n\nMEUS COMENTÁRIOS ACUMULADOS:\n[COLE — com o vídeo de origem quando der: \"vídeo do teste: 'e com água quente?'\"]\nMEUS MAPAS ATUAIS: [COLE O RESUMO DO PÚBLICO (#014) E A TABELA DE OBJEÇÕES (#077), SE TIVER]\n\nEntregue:\n\n1. CLASSIFICAÇÃO GERAL\nOs comentários distribuídos (com contagem) entre: INTENÇÃO DE COMPRA (\"onde\", \"quanto\", \"tem link\") / DÚVIDA PRÁTICA (uso, medida, compatibilidade) / OBJEÇÃO-CETICISMO / IDENTIFICAÇÃO (\"sou eu\", histórias próprias) / PEDIDO DE CONTEÚDO (\"faz com X\", \"testa Y\") / ELOGIO-PROVA (relatos de quem comprou) / RUÍDO. A proporção entre as categorias e o que ela diz sobre o meu conteúdo atual (ex.: muita identificação e pouca intenção = conteúdo conecta mas não conduz).\n\n2. O DICIONÁRIO DO MEU PÚBLICO\nAs 10–15 palavras e expressões EXATAS que eles usam (entre aspas, como escreveram) para as dores, o produto e as situações — a linguagem que meus ganchos e legendas devem falar (atualiza a seção de linguagem do #014).\n\n3. ATUALIZAÇÃO DOS MAPAS\nO que os comentários CORRIGEM ou ADICIONAM nos meus mapas: objeções novas para o #077, públicos que eu não previa aparecendo, dores que eu subestimei — item a item, com o comentário-evidência.\n\n4. A FILA ENCOMENDADA\nOs conteúdos que o público pediu (explícita ou implicitamente), ordenados por frequência do pedido — cada um com o formato sugerido e o prompt do ebook que o desenvolve (#070 para dúvidas repetidas, #033 para ceticismo, #037 para os \"faz mais\").\n\n5. OS 3 COMENTÁRIOS DE OURO\nOs 3 comentários individualmente mais valiosos da amostra (a objeção mais articulada, o relato de comprador mais forte, o pedido mais repetível) — e o uso exato de cada um.\n\nSe a amostra colada for pequena demais para proporções confiáveis, diga — e classifique mesmo assim, rotulando tudo como amostra limitada.","e":"de preenchimento:**\n• Comentários: 70 colados de 12 vídeos, com origem\n• Mapas: resumo do #014 e tabela do #077","u":"1. Acumule comentários numa nota ao longo do mês (copie os relevantes na hora) — a coleta contínua é o segredo.\n2. O dicionário do público entra direto nos próximos ganchos (#041) e legendas (#072).\n3. A fila encomendada é pauta validada de graça: priorize-a no calendário.\n4. Rode todo mês: é o prompt que mantém todos os seus mapas vivos.","p":"Claude"},{"n":"126","t":"PRODUTO → ROTEIRO COMPLETO","m":11,"mn":"PROMPTS MASTER","o":"A fábrica de um vídeo pronto: do produto ao pacote completo — público, problema, desejo, ângulo, gancho, roteiro cena a cena, CTA e legenda — em uma única execução. O caminho mais rápido do produto ao primeiro vídeo.","q":"Afiliados • Iniciantes • Criadores de conteúdo • Criadores faceless","i":":**\nProduto (com detalhes), preço, país, formato, tom, e o que você verificou (experiência/avaliações).","c":"Atue como uma equipe completa de social commerce: estrategista, copywriter e roteirista trabalhando em sequência. Vou fornecer um produto; você entrega o pacote completo de UM vídeo, nas etapas abaixo, na ordem.\n\nNORMAS OBRIGATÓRIAS (valem para todas as etapas): não prometa ganhos, viralização ou vendas; não invente dados, estatísticas ou capacidades do produto além do que eu informar; não roteirize experiência pessoal que eu não relatei; benefícios sempre concretos e situados, nunca abstratos (\"praticidade\" é proibido); se faltar informação essencial, pergunte antes de executar.\n\nMEUS DADOS:\n- Produto (descrição detalhada): [PRODUTO — o que é, o que faz, características]\n- Preço: [PREÇO] | País: [PAÍS]\n- Formato: [COM ROSTO / SEM ROSTO] | Tom: [DESCREVA]\n- O que verifiquei: [MINHA EXPERIÊNCIA REAL COM ELE, SE HOUVER + RESUMO DE AVALIAÇÕES REAIS, SE TIVER]\n- Duração do vídeo: [15s / 30s]\n\nENTREGUE, NESTA ORDEM:\n\n1. PÚBLICO-ALVO: o público principal deste vídeo (momento de vida, rotina, relação com o problema) em 4 linhas.\n\n2. PROBLEMA: a dor central que o vídeo ataca, escrita na voz do público em 1ª pessoa, concreta e cênica.\n\n3. DESEJO: o que o público quer no lugar da dor — o estado desejado, também na voz dele.\n\n4. ÂNGULO: a tese do vídeo em 1 frase (como este produto conecta o problema ao desejo para ESTE público) + por que este ângulo e não o óbvio.\n\n5. GANCHO: 3 opções de gancho (mecanismos diferentes: problema, curiosidade, transformação), até 12 palavras cada, com a cena dos 2 primeiros segundos entre parênteses. Marque o recomendado.\n\n6. ROTEIRO em tabela: TEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO. Arquitetura do 30s: gancho (0–3s) → dor/contexto (3–8s) → prova em ação contínua (8–20s) → benefício traduzido (20–26s) → CTA (26–30s). Para 15s: uma ideia só (gancho → prova → CTA). Se meu formato for SEM ROSTO, todas as cenas executáveis sem aparecer.\n\n7. LISTA DE CENAS: as cenas do roteiro agrupadas por setup, na ordem de GRAVAÇÃO (para eu filmar tudo numa sessão).\n\n8. CTA: a versão suave e a direta (urgência apenas se eu informei fato real).\n\n9. LEGENDA: 1 legenda (~200 caracteres) com primeira linha-gancho (versão truncada de 5 palavras entre parênteses), termos de busca naturais e o CTA escrito — + bloco de 6–8 hashtags em camadas (nicho / subnicho / formato), marcado como ponto de partida.\n\n10. AVISO DE EXECUÇÃO: 2 frases honestas — o que este pacote é (uma hipótese bem construída para testar) e o que não é (garantia de resultado).","e":"de preenchimento:**\n• Produto: suporte de tampa de panela com apoio de colher, plástico ABS\n• Preço: R$ 24,90 | País: Brasil\n• Formato: sem rosto | Tom: direto e leve\n• Verifiquei: uso há 2 semanas, balcão parou de ficar melado\n• Duração: 30s","u":"1. Preencha \"o que verifiquei\" com honestidade — é o que autoriza (ou limita) as afirmações do roteiro.\n2. Grave pela lista de cenas, edite pela tabela.\n3. Quer refinar alguma peça do pacote? Leve-a ao prompt especialista (gancho → Módulo 4; roteiro → Módulo 5; legenda → #072).\n4. Publicou? O ciclo do Módulo 10 assume.","p":"Multiplataforma"},{"n":"127","t":"PRODUTO → 30 IDEIAS DE VÍDEOS","m":11,"mn":"PROMPTS MASTER","o":"A fábrica de pauta de um mês: 30 ideias de vídeo para o mesmo produto, sem repetição — cada ideia com formato, dor atacada e facilidade de produção — organizadas em ondas de publicação. É o #023 em escala máxima, com trava anti-repetição reforçada.","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\nProduto, público, dores/benefícios mapeados, formato, e o que já foi feito.","c":"Atue como um diretor criativo encarregado de gerar a pauta de um mês inteiro para UM produto: 30 ideias de vídeo SEM repetição real entre elas.\n\nDEFINIÇÃO DE REPETIÇÃO (o que você deve evitar ativamente): duas ideias repetem se atacam a mesma dor, no mesmo formato, para o mesmo público — mudar só o cenário não é ideia nova. Cada ideia precisa variar pelo menos DOIS desses três eixos em relação às demais.\n\nNORMAS: nenhuma ideia pode depender de afirmar o que o produto não faz, de experiência que não informei, ou de dados inventados; se meu formato for SEM ROSTO, todas executáveis sem aparecer.\n\nMEUS DADOS:\n- Produto: [PRODUTO DETALHADO]\n- Público(s): [COLE — do #008 se tiver]\n- Dores e benefícios mapeados: [COLE — dos #007/#075/#076 se tiver; senão, descreva]\n- Formato: [COM ROSTO / SEM ROSTO] | Já fiz: [LISTE ou \"nada\"]\n\nENTREGUE:\n\n1. AS 30 IDEIAS em tabela:\nNº | IDEIA (2 frases: o que acontece no vídeo) | FORMATO (distribua entre pelo menos 8 formatos: demonstração, problema→solução, antes/depois, review, teste, educativo, curiosidade, storytelling, comparativo, lista, UGC, resposta a comentário, série) | DOR/DESEJO ATACADO | PÚBLICO | FACILIDADE (1–5 para meus recursos) | POTENCIAL VISUAL (1–5)\n\n2. AUDITORIA ANTI-REPETIÇÃO: revise você mesmo a tabela e declare: existe algum par de ideias que viola a definição de repetição? Se sim, substitua as violadoras e mostre as substitutas.\n\n3. AS 3 ONDAS: organize as 30 em ondas de publicação de 10 — ONDA 1 (as de melhor facilidade×potencial, para validar o produto), ONDA 2 (as que dependem dos sinais da onda 1 — indique qual sinal libera cada uma), ONDA 3 (as apostas diferentes e as de produção mais cara).\n\n4. AS 5 PRIMEIRAS, DESTRINCHADAS: para as 5 primeiras da onda 1: o gancho sugerido (até 12 palavras) + a cena de abertura + o prompt deste ebook que desenvolve o roteiro.\n\n5. REGRA DE ABANDONO: em 2 frases — o sinal (do Módulo 10) que autoriza abandonar esta pauta no meio e trocar de produto, sem culpa.","e":"de preenchimento:**\n• Produto: mini seladora de embalagens\n• Público: mora sozinho + famílias que compram no atacado\n• Dores: comida murcha, desperdício, pacote aberto derramando\n• Formato: sem rosto | Já fiz: 1 demonstração","u":"1. Cole os mapas dos Módulos 1 e 6 — a variedade das 30 depende da riqueza da entrada.\n2. Confie na auditoria anti-repetição, mas leia a tabela você também: você conhece seu feed.\n3. Produza a onda 1 em lotes (#017); as ondas 2 e 3 esperam os dados.\n4. Cada ideia escolhida vira roteiro no Módulo 5 (ou no #126, para velocidade).","p":"Claude"},{"n":"128","t":"PRODUTO → 10 HOOKS + 10 ROTEIROS","m":11,"mn":"PROMPTS MASTER","o":"A fábrica de teste de ângulos: 10 ângulos de comunicação DIFERENTES para o mesmo produto — cada um com seu gancho e seu roteiro curto — a bateria completa para descobrir, em duas semanas de publicação, qual comunicação o seu público compra. É a matriz de teste (#022) já municiada.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\nProduto, dores/públicos/benefícios mapeados, formato, duração dos vídeos de teste.","c":"Atue como um estrategista de testes de comunicação. Missão: 10 ÂNGULOS genuinamente diferentes para o mesmo produto — cada um com gancho e roteiro de teste — para o desempenho comparado revelar qual comunicação funciona.\n\nDEFINIÇÃO DE ÂNGULO: a combinação [dor ou desejo atacado] × [público] × [mecanismo de persuasão]. Dois ângulos são diferentes quando mudam o MOTIVO pelo qual alguém pararia no vídeo — não quando mudam o cenário.\n\nNORMAS: sem promessas de resultado; sem dados inventados; benefícios concretos; experiência pessoal só a que eu informar; formato SEM ROSTO respeitado em tudo, se for o meu.\n\nMEUS DADOS:\n- Produto: [DETALHADO]\n- Mapas: [DORES (#007) + PÚBLICOS (#008) + BENEFÍCIOS (#076) — o que tiver]\n- Minha experiência real: [SE HOUVER]\n- Formato: [COM/SEM ROSTO] | Duração dos testes: [15s / 30s]\n\nENTREGUE:\n\n1. OS 10 ÂNGULOS em tabela:\nNº | ÂNGULO (1 frase: a tese) | DOR/DESEJO | PÚBLICO | MECANISMO (problema, transformação, curiosidade, prova social, comparação, descoberta, benefício direto, storytelling, economia, ceticismo-invertido — use pelo menos 7 mecanismos diferentes entre os 10) | O QUE ESTE ÂNGULO ME ENSINA SE VENCER\n\n2. OS 10 GANCHOS: para cada ângulo, o gancho (até 12 palavras) + a cena dos 2 primeiros segundos entre parênteses.\n\n3. OS 10 ROTEIROS: para cada ângulo, o roteiro na duração escolhida, em tabela compacta (TEMPO | TELA | FALA | TEXTO NA TELA). Nos roteiros de 15s: uma ideia só por vídeo. IMPORTANTE: os 10 roteiros devem compartilhar o mesmo CTA e estrutura de fechamento — a variável do teste é o ÂNGULO, e só ela.\n\n4. ORDEM E ESPAÇAMENTO: a sequência de publicação dos 10 (alternando públicos e mecanismos, 1 por dia ou o que couber na minha rotina) e a regra de leitura: comparar retenção inicial e comentários de intenção entre eles APÓS todos publicados — não eleger vencedor no 3º vídeo.\n\n5. O DIA SEGUINTE AO TESTE: o que fazer com o vencedor (variações #069, sequência #080) e com os 2 piores (aposentar o ângulo, registrar a lição no caderno #121).","e":"de preenchimento:**\n• Produto: escova alisadora\n• Mapas: colados dos #007/#008/#076\n• Experiência: 1 mês de uso\n• Formato: com rosto | Testes: 15s","u":"1. Este prompt é a munição da matriz do #022 — rode os dois juntos ao iniciar um produto.\n2. Respeite o CTA idêntico entre os 10: é o que torna o teste limpo.\n3. Grave em lote: 10 vídeos de 15s saem em 2 sessões.\n4. A tabela final de resultados alimenta o #119 (que gancho venceu) e o #116 (onde investir).","p":"Claude"},{"n":"129","t":"PRODUTO → PLANO DE CONTEÚDO DE 30 DIAS","m":11,"mn":"PROMPTS MASTER","o":"A fábrica do mês de um produto: o calendário completo de 30 dias centrado em UM produto — fases (apresentar → aprofundar → converter → colher), tema e formato por dia, os pontos de decisão em que os dados redirecionam o plano, e os dias de folga honestos. Difere do #016 (que planeja o PERFIL): este é o mapa de campanha de um produto. Use com produto validado que merece o mês.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\nProduto e sinais até aqui, mapas, capacidade real semanal, formato.","c":"Atue como um planejador de campanhas de conteúdo. Missão: o plano de 30 dias de UM produto — um mês com arco, não uma lista de 30 vídeos soltos.\n\nARQUITETURA OBRIGATÓRIA DO MÊS:\n- SEMANA 1 — APRESENTAR: o problema e o produto entram na frente do público (formatos de alcance e identificação; CTAs suaves)\n- SEMANA 2 — APROFUNDAR: prova, teste, educação, objeções respondidas (a semana que constrói confiança)\n- SEMANA 3 — CONVERTER: os formatos e CTAs mais diretos, sequência de venda (#080), respostas a comentários\n- SEMANA 4 — COLHER E DECIDIR: prova social dos compradores, derivações dos vencedores, e a decisão do mês seguinte\n- PONTOS DE DECISÃO nos dias 7, 14 e 21: o plano prevê os desvios (\"se X aconteceu, a semana seguinte vira Y\")\n\nNORMAS: o plano respeita minha capacidade REAL (com 20% de folga); metas só de processo; nenhum dia depende de o público ter visto o dia anterior; sem promessas de resultado.\n\nMEUS DADOS:\n- Produto e sinais até aqui: [PRODUTO + O QUE JÁ TESTEI E O QUE FUNCIONOU]\n- Mapas: [DORES + PÚBLICOS + BENEFÍCIOS + OBJEÇÕES (#077) — o que tiver]\n- Capacidade real: [VÍDEOS/SEMANA] | Formato: [COM/SEM ROSTO]\n\nENTREGUE:\n\n1. O CALENDÁRIO em tabela:\nDIA | SEMANA/FASE | TEMA DO VÍDEO (1 frase) | FORMATO | DOR/ÂNGULO | CTA (intensidade da fase) | PROMPT DESTE EBOOK QUE O DESENVOLVE\nDistribua apenas os dias que minha capacidade cobre; os demais dias ficam explicitamente livres (constância > volume).\n\n2. OS PONTOS DE DECISÃO: para os dias 7, 14 e 21 — as 2 perguntas de cada checkpoint e o desvio que cada resposta aciona (ex.: \"dia 7: houve comentários de intenção? NÃO → semana 2 reforça identificação antes de aprofundar\").\n\n3. OS BLOCOS DE PRODUÇÃO: as sessões de gravação em lote da semana (o que gravar junto), alinhadas à minha rotina (#017).\n\n4. O DIA 30: o ritual de encerramento — o relatório (#115), a decisão entre os 3 caminhos (escalar o produto #124 / renovar os ângulos #122 / encerrar e migrar), e o critério objetivo de cada caminho.\n\n5. PLANO B DA SEMANA QUEBRADA: a versão mínima de cada semana para quando a vida atropelar (o essencial que mantém o arco vivo com 40% da capacidade).","e":"de preenchimento:**\n• Produto: mop giratório; teste inicial validou o ângulo \"faxina sem esfregar\"\n• Mapas: colados\n• Capacidade: 5/semana | Formato: sem rosto","u":"1. Use com produto que já passou pelo teste (#022/#128) — mês inteiro em produto não validado é aposta cara.\n2. Os pontos de decisão são compromissos: agende os dias 7, 14 e 21.\n3. Cada linha do calendário aponta seu prompt de desenvolvimento — o mês inteiro roda dentro deste ebook.\n4. O dia 30 decide o mês seguinte com dados, não com cansaço nem empolgação.","p":"Claude"},{"n":"130","t":"PRODUTO → MÁQUINA DE CONTEÚDO TIKTOK SHOP","m":11,"mn":"PROMPTS MASTER","o":"O prompt mais completo do produto: a máquina que recebe um produto com contexto completo e devolve o arsenal inteiro — análise, públicos, dores, desejos, 10 ângulos, 20 hooks, 10 ideias, 15 roteiros (completos, faceless e UGC), CTAs, legendas, cenas, briefings de imagem e vídeo, planos de 7 e 30 dias, testes A/B e checklist de análise. Rode uma vez por produto importante; o resultado é o documento-mestre que os módulos especialistas refinam.","q":"Afiliados • Vendedores • Criadores de conteúdo • Criadores faceless • Usuários que trabalham com IA","i":":**\nO pacote completo de dados do produto (lista no prompt). Quanto mais real e verificado, melhor a máquina.","c":"Atue como uma operação completa de social commerce — estrategista, pesquisador de público, copywriter, roteirista, diretor de arte e produtor — executando em sequência o arsenal completo de UM produto para TikTok Shop.\n\nNORMAS INEGOCIÁVEIS (governam todas as 20 entregas):\n- Nunca prometa ganhos, viralização ou vendas garantidas; o vocabulário é: testar, aumentar potencial, identificar oportunidades.\n- Nunca invente dados, estatísticas, tendências ou capacidades do produto além do que eu informar. Números sugeridos por você levam a marca [CONFIRMAR].\n- Nunca roteirize experiência pessoal que eu não relatei; roteiros UGC e depoimentos usam APENAS a experiência informada — sem ela, entregue as versões sem relato pessoal e diga por quê.\n- Rotule como HIPÓTESE o que for interpretação.\n- Se meu formato for SEM ROSTO, tudo executável sem aparecer.\n- Se algum dado essencial faltar, liste as pendências ANTES de executar e pare.\n\nMEUS DADOS:\n- Produto: [DESCRIÇÃO COMPLETA — o que é, o que faz, materiais, medidas]\n- Nicho: [NICHO] | País: [PAÍS] | Preço: [PREÇO ATUAL]\n- Características (ficha): [LISTE] | Benefícios que verifiquei: [LISTE]\n- Minha experiência real: [DETALHE ou \"não tenho o produto em mãos\"]\n- Avaliações reais de compradores: [COLE UM RESUMO ou trechos]\n- Objetivo do momento: [EX.: primeira venda / validar o produto / escalar]\n- Estilo de conteúdo: [TOM DO PERFIL] | Apareço nos vídeos: [SIM / NÃO]\n- Capacidade de produção: [VÍDEOS/SEMANA]\n\nENTREGUE, NESTA ORDEM E COMPLETO (sem resumir etapas):\n\n1. ANÁLISE DO PRODUTO: pontos fortes para vídeo curto, fraquezas e riscos, facilidade de demonstração (nota 1–5 justificada), veredito de teste (VALE TESTAR / COM CAUTELA / NÃO) — como hipótese.\n\n2. PÚBLICOS: o primário detalhado + 3 secundários (motivação distinta de cada um) + o público a evitar.\n\n3. PROBLEMAS DO PÚBLICO: 8 dores em 1ª pessoa, das funcionais às escondidas, ranqueadas por potencial de abertura de vídeo.\n\n4. DESEJOS DO PÚBLICO: 6 desejos na voz do público, pareados às dores.\n\n5. DEZ ÂNGULOS: tabela ÂNGULO | DOR/DESEJO | PÚBLICO | MECANISMO — 10 combinações genuinamente diferentes (mudam o motivo de parar no vídeo).\n\n6. VINTE HOOKS: 2 por ângulo, até 12 palavras, com a cena dos 2 primeiros segundos entre parênteses; mecanismos identificados.\n\n7. DEZ IDEIAS DE VÍDEO: tabela com formato, dor, facilidade (1–5) e potencial visual (1–5) — sem repetição entre elas.\n\n8. CINCO ROTEIROS COMPLETOS (30s): dos 5 melhores ângulos, na tabela padrão TEMPO | TELA | FALA | TEXTO NA TELA | DIREÇÃO, com gancho aos 0–3s e prova em ação até o segundo 15.\n\n9. CINCO ROTEIROS FACELESS: os mesmos ângulos (ou os seguintes) executáveis 100% sem rosto — coluna visual protagonista, âncora de atenção nomeada por cena.\n\n10. CINCO IDEIAS UGC: situação + pretexto de fala + esqueleto de 4 bullets (baseados APENAS na minha experiência informada; sem experiência, converta em ideias de apresentação transparente e sinalize).\n\n11. CTAs: a biblioteca — 3 de clique (suave/média/direta), 2 de seguir com motivo, 2 de comentário, 1 condicional.\n\n12. LEGENDAS: 3 legendas completas (curta/média/longa) com primeira linha truncada validada + bloco de hashtags em 3 camadas como ponto de partida.\n\n13. IDEIAS DE CENAS: as 10 cenas mais fortes do arsenal (money shots, encenações de dor, provas), descritas para gravação, agrupadas por setup.\n\n14. BRIEFING PARA IMAGENS: 5 instruções prontas para IA de imagem (foto de estúdio, ambiente real, em uso, lifestyle, card de vitrine), cada uma com o BLOCO DE PRESERVAÇÃO: \"use a imagem anexada como referência absoluta; preserve formato, proporções, cores, textura, logotipo e textos legíveis, embalagem; não deforme, não mude cores, não adicione ou remova partes, não reescreva textos\" — e a nota: anexar a foto real do produto na conversa.\n\n15. PROMPTS PARA NANO BANANA: as 5 instruções da etapa 14 finalizadas para uso direto (cena + formato 9:16 ou 1:1 + bloco de preservação).\n\n16. PROMPTS PARA IA DE VÍDEO: 5 briefings (imagem→vídeo) dos momentos-chave: CENA CONGELADA + AÇÃO ÚNICA + o que permanece estático + câmera + 5–10s + 9:16 + fidelidade do produto — adaptáveis a Kling, Veo, Runway, Sora ou similar, sem recursos exclusivos de plataforma.\n\n17. PLANO DE 7 DIAS: a primeira semana dia a dia (tema, formato, roteiro correspondente das etapas 8–9), dentro da minha capacidade.\n\n18. PLANO DE 30 DIAS: o mês em 4 fases (apresentar → aprofundar → converter → colher) com o calendário na minha capacidade e os pontos de decisão dos dias 7, 14 e 21.\n\n19. TESTES A/B: os 5 testes de variável única mais valiosos deste arsenal (o que varia, o que se mantém, amostra mínima, o que comparar).\n\n20. CHECKLIST DE ANÁLISE DOS RESULTADOS: a tabela de registro pronta (vídeo, ângulo, gancho, formato, retenção, comentários de intenção, cliques) + as 5 perguntas do ciclo quinzenal + a regra de leitura: padrão exige 3+ ocorrências; antes disso, tudo é indício.","e":"de preenchimento:**\n• Produto: dispenser de detergente 380ml com base para esponja, ABS+inox, 12x12x18cm\n• Nicho: cozinha/organização | Brasil | R$ 39,90\n• Experiência: 3 semanas de uso; avaliações: 20 coladas\n• Objetivo: validar | Tom: amiga direta | Apareço: não | Capacidade: 5/semana","u":"1. Reúna os dados ANTES de rodar — a máquina devolve na qualidade do que recebe. Ideal: rode primeiro os #002, #007, #008 e #011 e cole os resultados.\n2. Rode no Claude (contexto longo) e salve a resposta inteira como documento-mestre do produto.\n3. Se a IA parar em \"pendências\", complete-as — é a máquina funcionando, não falhando.\n4. Refine as peças que merecerem capricho nos módulos especialistas; execute imagens (Módulo 7) e vídeos (Módulo 8) com os briefings das etapas 14–16.\n5. Em 30 dias, o checklist da etapa 20 decide o próximo ciclo.","p":"Claude"}];
const $ = s => document.querySelector(s);
const list = $('#list'), q = $('#q'), mod = $('#mod'), plat = $('#plat');
let quick = '';

const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function card(p){
  return `<details class="card">
    <summary>
      <span class="num">#${p.n}</span>
      <span class="head-txt">
        <span class="title">${esc(p.t)}</span>
        <span class="meta">
          <span class="tag">Módulo ${String(p.m).padStart(2,'0')}</span>
          <span class="tag pf">${esc(p.p)}</span>
        </span>
      </span>
      <span class="arrow">+</span>
    </summary>
    <div class="body">
      ${p.o ? `<div class="sec"><div class="sec-t">Objetivo</div><div class="sec-c">${esc(p.o)}</div></div>` : ''}
      ${p.q ? `<div class="sec"><div class="sec-t">Para quem</div><div class="sec-c">${esc(p.q)}</div></div>` : ''}
      ${p.i ? `<div class="sec"><div class="sec-t">O que informar</div><div class="sec-c">${esc(p.i)}</div></div>` : ''}
      <div class="sec">
        <div class="sec-t">Prompt</div>
        <div class="codewrap">
          <pre id="c${p.n}">${esc(p.c)}</pre>
          <button class="copy" data-n="${p.n}">copiar</button>
        </div>
      </div>
      ${p.e ? `<div class="sec"><div class="sec-t">Exemplo</div><div class="sec-c">${esc(p.e)}</div></div>` : ''}
      ${p.u ? `<div class="sec"><div class="sec-t">Como usar</div><div class="sec-c">${esc(p.u)}</div></div>` : ''}
    </div>
  </details>`;
}

function render(){
  const term = q.value.toLowerCase().trim();
  const m = mod.value, pf = plat.value;
  const out = P.filter(p => {
    if (m && String(p.m) !== m) return false;
    if (pf && p.p !== pf) return false;
    const hay = (p.n+' '+p.t+' '+p.o+' '+p.c+' '+p.mn+' '+p.q).toLowerCase();
    if (quick && !hay.includes(quick)) return false;
    if (term && !hay.includes(term)) return false;
    return true;
  });
  $('#count').textContent = out.length + ' de ' + P.length + ' prompts';
  list.innerHTML = out.length ? out.map(card).join('')
    : '<div class="empty">Nenhum prompt encontrado.<br>Tente outra palavra ou limpe os filtros.</div>';
}

list.addEventListener('click', async e => {
  const b = e.target.closest('.copy');
  if (!b) return;
  e.preventDefault();
  const txt = document.getElementById('c' + b.dataset.n).textContent;
  try { await navigator.clipboard.writeText(txt); }
  catch(_) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  b.textContent = 'copiado'; b.classList.add('done');
  setTimeout(() => { b.textContent = 'copiar'; b.classList.remove('done'); }, 1600);
});

$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  quick = c.dataset.f;
  render();
});

[q, mod, plat].forEach(el => el.addEventListener('input', render));
render();
</script>
</body>
</html>
