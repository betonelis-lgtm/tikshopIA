<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>TikTok Shop AI Master — 130 Prompts</title>
<style>
:root{
  --ink:#0B0D17; --ink-2:#131A33; --card:#151C36;
  --violet:#6C4CE0; --violet-soft:#8F76F0; --mint:#7EE0D2; --gold:#F2B33D;
  --txt:#EAECF5; --dim:#98A1BB; --slate:#6F7A99;
  --line:rgba(255,255,255,.10);
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:50;background:rgba(11,13,23,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 12px;flex-wrap:wrap}
.logo{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.logo span{color:var(--violet-soft)}
.count{font-family:var(--mono);font-size:.75rem;color:var(--slate)}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding-bottom:16px}
input[type=search],select{
  background:var(--ink-2);border:1px solid var(--line);color:var(--txt);
  padding:12px 14px;border-radius:9px;font-size:.94rem;font-family:var(--sans);width:100%;
}
input[type=search]:focus,select:focus{outline:2px solid var(--violet);outline-offset:1px;border-color:transparent}
input[type=search]::placeholder{color:var(--slate)}

.chips{display:flex;gap:7px;padding-bottom:14px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:.7rem;padding:6px 12px;border-radius:20px;
  border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;transition:.15s;
}
.chip:hover{color:var(--txt);border-color:var(--violet-soft)}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}

main{padding:26px 0 90px}
.empty{text-align:center;padding:70px 20px;color:var(--slate)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card summary{padding:18px 20px;cursor:pointer;list-style:none;display:flex;gap:14px;align-items:flex-start}
.card summary::-webkit-details-marker{display:none}
.card summary:hover{background:rgba(255,255,255,.02)}
.num{font-family:var(--mono);font-size:.78rem;color:var(--violet-soft);flex:0 0 44px;padding-top:2px}
.head-txt{flex:1;min-width:0}
.title{font-size:1.04rem;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-family:var(--mono);font-size:.64rem;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
.tag.pf{border-color:rgba(126,224,210,.4);color:var(--mint)}
.arrow{color:var(--slate);font-size:1.2rem;line-height:1;transition:transform .2s;flex:0 0 auto}
details[open] .arrow{transform:rotate(45deg)}

.body{padding:0 20px 20px;border-top:1px solid var(--line);margin-top:2px}
.sec{margin-top:18px}
.sec-t{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:7px}
.sec-c{font-size:.92rem;color:#C3CBE0;white-space:pre-wrap}

.codewrap{position:relative;margin-top:8px}
pre{
  background:#080B16;border:1px solid rgba(255,255,255,.07);border-left:3px solid var(--violet);
  border-radius:9px;padding:16px 15px;font-family:var(--mono);font-size:.78rem;line-height:1.7;
  color:#C3CBE0;white-space:pre-wrap;word-wrap:break-word;overflow-x:auto;
}
.copy{
  position:absolute;top:9px;right:9px;font-family:var(--mono);font-size:.68rem;
  padding:7px 13px;border-radius:7px;background:rgba(108,76,224,.9);border:0;color:#fff;
  cursor:pointer;transition:.15s;
}
.copy:hover{background:var(--violet-soft)}
.copy.done{background:var(--mint);color:#0B0D17}

footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--slate);font-size:.78rem}

@media(max-width:680px){
  .controls{grid-template-columns:1fr}
  .card summary{padding:15px 15px}
  .body{padding:0 15px 16px}
  .num{flex:0 0 38px;font-size:.72rem}
  .title{font-size:.97rem}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-top">
      <div class="logo">TIKTOK SHOP <span>AI MASTER</span></div>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Buscar prompt... (ex: gancho, roteiro, imagem)" autocomplete="off">
      <select id="mod"><option value="">Todos os módulos</option><option value="1">Módulo 01 — ENCONTRANDO PRODUTOS PARA PROMOVER</option><option value="2">Módulo 02 — ESTRATÉGIA PARA AFILIADOS E CRIADORES</option><option value="3">Módulo 03 — CRIANDO CONTEÚDO QUE VENDE</option><option value="4">Módulo 04 — GANCHOS E RETENÇÃO</option><option value="5">Módulo 05 — ROTEIROS DE VÍDEOS</option><option value="6">Módulo 06 — COPYWRITING E CONVERSÃO</option><option value="7">Módulo 07 — IMAGENS COM INTELIGÊNCIA ARTIFICIAL</option><option value="8">Módulo 08 — VÍDEOS COM IA</option><option value="9">Módulo 09 — CONTEÚDO FACELESS</option><option value="10">Módulo 10 — ANÁLISE, TESTE E OTIMIZAÇÃO</option><option value="11">Módulo 11 — PROMPTS MASTER</option></select>
      <select id="plat">
        <option value="">Todas as IAs</option>
        <option>ChatGPT</option><option>Claude</option>
        <option>Nano Banana</option><option>IA de vídeo</option><option>Multiplataforma</option>
      </select>
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="">Todos</button>
      <button class="chip" data-f="produto">Produtos</button>
      <button class="chip" data-f="gancho">Ganchos</button>
      <button class="chip" data-f="roteiro">Roteiros</button>
      <button class="chip" data-f="imagem">Imagens</button>
      <button class="chip" data-f="vídeo">Vídeos</button>
      <button class="chip" data-f="faceless">Faceless</button>
      <button class="chip" data-f="legenda">Copy</button>
    </div>
  </div>
</header>

<main><div class="wrap" id="list"></div></main>

<footer><div class="wrap">TikTok Shop AI Master — 130 prompts · uso pessoal do comprador</div></footer>

<script>
const P = [{"n":"001","t":"Encontrador de Produtos com Potencial","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Gerar uma lista de categorias e tipos de produtos com boas características para promover na TikTok Shop dentro do seu nicho — com critérios claros para você buscar e validar na plataforma. Use quando estiver começando ou quando quiser renovar sua lista de testes.","q":"Afiliados • Iniciantes • Criadores de conteúdo","i":":**\n• Nicho ou área de interesse\n• País onde você atua\n• Faixa de preço que pretende trabalhar\n• Se você aparece ou não nos vídeos","c":"Atue como um estrategista de marketing de afiliados especializado em social commerce e vendas por vídeo curto.\n\nMeu contexto:\n- Nicho: [NICHO]\n- País: [PAÍS]\n- Faixa de preço dos produtos: [FAIXA DE PREÇO]\n- Formato de conteúdo: [APAREÇO NOS VÍDEOS / NÃO APAREÇO NOS VÍDEOS]\n\nSua tarefa é me ajudar a montar uma lista de TIPOS de produtos com potencial para eu buscar e validar na TikTok Shop. Importante: você não tem acesso em tempo real à plataforma, então NÃO invente produtos específicos \"em alta\" nem cite dados de vendas. Trabalhe com categorias, características e critérios.\n\nEntregue sua resposta no seguinte formato:\n\n1. CRITÉRIOS DE UM BOM PRODUTO PARA VÍDEO CURTO\nListe 8 critérios objetivos (ex.: ser demonstrável em segundos, resolver um problema visível, gerar reação de curiosidade, caber na faixa de preço de compra por impulso, etc.), explicando cada um em 1 frase.\n\n2. 15 TIPOS DE PRODUTOS PARA BUSCAR NO MEU NICHO\nPara cada tipo, informe:\n- Nome do tipo de produto\n- Por que tende a funcionar em vídeo curto\n- Que problema ou desejo ele atende\n- Pontuação de 1 a 5 em \"facilidade de demonstrar em vídeo\"\n\n3. O QUE EVITAR\nListe 5 características de produtos que costumam ser difíceis de vender por vídeo curto no meu contexto, explicando por quê.\n\n4. COMO VALIDAR\nExplique em 5 passos como eu devo validar cada tipo de produto dentro da própria TikTok Shop antes de escolher (ex.: verificar comissão, avaliações, quantidade de criadores promovendo, qualidade das fotos do vendedor).\n\nAntes de responder, verifique se alguma informação essencial está faltando no meu contexto. Se estiver, pergunte antes de gerar a lista. Não invente informações.","e":"de preenchimento:**\n• Nicho: organização de casa\n• País: Brasil\n• Faixa de preço: R$ 20 a R$ 80\n• Formato: não apareço nos vídeos","u":"1. Preencha os 4 campos com seus dados reais.\n2. Envie o prompt e leia a lista de 15 tipos de produtos.\n3. Abra a TikTok Shop (central de afiliados) e busque produtos reais que se encaixem nos tipos sugeridos.\n4. Aplique os \"5 passos de validação\" em cada produto encontrado.\n5. Leve os 3 a 5 melhores para o Prompt #002 (análise individual).","p":"ChatGPT"},{"n":"002","t":"Analisador de Potencial de Produto","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Analisar um produto específico que você encontrou na TikTok Shop e receber um diagnóstico estruturado: pontos fortes, pontos fracos, público provável e nota de potencial para teste. Use antes de decidir se vale criar conteúdo para o produto.","q":"Afiliados • Vendedores • Iniciantes","i":":**\n• Nome/descrição do produto\n• Preço\n• Comissão (se for afiliado)\n• Nicho\n• País\n• Resumo das avaliações que você leu (positivas e negativas)","c":"Atue como um analista de produtos para social commerce, especializado em avaliar o potencial de produtos para venda através de vídeos curtos.\n\nVou te passar os dados de um produto real que encontrei na TikTok Shop. Analise APENAS com base no que eu informar. Não invente dados de mercado, volume de vendas ou tendências. Se alguma informação estiver faltando e for importante para a análise, indique claramente o que preciso informar.\n\nDADOS DO PRODUTO:\n- Produto: [DESCREVA O PRODUTO]\n- Preço: [PREÇO]\n- Comissão: [COMISSÃO EM % OU VALOR]\n- Nicho: [NICHO]\n- País: [PAÍS]\n- Resumo das avaliações que li: [PONTOS POSITIVOS E NEGATIVOS DAS AVALIAÇÕES]\n\nEntregue sua análise no seguinte formato:\n\n1. RESUMO DO PRODUTO (2 frases)\n\n2. PONTOS FORTES PARA VÍDEO CURTO\nListe de 3 a 6 pontos, cada um em 1 frase.\n\n3. PONTOS FRACOS E RISCOS\nListe de 3 a 6 pontos, incluindo objeções prováveis do público e problemas apontados nas avaliações.\n\n4. PÚBLICO PROVÁVEL\nDescreva 2 perfis de público com maior probabilidade de interesse (idade aproximada, situação de vida, motivação de compra).\n\n5. FACILIDADE DE DEMONSTRAÇÃO\nNota de 1 a 5 + justificativa: o quanto esse produto pode ser demonstrado de forma visual e rápida em vídeo?\n\n6. RELAÇÃO ESFORÇO × RETORNO\nConsiderando preço, comissão e complexidade de criar conteúdo, classifique como BAIXA, MÉDIA ou ALTA a atratividade do teste, justificando.\n\n7. VEREDITO\nResponda: \"VALE TESTAR\", \"TESTAR COM CAUTELA\" ou \"PROVAVELMENTE NÃO VALE\", com justificativa de 2 a 3 frases. Deixe claro que isso é uma hipótese a validar com conteúdo real, não uma garantia.","e":"de preenchimento:**\n• Produto: mini processador de alho elétrico recarregável, corpo em plástico branco\n• Preço: R$ 39,90\n• Comissão: 15%\n• Nicho: cozinha/utilidades domésticas\n• País: Brasil\n• Avaliações: elogios à praticidade e bateria; reclamações sobre lâmina que perde o fio e dificuldade de limpar","u":"1. Escolha um produto real na TikTok Shop e leia as avaliações antes de preencher (isso muda tudo na qualidade da análise).\n2. Preencha todos os campos e envie.\n3. Se o veredito for \"VALE TESTAR\", siga para o Prompt #008 (públicos) e depois para os módulos de conteúdo.\n4. Se for \"TESTAR COM CAUTELA\", pergunte à IA: \"o que precisaria ser verdade para esse produto valer o teste?\"\n5. Repita para 3 a 5 produtos e compare os vereditos com o Prompt #010.","p":"Multiplataforma"},{"n":"003","t":"Detector de Tendências (com os SEUS dados)","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Identificar padrões e tendências a partir de dados que você mesmo coletou navegando na TikTok Shop e no feed (produtos repetidos, formatos de vídeo, hashtags, tipos de oferta). A IA atua como analista de padrões — não como fonte de tendências. Use após uma sessão de pesquisa de 20 a 30 minutos na plataforma.","q":"Afiliados • Criadores de conteúdo • Vendedores • Usuários que trabalham com IA","i":":**\n• Lista de produtos/vídeos que você viu repetidamente (quanto mais detalhes, melhor)\n• Nicho\n• País\n• O que chamou sua atenção em cada item","c":"Atue como um analista de tendências de social commerce. Sua função é encontrar PADRÕES em dados de observação que eu coletei manualmente na TikTok Shop e no feed do TikTok. Você não tem acesso à plataforma, então baseie-se exclusivamente no que eu informar. Não invente tendências nem complete com suposições apresentadas como fatos.\n\nMEU CONTEXTO:\n- Nicho: [NICHO]\n- País: [PAÍS]\n\nDADOS QUE COLETEI (produtos, vídeos, formatos e ofertas que vi se repetir):\n[COLE AQUI SUA LISTA — EX.: \"vi 4 vídeos diferentes de escova alisadora, todos com formato antes/depois; 3 vídeos de organizador de geladeira com voz de IA; muitos vídeos usando o gancho 'eu não acreditei que isso custava X'\"]\n\nEntregue sua análise no seguinte formato:\n\n1. PADRÕES DE PRODUTO\nQue categorias/tipos de produto aparecem com mais frequência nos meus dados? Agrupe e nomeie cada padrão.\n\n2. PADRÕES DE FORMATO\nQue formatos de vídeo se repetem (antes/depois, unboxing, POV, voz de IA, etc.)? O que eles têm em comum?\n\n3. PADRÕES DE COMUNICAÇÃO\nQue tipos de gancho, promessa ou ângulo aparecem nos meus dados?\n\n4. HIPÓTESES DE OPORTUNIDADE\nCom base APENAS nos padrões acima, liste de 3 a 5 hipóteses de oportunidade para eu testar (ex.: \"produto X com formato Y ainda pouco explorado nos seus dados\"). Rotule cada uma claramente como HIPÓTESE.\n\n5. O QUE COLETAR NA PRÓXIMA SESSÃO\nSugira 5 informações específicas que eu deveria observar na próxima pesquisa para confirmar ou descartar as hipóteses.\n\nSe os dados que forneci forem insuficientes para identificar padrões confiáveis, diga isso claramente e me oriente sobre quantos exemplos coletar.","e":"de preenchimento:**\n• Nicho: beleza e autocuidado\n• País: Brasil\n• Dados: \"6 vídeos de sérum facial com formato 'get ready with me'; 4 vídeos de massageador facial com antes/depois; 3 criadoras usando o gancho 'dermatologista não queria que você soubesse disso'; muitos vídeos com link fixado no comentário\"","u":"1. Passe 20 a 30 minutos navegando na TikTok Shop e no feed do seu nicho anotando o que se repete.\n2. Cole suas anotações no prompt, sem filtrar demais — detalhe ajuda.\n3. Leia as hipóteses e escolha 1 ou 2 para validar com conteúdo real.\n4. Repita a sessão de coleta 1x por semana e compare os resultados ao longo do tempo.","p":"Claude"},{"n":"004","t":"Buscador de Produtos por Nicho","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Mapear subnichos e ângulos de mercado dentro do seu nicho principal, com tipos de produto associados a cada subnicho. Use quando o nicho principal estiver saturado ou quando quiser encontrar espaços menos disputados.","q":"Afiliados • Iniciantes • Criadores faceless","i":":**\n• Nicho principal\n• País\n• Faixa de preço\n• Nível de concorrência que você percebe (alto, médio, baixo)","c":"Atue como um estrategista de nichos para social commerce.\n\nMeu contexto:\n- Nicho principal: [NICHO]\n- País: [PAÍS]\n- Faixa de preço: [FAIXA DE PREÇO]\n- Concorrência que percebo no nicho principal: [ALTA / MÉDIA / BAIXA]\n\nSua tarefa é abrir o meu nicho em subnichos e me mostrar onde pode haver espaço menos disputado. Não invente dados de mercado; trabalhe com lógica de segmentação e comportamento de consumo.\n\nEntregue sua resposta no seguinte formato:\n\n1. MAPA DE SUBNICHOS\nListe 10 subnichos dentro do meu nicho principal. Para cada um:\n- Nome do subnicho\n- Perfil de público típico (1 frase)\n- Dor ou desejo central (1 frase)\n- 3 tipos de produtos que atendem esse subnicho\n- Estimativa qualitativa de disputa (tende a ser mais ou menos concorrido que o nicho principal, e por quê)\n\n2. OS 3 SUBNICHOS MAIS PROMISSORES PARA MIM\nConsiderando minha faixa de preço e a concorrência que percebo, indique os 3 subnichos que eu deveria pesquisar primeiro na TikTok Shop, com justificativa.\n\n3. TERMOS DE BUSCA\nPara cada um dos 3 subnichos escolhidos, sugira 5 termos de busca que eu posso usar dentro da TikTok Shop para encontrar produtos reais.\n\n4. ALERTA\nAponte 2 subnichos da lista que parecem atraentes mas costumam ter armadilhas (ex.: produto frágil, público difícil de alcançar, promessa sensível), explicando o risco.\n\nSe faltar informação para uma boa análise, pergunte antes de responder.","e":"de preenchimento:**\n• Nicho principal: pets\n• País: Brasil\n• Faixa de preço: R$ 15 a R$ 60\n• Concorrência: alta","u":"1. Preencha e envie o prompt.\n2. Use os \"termos de busca\" da seção 3 diretamente na busca da TikTok Shop.\n3. Leve os produtos encontrados para o Prompt #002.\n4. Guarde o mapa de subnichos — ele serve de base para o Prompt #013 (público-alvo) e para pautas de conteúdo.","p":"ChatGPT"},{"n":"005","t":"Analisador de Concorrentes","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Extrair estratégia de vídeos de concorrentes que você assistiu: ângulos, ganchos, estrutura e pontos fracos que você pode explorar. Você descreve (ou transcreve) os vídeos; a IA desmonta a estratégia. Use antes de criar conteúdo para um produto que outros criadores já promovem.","q":"Afiliados • Criadores de conteúdo • Vendedores","i":":**\n• Produto\n• Descrição ou transcrição de 3 a 5 vídeos de concorrentes (o que acontece, o que é dito, gancho usado)\n• O que você percebeu de engajamento (curtidas/comentários visíveis, tipo de comentário)","c":"Atue como um estrategista de conteúdo especializado em engenharia reversa de vídeos de venda em plataformas de vídeo curto.\n\nAssisti a vídeos de criadores que promovem o mesmo produto (ou produto similar) ao meu. Vou descrever o que vi. Analise APENAS com base nas minhas descrições. Não invente métricas nem suponha dados que eu não informei.\n\nPRODUTO: [PRODUTO]\n\nVÍDEOS QUE ANALISEI:\nVídeo 1: [DESCREVA: gancho usado, o que acontece, o que é dito, duração aproximada, comentários que se destacam]\nVídeo 2: [DESCREVA]\nVídeo 3: [DESCREVA]\n(adicione mais se tiver)\n\nEntregue sua análise no seguinte formato:\n\n1. ESTRUTURA COMUM\nQue estrutura narrativa esses vídeos compartilham? (gancho → desenvolvimento → prova → CTA, ou outra)\n\n2. ÂNGULOS USADOS\nQue ângulo de venda cada vídeo usa (economia, transformação, curiosidade, medo de perder, prova social, etc.)?\n\n3. O QUE PARECE FUNCIONAR\nCom base no engajamento que descrevi, o que esses vídeos têm em comum que pode explicar o desempenho? Rotule como HIPÓTESE.\n\n4. PONTOS FRACOS E LACUNAS\nO que nenhum desses vídeos faz? Que objeção não é respondida? Que público é ignorado? Liste de 3 a 5 lacunas.\n\n5. MINHA DIFERENCIAÇÃO\nSugira 3 caminhos para eu criar conteúdo sobre o mesmo produto SEM copiar os concorrentes, explorando as lacunas da seção 4.\n\n6. O QUE NÃO FAZER\nListe 3 erros que eu cometeria se apenas imitasse esses vídeos.","e":"de preenchimento:**\n• Produto: garrafa térmica com display de temperatura\n• Vídeo 1: \"gancho 'essa garrafa fez eu largar o refrigerante', criadora mostra display, coloca gelo, mostra 12h depois, CTA 'link na vitrine', ~30s, comentários perguntando se cabe no porta-copos do carro\"\n• Vídeo 2: \"unboxing sem falas, só texto na tela e música, mostra caixa e acessórios, muitos comentários perguntando o preço\"","u":"1. Assista de 3 a 5 vídeos de concorrentes anotando gancho, estrutura e comentários.\n2. Preencha o prompt com o máximo de detalhes.\n3. Use a seção \"Minha diferenciação\" como pauta: cada caminho vira um vídeo de teste.\n4. Note as perguntas dos comentários dos concorrentes — elas são objeções prontas para o Prompt #077 (Quebrador de Objeções).","p":"Claude"},{"n":"006","t":"Detector de Produtos com Apelo Viral","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Avaliar um produto contra os fatores que historicamente favorecem compartilhamento e retenção em vídeo curto (efeito \"uau\", transformação visível, identificação imediata, curiosidade). O resultado é um placar de apelo — não uma promessa de viralização. Use na fase de escolha entre produtos.","q":"Afiliados • Criadores de conteúdo • Iniciantes","i":":**\n• Produto (com descrição física detalhada)\n• O que o produto faz\n• Preço\n• Público imaginado","c":"Atue como um especialista em conteúdo de vídeo curto, com foco em entender POR QUE certos produtos rendem vídeos com alta retenção e compartilhamento.\n\nImportante: viralização nunca é garantida. Sua tarefa é avaliar o POTENCIAL de apelo do produto abaixo em fatores objetivos, deixando claro que o resultado depende da execução e do teste.\n\nPRODUTO: [DESCREVA O PRODUTO EM DETALHES — aparência, tamanho, como funciona]\nO QUE ELE FAZ: [FUNÇÃO PRINCIPAL]\nPREÇO: [PREÇO]\nPÚBLICO IMAGINADO: [QUEM COMPRARIA]\n\nAvalie o produto de 1 a 5 em cada fator abaixo, com justificativa de 1 a 2 frases por fator:\n\n1. EFEITO \"UAU\" — o produto surpreende visualmente em até 3 segundos?\n2. TRANSFORMAÇÃO VISÍVEL — existe um antes/depois claro e rápido?\n3. DEMONSTRABILIDADE — dá para mostrar funcionando sem explicação longa?\n4. IDENTIFICAÇÃO — o espectador se reconhece no problema imediatamente?\n5. CURIOSIDADE — o produto gera a pergunta \"o que é isso?\"?\n6. CONVERSA — o produto naturalmente gera comentários, dúvidas ou polêmica saudável?\n7. IMPULSO — o preço permite decisão de compra sem longa reflexão?\n\nDepois:\n\n8. PLACAR FINAL: some os pontos (máximo 35) e classifique: 28+ = apelo alto / 20–27 = apelo médio / abaixo de 20 = apelo baixo para vídeo curto.\n\n9. COMO EXPLORAR OS PONTOS FORTES: para os 2 fatores com maior nota, sugira 2 ideias de cena que evidenciam cada um.\n\n10. COMO COMPENSAR OS PONTOS FRACOS: para os 2 fatores com menor nota, sugira 1 abordagem de conteúdo que contorna cada limitação.\n\nNão afirme que o produto \"vai viralizar\" em nenhuma hipótese. Trate tudo como potencial a ser testado.","e":"de preenchimento:**\n• Produto: tapete que muda de cor quando molhado, para banheiro, 60x40cm\n• O que faz: revela desenho colorido em contato com água e seca rápido\n• Preço: R$ 34,90\n• Público: mães de crianças pequenas, pessoas que gostam de decoração divertida","u":"1. Descreva o produto com riqueza — a nota de \"efeito uau\" depende de a IA \"enxergar\" o produto pelas suas palavras.\n2. Compare o placar de 2 ou 3 produtos candidatos.\n3. Use a seção 9 como semente de roteiro: cada ideia de cena alimenta o Módulo 5.\n4. Placar baixo não significa descartar: produtos de apelo baixo podem funcionar com ângulo educativo (Prompt #030).","p":"Multiplataforma"},{"n":"007","t":"Analisador de Problemas que um Produto Resolve","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Mapear todos os problemas, dores e incômodos que um produto resolve — dos óbvios aos escondidos. Cada problema é um ângulo de conteúdo diferente. Use logo após escolher um produto, antes de criar hooks e roteiros.","q":"Afiliados • Criadores de conteúdo • Vendedores • Criadores faceless","i":":**\n• Produto\n• Função principal\n• Público imaginado\n• Contextos de uso (onde/quando o produto é usado)","c":"Atue como um pesquisador de comportamento do consumidor especializado em identificar dores e necessidades que motivam compras por impulso.\n\nPRODUTO: [PRODUTO]\nFUNÇÃO PRINCIPAL: [O QUE ELE FAZ]\nPÚBLICO IMAGINADO: [QUEM COMPRARIA]\nCONTEXTOS DE USO: [ONDE E QUANDO É USADO]\n\nSua tarefa é mapear TODOS os problemas que este produto pode resolver, em camadas:\n\n1. PROBLEMAS FUNCIONAIS (5 a 8 itens)\nIncômodos práticos e visíveis do dia a dia que o produto elimina. Para cada um, escreva o problema na voz do consumidor, em 1ª pessoa (ex.: \"toda vez que eu...\").\n\n2. PROBLEMAS EMOCIONAIS (3 a 5 itens)\nO que a pessoa SENTE por causa do problema funcional (vergonha, frustração, cansaço, insegurança)? Também na voz do consumidor.\n\n3. PROBLEMAS SOCIAIS (2 a 4 itens)\nComo o problema afeta a imagem da pessoa diante de outros (visitas, família, colegas)?\n\n4. PROBLEMAS ESCONDIDOS (2 a 3 itens)\nDores que o público sente mas raramente verbaliza — as mais poderosas para ganchos de identificação.\n\n5. RANKING DE ÂNGULOS\nOrdene os 5 problemas com maior potencial para abrir um vídeo curto, justificando cada escolha em 1 frase.\n\nRegras: não invente capacidades que o produto não tem com base na função informada. Se o produto não resolver claramente algum tipo de problema (ex.: social), diga isso em vez de forçar.","e":"de preenchimento:**\n• Produto: organizador de cabos de mesa em silicone\n• Função: prende e separa até 5 cabos na borda da mesa\n• Público: pessoas em home office\n• Contextos: mesa de trabalho, cabeceira, setup de estudos","u":"1. Preencha e envie.\n2. Guarde o \"Ranking de Ângulos\": ele alimenta diretamente os Prompts #041 (Hooks de Problema) e #063 (Roteiro Problema → Solução).\n3. As frases em 1ª pessoa podem ser usadas literalmente como primeira linha de vídeos e legendas.\n4. Rode este prompt para cada produto do seu plano de testes.","p":"ChatGPT"},{"n":"008","t":"Identificador de Públicos para um Produto","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Descobrir todos os públicos possíveis para um produto — incluindo públicos secundários que a concorrência ignora. Cada público diferente permite um conjunto novo de conteúdos para o mesmo produto. Use após validar o produto (Prompt #002).","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto\n• Função principal\n• Preço\n• País","c":"Atue como um estrategista de segmentação de público para social commerce.\n\nPRODUTO: [PRODUTO]\nFUNÇÃO PRINCIPAL: [O QUE ELE FAZ]\nPREÇO: [PREÇO]\nPAÍS: [PAÍS]\n\nSua tarefa é mapear públicos para este produto, indo além do óbvio.\n\nEntregue no seguinte formato:\n\n1. PÚBLICO PRIMÁRIO\nO público mais óbvio. Descreva: faixa etária aproximada, momento de vida, motivação de compra, onde esse público está no TikTok (tipos de conteúdo que consome).\n\n2. 5 PÚBLICOS SECUNDÁRIOS\nPúblicos menos óbvios que também têm motivo real para comprar. Para cada um:\n- Quem são (1 frase)\n- Por que comprariam (motivação específica, diferente do público primário)\n- Que tipo de vídeo falaria com eles\n- Nível de disputa provável por esse público (alto/médio/baixo, com justificativa lógica)\n\n3. PÚBLICO PRESENTEADOR\nExiste um público que compraria este produto DE PRESENTE para outra pessoa? Se sim, descreva a ocasião e o gancho.\n\n4. PÚBLICO A EVITAR\nAlgum público parece atraente mas provavelmente não converte (ex.: gosta do conteúdo mas não compra)? Explique.\n\n5. RECOMENDAÇÃO\nSe eu só puder criar conteúdo para 2 públicos nos próximos 15 dias, quais escolher e por quê?\n\nBaseie-se em lógica de consumo. Não invente estatísticas demográficas. Se precisar de mais contexto sobre o produto, pergunte antes.","e":"de preenchimento:**\n• Produto: luminária de leitura com clipe e 3 tons de luz\n• Função: ilumina livro/tela sem incomodar quem está ao lado\n• Preço: R$ 29,90\n• País: Brasil","u":"1. Rode o prompt e escolha 2 públicos (siga a seção 5).\n2. Para cada público escolhido, rode o Prompt #007 novamente informando esse público específico — as dores mudam com o público.\n3. Crie conteúdos separados por público e compare o desempenho: essa é uma das formas mais baratas de testar ângulo.","p":"ChatGPT"},{"n":"009","t":"Gerador de Lista de Produtos para Teste","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Transformar os produtos que você validou em um plano de testes organizado: ordem de prioridade, quantidade de vídeos por produto, critério de aprovação e prazo. Use quando tiver de 3 a 10 produtos candidatos e não souber por onde começar.","q":"Afiliados • Iniciantes • Usuários que trabalham com IA","i":":**\n• Lista de produtos candidatos (com preço e comissão)\n• Quantos vídeos você consegue produzir por semana\n• Se aparece ou não nos vídeos\n• Tempo disponível por dia","c":"Atue como um gestor de testes de produtos para criadores de conteúdo de social commerce. Sua função é transformar uma lista de produtos em um plano de testes realista e organizado.\n\nMEUS PRODUTOS CANDIDATOS:\n[LISTE CADA PRODUTO COM PREÇO E COMISSÃO — EX.: \"1. Mini ventilador de pescoço — R$ 45 — 12%\"]\n\nMINHA CAPACIDADE:\n- Vídeos por semana: [QUANTIDADE]\n- Apareço nos vídeos: [SIM / NÃO]\n- Tempo disponível por dia: [TEMPO]\n\nEntregue o plano no seguinte formato:\n\n1. ORDEM DE PRIORIDADE\nOrdene os produtos do primeiro ao último a testar. Critérios: facilidade de produzir conteúdo com minha capacidade, relação preço × comissão, e variedade (não testar dois produtos idênticos em sequência). Justifique a posição de cada um em 1 frase.\n\n2. PROTOCOLO DE TESTE POR PRODUTO\nDefina, para cada produto: quantos vídeos mínimos antes de qualquer conclusão (sugira entre 3 e 5), quantos ângulos diferentes testar, e em quantos dias.\n\n3. CRITÉRIO DE DECISÃO\nProponha critérios objetivos e realistas para: CONTINUAR (que sinais indicam que vale mais vídeos), PAUSAR (que sinais indicam trocar o ângulo) e DESCARTAR (quando abandonar o produto). Use sinais como retenção, comentários e cliques — sem prometer números específicos de vendas.\n\n4. CALENDÁRIO\nMonte um cronograma semana a semana cobrindo todos os produtos, respeitando minha capacidade de produção. Formato de tabela.\n\n5. AVISO DE REALIDADE\nEm 3 frases, lembre-me do que um teste PODE e do que NÃO PODE provar com poucos vídeos.\n\nSe minha capacidade de produção for incompatível com a quantidade de produtos, diga isso claramente e sugira cortar a lista.","e":"de preenchimento:**\n• Produtos: \"1. Escova removedora de pelos — R$ 32 — 15% / 2. Suporte de celular articulado — R$ 48 — 10% / 3. Kit potes herméticos — R$ 79 — 8%\"\n• Vídeos por semana: 5\n• Apareço: não\n• Tempo: 1h30 por dia","u":"1. Só use este prompt com produtos que já passaram pelo Prompt #002.\n2. Siga a ordem de prioridade — a tentação de testar tudo ao mesmo tempo é o erro nº 1 de iniciante.\n3. Anote os critérios de decisão em algum lugar visível: eles evitam abandonar produto cedo demais ou insistir demais.\n4. Ao final de cada ciclo, leve os dados para o Módulo 10 (análise).","p":"ChatGPT"},{"n":"010","t":"Comparador de Produtos","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Comparar de 2 a 5 produtos candidatos lado a lado em uma tabela objetiva e receber uma recomendação fundamentada de qual testar primeiro. Use como etapa final de decisão, depois das análises individuais.","q":"Afiliados • Vendedores • Iniciantes","i":":**\n• Dados de cada produto (nome, preço, comissão, resumo das avaliações, facilidade de demonstrar)\n• Seu formato de conteúdo (com ou sem rosto)\n• Seu objetivo do momento","c":"Atue como um analista de decisão especializado em seleção de produtos para social commerce.\n\nVou te passar de 2 a 5 produtos que já analisei individualmente. Sua tarefa é compará-los e me ajudar a decidir qual testar PRIMEIRO. Baseie-se apenas nos dados fornecidos. Não invente informações.\n\nMEU FORMATO: [APAREÇO / NÃO APAREÇO NOS VÍDEOS]\nMEU OBJETIVO AGORA: [EX.: primeira venda, ganhar consistência, escalar um nicho]\n\nPRODUTO A: [NOME, PREÇO, COMISSÃO, RESUMO DAS AVALIAÇÕES, NOTA DE FACILIDADE DE DEMONSTRAR 1-5]\nPRODUTO B: [IDEM]\nPRODUTO C: [IDEM — opcional]\nPRODUTO D: [IDEM — opcional]\nPRODUTO E: [IDEM — opcional]\n\nEntregue:\n\n1. TABELA COMPARATIVA\nColunas: Produto | Preço | Comissão | Ganho por venda | Facilidade de demonstrar | Risco apontado nas avaliações | Compatibilidade com meu formato (alta/média/baixa)\n\n2. PONTO FORTE ÚNICO DE CADA PRODUTO\n1 frase por produto: o que ele tem que os outros não têm.\n\n3. RISCO PRINCIPAL DE CADA PRODUTO\n1 frase por produto.\n\n4. RECOMENDAÇÃO\nIndique qual produto testar primeiro e qual em segundo, justificando com base na tabela e no meu objetivo. Deixe claro que a recomendação é uma hipótese de priorização, não uma previsão de resultado.\n\n5. PERGUNTA DECISIVA\nFormule 1 pergunta que, se eu conseguir responder pesquisando na TikTok Shop, mudaria ou confirmaria a recomendação.","e":"de preenchimento:**\n• Formato: não apareço\n• Objetivo: primeira venda\n• Produto A: \"Lixeira automática com sensor — R$ 89 — 8% — avaliações elogiam praticidade, reclamam de pilha — demonstrar: 5\"\n• Produto B: \"Passador de roupa portátil — R$ 65 — 12% — avaliações boas, algumas reclamações de aquecimento lento — demonstrar: 4\"","u":"1. Rode primeiro o Prompt #002 para cada produto — a comparação depende dessas análises.\n2. Preencha com dados consistentes entre os produtos (mesmos campos para todos).\n3. Responda a \"pergunta decisiva\" pesquisando na plataforma antes de bater o martelo.\n4. Registre a decisão e o motivo — ao analisar resultados no Módulo 10, você vai querer saber por que escolheu aquele produto.","p":"Multiplataforma"},{"n":"011","t":"Minerador de Avaliações de Clientes","m":1,"mn":"ENCONTRANDO PRODUTOS PARA PROMOVER","o":"Transformar avaliações reais de clientes (da TikTok Shop ou de marketplaces) em matéria-prima de conteúdo: dores verbalizadas, frases prontas para hooks, objeções reais e provas sociais. É o prompt mais subestimado deste módulo — avaliações são pesquisa de mercado gratuita. Use depois de escolher o produto.","q":"Afiliados • Vendedores • Criadores de conteúdo • Criadores faceless","i":":**\n• Produto\n• 10 a 30 avaliações copiadas (positivas e negativas, sem editar)","c":"Atue como um analista de voz do cliente (VoC) especializado em transformar avaliações de produtos em insumos de marketing.\n\nPRODUTO: [PRODUTO]\n\nAVALIAÇÕES REAIS QUE COLETEI (coladas sem edição):\n[COLE AQUI DE 10 A 30 AVALIAÇÕES]\n\nAnalise APENAS o texto das avaliações. Não invente opiniões que não estão lá.\n\nEntregue no seguinte formato:\n\n1. DORES VERBALIZADAS\nListe os problemas que os clientes tinham ANTES do produto, usando as próprias palavras deles sempre que possível (entre aspas).\n\n2. BENEFÍCIOS PERCEBIDOS\nO que os clientes mais celebram? Ordene por frequência de menção.\n\n3. FRASES DE OURO\nSelecione de 5 a 10 trechos curtos de avaliações com potencial de virar hook ou texto de tela (ex.: \"chorei quando vi funcionando\"). Copie exatamente como escritos.\n\n4. OBJEÇÕES E RECLAMAÇÕES REAIS\nListe os problemas apontados nas avaliações negativas. Para cada um, classifique: DEFEITO DO PRODUTO (evitar prometer o contrário) ou EXPECTATIVA MAL ALINHADA (posso esclarecer no conteúdo).\n\n5. PERFIL DOS COMPRADORES\nO que dá para inferir sobre quem compra, a partir do que escrevem (contexto de uso, para quem compraram, ocasião)? Rotule inferências como INFERÊNCIA.\n\n6. IDEIAS DE CONTEÚDO\nSugira 5 ideias de vídeo baseadas diretamente no que os clientes escreveram (ex.: responder a objeção mais comum; encenar a dor mais citada).\n\nAtenção: não vou usar avaliações para inventar depoimentos falsos. As \"frases de ouro\" servem de inspiração de linguagem, e qualquer citação em conteúdo deve respeitar as regras da plataforma.","e":"de preenchimento:**\n• Produto: aspirador portátil para carro\n• Avaliações: colar 15 avaliações reais copiadas da página do produto, incluindo as de 1 e 2 estrelas","u":"1. Abra a página do produto e copie de 10 a 30 avaliações — inclua as negativas, elas valem ouro.\n2. Cole tudo no prompt sem editar.\n3. Use as \"frases de ouro\" como hooks e textos de tela (Módulo 4).\n4. Use as objeções na seção 4 com o Prompt #077 (Quebrador de Objeções).\n5. As \"dores verbalizadas\" alimentam os roteiros Problema → Solução (Prompt #063).","p":"Claude"},{"n":"012","t":"Estrategista de TikTok Shop para Iniciantes (Roadmap de 90 Dias)","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Receber um plano estratégico de 90 dias em fases, adaptado à sua realidade: o que aprender, o que construir e o que testar em cada fase. É o prompt de visão macro — a execução dos primeiros dias fica com o Prompt #018. Use antes de tudo, ou quando estiver perdido(a) sem saber a ordem das coisas.","q":"Iniciantes • Afiliados • Criadores de conteúdo","i":":**\n• Sua experiência atual (com TikTok, vendas e criação de conteúdo)\n• Tempo disponível por dia\n• Nicho (se já tiver) ou interesses\n• Se aparece ou não nos vídeos\n• Recursos disponíveis (celular, computador, ferramentas de IA)\n• País","c":"Atue como um estrategista de social commerce especializado em estruturar a jornada de criadores iniciantes na TikTok Shop.\n\nMINHA SITUAÇÃO:\n- Experiência: [DESCREVA — ex.: nunca criei conteúdo / já posto mas nunca vendi / já vendi em outra plataforma]\n- Tempo disponível por dia: [TEMPO]\n- Nicho ou interesses: [NICHO OU LISTA DE INTERESSES]\n- Apareço nos vídeos: [SIM / NÃO / AINDA NÃO SEI]\n- Recursos: [EX.: celular, computador, acesso a ChatGPT, etc.]\n- País: [PAÍS]\n\nCrie um plano estratégico de 90 dias dividido em 3 fases de 30 dias. Regras: não prometa ganhos, não cite números de renda, e trate metas apenas como METAS DE PROCESSO (coisas sob meu controle: vídeos publicados, testes feitos, habilidades desenvolvidas).\n\nEntregue no seguinte formato:\n\nFASE 1 — FUNDAÇÃO (dias 1–30)\n- Objetivo central da fase (1 frase)\n- 5 metas de processo mensuráveis\n- Habilidades a desenvolver e como praticar cada uma\n- O que eu NÃO devo tentar fazer ainda (e por quê)\n\nFASE 2 — TESTE (dias 31–60)\n- Mesmo formato, com foco em testar produtos e ângulos\n\nFASE 3 — REFINAMENTO (dias 61–90)\n- Mesmo formato, com foco em dobrar o que mostrou sinais e cortar o que não mostrou\n\nDepois:\n\nMARCOS DE VERIFICAÇÃO: para o fim de cada fase, defina 3 perguntas que eu devo me fazer para saber se estou pronto(a) para a fase seguinte.\n\n5 ERROS CLÁSSICOS DE INICIANTE nesse percurso, com 1 frase sobre como evitar cada um.\n\nREGRA DE OURO: termine com 1 princípio único que devo lembrar nos 90 dias.\n\nSobre requisitos da plataforma (seguidores mínimos, elegibilidade de afiliado): NÃO afirme números específicos, pois mudam por país e por época. Apenas me instrua a verificar os requisitos atuais dentro do próprio app da TikTok Shop.\n\nSe minha situação tiver alguma incompatibilidade grave (ex.: tempo insuficiente para o mínimo viável), aponte isso antes de montar o plano.","e":"de preenchimento:**\n• Experiência: uso TikTok como consumidor, nunca postei\n• Tempo: 1h por dia durante a semana, 3h no sábado\n• Nicho: casa e organização\n• Apareço: ainda não sei\n• Recursos: celular bom, ChatGPT gratuito\n• País: Brasil","u":"1. Responda com honestidade — inflar tempo disponível gera um plano que você não cumpre.\n2. Imprima ou salve as 3 fases; use os \"marcos de verificação\" a cada 30 dias.\n3. Combine com o Prompt #018 para destrinchar os primeiros 14 dias da Fase 1.\n4. Ao final dos 90 dias, rode o prompt de novo informando o que mudou — o plano da segunda rodada será muito melhor.","p":"ChatGPT"},{"n":"013","t":"Escolhedor de Nicho","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Cruzar seus interesses, conhecimentos e capacidade de produção com a lógica de demanda para chegar a 3 nichos finalistas — com prós, contras e um teste de validação para cada um. Use se ainda não escolheu nicho ou se está em dúvida entre vários.","q":"Iniciantes • Afiliados • Criadores faceless","i":":**\n• Interesses e hobbies\n• Conhecimentos e experiências (profissão, habilidades)\n• Tipos de produto que você mesmo compra\n• Se aparece ou não nos vídeos\n• Tempo disponível","c":"Atue como um consultor de posicionamento para criadores de social commerce, especializado em escolha de nicho.\n\nMEUS DADOS:\n- Interesses e hobbies: [LISTE]\n- Conhecimentos e experiências: [PROFISSÃO, HABILIDADES, VIVÊNCIAS]\n- Produtos que eu mesmo(a) compro com frequência: [LISTE]\n- Apareço nos vídeos: [SIM / NÃO]\n- Tempo disponível por dia: [TEMPO]\n\nSua tarefa é me ajudar a escolher um nicho para atuar na TikTok Shop. Siga este processo:\n\n1. INVENTÁRIO\nOrganize meus dados em 3 colunas: \"sei falar sobre\", \"gosto de consumir\", \"consigo produzir conteúdo sobre com meus recursos\".\n\n2. CANDIDATOS\nGere de 6 a 8 nichos candidatos que cruzem pelo menos 2 das 3 colunas. Para cada um, avalie de 1 a 5:\n- Afinidade (o quanto se conecta comigo)\n- Variedade de produtos físicos vendáveis por vídeo curto\n- Facilidade de produzir no meu formato (com ou sem rosto)\n- Sustentabilidade (consigo criar conteúdo disso por 6+ meses sem enjoar?)\n\n3. TRÊS FINALISTAS\nEscolha os 3 melhores somando as notas. Para cada finalista:\n- Por que ele (2 frases)\n- Principal risco (1 frase)\n- 5 exemplos de TIPOS de produto desse nicho (tipos, não produtos específicos — não invente produtos da plataforma)\n\n4. TESTE DE VALIDAÇÃO\nPara cada finalista, descreva um teste prático de 7 dias que eu posso fazer ANTES de decidir (ex.: pesquisar X produtos na TikTok Shop, criar 2 vídeos de teste, avaliar se a produção fluiu).\n\n5. AVISO\nTermine lembrando, em 2 frases, que nicho é decisão reversível: melhor escolher e testar do que buscar o nicho \"perfeito\".\n\nNão use dados inventados de mercado. Baseie as notas em lógica, e diga quando uma nota for palpite qualitativo.","e":"de preenchimento:**\n• Interesses: games, cozinha prática, academia\n• Conhecimentos: trabalho com TI, cozinho todo dia, treino há 5 anos\n• Produtos que compro: acessórios de cozinha, suplementos, gadgets\n• Apareço: não\n• Tempo: 1h por dia","u":"1. Preencha as listas com abundância — 10 itens dizem mais que 3.\n2. Execute o \"teste de validação\" do finalista nº 1 antes de se comprometer.\n3. Com o nicho escolhido, vá direto para os Prompts #014 (público) e #015 (posicionamento).\n4. Se em 30 dias a produção estiver travando por falta de afinidade, rode de novo — o custo de trocar cedo é baixo.","p":"ChatGPT"},{"n":"014","t":"Definidor de Público-Alvo (do seu perfil)","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Construir o retrato detalhado do público do seu perfil: rotina, dores, desejos, linguagem, objeções e hábitos de consumo de conteúdo. Diferente do Prompt #008 (que mapeia públicos de UM produto), este define o público do seu CANAL — a base para posicionamento, tom de voz e escolha de produtos futuros.","q":"Afiliados • Criadores de conteúdo • Vendedores • Criadores faceless","i":":**\n• Nicho\n• Tipos de produto que pretende promover\n• País\n• Formato (com ou sem rosto)\n• Faixa de preço típica","c":"Atue como um pesquisador de audiência especializado em consumidores de social commerce.\n\nMEU CONTEXTO:\n- Nicho: [NICHO]\n- Tipos de produto que pretendo promover: [LISTE]\n- País: [PAÍS]\n- Formato: [COM ROSTO / SEM ROSTO]\n- Faixa de preço típica dos produtos: [FAIXA]\n\nConstrua o perfil do público principal do meu perfil. Baseie-se em lógica de comportamento de consumo; não invente estatísticas. Quando fizer uma inferência, rotule como INFERÊNCIA.\n\nEntregue no seguinte formato:\n\n1. RETRATO DO PÚBLICO PRINCIPAL\n- Faixa etária provável e momento de vida\n- Rotina típica (como é o dia dessa pessoa)\n- Relação dela com o meu nicho (iniciante? entusiasta? só quer resolver um problema?)\n- Em que momentos do dia ela provavelmente rola o feed\n\n2. MAPA DE DORES E DESEJOS\n- 6 dores concretas ligadas ao meu nicho, escritas na voz dela (1ª pessoa)\n- 6 desejos, também na voz dela\n- 3 medos ou vergonhas que ela não verbaliza\n\n3. LINGUAGEM\n- 10 palavras e expressões que esse público usa naturalmente\n- 5 termos técnicos do nicho que eu devo EVITAR ou explicar\n- Tom que funciona (ex.: amiga que indica / especialista acessível / humor)\n\n4. OBJEÇÕES DE COMPRA\nAs 5 objeções mais prováveis desse público ao comprar pelo TikTok, em ordem de força.\n\n5. CONTEÚDO QUE ELA JÁ CONSOME\nQue formatos e temas de vídeo esse público provavelmente já assiste? (para eu me inserir em hábitos existentes, não criar hábitos novos)\n\n6. ANTIPERSONA\nDescreva em 3 frases quem NÃO é meu público — para eu não desperdiçar conteúdo tentando agradar todo mundo.","e":"de preenchimento:**\n• Nicho: organização e casa\n• Produtos: organizadores, itens de limpeza inteligentes, utilidades\n• País: Brasil\n• Formato: sem rosto\n• Faixa: R$ 20 a R$ 90","u":"1. Rode após escolher o nicho (Prompt #013).\n2. Copie o \"Mapa de Dores e Desejos\" para um documento fixo — ele será insumo dos Módulos 4, 5 e 6.\n3. Use a seção \"Linguagem\" como guia de estilo em todas as legendas e roteiros.\n4. Revisite a cada 60 dias: os comentários reais dos seus vídeos vão corrigir e enriquecer esse retrato (use com o Prompt #125).","p":"Multiplataforma"},{"n":"015","t":"Criador de Posicionamento","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Definir como seu perfil se apresenta e se diferencia: promessa central, bio, pilares de conteúdo e tom de voz. Posicionamento é o que faz alguém seguir você em vez de só assistir um vídeo solto. Use depois de definir nicho e público.","q":"Criadores de conteúdo • Afiliados • Criadores faceless","i":":**\n• Nicho\n• Público (resumo do Prompt #014)\n• Formato\n• Seus diferenciais pessoais (experiências, estilo, jeito)\n• O que você viu concorrentes fazendo","c":"Atue como um estrategista de marca pessoal especializado em perfis de social commerce.\n\nMEU CONTEXTO:\n- Nicho: [NICHO]\n- Público (resumo): [COLE O RESUMO DO SEU PÚBLICO]\n- Formato: [COM ROSTO / SEM ROSTO]\n- Meus diferenciais: [EX.: experiência profissional, bom humor, perfeccionismo com testes, história pessoal]\n- O que concorrentes do meu nicho fazem: [DESCREVA EM 2-4 FRASES O QUE VOCÊ OBSERVOU]\n\nCrie meu posicionamento. Entregue no seguinte formato:\n\n1. FRASE DE POSICIONAMENTO\nComplete com 3 variações: \"Eu ajudo [PÚBLICO] a [TRANSFORMAÇÃO/BENEFÍCIO] através de [COMO], sem [DOR/OBSTÁCULO].\"\n\n2. PROMESSA DO PERFIL\nEm 1 frase: o que a pessoa ganha ao me seguir (não ao comprar — ao SEGUIR).\n\n3. BIO PRONTA\n3 opções de bio para o perfil, cada uma com até 80 caracteres, claras e sem clichês vazios tipo \"transformando vidas\".\n\n4. PILARES DE CONTEÚDO\n3 pilares com nome, descrição de 1 frase e proporção sugerida (ex.: 50% / 30% / 20%). Pelo menos 1 pilar deve gerar valor mesmo para quem não vai comprar nada.\n\n5. TOM DE VOZ\n- 3 adjetivos que definem meu tom\n- 5 \"faça\" e 5 \"não faça\" de comunicação\n- 1 exemplo de frase dita no MEU tom vs. a mesma frase em tom genérico\n\n6. DIFERENCIAÇÃO\nCom base no que descrevi dos concorrentes, aponte 2 espaços de posicionamento que parecem vagos e como ocupá-los. Rotule como HIPÓTESE (baseada só na minha observação).\n\n7. TESTE DE COERÊNCIA\nFormule 3 perguntas que devo me fazer antes de publicar qualquer vídeo para checar se ele está alinhado ao posicionamento.\n\nNão invente dados sobre concorrentes além do que informei.","e":"de preenchimento:**\n• Nicho: cozinha prática\n• Público: mulheres 25–45, pouco tempo, cozinham por obrigação\n• Formato: sem rosto (mãos + voz)\n• Diferenciais: cozinho rápido de verdade há 10 anos, humor seco\n• Concorrentes: \"a maioria faz review empolgado gritando; poucos testam o produto de verdade por dias\"","u":"1. Escolha 1 das 3 bios e aplique no perfil hoje.\n2. Cole os \"pilares\" no topo do seu plano de conteúdo (Prompt #016).\n3. Use o \"teste de coerência\" como filtro antes de publicar — 10 segundos que evitam vídeos fora de identidade.\n4. Posicionamento se ajusta com dados: revisite após o primeiro ciclo do Módulo 10.","p":"ChatGPT"},{"n":"016","t":"Plano de Conteúdo de 30 Dias (do perfil)","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Montar o calendário de 30 dias do seu perfil, equilibrando conteúdo de produto, conteúdo de valor e conteúdo de conexão — com tema definido para cada dia. Observação: este plano é do CANAL como um todo; o plano de 30 dias centrado em um único produto está no Módulo 11 (Prompts Master).","q":"Criadores de conteúdo • Afiliados • Iniciantes • Criadores faceless","i":":**\n• Nicho e pilares de conteúdo (do Prompt #015)\n• Lista de produtos que vai promover no período\n• Quantos vídeos por semana\n• Formato\n• Dias/horários que consegue publicar","c":"Atue como um planejador editorial especializado em perfis de social commerce em plataformas de vídeo curto.\n\nMEU CONTEXTO:\n- Nicho: [NICHO]\n- Pilares de conteúdo: [COLE OS PILARES E PROPORÇÕES]\n- Produtos do período: [LISTE OS PRODUTOS QUE VOU PROMOVER NESTES 30 DIAS]\n- Vídeos por semana: [QUANTIDADE]\n- Formato: [COM ROSTO / SEM ROSTO]\n- Dias que consigo publicar: [DIAS DA SEMANA]\n\nCrie meu plano de conteúdo de 30 dias. Regras:\n- Respeite minha capacidade real (não crie mais vídeos do que eu disse que consigo).\n- Distribua os pilares conforme as proporções informadas.\n- Nenhum produto deve ter dois vídeos com o MESMO ângulo no mesmo período — varie ângulo, formato ou público.\n- Inclua conteúdo que gera valor sem vender (o público não aguenta 100% oferta).\n\nEntregue no seguinte formato:\n\n1. VISÃO GERAL\nTabela-resumo: quantos vídeos de cada pilar e de cada produto no mês.\n\n2. CALENDÁRIO DIA A DIA\nTabela com colunas: Dia | Pilar | Produto (ou \"sem produto\") | Tema do vídeo (1 frase) | Formato sugerido (review, demonstração, storytelling, lista etc.) | Objetivo do vídeo (alcance, conexão ou conversão)\n\n3. BLOCOS DE GRAVAÇÃO\nAgrupe os vídeos em sessões de gravação em lote (batch), sugerindo o que gravar junto para economizar tempo.\n\n4. REGRAS DE FLEXIBILIDADE\n3 regras práticas para adaptar o plano quando um vídeo performar acima do normal (ex.: criar variações imediatas) ou quando eu perder um dia.\n\n5. CHECKPOINT DO DIA 15\nListe 4 perguntas de meio de percurso para ajustar a segunda quinzena.\n\nNão prometa resultados de alcance ou vendas; o objetivo do plano é consistência e variedade de testes.","e":"de preenchimento:**\n• Nicho: pets\n• Pilares: 50% produtos / 30% dicas / 20% humor-conexão\n• Produtos: tapete lambedor, escova removedora, fonte de água\n• Vídeos por semana: 5\n• Formato: sem rosto\n• Dias: seg a sex","u":"1. Gere o plano e transfira para sua agenda ou app de notas.\n2. Use os \"blocos de gravação\" para gravar 1x e publicar a semana toda.\n3. Para cada linha do calendário, use o prompt do módulo correspondente (ideia → Módulo 3; roteiro → Módulo 5).\n4. No dia 15, responda o checkpoint e peça à IA os ajustes da segunda quinzena.","p":"Claude"},{"n":"017","t":"Criador de Rotina de Publicação","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Transformar seu tempo disponível em uma rotina semanal realista de produção: blocos de pesquisa, gravação em lote, edição, publicação e análise. O plano de conteúdo diz O QUE postar; este prompt organiza QUANDO e COMO produzir. Use quando a inconsistência for seu maior problema.","q":"Iniciantes • Criadores de conteúdo • Usuários que trabalham com IA","i":":**\n• Tempo disponível por dia (realista)\n• Dias e horários livres\n• Meta de vídeos por semana\n• Etapa que mais te trava (ideia, gravação, edição, publicação)\n• Ferramentas que usa","c":"Atue como um especialista em produtividade para criadores de conteúdo solo.\n\nMINHA REALIDADE:\n- Tempo disponível: [DESCREVA POR DIA DA SEMANA — seja honesto(a)]\n- Meta de vídeos por semana: [QUANTIDADE]\n- Etapa que mais me trava: [IDEIA / GRAVAÇÃO / EDIÇÃO / PUBLICAÇÃO / ANÁLISE]\n- Ferramentas que uso: [EX.: CapCut, ChatGPT, Nano Banana]\n\nCrie minha rotina semanal de produção. Princípios obrigatórios:\n- Trabalhe com PRODUÇÃO EM LOTE (agrupar tarefas iguais) sempre que possível.\n- A rotina precisa caber no tempo que informei, com folga de segurança de 20%.\n- Se a meta de vídeos for incompatível com meu tempo, diga isso e proponha a meta máxima realista.\n\nEntregue no seguinte formato:\n\n1. DIAGNÓSTICO\nEm 3 frases: minha meta cabe no meu tempo? Onde está o maior risco de travar?\n\n2. ROTINA SEMANAL EM BLOCOS\nTabela: Dia | Horário | Bloco (pesquisa / roteiro com IA / gravação em lote / edição / publicação / análise) | Duração | Entregável do bloco\n\n3. CHECKLIST DE CADA BLOCO\nPara cada tipo de bloco, um checklist de 4 a 6 passos objetivos (ex.: bloco \"roteiro com IA\": abrir prompts X e Y, gerar 5 roteiros, escolher 3, ajustar linguagem).\n\n4. PROTOCOLO ANTI-TRAVAMENTO\nPara a etapa que mais me trava, crie um protocolo específico de desbloqueio em 3 passos.\n\n5. PLANO B DA SEMANA CAÓTICA\nUma versão mínima da rotina para semanas em que só tenho 30% do tempo — o essencial para não zerar a consistência.\n\n6. RITUAL DE DOMINGO\n5 itens de preparação semanal (10–15 min) que deixam a semana seguinte pronta para executar.","e":"de preenchimento:**\n• Tempo: seg/qua/sex 1h à noite; sáb 3h\n• Meta: 5 vídeos/semana\n• Trava: edição\n• Ferramentas: CapCut, ChatGPT","u":"1. Preencha com seu tempo REAL, não o ideal.\n2. Teste a rotina por 2 semanas antes de ajustar — rotina precisa de repetição para virar hábito.\n3. Guarde o \"Plano B\": a diferença entre quem constrói audiência e quem desiste costuma ser o que fazem nas semanas ruins.\n4. Combine com o Prompt #016: calendário (o quê) + rotina (quando/como).","p":"ChatGPT"},{"n":"018","t":"Plano de Arranque: Primeiros 14 Dias do Zero Absoluto","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Um plano dia a dia dos primeiros 14 dias para quem está com conta zerada (ou quase): o que fazer, o que publicar, o que medir e — principalmente — o que ignorar. Complementa o Prompt #012: lá está a visão de 90 dias; aqui, a execução da largada. Use no dia em que decidir começar.","q":"Iniciantes • Afiliados • Criadores faceless","i":":**\n• Situação da conta (nova ou existente, nº aproximado de seguidores)\n• Nicho\n• Produto inicial (se já tiver) ou \"ainda escolhendo\"\n• Tempo por dia\n• Formato","c":"Atue como um mentor prático de criadores iniciantes em social commerce. Sua especialidade é tirar pessoas da inércia nos primeiros 14 dias.\n\nMINHA SITUAÇÃO:\n- Conta: [NOVA / EXISTENTE COM ~X SEGUIDORES]\n- Nicho: [NICHO]\n- Produto inicial: [PRODUTO ou \"AINDA ESCOLHENDO\"]\n- Tempo por dia: [TEMPO]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nCrie um plano de arranque de 14 dias, dia a dia. Regras:\n- Cada dia deve ter no máximo 3 tarefas, executáveis no meu tempo disponível.\n- Os primeiros vídeos são TREINO: o objetivo é destravar a publicação e aprender o processo, não performar.\n- Não afirme requisitos específicos da plataforma (número mínimo de seguidores para afiliação, regras de elegibilidade), pois variam por país e mudam com o tempo. Em vez disso, inclua como tarefa: \"verificar os requisitos atuais de afiliado dentro do app da TikTok Shop\".\n- Não prometa resultados; defina apenas metas de processo.\n\nEntregue no seguinte formato:\n\n1. PLANO DIA A DIA (Dia 1 ao Dia 14)\nPara cada dia: tarefas (máx. 3), tempo estimado, entregável do dia.\nO plano deve incluir, distribuídos ao longo dos 14 dias: configuração e otimização do perfil; verificação dos requisitos de afiliado no app; pesquisa de produtos; estudo de 10 vídeos de referência do nicho; publicação dos primeiros vídeos (defina quantos são realistas para meu tempo); e a primeira mini-análise.\n\n2. O QUE MEDIR NOS PRIMEIROS 14 DIAS\n3 indicadores simples e sob meu controle ou observáveis (ex.: vídeos publicados, retenção média, comentários), com o que cada um me ensina.\n\n3. O QUE IGNORAR\n4 métricas ou comparações que iniciantes olham e que só atrapalham nesta fase, com justificativa.\n\n4. EXPECTATIVA REALISTA\nEm 4 frases honestas: o que normalmente acontece (e o que normalmente NÃO acontece) nos primeiros 14 dias de uma conta iniciante.\n\n5. GATILHO DE CONTINUIDADE\nDefina o critério objetivo que marca o fim bem-sucedido do arranque (ex.: X vídeos publicados + processo dominado) e qual é o próximo passo (apontar para um plano de 90 dias).","e":"de preenchimento:**\n• Conta: nova\n• Nicho: beleza\n• Produto: ainda escolhendo\n• Tempo: 1h por dia\n• Formato: com rosto","u":"1. Rode o prompt e cole o plano em local visível.\n2. Cumpra os dias na ordem — a sequência foi desenhada para destravar publicação cedo.\n3. Releia a seção \"Expectativa Realista\" no dia 7, quando bater o desânimo. Vai bater.\n4. Ao concluir o dia 14, volte ao Prompt #012 para a visão dos 90 dias.","p":"Multiplataforma"},{"n":"019","t":"Estrategista para Conteúdo Faceless","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Definir a estratégia completa de um perfil sem rosto: formatos viáveis com os seus recursos, identidade sem aparecer, cuidados com originalidade e o plano dos 7 primeiros vídeos. Use antes de mergulhar no Módulo 9 (que traz os prompts de produção faceless).","q":"Criadores faceless • Iniciantes • Usuários que trabalham com IA","i":":**\n• Nicho\n• Recursos (consegue filmar o produto? tem voz de IA? só imagens?)\n• Motivo de não aparecer (timidez, privacidade, escala)\n• Tempo disponível\n• Produtos iniciais","c":"Atue como um estrategista especializado em canais faceless de social commerce (perfis que vendem sem mostrar o rosto do criador).\n\nMEU CONTEXTO:\n- Nicho: [NICHO]\n- Recursos: [EX.: tenho o produto em mãos e posso filmar com celular / só tenho imagens / posso usar voz de IA / posso narrar com minha voz]\n- Motivo de não aparecer: [TIMIDEZ / PRIVACIDADE / QUERO ESCALAR VÁRIOS PERFIS / OUTRO]\n- Tempo por dia: [TEMPO]\n- Produtos iniciais: [LISTE]\n\nEntregue no seguinte formato:\n\n1. FORMATOS VIÁVEIS PARA MIM\nDos formatos faceless possíveis (mãos + produto, voice-over com b-roll, texto na tela + imagens, narração com IA, POV, screencast, stop motion etc.), ranqueie os 4 melhores PARA OS MEUS RECURSOS, explicando o porquê de cada posição.\n\n2. IDENTIDADE SEM ROSTO\nComo criar reconhecimento sem aparecer: sugira 5 elementos de identidade (ex.: estilo de voz/narração, paleta, jeito de abrir o vídeo, cenário fixo, bordão) adaptados ao meu nicho.\n\n3. RISCOS DO FACELESS E COMO EVITAR\nAponte com franqueza os 4 riscos clássicos: parecer genérico, baixa conexão/confiança, dependência de mídia de terceiros e problemas de originalidade. Para cada um, 1 ação preventiva. Inclua o alerta: usar vídeos ou imagens de outras pessoas sem autorização viola direitos autorais e regras da plataforma — sempre produzir ou gerar mídia própria, e verificar no app as regras atuais sobre conteúdo gerado por IA e sobre divulgação desse uso.\n\n4. CONFIANÇA SEM ROSTO\n5 táticas para gerar prova e credibilidade sem aparecer (ex.: demonstração real do produto em mãos, testes na câmera, responder comentários em vídeo).\n\n5. PLANO DOS 7 PRIMEIROS VÍDEOS\nTabela: Vídeo | Formato (da seção 1) | Produto | Ideia central (1 frase) | O que estou testando com ele\n\n6. EVOLUÇÃO\nEm 3 frases: como esse perfil pode evoluir nos próximos 90 dias se os primeiros testes derem sinais positivos.\n\nNão prometa que faceless é \"mais fácil\" ou \"dinheiro no automático\" — trate como um formato com vantagens e custos próprios.","e":"de preenchimento:**\n• Nicho: utilidades domésticas\n• Recursos: tenho os produtos em mãos, filmo com celular, posso narrar com minha voz\n• Motivo: privacidade\n• Tempo: 1h30/dia\n• Produtos: mop giratório, organizador de temperos, lixeira com sensor","u":"1. Rode este prompt ANTES de usar o Módulo 9 — ele define quais formatos do módulo você vai priorizar.\n2. Implemente pelo menos 3 dos 5 \"elementos de identidade\" desde o primeiro vídeo.\n3. Execute o plano dos 7 vídeos e analise com o Módulo 10.\n4. Releia a seção de riscos a cada mês — perfis faceless derrapam para o genérico sem perceber.","p":"ChatGPT"},{"n":"020","t":"Estrategista de Produção com IA","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Montar o seu pipeline pessoal de produção com IA: qual ferramenta entra em cada etapa (ideia → roteiro → imagem → vídeo → legenda → análise), o que automatizar, o que manter manual e em que ordem aprender as ferramentas. Use para parar de usar IA de forma solta e passar a usar como linha de produção.","q":"Usuários que trabalham com IA • Criadores de conteúdo • Criadores faceless • Afiliados","i":":**\n• Ferramentas a que você tem acesso (e se são gratuitas ou pagas)\n• Orçamento mensal para ferramentas\n• Tempo disponível\n• Formato de conteúdo\n• Etapas que você já domina vs. as que nunca fez","c":"Atue como um consultor de fluxos de produção de conteúdo com inteligência artificial para criadores solo.\n\nMEU CONTEXTO:\n- Ferramentas a que tenho acesso: [EX.: ChatGPT gratuito, Claude, Nano Banana, CapCut, nenhuma IA de vídeo ainda]\n- Orçamento mensal para ferramentas: [VALOR ou \"zero\"]\n- Tempo por dia: [TEMPO]\n- Formato: [COM ROSTO / SEM ROSTO]\n- Etapas que já domino: [LISTE]\n- Etapas que nunca fiz: [LISTE]\n\nMonte meu pipeline de produção com IA. Regras:\n- Priorize as ferramentas que EU JÁ TENHO. Só sugira ferramenta paga se houver ganho claro e couber no orçamento; caso contrário, indique a alternativa gratuita ou manual.\n- Não invente funções que uma ferramenta não tem. Se não tiver certeza de um recurso específico, diga \"verifique se a ferramenta oferece este recurso na versão atual\".\n- IA acelera; não substitui julgamento. Marque as etapas em que EU devo decidir/revisar.\n\nEntregue no seguinte formato:\n\n1. MEU PIPELINE (tabela)\nEtapa | Ferramenta | O que a IA faz | O que EU faço | Tempo estimado\nEtapas: pesquisa de produto, definição de ângulo, hook, roteiro, imagem/criativo, vídeo, edição, legenda + CTA, publicação, análise.\n\n2. GRAU DE AUTOMAÇÃO\nClassifique cada etapa: AUTOMATIZAR (IA faz quase tudo), COPILOTAR (IA propõe, eu decido) ou MANUAL (melhor sem IA no meu caso). Justifique as escolhas não óbvias.\n\n3. ORDEM DE APRENDIZADO\nSe eu ainda não domino alguma ferramenta do pipeline, defina a ordem de aprendizado (1 ferramenta por vez) com um mini-desafio prático de 30 minutos para destravar cada uma.\n\n4. ARMADILHAS DO CONTEÚDO 100% IA\n4 riscos de exagerar na automação (conteúdo genérico, erros factuais, perda de autenticidade, possíveis exigências da plataforma sobre rotular conteúdo gerado por IA — instrua-me a verificar as regras atuais no app) e como evitar cada um.\n\n5. META DE EFICIÊNCIA\nEstime, de forma conservadora, quanto tempo por vídeo esse pipeline pode economizar em relação ao processo 100% manual, deixando claro que é estimativa.","e":"de preenchimento:**\n• Ferramentas: ChatGPT gratuito, Nano Banana, CapCut\n• Orçamento: R$ 50/mês\n• Tempo: 1h/dia\n• Formato: sem rosto\n• Domino: edição básica no CapCut\n• Nunca fiz: roteiro com IA, imagem com IA","u":"1. Rode o prompt e imprima a tabela do pipeline — ela vira seu mapa de produção.\n2. Siga a \"ordem de aprendizado\": uma ferramenta nova por semana, no máximo.\n3. Cruze o pipeline com a rotina do Prompt #017: cada bloco da rotina executa etapas do pipeline.\n4. Revise o pipeline a cada 60 dias — ferramentas de IA mudam rápido.","p":"ChatGPT"},{"n":"021","t":"Analisador de Criadores de Referência","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Extrair o playbook de criadores que você admira no seu nicho: o que produzem, com que frequência, como estruturam a comunicação — e, principalmente, o que você deve ADAPTAR (não copiar). Diferente do Prompt #005 (que disseca vídeos concorrentes de um produto), este analisa PERFIS inteiros como modelo estratégico.","q":"Iniciantes • Criadores de conteúdo • Criadores faceless","i":":**\n• Descrição de 2 a 4 perfis de referência que você estudou (formatos, frequência, tipos de vídeo, bio, o que parece funcionar)\n• Seu nicho e formato\n• Seus recursos e limitações","c":"Atue como um analista de estratégia de criadores de conteúdo. Vou descrever perfis que estudei manualmente no meu nicho. Analise APENAS com base nas minhas descrições — não invente dados sobre esses perfis nem cite criadores que eu não mencionei.\n\nMEU CONTEXTO:\n- Meu nicho: [NICHO]\n- Meu formato: [COM ROSTO / SEM ROSTO]\n- Meus recursos e limitações: [EX.: 1h por dia, sem equipe, celular]\n\nPERFIS QUE ESTUDEI:\nPerfil 1: [DESCREVA: tamanho aproximado, tipos de vídeo, frequência, bio, estilo, o que os melhores vídeos têm em comum, como vendem]\nPerfil 2: [IDEM]\nPerfil 3: [OPCIONAL]\nPerfil 4: [OPCIONAL]\n\nEntregue no seguinte formato:\n\n1. PADRÕES ENTRE OS PERFIS\nO que esses criadores têm em comum em: formato, frequência, estrutura de vídeo e forma de vender? Liste os padrões e rotule como HIPÓTESE o que for interpretação.\n\n2. PLAYBOOK EXTRAÍDO\nTraduza os padrões em 6 a 8 práticas concretas e replicáveis (ex.: \"abrem com o produto já em uso nos 2 primeiros segundos\").\n\n3. FILTRO DE REALIDADE\nCruze o playbook com MEUS recursos: o que consigo aplicar já, o que precisa adaptação e o que devo ignorar por não caber na minha realidade. Seja direto.\n\n4. ADAPTAR ≠ COPIAR\nPara as 3 práticas mais fortes, mostre: como o criador faz → como EU faço a MINHA versão (diferente na execução, igual no princípio).\n\n5. LACUNA DE OPORTUNIDADE\nCom base só nas minhas descrições: o que NENHUM desses perfis faz e que eu poderia testar como diferencial? Rotule como HIPÓTESE.\n\n6. ALERTA\nEm 2 frases, lembre-me do risco de comparar meu início com o meio da jornada deles.","e":"de preenchimento:**\n• Nicho: organização\n• Formato: sem rosto\n• Recursos: 1h/dia, celular\n• Perfil 1: \"perfil grande, posta 2x/dia, vídeos de 20-30s, sempre mãos + produto, abre mostrando a bagunça antes, vende com link fixado no comentário, bio curta com promessa clara\"","u":"1. Estude cada perfil por 15–20 minutos anotando o que pede o prompt (assista aos vídeos mais populares deles).\n2. Rode a análise e implemente 2 práticas do \"filtro de realidade\" já na próxima semana.\n3. Use a \"lacuna de oportunidade\" como pauta de teste no seu plano de conteúdo.\n4. Repita a cada 60 dias com perfis novos — referência também expira.","p":"Claude"},{"n":"022","t":"Plano de Teste de Produtos (protocolo de um produto)","m":2,"mn":"ESTRATÉGIA PARA AFILIADOS E CRIADORES","o":"Criar o protocolo de teste completo de UM produto: matriz de ângulos × formatos, ordem dos vídeos, duração do teste e regras de decisão. Diferente do Prompt #009 (que ordena uma LISTA de produtos num calendário), este define como testar direito um único produto antes de julgá-lo. Use ao iniciar o teste de cada produto do seu plano.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto (com análise prévia, se tiver)\n• Ângulos e públicos identificados (Prompts #007 e #008)\n• Quantos vídeos você consegue dedicar ao teste\n• Formato\n• Prazo do teste","c":"Atue como um especialista em metodologia de testes de conteúdo para social commerce. Sua função é desenhar o protocolo de teste de UM produto, para que a decisão final (continuar, ajustar ou descartar) seja baseada em evidência, não em impressão.\n\nDADOS DO TESTE:\n- Produto: [PRODUTO]\n- Ângulos identificados: [COLE OS ÂNGULOS — ex.: economia de tempo, presente, dor específica X]\n- Públicos identificados: [COLE OS 2 PÚBLICOS PRINCIPAIS]\n- Vídeos disponíveis para o teste: [QUANTIDADE — ex.: 6]\n- Formato: [COM ROSTO / SEM ROSTO]\n- Prazo: [EX.: 14 dias]\n\nEntregue no seguinte formato:\n\n1. MATRIZ DE TESTE\nMonte uma tabela cruzando ângulo × público × formato de vídeo, distribuindo meus vídeos disponíveis para MAXIMIZAR APRENDIZADO: cada vídeo deve testar UMA variável principal diferente. Colunas: Vídeo | Ângulo | Público | Formato | Variável sendo testada | O que este vídeo me ensina se for bem / se for mal.\n\n2. ORDEM DE EXECUÇÃO\nEm que ordem publicar os vídeos e por quê (ex.: começar pelo ângulo mais forte da análise; separar vídeos do mesmo ângulo por alguns dias).\n\n3. REGRAS DE LEITURA\nComo interpretar os sinais SEM precipitação: quanto tempo esperar por vídeo antes de concluir algo; por que 1 vídeo ruim não condena um ângulo; o que caracteriza um sinal consistente (padrão em 2+ vídeos).\n\n4. CRITÉRIOS DE DECISÃO AO FIM DO PRAZO\nDefina de forma objetiva os três desfechos: DOBRAR (que padrão de sinais justifica mais vídeos e variações), PIVOTAR (sinais mistos → trocar ângulo/público mantendo o produto) e DESCARTAR (que padrão justifica abandonar). Use sinais de retenção, comentários, cliques e conversões relativas — sem prometer nenhum número como garantia.\n\n5. REGISTRO\nCrie um mini-template de tabela para eu anotar os resultados de cada vídeo do teste (colunas prontas para copiar).\n\n6. AVISO DE MÉTODO\nEm 3 frases: o que este teste PODE concluir e o que ele NÃO PODE concluir com essa quantidade de vídeos.","e":"de preenchimento:**\n• Produto: escova alisadora\n• Ângulos: pressa de manhã, economia vs. salão, autoestima\n• Públicos: mulheres 25–40 com rotina corrida; mães de adolescentes\n• Vídeos: 6\n• Formato: com rosto\n• Prazo: 14 dias","u":"1. Rode DEPOIS dos Prompts #007 e #008 — a matriz depende de ângulos e públicos mapeados.\n2. Siga a matriz à risca: mudar duas variáveis no mesmo vídeo destrói o aprendizado do teste.\n3. Preencha o template de registro a cada vídeo publicado.\n4. Ao fim do prazo, leve o registro para o Módulo 10 e aplique os critérios de decisão.","p":"ChatGPT"},{"n":"023","t":"Gerador de Ideias de Vídeos","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Gerar 20 ideias de vídeo para um produto, distribuídas entre formatos diferentes e classificadas por facilidade de produção. É o prompt guarda-chuva do módulo: use quando estiver sem ideias ou ao iniciar o teste de um produto novo.","q":"Afiliados • Criadores de conteúdo • Iniciantes • Criadores faceless","i":":**\n• Produto\n• Público principal\n• Principais dores/desejos (Prompt #007)\n• Formato (com ou sem rosto)\n• Ideias que você já fez (para não repetir)","c":"Atue como um diretor criativo especializado em vídeos curtos de social commerce.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Público principal: [PÚBLICO]\n- Principais dores/desejos do público: [COLE DO SEU MAPA]\n- Formato: [COM ROSTO / SEM ROSTO]\n- Vídeos que já fiz deste produto: [LISTE ou \"nenhum\"]\n\nGere 20 ideias de vídeo para este produto. Regras:\n- Distribua entre pelo menos 6 formatos diferentes (demonstração, review, problema→solução, antes/depois, educativo, curiosidade, storytelling, comparativo, teste, lista).\n- Nenhuma ideia pode repetir o ângulo de outra — varie a dor atacada, o contexto de uso ou o público.\n- Nenhuma ideia pode depender de afirmar algo que não se possa verificar sobre o produto.\n- Se meu formato for SEM ROSTO, todas as ideias devem ser executáveis sem aparecer.\n\nEntregue em tabela com as colunas:\nNº | Ideia (2 frases: o que acontece no vídeo) | Formato | Dor/desejo atacado | Facilidade de produzir (1–5, considerando meu formato) | Potencial de retenção (1–5, com base na força visual da ideia)\n\nDepois da tabela:\n\nTOP 5 PARA COMEÇAR: indique as 5 ideias com melhor combinação de facilidade + potencial, justificando em 1 frase cada.\n\nIDEIA CORINGA: destaque 1 ideia mais ousada/diferente do padrão do nicho, explicando o risco e o possível ganho.\n\nSe as informações de público ou dores estiverem vagas demais para gerar ideias específicas, aponte o que falta antes de gerar.","e":"de preenchimento:**\n• Produto: mini seladora de embalagens\n• Público: pessoas que moram sozinhas e desperdiçam comida\n• Dores: \"salgadinho murcha\", \"comida estraga\", \"gasto com comida jogada fora\"\n• Formato: sem rosto\n• Já fiz: 1 demonstração simples","u":"1. Rode com o mapa de dores em mãos (Prompt #007) — sem ele, as ideias saem genéricas.\n2. Leve as \"Top 5\" para a matriz de teste do Prompt #022.\n3. Para cada ideia escolhida, use o prompt do formato correspondente neste módulo para desenvolver o conceito.\n4. Guarde a tabela: as 15 ideias restantes são estoque para as próximas semanas.","p":"ChatGPT"},{"n":"024","t":"Criador de Vídeo de Demonstração","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Planejar uma demonstração que prova, não só mostra: o que demonstrar, em que ordem, qual é o \"momento de prova\" (money shot) e que erros de demonstração evitar. Use para produtos com função visível — é o formato mais direto de venda.","q":"Afiliados • Vendedores • Criadores faceless","i":":**\n• Produto e suas funções\n• O que o produto faz de mais impressionante visualmente\n• Contexto de uso real\n• Público","c":"Atue como um especialista em demonstração de produtos em vídeo curto. Seu princípio central: demonstração boa é PROVA VISUAL — o espectador precisa VER o produto resolvendo o problema, não ouvir que ele resolve.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Funções: [LISTE AS FUNÇÕES]\n- O que ele faz de mais impressionante visualmente: [DESCREVA]\n- Contexto de uso real: [ONDE/QUANDO É USADO]\n- Público: [PÚBLICO]\n\nEntregue o plano de demonstração no seguinte formato:\n\n1. O MOMENTO DE PROVA (money shot)\nQual é a ÚNICA cena que, sozinha, prova o valor do produto? Descreva-a em detalhe: o que aparece no quadro, o que acontece, por que convence.\n\n2. ORDEM DE DEMONSTRAÇÃO\nSequência de 3 a 5 momentos, do mais impactante ao complementar. Regra: o momento de prova (ou uma prévia dele) deve aparecer nos 3 primeiros segundos — nunca guarde o melhor para o final.\n\n3. CONDIÇÕES DE CREDIBILIDADE\n4 cuidados de gravação que aumentam a confiança (ex.: plano contínuo sem corte no momento de prova, mostrar mãos reais, situação de bagunça real e não cenografada).\n\n4. ERROS DE DEMONSTRAÇÃO A EVITAR\n5 erros comuns neste tipo de produto (ex.: demonstrar em condição ideal irreal, acelerar demais o momento de prova, excesso de funções num vídeo só).\n\n5. VARIAÇÕES DE CONTEXTO\n3 contextos de uso diferentes para gravar a MESMA demonstração (para gerar variações de teste sem refazer o conceito).\n\n6. CHECKLIST DE GRAVAÇÃO\nLista objetiva do que filmar na sessão (planos, ângulos, detalhes), para eu capturar tudo de uma vez.\n\nBaseie tudo nas funções que informei. Se alguma função descrita for vaga demais para planejar prova visual, pergunte antes.","e":"de preenchimento:**\n• Produto: mop giratório com balde\n• Funções: torce sozinho no balde, cabeça giratória 360°, microfibra\n• Mais impressionante: sair da água escura e ficar seco na hora\n• Contexto: limpeza de casa no fim de semana\n• Público: quem odeia torcer pano","u":"1. Preencha \"o mais impressionante\" com cuidado — o plano inteiro gira em torno disso.\n2. Grave seguindo o checklist da seção 6 numa sessão só.\n3. Leve o plano para o Prompt #060 (Roteiro de Demonstração) para transformar em roteiro com falas e tempos.\n4. Use as \"variações de contexto\" para produzir 3 vídeos da mesma sessão.","p":"ChatGPT"},{"n":"025","t":"Criador de Review","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Estruturar um review crível: critérios de avaliação, prós e contras reais, e os elementos que separam review de comercial disfarçado. Regra inegociável embutida no prompt: você só avalia o que testou de verdade. Use quando tiver o produto em mãos e experiência real de uso.","q":"Criadores de conteúdo • Afiliados • Vendedores","i":":**\n• Produto\n• Sua experiência REAL de uso (tempo usando, o que gostou, o que decepcionou)\n• Público\n• O que as avaliações de outros compradores dizem (opcional, do Prompt #011)","c":"Atue como um consultor de conteúdo de review, especializado em avaliações que geram confiança (e por isso convertem melhor que propaganda).\n\nPrincípio obrigatório: um review só pode conter o que EU experimentei ou o que está documentado nas avaliações de compradores que eu fornecer. Não invente experiências, não crie prós que eu não citei, não maquie os contras.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Minha experiência real: [HÁ QUANTO TEMPO USO, O QUE GOSTEI, O QUE ME DECEPCIONOU, SITUAÇÕES DE USO]\n- Público: [PÚBLICO]\n- O que outros compradores dizem (opcional): [COLE UM RESUMO DAS AVALIAÇÕES]\n\nEntregue no seguinte formato:\n\n1. CRITÉRIOS DE AVALIAÇÃO\nDefina de 4 a 6 critérios relevantes PARA ESTE TIPO de produto (ex.: para um fone: conforto, bateria, som, chamadas). Para cada critério, indique o que da minha experiência entra ali.\n\n2. VEREDITO POR CRITÉRIO\nCom base APENAS no que relatei: nota ou avaliação qualitativa por critério, com a evidência da minha experiência entre parênteses.\n\n3. O CONTRA QUE CONSTRÓI CONFIANÇA\nIdentifique o ponto negativo mais honesto da minha experiência e mostre como apresentá-lo de forma justa: para quem esse contra é impeditivo e para quem é irrelevante. (Review sem contra é comercial — o público percebe.)\n\n4. PARA QUEM É / PARA QUEM NÃO É\nDuas listas curtas e diretas. A lista \"não é para você se...\" é obrigatória.\n\n5. ESTRUTURA DO REVIEW EM VÍDEO\nOrdem dos blocos para vídeo curto: veredito antecipado → experiência → prós com prova visual → contra honesto → para quem é → CTA. Adapte à minha experiência específica, indicando o que mostrar visualmente em cada bloco.\n\n6. FRASES DE CREDIBILIDADE\n5 frases prontas no meu contexto que sinalizam honestidade sem clichê (evite \"opinião sincera\" — mostre, não declare).\n\nSe minha experiência relatada for insuficiente para um review responsável (ex.: usei uma vez só), diga isso e sugira o que testar antes de gravar.","e":"de preenchimento:**\n• Produto: air fryer compacta 3L\n• Experiência: uso há 3 semanas, quase todo dia; batata fica ótima, frango resseca se passar do tempo, cesto pequeno para 2 pessoas, fácil de limpar\n• Público: quem mora sozinho\n• Avaliações: elogios ao tamanho para 1 pessoa; reclamações de tinta do cesto após meses","u":"1. Use o produto por tempo suficiente antes de rodar o prompt — review de primeira impressão é raso e o público nota.\n2. Não pule a seção 3: o contra honesto é o que faz o resto do review ser acreditado.\n3. Leve a estrutura para o Prompt #059 (Roteiro de Review).\n4. Se receber comentários questionando algo, responda com a evidência da sua experiência — e use o Prompt #070 (Roteiro de Resposta a Comentário).","p":"Multiplataforma"},{"n":"026","t":"Criador de Unboxing","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Planejar um unboxing com narrativa de expectativa: a ordem das revelações, os detalhes senso
