\" [CONFIRMAR]).\n3. \"FUNCIONA MESMO?\" — mini-prova em 1 linha (experiência ou dado verificado) + convite ao vídeo de teste, se houver.\n4. \"VALE A PENA?\" — resposta condicional (\"se você é X, vale; se é Y, talvez não\") — a honestidade que converte o indeciso que está lendo.\n5. \"E COMPARADO COM [ALTERNATIVA]?\" — resposta com o veredito condicional do meu comparativo, sem citar marcas de terceiros.\n6. \"COMPREI PELO SEU VÍDEO!\" — agradecimento específico + pedido leve de retorno depois do uso (a semente da prova social futura).\n7. \"CHEGOU DIFERENTE / DEU PROBLEMA\" — acolhimento + direcionamento correto (suporte da loja/plataforma), sem promessas que não posso cumprir e sem abandonar a pessoa em público.\n8. \"É PUBLI, NÉ?\" — transparência direta sobre ser afiliado, sem constrangimento e sem agressividade — a resposta que define minha credibilidade para todo mundo que lê.\n\nDepois:\nPRIORIDADE DE RESPOSTA: a ordem e o prazo ideais (quais tipos respondo em minutos, quais podem esperar) e o critério para transformar pergunta repetida em vídeo (Prompt #070).","e":"de preenchimento:**\n• Produto: mop giratório, link na vitrine\n• Comentários: \"quanto tá?\", \"isso dura?\", \"meu balde chegou trincado\"\n• Tom: amiga direta, sem formalidade\n• Fatos: paguei R$ 79 mês passado; balde de polipropileno","u":"1. Salve o manual no bloco de notas do celular — a velocidade de resposta é metade da conversão.\n2. Alterne as 2 variações para não parecer copia-e-cola na mesma seção de comentários.\n3. O tipo 7 é o mais importante do manual: problema tratado com dignidade em público vale mais que dez elogios.\n4. Pergunta repetida 3+ vezes → Prompt #070 (vira vídeo).","p":"ChatGPT"},{"n":"079","t":"Criador de Comentários Estratégicos","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Planejar os comentários que você mesmo publica — o comentário fixado que trabalha como segunda legenda, a pergunta-semente que abre a conversa, o comentário-complemento com informação que não coube no vídeo. Tudo às claras, do seu perfil: o prompt proíbe explicitamente perfis falsos, elogios plantados e qualquer astroturfing — que além de antiético, é detectável e punível pela plataforma. Use em toda publicação.","q":"Afiliados • Criadores de conteúdo • Criadores faceless • Vendedores","i":":**\n• O vídeo publicado (roteiro ou resumo)\n• Objetivo do vídeo (venda, alcance, engajamento)\n• Informações que ficaram de fora do vídeo\n• Seu tom","c":"Atue como um estrategista de comentários próprios para social commerce — os comentários que o CRIADOR publica no próprio vídeo como camada extra de conversão e conversa.\n\nREGRA ÉTICA ABSOLUTA: todos os comentários saem do MEU perfil, identificado. Proibido sugerir perfis alternativos, elogios simulando clientes, perguntas plantadas fingindo ser público, ou qualquer forma de engajamento falso — isso é fraude, viola regras da plataforma e destrói contas.\n\nCONTEXTO:\n- O vídeo: [COLE O ROTEIRO OU RESUMA]\n- Objetivo do vídeo: [VENDA / ALCANCE / ENGAJAMENTO]\n- O que ficou de fora do vídeo: [INFORMAÇÕES ÚTEIS QUE NÃO COUBERAM — medidas, dicas, contexto]\n- Meu tom: [DESCREVA]\n\nEntregue:\n\n1. COMENTÁRIO FIXADO — 3 opções, cada uma com função diferente:\n- CONVERSOR: o resumo do argumento + direção ao link (a \"segunda legenda\" para quem chega pelo vídeo compartilhado)\n- INFORMATIVO: o dado útil que faltou no vídeo (medida, compatibilidade, resposta à dúvida previsível)\n- CONVERSADOR: a pergunta-semente que abre o debate (alinhada ao Prompt #052, se o vídeo usou gancho de comentário)\nIndique qual das 3 fixar PARA O OBJETIVO deste vídeo.\n\n2. COMENTÁRIO-COMPLEMENTO (não fixado): 1 comentário para publicar 2–4h depois, adicionando camada nova (bastidor, dica extra, \"detalhe que esqueci de falar\") — o comentário que reacende a seção quando o vídeo desacelera.\n\n3. RESPOSTA-VITRINE: a resposta preparada para o primeiro comentário orgânico relevante que chegar — respondida com capricho visível, porque define o tom da seção inteira.\n\n4. CRONOGRAMA DA SEÇÃO: os 3 momentos de atenção aos comentários deste vídeo (publicação + horas seguintes + dia seguinte), com o que fazer em cada um (responder, fixar melhor comentário orgânico de comprador real, colher perguntas para o #070).\n\n5. LIMITE: em 2 frases, o sinal de que estou \"trabalhando demais\" a seção (comentários próprios em excesso sufocam a conversa orgânica) — e quando parar.","e":"de preenchimento:**\n• Vídeo: demonstração 30s do dispenser\n• Objetivo: venda\n• Ficou de fora: medida da base (12x12), que cabe qualquer marca de detergente\n• Tom: direto e leve","u":"1. Publique o comentário fixado no minuto seguinte à publicação — ele trabalha desde a primeira visualização.\n2. O comentário-complemento de 2–4h é subestimado: agenda um lembrete.\n3. Quando um comprador real elogiar, fixe O COMENTÁRIO DELE no lugar do seu — prova social orgânica vale mais que qualquer copy sua.\n4. Releia a seção 5 mensalmente: a seção de comentários é do público, você só rega.","p":"ChatGPT"},{"n":"080","t":"Criador de Sequência de Conteúdo para Venda","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Arquitetar uma sequência de vídeos que aquece a audiência para um produto: em vez de vídeos soltos, uma escada — o vídeo que apresenta o problema, o que constrói consideração, o que converte e o que colhe prova social — com papéis, ordem e espaçamento definidos. É a peça que transforma conteúdo em campanha. Use com produtos validados que merecem mais que um vídeo.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto validado e seus melhores sinais até aqui\n• Arsenal de argumentos (Prompt #074)\n• Quantos vídeos e em quantos dias\n• Formatos que funcionam no seu perfil","c":"Atue como um arquiteto de sequências de venda em vídeo curto. Princípio: cada vídeo da sequência tem UM papel na jornada — reconhecimento do problema → consideração da solução → conversão → prova social — e tentar fazer tudo em cada vídeo é fazer nada em todos.\n\nRealidade da plataforma a respeitar: o alcance de cada vídeo atinge públicos parcialmente diferentes; a sequência não pode DEPENDER de a pessoa ter visto o vídeo anterior. Cada vídeo funciona sozinho E soma para quem acompanha.\n\nCONTEXTO:\n- Produto e sinais até aqui: [PRODUTO + O QUE JÁ FUNCIONOU NOS TESTES]\n- Arsenal de argumentos: [COLE DO PROMPT #074 — ao menos o TOP 3]\n- Vídeos disponíveis e prazo: [EX.: 6 vídeos em 12 dias]\n- Formatos que funcionam no meu perfil: [EX.: demonstração, resposta a comentário, UGC]\n\nEntregue:\n\n1. A ESCADA em tabela:\nNº | PAPEL NA JORNADA | FORMATO | CONCEITO DO VÍDEO (2 frases) | ARGUMENTO CENTRAL (do arsenal) | CTA (intensidade crescente ao longo da escada) | DIA DE PUBLICAÇÃO\nRegras: o primeiro vídeo não vende (apresenta o problema/curiosidade — CTA de seguir/comentar); a conversão concentra-se nos vídeos do meio-fim; o último colhe e exibe prova social (comentários de compradores, resposta a comprador via #070); e nenhum vídeo depende do anterior para fazer sentido.\n\n2. FIOS DE COSTURA\n3 elementos que conectam a sequência para quem acompanha (o bordão repetido, a promessa cumprida entre vídeos, a resposta no vídeo N à pergunta do vídeo N-1) — a recompensa de seguir o perfil.\n\n3. PONTOS DE ADAPTAÇÃO\nAs 2 decisões que os dados devem tomar no meio da sequência (ex.: \"se o vídeo 2 gerar comentários céticos, o vídeo 4 vira resposta com prova em vez do planejado\") — sequência boa é planejada E viva.\n\n4. PÓS-SEQUÊNCIA\nO que fazer na semana seguinte com base no resultado: escalar com variações (#069), migrar o ângulo, ou encerrar o produto — os critérios de cada caminho em 1 frase.","e":"de preenchimento:**\n• Produto: escova alisadora; melhor sinal = gancho de pressa matinal\n• Arsenal: economia de 40 min (avaliação real); custo vs. salão; aquece em 60s (testei)\n• Vídeos e prazo: 6 em 12 dias\n• Formatos: demonstração, UGC, resposta a comentário","u":"1. Use apenas com produto que passou pelo teste do #022 — sequência é investimento, não teste.\n2. Cada linha da escada vira um roteiro no Módulo 5 (o formato indica o prompt).\n3. Execute os \"pontos de adaptação\" de verdade: olhe os dados no meio, não só no fim.\n4. A sequência inteira se replica para o próximo produto validado — guarde a estrutura que funcionou.","p":"Claude"},{"n":"081","t":"Otimizador de Título de Vitrine","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Otimizar os títulos que vendem na prateleira digital: para vendedores, o título do produto na loja (o que aparece na busca e no card antes de qualquer clique); para afiliados, os nomes das coleções da vitrine e a leitura crítica de títulos ao escolher produtos (título ruim do vendedor = atrito de conversão que você herda). Clareza primeiro, busca depois, honestidade sempre.","q":"Vendedores • Afiliados","i":":**\n• Modo (vendedor otimizando título / afiliado organizando vitrine)\n• Título atual e ficha do produto (modo vendedor) ou lista de produtos da vitrine (modo afiliado)\n• Termos que o público busca\n• Dúvidas/confusões que os compradores demonstram","c":"Atue como um especialista em títulos para social commerce — o texto de prateleira que decide o clique na busca e no card do produto.\n\nPrincípios:\n- CLAREZA VENCE CRIATIVIDADE: em título de produto, o comprador precisa entender O QUE É em 1 segundo.\n- O título responde 3 perguntas na ordem: o que é → para que/para quem → o atributo decisivo.\n- Proibido: caixa alta integral, corrente de emojis, palavras vazias (\"premium\", \"top\", \"incrível\") e qualquer atributo não confirmado na ficha.\n\nMODO: [VENDEDOR — otimizar título de produto / AFILIADO — organizar vitrine]\n\nSE VENDEDOR:\n- Título atual: [COLE]\n- Ficha real do produto: [COLE]\n- Termos que o público busca: [COLE]\n- Confusões que os compradores demonstram: [EX.: acham que vem com refil]\n\nEntregue:\n1. DIAGNÓSTICO do título atual: o que confunde, o que falta, o que sobra (1 frase por problema).\n2. CINCO TÍTULOS OTIMIZADOS (até 60 caracteres cada), variando o atributo decisivo em destaque — cada um com a justificativa da escolha em 1 frase.\n3. TESTE DO CARD: para os 2 melhores, a versão truncada (~40 caracteres, como aparece no card pequeno) — o título precisa sobreviver ao corte.\n4. ANTI-CONFUSÃO: se os compradores demonstram uma confusão recorrente, o elemento do título que a previne.\n\nSE AFILIADO:\n- Produtos da minha vitrine: [LISTE]\n- Meu nicho e público: [COLE]\n\nEntregue:\n1. COLEÇÕES: agrupamento dos produtos em 3–5 coleções com nomes claros e orientados a problema/situação (\"Cozinha sem bagunça\"), não a categoria fria (\"Utilidades\") — com a lógica de cada agrupamento.\n2. ORDEM DENTRO DA VITRINE: quais produtos posicionar primeiro (os validados por conteúdo) e por quê.\n3. LEITURA CRÍTICA: entre os produtos listados, aponte títulos de vendedor confusos o bastante para gerar atrito de conversão — o sinal para eu cobrar do vendedor ou preferir concorrente com página melhor.","e":"de preenchimento (modo vendedor):**\n• Título atual: \"🔥PROMOÇÃO Dispenser TOP Premium Cozinha 2 em 1 LANÇAMENTO🔥\"\n• Ficha: dispenser 380ml com base para esponja, ABS+inox, 12x12cm\n• Termos: \"dispenser detergente\", \"porta esponja\"\n• Confusões: acham que vem com detergente","u":"1. Vendedor: teste o título novo por 2 semanas e compare cliques/conversão da página — título também é experimento.\n2. O \"teste do card\" é o mais importante: a maioria dos compradores só vê a versão truncada.\n3. Afiliado: revise as coleções a cada ciclo de produtos validados; a vitrine organizada por problema converte quem chega do vídeo.\n4. Use junto com o #073 — título e descrição são a mesma página trabalhando junta.","p":"ChatGPT"},{"n":"082","t":"Foto Profissional de Produto","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Transformar sua foto caseira em foto de estúdio: fundo limpo, luz profissional, sombra natural — o padrão de e-commerce que valoriza a página do produto e serve de base para os outros prompts do módulo. É o primeiro prompt a rodar com qualquer produto novo.","q":"Vendedores • Afiliados • Criadores faceless • Usuários que trabalham com IA","i":":**\n• Foto real do produto ANEXADA\n• Cor/estilo do fundo\n• Ângulo desejado\n• Formato (1:1, 9:16, 4:5)","c":"Transforme a foto anexada em uma fotografia profissional de estúdio deste produto.\n\nCENA: produto sobre superfície [BRANCA LISA / CINZA NEUTRA / COR: ___], fundo infinito da mesma cor, sem nenhum outro objeto na cena. Iluminação de estúdio suave e difusa vinda de cima e da lateral, com sombra suave e natural na base do produto (sem sombras duras ou duplas). Produto em foco nítido total, ângulo [FRONTAL / LEVEMENTE ELEVADO EM 3/4 / DE CIMA], ocupando cerca de 70–80% do quadro, centralizado.\n\nFORMATO: [1:1 / 9:16 / 4:5], alta resolução, estética de fotografia de e-commerce premium — limpa, realista, sem filtros artísticos.\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve com fidelidade total: formato e proporções, cores reais, textura e material, logotipo e todos os textos do rótulo (idênticos e legíveis), embalagem e acabamento. NÃO deforme o produto, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva ou invente textos, NÃO acrescente elementos ao produto. Se qualquer texto sair ilegível ou diferente da referência, a imagem está errada.","e":"de preenchimento:**\n• Foto anexada: dispenser de detergente fotografado na pia de casa\n• Fundo: branco liso\n• Ângulo: 3/4 levemente elevado\n• Formato: 1:1","u":"1. Anexe a melhor foto real que você tem (limpe o produto antes de fotografar — IA preserva mancha também).\n2. Envie o prompt preenchido na mesma conversa da imagem.\n3. Rode o checklist pós-geração do módulo (logo, textos, cor, proporção).\n4. Gere as 3 variações de ângulo na mesma conversa (\"agora o mesmo, em ângulo frontal\") — a consistência melhora dentro da mesma conversa.","p":"Nano Banana"},{"n":"083","t":"Produto em Ambiente Real","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Colocar o produto no lugar onde ele vive: a pia, a mesa do home office, o banheiro — um ambiente realista e verossímil, sem pessoas, com o produto como protagonista. É a foto que faz o comprador visualizar o produto na casa dele. Diferente do #085 (lifestyle), aqui o ambiente serve ao produto; lá, o produto serve à cena.","q":"Vendedores • Afiliados • Criadores faceless","i":":**\n• Foto real ANEXADA\n• Ambiente específico e detalhes de verossimilhança\n• Estilo do ambiente (simples, moderno, aconchegante)\n• Formato","c":"Insira o produto da foto anexada em um ambiente real e verossímil.\n\nCENA: [AMBIENTE — ex.: bancada de pia de cozinha residencial brasileira] em estilo [SIMPLES E REAL / MODERNO CLEAN / ACONCHEGANTE]. O produto posicionado [ONDE EXATAMENTE — ex.: ao lado da torneira, sobre a bancada], em tamanho e perspectiva coerentes com o ambiente. Ao redor, apenas 2 ou 3 objetos discretos e coerentes com o local [EX.: uma esponja, um pano dobrado], desfocados levemente para o produto dominar o foco. Iluminação natural de janela, hora do dia [MANHÃ CLARA / FIM DE TARDE]. O ambiente deve parecer uma casa de verdade, vivida — não um showroom.\n\nO PRODUTO É O PROTAGONISTA: em foco total, bem iluminado, ocupando posição de destaque no quadro.\n\nFORMATO: [9:16 / 1:1 / 4:5], fotografia realista, sem estética de ilustração.\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve com fidelidade total: formato e proporções, cores reais, textura e material, logotipo e todos os textos do rótulo (idênticos e legíveis), embalagem e acabamento. NÃO deforme o produto, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva textos, NÃO acrescente elementos ao produto. Verifique que o TAMANHO do produto está proporcional ao ambiente (um dispenser não pode parecer do tamanho de uma geladeira).","e":"de preenchimento:**\n• Ambiente: bancada de cozinha pequena, ao lado da torneira\n• Estilo: simples e real\n• Formato: 9:16","u":"1. Descreva o ambiente da casa do SEU público, não de revista — verossimilhança converte mais que luxo.\n2. Confira a escala do produto na cena (o erro mais comum deste tipo de geração).\n3. Gere 2–3 ambientes diferentes do mesmo produto: são os cenários dos seus criativos da semana.\n4. Esta imagem é ótima primeira cena para vídeo (leve ao Prompt #091).","p":"Nano Banana"},{"n":"084","t":"Produto em Uso","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Gerar a cena de interação: mãos segurando, apertando, aplicando — o produto em ação humana. Com dois cuidados críticos embutidos: a anatomia das mãos (onde IA mais erra) e a regra de honestidade — a cena mostra o USO, nunca um RESULTADO que o produto não produz. Use para criativos de demonstração e primeiras cenas de vídeo.","q":"Afiliados • Vendedores • Criadores faceless","i":":**\n• Foto real ANEXADA\n• A ação exata (o que as mãos fazem com o produto)\n• Contexto e características das mãos/pessoa (tom de pele, idade aparente)\n• Formato","c":"Crie uma fotografia realista do produto anexado sendo usado por uma pessoa.\n\nCENA: mãos [FEMININAS/MASCULINAS, TOM DE PELE: ___, IDADE APARENTE: ___] realizando exatamente esta ação com o produto: [DESCREVA A AÇÃO — ex.: pressionando a bomba do dispenser com uma mão enquanto a outra segura uma esponja embaixo]. Ambiente: [ONDE]. Enquadramento fechado na ação (mãos + produto dominam o quadro), câmera em ângulo [POV DE QUEM USA / LATERAL / LEVEMENTE ELEVADO]. Iluminação natural realista. A ação deve parecer um momento real de uso doméstico, não pose de propaganda.\n\nREGRAS DE ANATOMIA: mãos com exatamente 5 dedos cada, proporções naturais, pegada fisicamente correta no produto (dedos tocando onde tocariam de verdade).\n\nREGRA DE HONESTIDADE: a cena mostra o USO do produto. NÃO crie efeitos ou resultados que a ação não produz de verdade (brilhos mágicos, transformações instantâneas, exageros de desempenho).\n\nFORMATO: [9:16 / 1:1], fotografia realista.\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve com fidelidade total: formato e proporções, cores reais, textura e material, logotipo e textos do rótulo (idênticos e legíveis), embalagem. NÃO deforme o produto, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva textos. A mão não pode cobrir o logo principal do produto.","e":"de preenchimento:**\n• Ação: pressionando a bomba do dispenser com esponja embaixo\n• Mãos: femininas, pele parda, ~30 anos\n• Contexto: pia de cozinha\n• Formato: 9:16","u":"1. Descreva a ação com precisão de coreografia — \"usando o produto\" gera cena genérica e mãos erradas.\n2. Inspecione dedos, articulações e a pegada em zoom antes de aprovar. Sempre.\n3. Se o produto tiver botão/parte funcional, confira que a mão interage com a parte certa.\n4. Imagem aprovada aqui é candidata natural a primeiro quadro de vídeo (Prompt #091 e Módulo 8).","p":"Nano Banana"},{"n":"085","t":"Foto Lifestyle","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Criar a cena aspiracional: o momento de vida em que o produto participa — a manhã organizada, o ritual do café, o canto de descompressão. Aqui o clima e a narrativa lideram; o produto está integrado, visível e fiel, mas a foto vende o momento. Use para conteúdo de conexão, capa de perfil de produto e criativos de identificação.","q":"Criadores de conteúdo • Afiliados • Vendedores","i":":**\n• Foto real ANEXADA\n• O momento de vida (a cena narrativa)\n• Clima/estética (paleta, luz, sensação)\n• Com ou sem pessoa; formato","c":"Crie uma fotografia lifestyle com o produto anexado integrado a um momento de vida.\n\nCENA NARRATIVA: [DESCREVA O MOMENTO — ex.: manhã tranquila de home office: mesa junto à janela, caderno aberto, caneca fumegante, luz de sol entrando]. O produto [ONDE ELE ESTÁ NA CENA — ex.: sobre a mesa, ao lado do caderno], naturalmente integrado, como parte real da rotina — visível, nítido e reconhecível, mas sem pose de anúncio.\n[SE HOUVER PESSOA]: pessoa [DESCRIÇÃO BREVE] em segundo plano ou parcialmente no quadro (mãos, silhueta), desfocada o suficiente para o produto permanecer o elemento mais nítido.\n\nCLIMA E ESTÉTICA: [PALETA — ex.: tons quentes e neutros], [LUZ — ex.: golden hour pela janela], [SENSAÇÃO — ex.: calma, aconchego, organização]. Estética de fotografia editorial de lifestyle: composição cuidadosa, profundidade de campo, atmosfera — mas com verossimilhança de casa real.\n\nFORMATO: [9:16 / 4:5 / 1:1].\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve com fidelidade total: formato e proporções, cores reais, textura e material, logotipo e textos (idênticos e legíveis), embalagem. NÃO deforme, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva textos. Mesmo em cena atmosférica, o produto permanece fiel e identificável — a luz da cena não pode alterar a cor percebida do produto a ponto de enganar.","e":"de preenchimento:**\n• Momento: fim de tarde de autocuidado — banheiro com toalhas dobradas, vela acesa\n• Clima: tons neutros, luz quente, sensação de spa em casa\n• Pessoa: não\n• Formato: 4:5","u":"1. Escreva a cena como se descrevesse uma lembrança, não um anúncio — a IA responde à narrativa.\n2. Confira a regra final: a atmosfera não pode mentir a cor do produto (comprador compra pela foto).\n3. Gere versões de manhã/tarde/noite do mesmo momento — três criativos da mesma cena.\n4. Lifestyle + gancho de identificação (Prompt #041) é a dupla de criativo de conexão.","p":"Nano Banana"},{"n":"086","t":"Foto Estilo UGC","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Gerar imagens com estética de foto de gente comum: enquadramento imperfeito, luz de casa, celular na mão — o visual que se mistura ao feed e não dispara o alarme de \"anúncio\". Com a regra de transparência do formato: é um ESTILO visual para os seus criativos, nunca uma foto para se passar por registro de cliente real.","q":"Afiliados • Criadores faceless • Usuários que trabalham com IA","i":":**\n• Foto real ANEXADA\n• A situação caseira da foto\n• O \"defeito\" proposital (enquadramento torto, sombra, fundo vivido)\n• Formato","c":"Crie uma foto do produto anexado com estética UGC autêntica — como se tirada por uma pessoa comum com o celular, em casa.\n\nCENA: [SITUAÇÃO — ex.: produto recém-tirado da caixa sobre a mesa da sala, com a embalagem aberta ao lado]. Características obrigatórias da estética UGC:\n- Luz de ambiente doméstico real ([LUZ DE JANELA LATERAL / LUZ AMARELADA DE SALA À NOITE]), sem iluminação profissional\n- Enquadramento de celular: [LEVEMENTE DESCENTRALIZADO / ÂNGULO DE QUEM FOTOGRAFA SENTADO / LIGEIRAMENTE DE CIMA]\n- Fundo de casa vivida e coerente: [EX.: sofá com manta, mesa com controle remoto] — organizado o bastante, real o bastante\n- Um \"defeito\" natural proposital: [SOMBRA DO PRÓPRIO CELULAR NA BORDA / REFLEXO LEVE / PEQUENO DESFOQUE DE MOVIMENTO NA BORDA]\n- Textura de foto de celular: nitidez boa mas não perfeita, cores naturais sem tratamento\n\nO produto: nítido, identificável, protagonista natural da foto.\n\nFORMATO: [9:16 / 1:1].\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve com fidelidade total: formato, proporções, cores reais, textura, logotipo e textos (legíveis), embalagem. NÃO deforme, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva textos. A estética imperfeita vale para a CENA — nunca para o produto, que permanece fiel.","e":"de preenchimento:**\n• Situação: produto sobre a pia logo depois de instalado, embalagem ao lado\n• Defeito: sombra leve do celular na borda inferior\n• Luz: janela lateral de manhã\n• Formato: 9:16","u":"1. Use como criativo seu, do seu perfil — nunca apresente como \"foto que uma cliente mandou\": isso é fabricar prova social (e é exatamente o que o Prompt #054 proíbe).\n2. O \"defeito proposital\" é o ingrediente — sem ele, a foto volta a parecer anúncio.\n3. Confira as regras de rotulagem de conteúdo de IA no app antes de publicar.\n4. Combine com os hooks UGC (#048) para criativos estáticos de identificação.","p":"Nano Banana"},{"n":"087","t":"Criativo para Divulgação","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Montar o criativo pronto para publicar: imagem do produto + espaço de headline + hierarquia visual que funciona no tamanho de celular. Com a limitação de texto em IA tratada de frente: texto gerado por IA sai errado com frequência — o prompt pede pouco texto, grande e conferível, e a alternativa de deixar a área do texto vazia para você escrever no CapCut/Canva (mais confiável).","q":"Afiliados • Vendedores • Criadores faceless","i":":**\n• Foto real ANEXADA\n• Headline curta (até 6 palavras) OU decisão de deixar área vazia\n• Estilo do criativo e cor predominante\n• Formato","c":"Crie um criativo de divulgação com o produto anexado.\n\nCOMPOSIÇÃO: produto em destaque ocupando cerca de 60% do quadro, posicionado [CENTRO / TERÇO INFERIOR / LATERAL DIREITA], sobre fundo [COR/ESTILO — ex.: gradiente suave de azul claro / cor sólida complementar à cor do produto / cena desfocada do ambiente de uso]. Composição limpa com forte hierarquia visual: o olho vê primeiro o produto, depois o texto.\n\nTEXTO: [ESCOLHA UMA OPÇÃO]\n(A) Incluir a headline \"[SUA FRASE DE ATÉ 6 PALAVRAS]\" em tipografia grande, bold, sem serifa, cor [___], posicionada [TOPO / ABAIXO DO PRODUTO], com contraste alto contra o fundo. NENHUM outro texto além deste.\n(B) NÃO incluir nenhum texto — deixar a área [TOPO / INFERIOR] limpa e com respiro, reservada para eu adicionar o texto depois em outro aplicativo.\n\nESTILO: [MODERNO E LIMPO / VIBRANTE / MINIMALISTA], legível em tela de celular pequena, estética de anúncio profissional de social commerce — sem poluição, sem selos falsos de desconto, sem elementos que simulem interface da plataforma.\n\nFORMATO: [9:16 / 1:1].\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve com fidelidade total: formato, proporções, cores reais, textura, logotipo e textos do rótulo (legíveis), embalagem. NÃO deforme, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva os textos do produto.","e":"de preenchimento:**\n• Headline: opção B (área inferior vazia, texto no CapCut depois)\n• Estilo: moderno e limpo, fundo gradiente azul claro\n• Formato: 9:16","u":"1. Prefira a opção B se o texto for importante: escrever o texto você mesmo em cima elimina o risco de tipografia errada da IA.\n2. Se usar a opção A, confira letra por letra — texto de IA erra em silêncio.\n3. Sem selos de desconto falsos: promoção só existe no criativo se existir na vitrine (regra do #071 vale aqui).\n4. Gere 2 fundos diferentes do mesmo criativo e teste como capa de vídeo alternada.","p":"Nano Banana"},{"n":"088","t":"Imagem Estilo Catálogo","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Criar a série padronizada de catálogo: o mesmo produto em vários ângulos (ou variações de cor) com fundo, luz e enquadramento IDÊNTICOS entre todas as imagens — a consistência que faz uma página de produto parecer de loja grande. O prompt trabalha em sequência na mesma conversa, ângulo a ângulo.","q":"Vendedores • Afiliados","i":":**\n• Foto real ANEXADA (idealmente mais de um ângulo real)\n• Lista de ângulos/variações desejados\n• Padrão do catálogo (fundo, luz)\n• Formato","c":"Vamos criar uma SÉRIE DE CATÁLOGO do produto anexado: várias imagens com padrão visual rigorosamente idêntico entre elas.\n\nPADRÃO FIXO DA SÉRIE (igual em todas as imagens):\n- Fundo: [BRANCO PURO / CINZA CLARO NEUTRO]\n- Iluminação: estúdio difusa, sombra suave e curta na base\n- Produto ocupando ~75% do quadro, centralizado\n- Formato: [1:1 / 4:5], mesma distância de câmera em todas\n\nIMAGEM 1 DESTA SÉRIE: produto em ângulo [FRONTAL].\n\nDepois desta, vou pedir na sequência os demais ângulos: [LISTE — ex.: 3/4 esquerdo, lateral, traseira, vista de cima, close do rótulo, close da parte funcional]. Mantenha o padrão fixo EXATAMENTE igual em todas — qualquer mudança de fundo, luz ou escala entre imagens quebra o catálogo.\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve com fidelidade total: formato e proporções, cores reais, textura e material, logotipo e todos os textos (idênticos e legíveis), embalagem. NÃO deforme, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva textos. ATENÇÃO ESPECIAL nos ângulos que a foto de referência não mostra (traseira, lateral): NÃO invente botões, entradas, textos ou detalhes que não existem — se um ângulo exigir detalhes que a referência não revela, me avise e peça uma foto real daquele ângulo.","e":"de preenchimento:**\n• Fotos anexadas: frente e traseira reais do produto\n• Ângulos: frontal, 3/4, lateral, vista de cima, close do bico\n• Padrão: fundo branco puro, 1:1","u":"1. Anexe fotos reais de todos os ângulos que puder — a regra final existe porque IA inventa traseiras com convicção.\n2. Peça os ângulos um a um na mesma conversa, conferindo consistência a cada geração.\n3. Compare as imagens lado a lado no fim: escala e tom de fundo idênticos? Refaça as que destoarem.\n4. A série completa é a página de produto do vendedor e o banco de cenas do afiliado.","p":"Nano Banana"},{"n":"089","t":"Imagem de Antes e Depois (diagramação honesta)","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Diagramar as suas duas fotos reais — o antes e o depois que você registrou (Prompt #028) — em um layout profissional de comparação: divisão limpa, rótulos, harmonia visual. Atenção à regra que define este prompt: a IA diagrama e harmoniza o layout; ela NÃO cria nem intensifica o resultado. Antes/depois gerado por IA é propaganda enganosa — e este prompt se recusa a fazer isso.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• As DUAS fotos reais ANEXADAS (antes e depois, mesmos ângulos — checklist do #028)\n• Tipo de layout\n• Formato","c":"Diagrame as duas fotos REAIS anexadas (antes e depois) em um layout profissional de comparação.\n\nREGRA ABSOLUTA DESTE TRABALHO: as duas fotos mostram um resultado real que eu registrei. Sua tarefa é APENAS diagramar, alinhar e harmonizar a apresentação. É PROIBIDO: alterar o estado das superfícies/objetos em qualquer das fotos, intensificar a sujeira do \"antes\", melhorar o resultado do \"depois\", ou modificar qualquer coisa que mude a comparação real. Ajustes permitidos: enquadramento/corte para alinhar as duas fotos, equalização LEVE de brilho para as fotos ficarem comparáveis (sem alterar a percepção do resultado), e a diagramação em si.\n\nLAYOUT: [DIVISÃO VERTICAL AO MEIO (antes à esquerda, depois à direita) / DIVISÃO HORIZONTAL (antes em cima) / DIAGONAL], com linha divisória fina e limpa. Rótulos \"ANTES\" e \"DEPOIS\" em tipografia simples, bold, discreta, posicionados [CANTOS SUPERIORES / SOBRE A LINHA], sem cobrir a área da comparação. Sem molduras pesadas, sem setas, sem emojis, sem elementos gráficos que dramatizem.\n\nFORMATO: [9:16 / 1:1].\n\nAlinhe as duas fotos pelo mesmo enquadramento (mesma área visível nas duas metades) para a comparação ser direta e justa.","e":"de preenchimento:**\n• Fotos anexadas: grelha engordurada (antes) e a mesma grelha limpa (depois), mesmo ângulo\n• Layout: divisão vertical ao meio\n• Formato: 9:16","u":"1. Este prompt depende do trabalho do #028: as duas fotos reais, no mesmo ângulo e luz comparável. Sem elas, não há o que diagramar.\n2. Confira a regra absoluta no resultado: compare as metades geradas com as fotos originais — nada pode ter \"melhorado\".\n3. Use como capa do vídeo de transformação e como criativo estático.\n4. Se alguém pedir nos comentários, você tem as fotos originais como prova — essa é a força de fazer do jeito honesto.","p":"Nano Banana"},{"n":"090","t":"Imagem Comparativa","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Montar o quadro visual de comparação: seu produto ao lado da alternativa genérica (\"o jeito antigo\"), lado a lado, com rótulos e eixos — a versão estática do Prompt #029. Mesmas regras do comparativo: alternativa genérica sem marca de terceiros, comparação justa, e diferenças afirmadas apenas as que você verificou.","q":"Afiliados • Vendedores • Criadores faceless","i":":**\n• Foto real do seu produto ANEXADA (e da alternativa, se tiver)\n• A alternativa (descrita genericamente)\n• Os pontos de comparação VERIFICADOS (do #029)\n• Formato","c":"Crie uma imagem comparativa lado a lado entre o produto anexado e uma alternativa genérica.\n\nLADO A (esquerda): a alternativa — [DESCREVA GENERICAMENTE, SEM MARCA — ex.: \"escova de limpeza manual comum, cabo plástico simples, sem marca visível\"]. IMPORTANTE: objeto 100% genérico, SEM logotipo, SEM marca, SEM design que imite um produto específico existente. [SE EU ANEXAR FOTO REAL DA ALTERNATIVA: use a foto anexada, removendo/desfocando qualquer marca visível.]\n\nLADO B (direita): o MEU produto, da foto anexada, preservado com fidelidade.\n\nCOMPOSIÇÃO: os dois objetos em escala real relativa, mesma iluminação neutra, mesmo fundo [BRANCO / CINZA CLARO], divisão central fina. Rótulos simples e neutros sobre cada lado: \"[EX.: JEITO COMUM]\" e \"[EX.: COM RESERVATÓRIO]\" — rótulos DESCRITIVOS, não depreciativos (proibido \"ruim vs. bom\", \"antigo vs. moderno\" com carga de julgamento).\n[OPCIONAL] Abaixo de cada lado, até 2 marcadores de texto curto com os pontos verificados: LADO A: \"[PONTO VERIFICADO]\" / LADO B: \"[PONTO VERIFICADO]\" — apenas os fatos que informei.\n\nFORMATO: [9:16 / 1:1], estética limpa de infográfico fotográfico.\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO MEU PRODUTO (lado B). Preserve: formato, proporções, cores, textura, logotipo e textos legíveis, embalagem. NÃO deforme, NÃO altere, NÃO adicione partes. A comparação deve ser visualmente JUSTA: mesma luz, mesma escala, mesma qualidade de apresentação nos dois lados — não deteriore o lado A para favorecer o B.","e":"de preenchimento:**\n• Alternativa: escova manual comum de cabo plástico, sem marca\n• Pontos verificados: A: \"exige força\" / B: \"giro motorizado\"\n• Formato: 1:1","u":"1. Use apenas pontos do placar verificado do #029 nos marcadores — a imagem herda a honestidade (ou a desonestidade) da sua comparação.\n2. Confira a justiça visual: o lado A bem apresentado é o que torna a comparação crível.\n3. Se tiver a alternativa em casa, fotografe-a de verdade e anexe — comparação de dois objetos reais é sempre mais forte.\n4. Funciona como capa do vídeo comparativo (#064) e criativo independente.","p":"Nano Banana"},{"n":"091","t":"Briefing Visual para Criar Vídeo","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Gerar os quadros-chave do seu vídeo: a imagem do primeiro quadro (a que você vai animar com IA de vídeo no Módulo 8) e os quadros das cenas seguintes — todos com o produto preservado e com a composição pensada para movimento (espaço para a ação acontecer). É a ponte entre este módulo e o próximo: imagem parada hoje, vídeo amanhã.","q":"Usuários que trabalham com IA • Criadores faceless • Afiliados","i":":**\n• Foto real ANEXADA\n• O roteiro ou a cena a animar (do Módulo 5/8)\n• O movimento planejado (o que vai acontecer quando a imagem virar vídeo)\n• Formato (9:16 para TikTok)","c":"Crie o QUADRO-CHAVE de abertura de um vídeo — uma imagem composta para ser animada por IA de vídeo em seguida.\n\nA CENA DESTE QUADRO: [DESCREVA O MOMENTO CONGELADO — ex.: mão feminina segurando o dispenser sobre a pia com louça, dedo posicionado sobre a bomba, prestes a pressionar].\n\nO MOVIMENTO QUE VIRÁ (componha o quadro para permitir esta ação): [DESCREVA — ex.: a mão vai pressionar a bomba e o sabão vai cair na esponja]. Por isso:\n- Deixe ESPAÇO DE AÇÃO no quadro na direção do movimento (não corte o quadro rente ao ponto onde a ação acontece)\n- Elementos que vão se mover devem estar em posição inicial coerente (a mão \"pronta para\", o objeto \"prestes a\")\n- Composição estável nas bordas (as bordas se distorcem primeiro na animação): produto e ação no centro-terços do quadro\n\nCENÁRIO E LUZ: [AMBIENTE + ILUMINAÇÃO], realista, coerente com vídeo de celular vertical.\n\nFORMATO: 9:16 vertical, alta resolução, fotografia realista (sem estética de ilustração — IA de vídeo anima melhor quadros fotorrealistas).\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve: formato, proporções, cores reais, textura, logotipo e textos legíveis, embalagem. NÃO deforme, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva textos.\n\nDepois deste quadro, vou pedir na mesma conversa os quadros-chave das cenas seguintes do vídeo — mantenha produto, cenário, luz e estilo consistentes entre todos.","e":"de preenchimento:**\n• Cena: mão sobre a bomba do dispenser, pia com louça ao fundo\n• Movimento que virá: pressionar a bomba, sabão caindo na esponja\n• Cenário/luz: cozinha residencial, luz de janela lateral\n• Formato: 9:16","u":"1. Traga o roteiro pronto (Módulo 5) — cada linha da coluna visual pode virar um quadro-chave.\n2. O \"espaço de ação\" é o detalhe que separa imagem animável de imagem que a IA de vídeo distorce.\n3. Gere todos os quadros do vídeo na mesma conversa, pela consistência.\n4. Leve os quadros aprovados direto ao Prompt #093 (Módulo 8) para animar.","p":"Nano Banana"},{"n":"092","t":"Imagem de Destaque para Vitrine","m":7,"mn":"IMAGENS COM INTELIGÊNCIA ARTIFICIAL","o":"Criar a imagem que vence no tamanho de miniatura: a foto principal do card do produto, otimizada para a prateleira onde tudo é pequeno — produto grande no quadro, contraste alto, zero poluição, legível num card de 3 centímetros. É a imagem que decide o clique antes de qualquer outra coisa. Feche o módulo do vendedor com ela.","q":"Vendedores • Afiliados (para avaliar páginas antes de promover)","i":":**\n• Foto real ANEXADA\n• O atributo visual decisivo do produto (o que precisa ser visível mesmo em miniatura)\n• Cor de fundo que contrasta com o produto\n• Formato (1:1 para card)","c":"Crie a imagem principal de card de produto — otimizada para ser vista em MINIATURA (o card pequeno da busca e da vitrine).\n\nREGRAS DE MINIATURA (todas obrigatórias):\n- Produto ocupando 85–90% do quadro — maior do que pareceria natural numa foto comum\n- Fundo em cor sólida [COR QUE CONTRASTA COM O PRODUTO — ex.: produto branco → fundo azul-acinzentado suave], SEM cenário, SEM objetos de apoio, SEM texto, SEM selos\n- O atributo decisivo do produto claramente visível e virado para a câmera: [QUAL — ex.: a base para esponja / o display de temperatura / o bico dosador]\n- Ângulo que mostra o produto da forma mais reconhecível: [3/4 ELEVADO / FRONTAL]\n- Contraste e nitidez altos; iluminação uniforme sem sombras dramáticas\n- Silhueta do produto limpa e legível — o teste é: reduzida a 3cm, a imagem ainda comunica o que o produto é?\n\nFORMATO: 1:1, alta resolução.\n\nUSE A IMAGEM ANEXADA COMO REFERÊNCIA ABSOLUTA DO PRODUTO. Preserve com fidelidade total: formato e proporções, cores reais, textura e material, logotipo e textos (idênticos e legíveis), embalagem. NÃO deforme, NÃO mude cores, NÃO adicione ou remova partes, NÃO reescreva textos. A cor do fundo não pode contaminar a cor percebida do produto.","e":"de preenchimento:**\n• Atributo decisivo: a base para esponja acoplada\n• Fundo: azul-acinzentado suave (produto branco/inox)\n• Ângulo: 3/4 elevado\n• Formato: 1:1","u":"1. Faça o teste da miniatura de verdade: reduza a imagem na tela do celular ao tamanho de card e avalie — é o único julgamento que importa.\n2. Vendedor: teste a imagem nova por 2 semanas e compare a taxa de clique do card.\n3. Afiliado: use este padrão como régua para avaliar páginas de produto antes de promover (card ruim = atrito que você herda — regra do #081).\n4. Par obrigatório do título otimizado (#081): card e título trabalham juntos na prateleira.","p":"Nano Banana"},{"n":"093","t":"Transformar Imagem em Vídeo","m":8,"mn":"VÍDEOS COM IA","o":"Animar o quadro-chave aprovado (do Prompt #091): o briefing de movimento que diz à IA de vídeo o que se move, o que fica parado e como a câmera se comporta — o caminho mais confiável para vídeo com produto fiel. É o prompt-ponte do fluxo Nano Banana → IA de vídeo. Use para cada clipe do seu vídeo montado.","q":"Usuários que trabalham com IA • Criadores faceless • Afiliados","i":":**\n• O quadro-chave ANEXADO na ferramenta de vídeo (imagem do #091)\n• O movimento planejado (definido quando criou o quadro)\n• Duração do clipe\n• O que NÃO deve se mover","c":"Anime esta imagem preservando fielmente todos os elementos dela — especialmente o produto, que deve permanecer idêntico ao da imagem durante todo o clipe (mesma forma, cor, rótulo e proporções).\n\nAÇÃO (o único movimento principal da cena): [DESCREVA UM movimento claro e físico — ex.: a mão pressiona a bomba do dispenser uma vez, e uma pequena porção de sabão desce sobre a esponja]. Movimento em velocidade natural e física realista.\n\nO QUE PERMANECE ESTÁTICO: [LISTE — ex.: o produto no lugar, o fundo, os objetos da bancada]. Nada além da ação descrita deve se mover.\n\nCÂMERA: [ESTÁTICA / APROXIMAÇÃO LENTA E SUAVE EM DIREÇÃO AO PRODUTO / LEVE MOVIMENTO LATERAL], sem tremores, sem cortes dentro do clipe.\n\nDURAÇÃO: [5–10] segundos. FORMATO: vertical 9:16. ESTILO: realista, coerente com a iluminação da imagem original — sem mudança de luz, sem efeitos, sem elementos novos entrando na cena.","e":"de preenchimento:**\n• Imagem: quadro do dispenser com mão posicionada (gerado no #091)\n• Ação: pressionar a bomba, sabão descendo na esponja\n• Estático: produto, fundo, louça\n• Câmera: estática / Duração: 6s","u":"1. Um movimento por clipe. Dois movimentos simultâneos dobram a chance de distorção — a regra de ouro do imagem→vídeo.\n2. Gere 2–3 versões do mesmo clipe e escolha a de física mais convincente; descarte qualquer uma em que o produto deformou.\n3. Repita para cada quadro-chave do vídeo e monte a sequência no editor.\n4. Texto na tela e narração entram na edição, nunca na geração.","p":"IA de vídeo"},{"n":"094","t":"Criar Vídeo UGC com IA","m":8,"mn":"VÍDEOS COM IA","o":"Gerar clipes de pessoa em estilo UGC falando/segurando o produto — o avatar casual de IA para quem não aparece. Com as regras que o formato exige: a pessoa gerada não é uma cliente real e nunca pode ser apresentada como tal; a fala vem do seu mapa de beats real (#058); e a rotulagem de conteúdo IA se verifica no app antes de publicar. Use como alternativa faceless ao UGC — sabendo que o UGC humano real continua convertendo mais.","q":"Criadores faceless • Usuários que trabalham com IA • Afiliados","i":":**\n• Descrição da pessoa (coerente com seu público)\n• Cenário caseiro e ação\n• A fala (do seu roteiro UGC real — #058) se a ferramenta suportar áudio/lip sync\n• Duração e produto (idealmente via imagem de referência, se a ferramenta aceitar)","c":"Vídeo vertical 9:16, estética UGC autêntica de câmera frontal de celular.\n\nPESSOA: [DESCRIÇÃO — ex.: mulher brasileira, ~30 anos, pele parda, cabelo preso informal, camiseta básica], expressão natural e simpática, olhando para a câmera como quem grava para amigos — não como apresentadora.\n\nCENÁRIO: [AMBIENTE CASEIRO REAL — ex.: cozinha residencial comum ao fundo, levemente desfocada], luz natural de janela, ambiente vivido e verossímil (não estúdio, não casa de revista).\n\nAÇÃO: a pessoa [SEGURA O PRODUTO PRÓXIMO À CÂMERA / MOSTRA O PRODUTO E GESTICULA ENQUANTO FALA / USA O PRODUTO BREVEMENTE], com gestos naturais e imperfeitos de conversa real.\n[SE A FERRAMENTA ACEITAR IMAGEM DE REFERÊNCIA DO PRODUTO: anexe a foto real e instrua: \"o produto nas mãos dela deve ser idêntico ao da imagem anexada — forma, cor, rótulo\".]\n\nCÂMERA: frontal fixa, altura dos olhos, enquadramento de selfie apoiada (busto), leve micro-movimento natural de câmera segurada.\n\n[SE A FERRAMENTA SUPORTAR FALA/LIP SYNC]: a pessoa fala com naturalidade: \"[COLE AQUI A FALA CURTA DO SEU ROTEIRO UGC — 1 a 2 frases por clipe]\". Tom de conversa, não de locução.\n\nDURAÇÃO: [5–10] segundos por clipe. ESTILO: realista, cores naturais de celular, sem aparência de comercial.","e":"de preenchimento:**\n• Pessoa: mulher ~30, pele parda, camiseta cinza\n• Cenário: cozinha comum, luz de janela\n• Ação: segurando o dispenser perto da câmera, gesticulando\n• Fala: \"gente, eu jurava que isso era besteira de internet\"","u":"1. A fala vem do seu mapa de beats (#058) fatiada em clipes de 1–2 frases — monte a sequência no editor.\n2. Regra inegociável: esta pessoa não existe. Nunca a apresente como cliente, nunca use como \"depoimento\". Ela é uma atriz virtual do SEU criativo — e o conteúdo segue as regras de rotulagem de IA do app (verifique antes de publicar).\n3. Inspecione lábios (se houver fala), mãos e o produto em cada clipe.\n4. Se puder gravar UGC real (#035), grave — use o de IA para escalar volume, não para substituir a verdade.","p":"IA de vídeo"},{"n":"095","t":"Criar Apresentador Virtual","m":8,"mn":"VÍDEOS COM IA","o":"Criar um apresentador recorrente para o seu perfil: um personagem virtual com identidade fixa (aparência, figurino, cenário, tom) que apresenta produtos vídeo após vídeo — a \"cara\" do canal faceless. O prompt define a ficha de identidade UMA vez e a reutiliza em todo clipe, porque a consistência entre vídeos é o que transforma avatar em apresentador. Difere do #094: lá, textura casual de consumidor; aqui, um host reconhecível do canal.","q":"Criadores faceless • Usuários que trabalham com IA","i":":**\n• Identidade do apresentador (alinhada ao posicionamento do #015)\n• Cenário fixo do canal\n• A fala/apresentação do clipe (roteiro do Módulo 5)\n• Produto e duração","c":"=== FICHA DE IDENTIDADE DO APRESENTADOR (use idêntica em todos os clipes deste canal) ===\nAPRESENTADOR(A): [DESCRIÇÃO COMPLETA E ESPECÍFICA — ex.: homem brasileiro, ~35 anos, pele negra, barba curta bem-feita, óculos de armação fina preta, camisa polo verde-escura]. Expressão padrão: [SIMPÁTICO E DIRETO / ENTUSIASMADO CONTIDO]. Postura: [EM PÉ ATRÁS DE BANCADA / SENTADO À MESA].\nCENÁRIO FIXO: [DESCRIÇÃO — ex.: bancada de madeira clara, fundo de parede cinza com duas prateleiras e uma planta, luz principal frontal suave].\n=== FIM DA FICHA ===\n\nCLIPE DE HOJE:\nAÇÃO: o apresentador [SEGURA O PRODUTO E O APRESENTA À CÂMERA / DEMONSTRA O PRODUTO SOBRE A BANCADA / APONTA PARA O PRODUTO AO LADO], com gestos claros e contidos de apresentador.\n[SE A FERRAMENTA ACEITAR IMAGEM DE REFERÊNCIA: anexe a foto real do produto e exija fidelidade total a ela.]\n[SE HOUVER FALA/LIP SYNC]: ele diz, em tom de apresentador acessível: \"[FRASE DO ROTEIRO — 1 a 2 frases por clipe]\".\n\nCÂMERA: fixa frontal, plano médio (cintura para cima), enquadramento idêntico entre todos os clipes do canal.\nDURAÇÃO: [5–10]s. FORMATO: 9:16. ESTILO: realista, iluminação constante da ficha, sem variação de cenário.","e":"de preenchimento:**\n• Ficha: homem ~35, óculos finos, polo verde; bancada de madeira, parede cinza com prateleiras\n• Ação: segurando o organizador de cabos, apresentando\n• Fala: \"esse aqui resolveu a bagunça da minha mesa em 1 minuto\"","u":"1. Escreva a ficha uma vez, salve em nota fixa, e cole SEM ALTERAR em todo clipe — cada palavra mudada muda o rosto.\n2. Gere 3–4 clipes-teste antes de adotar: se a ferramenta não mantiver a consistência do personagem, simplifique a ficha (menos detalhes variáveis, figurino mais simples).\n3. O apresentador segue as mesmas regras do #094: não é pessoa real, não dá \"depoimento\", e o conteúdo respeita a rotulagem de IA do app.\n4. A identidade do apresentador deve nascer do posicionamento (#015) — ele é o seu tom com rosto.","p":"IA de vídeo"},{"n":"096","t":"Criar Demonstração de Produto","m":8,"mn":"VÍDEOS COM IA","o":"Gerar clipes do produto funcionando: a ação mecânica, o encaixe, o resultado do uso — com o alerta central do formato: física é onde IA de vídeo mais falha e onde a mentira mais mora. O briefing exige física plausível, proíbe desempenho inventado e recomenda o caminho híbrido: momento de prova REAL filmado por você + cenas de apoio geradas. Use para complementar (não substituir) a demonstração real.","q":"Afiliados • Vendedores • Usuários que trabalham com IA","i":":**\n• Quadro-chave do produto ANEXADO (#091) — obrigatório neste formato\n• A função demonstrada (o que acontece fisicamente)\n• O que caracterizaria exagero (para você mesmo policiar)\n• Duração","c":"Anime esta imagem mostrando o produto em funcionamento, com FÍSICA REALISTA como prioridade máxima.\n\nAÇÃO DEMONSTRADA: [DESCREVA O FUNCIONAMENTO FÍSICO EXATO — ex.: a cabeça do mop gira dentro do balde quando o pedal é pressionado; a água escorre naturalmente das fibras]. A ação acontece em velocidade real, com o comportamento físico correto de [ÁGUA / TECIDO / MECANISMO / VAPOR — o elemento da cena].\n\nLIMITES DA DEMONSTRAÇÃO (obrigatórios):\n- O produto realiza APENAS a ação descrita — sem efeitos extras, sem resultados ampliados, sem \"mágica\" (brilhos, transformações instantâneas, sujeira sumindo além do que a ação física removeria)\n- O produto permanece idêntico ao da imagem durante todo o movimento (forma, cor, rótulo)\n- Nenhum elemento novo entra na cena\n\nCÂMERA: [ESTÁTICA EM PLANO FECHADO NA AÇÃO / APROXIMAÇÃO LENTA], estável.\nDURAÇÃO: [5–10]s. FORMATO: 9:16. ESTILO: realista de vídeo de celular bem feito, luz coerente com a imagem original.","e":"de preenchimento:**\n• Quadro: mop dentro do balde (do #091)\n• Ação: cabeça girando ao pressionar o pedal, água escorrendo\n• Exagero a policiar: água \"sumindo\" ou chão limpando sozinho\n• Duração: 7s","u":"1. Regra do híbrido: o momento de prova central (o money shot do #024) deve ser REAL, filmado por você — a IA gera as cenas de apoio (contexto, aproximações, ambiente). Prova gerada não é prova.\n2. Julgue a física de cada clipe com rigor: água estranha, engrenagem impossível ou movimento \"flutuante\" = descarte.\n3. Se a demonstração inteira depender de física complexa (líquidos, vapor), filme real — sai mais rápido que iterar geração.\n4. Monte: clipe real de prova + clipes IA de apoio, no roteiro do #060.","p":"IA de vídeo"},{"n":"097","t":"Criar Vídeo Cinematográfico","m":8,"mn":"VÍDEOS COM IA","o":"Gerar o hero shot: o clipe de estética de comercial — luz dramática, câmera lenta e deliberada, produto monumentalizado — que abre vídeo, fecha criativo ou vira capa animada. É estética pura, e o briefing assume isso: aqui não se demonstra nada; se cria desejo visual. Use com moderação: um hero shot por vídeo, no máximo.","q":"Usuários que trabalham com IA • Vendedores • Criadores faceless","i":":**\n• Quadro-chave ou foto profissional do produto ANEXADA (#082/#091)\n• O clima cinematográfico (a referência de sensação)\n• Movimento de câmera\n• Duração","c":"Anime esta imagem como um hero shot cinematográfico do produto.\n\nCLIMA: [ESCOLHA/DESCREVA — ex.: elegante e minimalista: fundo escuro, produto emergindo da penumbra / fresco e vibrante: luz de manhã, partículas de poeira na luz / premium tech: reflexos controlados em superfície escura espelhada].\n\nMOVIMENTO DE CÂMERA (apenas UM, lento e contínuo): [ÓRBITA LENTA AO REDOR DO PRODUTO / APROXIMAÇÃO FRONTAL SUAVE (dolly in) / DESLIZAMENTO LATERAL REVELANDO O PRODUTO / ELEVAÇÃO LENTA DO NÍVEL DA BASE AO NÍVEL DO PRODUTO]. Velocidade contemplativa, movimento perfeitamente estável.\n\nELEMENTOS DE ATMOSFERA (no máximo um, sutil): [PARTÍCULAS DE POEIRA NA LUZ / NÉVOA BAIXA DISCRETA / REFLEXO SUAVE NA SUPERFÍCIE / NENHUM]. O elemento não pode tocar nem obscurecer o produto.\n\nLUZ: [DRAMÁTICA LATERAL COM SOMBRAS PROFUNDAS / SUAVE E ENVOLVENTE / CONTRALUZ COM CONTORNO ILUMINADO], comportamento de luz realista.\n\nO produto permanece idêntico ao da imagem durante todo o movimento — forma, cor, rótulo, proporções. Nenhum efeito sobre o produto em si.\n\nDURAÇÃO: [5–8]s. FORMATO: 9:16. ESTILO: fotografia publicitária em movimento, profundidade de campo, realismo premium.","e":"de preenchimento:**\n• Imagem: foto de estúdio da garrafa térmica (#082)\n• Clima: premium tech, superfície escura espelhada\n• Câmera: órbita lenta\n• Duração: 6s","u":"1. Um movimento de câmera por clipe — órbita + zoom + névoa no mesmo pedido gera sopa visual.\n2. O hero shot funciona como: abertura de vídeo de produto (#099), capa animada e fechamento de criativo. Não sustenta vídeo inteiro.\n3. Cheque o rótulo durante o movimento — órbitas revelam lados que a IA pode inventar (mesma regra do #088: sem foto real do lado, desconfie do lado gerado).\n4. Combine com som de impacto sutil na edição — hero shot é 50% áudio.","p":"IA de vídeo"},{"n":"098","t":"Criar Vídeo Estilo TikTok","m":8,"mn":"VÍDEOS COM IA","o":"Gerar clipes com a gramática nativa do feed: câmera de celular na mão, energia de vídeo caseiro, luz de ambiente, ritmo de quem filma a própria vida — o oposto do hero shot. É o clipe que não parece anúncio, para montar vídeos que se misturam ao rolar do dedo. Use para as cenas de contexto e rotina dos seus vídeos montados.","q":"Criadores faceless • Afiliados • Usuários que trabalham com IA","i":":**\n• Quadro-chave ou descrição da cena (com produto: anexe imagem)\n• A situação de rotina filmada\n• O tipo de \"câmera de celular\" (POV, apoiada, na mão)\n• Duração","c":"Gere um clipe vertical 9:16 com estética NATIVA de vídeo de celular para feed — deve parecer filmado por uma pessoa comum no dia a dia, não produzido.\n\nCENA: [SITUAÇÃO DE ROTINA — ex.: POV de alguém abrindo a gaveta bagunçada da cozinha de manhã / mãos guardando compras na despensa apertada / vista da mesa de home office ao fim do dia].\n\nCARACTERÍSTICAS OBRIGATÓRIAS DA ESTÉTICA:\n- Câmera: [NA MÃO COM MICRO-TREMOR NATURAL / POV NA ALTURA DOS OLHOS / APOIADA IMPROVISADA EM ÂNGULO LEVEMENTE TORTO]\n- Luz: de ambiente real ([JANELA / LÂMPADA AMARELADA DE CASA]), sem iluminação de produção\n- Ambiente: casa vivida e verossímil, com os pequenos sinais de vida real [EX.: pano no gancho, ímã na geladeira]\n- Movimento com energia de vídeo caseiro: [RÁPIDO E DIRETO / CASUAL E FLUIDO]\n- Cores naturais de celular, sem tratamento cinematográfico, sem profundidade de campo artificial\n\n[SE O PRODUTO APARECE]: use a imagem anexada como referência absoluta do produto — idêntico em forma, cor e rótulo durante todo o clipe.\n\nDURAÇÃO: [5–8]s. Sem textos na tela (adiciono na edição), sem transições dentro do clipe.","e":"de preenchimento:**\n• Cena: POV abrindo gaveta de tampas bagunçada\n• Câmera: POV altura dos olhos, micro-tremor\n• Luz: janela de manhã\n• Duração: 5s","u":"1. Este é o gerador de \"cenas de vida\" dos seus vídeos: a dor encenada (#063), o contexto do POV (#068), o b-roll de rotina (#106).\n2. O micro-tremor e a luz de casa são o disfarce — se o clipe sair bonito demais, regenere pedindo mais imperfeição.\n3. Monte clipes deste prompt com clipes reais seus: a mistura confunde a leitura de \"anúncio\" melhor que qualquer um dos dois sozinho.\n4. Cheque a verossimilhança do ambiente (IA às vezes gera \"casa de ninguém\") — os pequenos sinais de vida são o que convence.","p":"IA de vídeo"},{"n":"099","t":"Criar Vídeo de Produto","m":8,"mn":"VÍDEOS COM IA","o":"Gerar o vídeo de página de produto: rotação/apresentação do produto em fundo neutro com as vistas que o comprador quer conferir antes de clicar — o análogo em vídeo da série de catálogo (#088). Funcional, limpo, sem narrativa: o produto girando, os ângulos, o close da parte que importa. Use na página do vendedor e como material de apoio do afiliado.","q":"Vendedores • Afiliados","i":":**\n• Foto de estúdio ANEXADA (#082 — a base ideal)\n• O tipo de apresentação (rotação, sequência de vistas)\n• A parte funcional que merece destaque\n• Duração e fundo","c":"Anime esta imagem como um vídeo de apresentação de produto para página de e-commerce.\n\nAPRESENTAÇÃO: o produto sobre [SUPERFÍCIE BRANCA / CINZA NEUTRA] com fundo infinito da mesma cor, realizando [ROTAÇÃO COMPLETA LENTA EM TORNO DO PRÓPRIO EIXO (estilo turntable) / ROTAÇÃO PARCIAL DE 90° REVELANDO A LATERAL / PERMANECENDO ESTÁTICO ENQUANTO A CÂMERA ORBITA LENTAMENTE].\n\nREGRA CRÍTICA DA ROTAÇÃO: os lados do produto revelados pelo giro devem ser COERENTES com um produto real — sem inventar botões, entradas, textos ou detalhes nos ângulos que a imagem de referência não mostra. Se a rotação exigir detalhes desconhecidos, prefira rotação parcial que permaneça nos ângulos visíveis da referência.\n\nLUZ: estúdio difusa e constante durante todo o movimento, sombra suave acompanhando a base naturalmente.\nO produto permanece idêntico ao da referência: forma, proporções, cores, rótulo legível durante todo o giro.\n\nDURAÇÃO: [5–8]s por clipe. FORMATO: [1:1 PARA PÁGINA DE PRODUTO / 9:16]. ESTILO: e-commerce premium, limpo, sem elementos decorativos.\n\n[CLIPE 2, opcional, na sequência]: close lento na parte funcional: [QUAL — ex.: aproximação suave até o bico dosador, mostrando o mecanismo em detalhe].","e":"de preenchimento:**\n• Imagem: foto de estúdio do dispenser (#082)\n• Apresentação: rotação parcial 90° + clipe 2 de close no bico\n• Fundo: branco / Formato: 1:1\n• Duração: 6s + 5s","u":"1. Parta sempre da foto de estúdio (#082) — fundo neutro dá à IA menos chances de errar.\n2. A \"regra crítica da rotação\" é a mesma lição do catálogo (#088): sem referência do lado, prefira não mostrar o lado. Anexe fotos de mais ângulos se tiver.\n3. Vendedor: vídeo de produto na página reduz dúvida e devolução — par do #073 e #092.\n4. Afiliado: use como cena de apoio em reviews e comparativos.","p":"IA de vídeo"},{"n":"100","t":"Criar Storytelling em Vídeo","m":8,"mn":"VÍDEOS COM IA","o":"Produzir a sequência narrativa completa: o plano de clipes que conta a sua história (#062) com continuidade — mesmo personagem, mesmo ambiente, mesma luz entre os clipes, o desafio técnico central de narrativa com IA. O prompt entrega o plano de continuidade + o briefing de cada clipe, prontos para gerar em sequência. Use para as histórias faceless narradas sobre cenas.","q":"Criadores faceless • Usuários que trabalham com IA • Criadores de conteúdo","i":"(este briefing se monta no ChatGPT/Claude e executa na IA de vídeo):**\n• O roteiro de storytelling (#062, com a camada visual)\n• Personagem e ambiente da história\n• Quantos clipes sua montagem precisa","c":"Atue como um diretor de produção de vídeo com IA. Vou te dar um roteiro narrativo; sua tarefa é convertê-lo em uma SEQUÊNCIA DE BRIEFINGS para IA de vídeo (clipes de 5–10s), com a continuidade como prioridade máxima.\n\nROTEIRO: [COLE O ROTEIRO DO PROMPT #062, COM A CAMADA VISUAL]\nPERSONAGEM DA HISTÓRIA (se aparecer): [DESCRIÇÃO FIXA E ESPECÍFICA — roupa, aparência]\nAMBIENTE: [DESCRIÇÃO FIXA — o cenário da história]\nCLIPES DISPONÍVEIS: [QUANTOS — ex.: 5 clipes para um vídeo de 45s]\n\nEntregue:\n\n1. FICHA DE CONTINUIDADE\nO bloco de texto FIXO (personagem + ambiente + luz + estilo) que deve abrir IDÊNTICO todos os briefings — a âncora de consistência entre clipes.\n\n2. BRIEFINGS DOS CLIPES, um a um:\nCLIPE N: [ficha de continuidade] + CENA (o momento da história) + AÇÃO (um movimento) + CÂMERA (posição/movimento) + EMOÇÃO DA CENA (a função narrativa: tensão, virada, alívio) + DURAÇÃO. Formato 9:16, realista.\nCada clipe cobre UM beat do roteiro; a soma dos clipes conta a história completa na ordem.\n\n3. PONTOS DE FRAGILIDADE\nPara cada clipe: o que tem mais chance de quebrar a continuidade (a roupa que muda, a luz que vira) — o que conferir antes de aceitar a geração.\n\n4. PLANO B DE CONTINUIDADE\nSe a ferramenta não mantiver o personagem entre clipes: a versão alternativa da sequência SEM rosto em quadro (mãos, POV, objetos, silhueta) — a narrativa que sobrevive à limitação.\n\n5. MAPA DE MONTAGEM\nA ordem de edição, onde entra a narração (gravada por mim sobre os clipes) e os pontos de corte entre clipes.","e":"de preenchimento:**\n• Roteiro: a história da entrevista perdida (#062)\n• Personagem: mulher ~28, blusa social branca amassada\n• Ambiente: quarto pós-mudança com caixas\n• Clipes: 5","u":"1. Este prompt roda em duas etapas: monte os briefings no ChatGPT/Claude, execute na IA de vídeo clipe a clipe.\n2. Gere os clipes NA ORDEM e confira a ficha de continuidade a cada um — personagem que mudou de blusa = regenerar.\n3. Se a consistência falhar duas vezes, adote o Plano B sem hesitar: história em POV/mãos conta igual e não quebra.\n4. A narração é sua, gravada na edição — voz real sobre cena gerada é a combinação que humaniza o formato.","p":"Multiplataforma"},{"n":"101","t":"Criar Variações de um Vídeo","m":8,"mn":"VÍDEOS COM IA","o":"Multiplicar um clipe de IA que funcionou em variações sistemáticas — mesmo briefing, UMA variável trocada por versão (cenário, câmera, hora do dia, personagem, ritmo) — o análogo em vídeo do Prompt #069, aproveitando que variar geração custa minutos, não uma tarde de filmagem. Use quando um vídeo montado com clipes de IA der sinal.","q":"Usuários que trabalham com IA • Criadores faceless • Afiliados","i":"(monte no ChatGPT/Claude, execute na IA de vídeo):**\n• O briefing original do clipe que funcionou\n• Os sinais do vídeo (o que a análise indicou)\n• Quantas variações quer gerar","c":"Atue como um engenheiro de variações de briefings de IA de vídeo. Método: cada variação altera EXATAMENTE UMA variável do briefing original e preserva todo o resto — para o desempenho comparado revelar o que importa. \n\nBRIEFING ORIGINAL (do clipe que funcionou): [COLE O BRIEFING COMPLETO]\nSINAIS DO VÍDEO: [O QUE A ANÁLISE MOSTROU — retenção, comentários, cliques]\nVARIAÇÕES DESEJADAS: [QUANTAS — sugestão: 5]\n\nEntregue:\n\n1. ANATOMIA DO BRIEFING\nDecomponha o briefing original nas variáveis: CENÁRIO / PERSONAGEM (se houver) / AÇÃO / CÂMERA / LUZ E HORA / RITMO / ESTILO. Identifique qual variável os sinais sugerem ser a força do clipe (rotule como HIPÓTESE) — essa NÃO se mexe.\n\n2. AS VARIAÇÕES, em tabela:\nNº | VARIÁVEL ALTERADA | BRIEFING COMPLETO DA VARIAÇÃO (pronto para colar na IA de vídeo, com a alteração destacada) | O QUE ESTA VARIAÇÃO TESTA\nDistribua entre variáveis diferentes (ex.: cenário cozinha→banheiro; câmera estática→POV; luz manhã→noite; ritmo casual→rápido).\n\n3. REGRAS DE COMPARAÇÃO\nComo publicar as variações para o teste ser limpo: mesmo gancho e mesma legenda entre versões (a variável do teste é o clipe, não o resto), espaçamento de dias, e o que comparar.\n\n4. LIMITE DE FIDELIDADE\nAlerta: em toda variação com produto em cena, a imagem de referência do produto continua anexada e a exigência de fidelidade continua integral — variar cenário nunca autoriza variar o produto.","e":"de preenchimento:**\n• Briefing original: POV da gaveta bagunçada (#098)\n• Sinais: retenção alta nos 3 primeiros segundos, comentários \"minha gaveta é pior\"\n• Variações: 5","u":"1. Como no #069: só varie clipe que deu sinal — variar clipe morto multiplica zero.\n2. Execute as variações na IA de vídeo colando cada briefing da tabela como está.\n3. Publique com a regra de comparação limpa (mesmo gancho/legenda) e registre no #022.\n4. A variação vencedora vira o novo briefing-base — e o ciclo recomeça.","p":"Multiplataforma"},{"n":"102","t":"Criar Briefing Completo para IA de Vídeo","m":8,"mn":"VÍDEOS COM IA","o":"O orquestrador do módulo: transforma um roteiro inteiro (Módulo 5) no plano de produção completo com IA — a lista de clipes, o briefing pronto de cada um, o que gerar vs. o que filmar real, as imagens-base a criar no Nano Banana, o plano de áudio e a ordem de montagem. Um roteiro entra; um plano de produção executável sai. Use como primeiro passo de qualquer vídeo produzido com IA.","q":"Usuários que trabalham com IA • Criadores faceless • Afiliados","i":":**\n• O roteiro completo (tabela do Módulo 5)\n• Suas ferramentas disponíveis (IA de imagem, IA de vídeo, editor)\n• O que você pode filmar real\n• Foto real do produto disponível","c":"Atue como um produtor executivo de vídeos feitos com IA para social commerce. Vou te dar um roteiro; sua tarefa é convertê-lo no PLANO DE PRODUÇÃO completo: o que gerar, o que filmar, em que ordem, com quais briefings.\n\nROTEIRO: [COLE A TABELA COMPLETA DO MÓDULO 5]\nMINHAS FERRAMENTAS: [EX.: Nano Banana, Kling, CapCut]\nO QUE POSSO FILMAR REAL: [EX.: o produto em mãos, minha cozinha / \"nada — 100% IA\"]\nFOTO REAL DO PRODUTO: [TENHO / NÃO TENHO]\n\nRegras do plano:\n- REAL > GERADO onde importa: o momento de prova do produto deve ser real sempre que eu puder filmar; IA cobre contexto, ambiente e cenas impossíveis/caras de filmar.\n- Produto em cena gerada = SEMPRE via imagem→vídeo partindo de quadro preservado (Nano Banana), nunca texto→vídeo.\n- Não atribua às ferramentas recursos que podem não existir: onde um recurso for opcional (lip sync, referência de personagem), marque como [SE SUA FERRAMENTA SUPORTAR] com a alternativa sem o recurso.\n\nEntregue:\n\n1. DECUPAGEM em tabela:\nCENA DO ROTEIRO | ORIGEM (FILMAR REAL / GERAR COM IA / IMAGEM ESTÁTICA COM MOVIMENTO NA EDIÇÃO) | JUSTIFICATIVA (1 frase)\n\n2. IMAGENS-BASE A CRIAR (para as cenas geradas com produto): a lista de quadros-chave a gerar no Nano Banana, cada um com a instrução de cena (no padrão do Prompt #091).\n\n3. BRIEFINGS DOS CLIPES: para cada cena \"GERAR COM IA\", o briefing completo pronto para a IA de vídeo (cena, ação única, câmera, luz, duração, 9:16, fidelidade do produto quando presente).\n\n4. PLANO DE ÁUDIO: onde entra narração (gravada por mim), som ambiente e trilha — e o lembrete do que NUNCA vai na geração (textos na tela e legendas entram na edição).\n\n5. ORDEM DE PRODUÇÃO: a sequência de trabalho otimizada (todas as imagens primeiro → todos os clipes → filmagens reais → montagem) com tempo estimado por etapa.\n\n6. CHECKLIST DE MONTAGEM: a conferência final antes de publicar — fidelidade do produto em cada clipe, continuidade entre clipes, física plausível, rotulagem de conteúdo IA conforme as regras atuais do app.","e":"de preenchimento:**\n• Roteiro: o 30s problema→solução do dispenser (#063)\n• Ferramentas: Nano Banana, Kling, CapCut\n• Posso filmar: o produto em mãos na minha cozinha\n• Foto real: tenho","u":"1. Rode este prompt ANTES de gerar qualquer coisa — produzir sem decupagem é gerar clipes órfãos.\n2. Siga a ordem de produção: imagens em lote, depois clipes em lote (trocar de ferramenta a cada cena desperdiça tempo).\n3. A decupagem REAL/GERADO é a decisão mais importante do plano — respeite a regra \"real onde importa\".\n4. O checklist final da seção 6 é o portão de publicação: não pule.","p":"Claude"},{"n":"103","t":"Vídeo de Close-up de Detalhes","m":8,"mn":"VÍDEOS COM IA","o":"Construir sua biblioteca de b-roll de detalhes: closes macro da textura, do encaixe, do mecanismo, do acabamento — os clipes de 3 a 5 segundos que preenchem vídeos, provam qualidade sem palavras e dão o \"respiro visual\" entre cenas. Gere uma vez por produto, use em dezenas de vídeos. É o prompt de maior reaproveitamento do módulo.","q":"Criadores faceless • Afiliados • Vendedores • Usuários que trabalham com IA","i":":**\n• Foto real em close do detalhe ANEXADA (fotografe os detalhes de perto — a referência do macro é o próprio macro)\n• O detalhe e o micro-movimento\n• Duração","c":"Anime esta imagem como um close-up macro de detalhe de produto — b-roll de 3 a 5 segundos.\n\nDETALHE EM CENA: [QUAL — ex.: o encaixe da tampa / a textura emborrachada da base / o mecanismo do bico / a costura do material].\n\nMICRO-MOVIMENTO (apenas um, sutil e lento): [ESCOLHA — ex.: dedos girando a peça lentamente sob a luz / a luz deslizando pela superfície revelando a textura / o encaixe fechando com precisão / aproximação macro suave da câmera]. O movimento é contemplativo — b-roll de detalhe não tem pressa.\n\nLUZ: direcionada e rasante para revelar textura e relevo, com reflexos realistas no material [PLÁSTICO / METAL / SILICONE / TECIDO — o material real].\n\nFIDELIDADE: o detalhe permanece idêntico ao da imagem anexada — textura, cor, acabamento, qualquer texto visível legível. Sem embelezar o acabamento além do real (o comprador vai receber o produto da foto, não o do sonho).\n\nDURAÇÃO: [3–5]s. FORMATO: 9:16. ESTILO: macro realista, foco raso (fundo desfocado), sem elementos além do detalhe.","e":"de preenchimento:**\n• Close anexado: foto de perto do encaixe da tampa da garrafa\n• Detalhe: rosca e vedação da tampa\n• Micro-movimento: tampa fechando com giro lento\n• Duração: 4s","u":"1. Fotografe 5–8 detalhes reais do produto de perto, com boa luz — cada foto vira um briefing.\n2. Gere a biblioteca inteira numa sessão e organize numa pasta por produto.\n3. Use os closes como: respiro entre cenas (#057), prova de qualidade em reviews (#059), momentos sensoriais de unboxing (#061) e \"âncoras de atenção\" faceless (#068).\n4. A regra \"sem embelezar\" protege você de devolução: o close vende o acabamento REAL.","p":"IA de vídeo"},{"n":"104","t":"Criador de Vídeos Faceless (linha de produção)","m":9,"mn":"CONTEÚDO FACELESS","o":"A porta de entrada do módulo: recebe sua ideia/roteiro e devolve a decisão de técnica (qual subformato faceless executa melhor essa ideia com seus recursos) + o pacote de produção completo — lista de capturas, ordem de montagem e os prompts deste módulo a usar em cada etapa. Use quando tiver a ideia e não souber por onde começar a produzir.","q":"Criadores faceless • Iniciantes • Usuários que trabalham com IA","i":":**\n• A ideia ou roteiro (#036/#068)\n• Seus recursos (produto em mãos? voz própria? IA de voz? só imagens?)\n• Seus elementos de identidade (#019)\n• Tempo disponível para produzir","c":"Atue como um produtor de vídeos faceless. Recebo uma ideia e entrego a linha de produção completa dela — técnica, capturas e montagem — executável com os recursos informados.\n\nIDEIA/ROTEIRO: [COLE]\nMEUS RECURSOS: [PRODUTO EM MÃOS? MINHA VOZ / VOZ DE IA / SEM VOZ? CELULAR? FERRAMENTAS DE IA?]\nMEUS ELEMENTOS DE IDENTIDADE: [COLE DO #019 — abertura padrão, estilo, paleta, bordão]\nTEMPO PARA PRODUZIR: [EX.: 1h]\n\nEntregue:\n\n1. DECISÃO DE TÉCNICA\nQual subformato executa melhor ESTA ideia com MEUS recursos: mãos+produto / POV / imagens em sequência / b-roll+narração / texto na tela / 100% IA. Justifique em 2 frases e aponte a segunda opção caso a primeira trave.\n\n2. PACOTE DE PRODUÇÃO em tabela:\nETAPA | O QUE FAZER | FERRAMENTA | TEMPO ESTIMADO\nDa preparação à publicação, cabendo no meu tempo. Se não couber, corte escopo e diga o que cortou.\n\n3. LISTA DE CAPTURAS\nTudo o que filmar/fotografar/gerar, agrupado por setup — com os 2 planos de segurança do momento-chave.\n\n4. IDENTIDADE APLICADA\nOnde exatamente os meus elementos de identidade entram neste vídeo (abertura, transição, encerramento) — cite-os um a um.\n\n5. MONTAGEM\nOrdem de edição em passos numerados, incluindo onde entram texto na tela e som.\n\nNão sugira técnica que exija recurso que não informei ter.","e":"de preenchimento:**\n• Ideia: POV do ritual das 19h com o umidificador (#036)\n• Recursos: produto em mãos, sem voz, celular\n• Identidade: abertura com close no clique de ligar, paleta quente, texto branco\n• Tempo: 1h","u":"1. Rode para cada vídeo até a linha de produção virar automática — depois, só para ideias fora do padrão.\n2. A \"decisão de técnica\" indica qual prompt deste módulo aprofundar (#105–#113).\n3. Filme a lista de capturas completa antes de editar qualquer coisa.\n4. Confira a seção 4 antes de publicar: identidade esquecida é o vazamento invisível do faceless.","p":"ChatGPT"},{"n":"105","t":"Roteiro com Narração (escrever para o ouvido)","m":9,"mn":"CONTEÚDO FACELESS","o":"Escrever a narração de verdade — texto para ser OUVIDO, não lido: frases curtas, ritmo de fala, marcas de respiração e ênfase, e a direção de gravação para a sua própria voz. Texto escrito lido em voz alta soa robótico mesmo com voz humana; este prompt converte roteiro em fala. Use sempre que o vídeo tiver a sua narração.","q":"Criadores faceless • Criadores de conteúdo","i":":**\n• O roteiro/conteúdo a narrar (#068)\n• Seu tom e suas expressões\n• Duração alvo da narração","c":"Atue como um redator de narração para vídeo curto — texto escrito PARA O OUVIDO.\n\nRegras da escrita falada:\n- Frases de no máximo 12 palavras; uma ideia por frase.\n- Palavras que a boca fala (contrações, ordem coloquial); proibido construção de texto escrito (\"o qual\", \"sendo que\", \"por conseguinte\").\n- Repetição proposital é permitida (o ouvido precisa dela; o olho não).\n- O ritmo se marca no texto: / = pausa curta, // = pausa longa, MAIÚSCULA = ênfase.\n\nCONTEXTO:\n- Conteúdo a narrar: [COLE O ROTEIRO OU OS PONTOS]\n- Meu tom e expressões: [COLE]\n- Duração alvo: [EX.: 30s de narração ≈ 65–75 palavras]\n\nEntregue:\n\n1. NARRAÇÃO MARCADA\nO texto completo com as marcas de ritmo (/, //, MAIÚSCULAS), dentro do limite de palavras da duração.\n\n2. TESTE DO OUVIDO\nReleia cada frase em voz alta mentalmente: reescreva qualquer uma que exija fôlego demais ou soe como texto de e-mail. Mostre as reescritas.\n\n3. DIREÇÃO DE GRAVAÇÃO\n5 instruções para eu gravar com o celular: distância da boca ao microfone, gravar de pé, 3 takes da primeira frase (é a mais importante), sorrir nas frases de abertura (muda o timbre), e ambiente (cômodo com tecidos, longe de eco).\n\n4. SINCRONIA\nA narração dividida em blocos com o tempo de cada um — para eu alinhar com as cenas na edição.","e":"de preenchimento:**\n• Conteúdo: roteiro do POV do umidificador\n• Tom: calmo, direto, \"juro\", \"olha isso\"\n• Duração: 30s","u":"1. Grave lendo as marcas — elas são a diferença entre narrar e ler.\n2. O 3º take da primeira frase quase sempre é o bom.\n3. Voz de IA em vez da sua? Leve esta narração ao #110 (a escrita muda).\n4. Guarde narrações boas: frases de abertura fortes se reaproveitam entre vídeos.","p":"ChatGPT"},{"n":"106","t":"Vídeo com Imagens (sequência de fotos)","m":9,"mn":"CONTEÚDO FACELESS","o":"Produzir vídeo a partir de fotos em sequência: as imagens (suas ou geradas no Módulo 7) ordenadas com tempo, movimento de edição (zoom/deslize estilo Ken Burns) e transições — o formato faceless de menor barreira: sem filmar nada. Use para catálogos animados, listas, antes/depois e vídeos de curiosidade com imagens.","q":"Criadores faceless • Iniciantes • Usuários que trabalham com IA","i":":**\n• A ideia/roteiro do vídeo\n• As imagens que você tem (ou pode gerar no Módulo 7)\n• Duração alvo e se haverá narração/texto","c":"Atue como um editor especialista em vídeos feitos de imagens estáticas (foto-sequência com movimento de edição).\n\nPrincípio: imagem parada na tela por mais de 2–3 segundos sem movimento = dedo rolando. Cada imagem precisa de movimento de edição (zoom in/out lento, deslize lateral) e de um MOTIVO para estar na sequência.\n\nCONTEXTO:\n- Ideia/roteiro: [COLE]\n- Imagens disponíveis: [LISTE AS QUE TENHO] / Imagens a gerar: [POSSO GERAR NO NANO BANANA? QUAIS?]\n- Duração alvo: [EX.: 25s]\n- Áudio: [NARRAÇÃO / SÓ TEXTO NA TELA + TRILHA]\n\nEntregue:\n\n1. SEQUÊNCIA em tabela:\nORDEM | IMAGEM (qual, das minhas, ou a gerar — com a instrução resumida para o Módulo 7) | TEMPO NA TELA (1,5–3s) | MOVIMENTO DE EDIÇÃO (zoom in lento / zoom out / deslize esq→dir...) | TEXTO NA TELA (máx. 7 palavras) | FUNÇÃO NA SEQUÊNCIA (gancho / desenvolvimento / prova / fechamento)\n\n2. REGRA DO CONTRASTE\nOrdene alternando composições (close → aberto, claro → escuro) — sequência de imagens parecidas em fila hipnotiza para fora do vídeo. Aponte onde aplicou.\n\n3. IMAGENS FALTANTES\nAs imagens que a sequência pede e eu não tenho: a lista com a instrução de geração de cada uma (apontando o prompt do Módulo 7 adequado).\n\n4. MONTAGEM NO EDITOR\nPasso a passo no CapCut ou similar: importar na ordem, aplicar os movimentos, tempos, transição padrão (corte seco ou dissolve rápido — escolha uma e repita), texto e trilha.","e":"de preenchimento:**\n• Ideia: \"5 usos do organizador que ninguém conhece\" (#038)\n• Imagens: 3 fotos reais de usos; posso gerar mais 2 no Nano Banana\n• Duração: 25s / Áudio: texto na tela + trilha","u":"1. Respeite o teto de 3s por imagem — é a regra que segura o formato.\n2. Gere as faltantes no Módulo 7 antes de abrir o editor.\n3. Uma transição padrão para o vídeo todo: variedade de transição é marca de amador.\n4. Este formato é a porta de entrada do faceless: domine-o antes das técnicas com filmagem.","p":"Nano Banana"},{"n":"107","t":"Vídeo com B-Roll (biblioteca própria)","m":9,"mn":"CONTEÚDO FACELESS","o":"Planejar e filmar sua biblioteca de b-roll própria: a lista de planos de apoio (rotina, ambiente, produto em contexto) que você captura com o celular numa sessão e reaproveita por semanas sob narrações diferentes. B-roll próprio elimina a dependência de banco de vídeo alheio (e os problemas de direito e de genericidade que vêm junto). Use uma vez por produto/cenário.","q":"Criadores faceless • Afiliados • Criadores de conteúdo","i":":**\n• Produto e os temas dos seus próximos vídeos\n• Cenários disponíveis (sua casa, rotina)\n• Tempo da sessão de filmagem","c":"Atue como um diretor de fotografia de b-roll para criador solo com celular. Objetivo: uma SESSÃO de filmagem que gera uma biblioteca de planos reutilizáveis por semanas.\n\nRegras do b-roll que funciona:\n- Cada plano tem UM assunto e movimento simples (câmera desliza OU objeto se move — não os dois).\n- Planos de 8–12s brutos (para sobrar corte na edição).\n- Sempre capturar cada assunto em 2 ângulos (aberto + close).\n- Luz natural, cenário real vivido.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Temas dos próximos vídeos: [COLE — dos meus planos dos Módulos 3 e 5]\n- Cenários disponíveis: [EX.: minha cozinha, área de serviço, mesa de trabalho]\n- Tempo da sessão: [EX.: 45 min]\n\nEntregue:\n\n1. SHOT LIST em tabela:\nNº | PLANO (o que aparece + a ação) | ÂNGULO E ALTURA DA CÂMERA | MOVIMENTO (estático / deslize lento / aproximação) | ONDE REAPROVEITAR (quais temas dos meus vídeos usam este plano)\nEntre 12 e 20 planos, agrupados por cenário (para filmar sem ficar mudando de lugar), cabendo no tempo da sessão. Inclua as 4 categorias: produto em contexto, ação de rotina (mãos), detalhes do ambiente, e \"planos de respiro\" (janela, luz, textura).\n\n2. OS 3 PLANOS-CORINGA\nOs planos de maior reaproveitamento da lista — os que servem a quase qualquer narração do nicho. Capriche neles.\n\n3. TRUQUES DE CELULAR\n5 técnicas práticas: apoiar o celular em objetos para estabilidade, deslizar sobre superfície lisa para movimento suave, filmar em 4K para poder cortar, travar foco/exposição tocando na tela, e limpar a lente (sério).\n\n4. ORGANIZAÇÃO\nComo nomear e pastar os arquivos por categoria para achar em segundos na edição.","e":"de preenchimento:**\n• Produto: kit potes herméticos\n• Temas: despensa organizada, marmitas da semana, comida durando mais\n• Cenários: cozinha, despensa\n• Sessão: 45 min","u":"1. Filme a shot list inteira de uma vez — a biblioteca é o que torna a semana de edição leve.\n2. Os planos-coringa merecem 3 takes.\n3. Renove a biblioteca a cada 4–6 semanas (o público percebe plano repetido demais).\n4. Par natural do #105: narração nova + b-roll do acervo = vídeo em 30 minutos.","p":"ChatGPT"},{"n":"108","t":"Vídeo com Texto na Tela","m":9,"mn":"CONTEÚDO FACELESS","o":"Produzir o vídeo em que o texto É a narrativa: cartelas escritas sobre cenas, com o ofício específico do formato — ritmo de leitura, palavras por cartela, hierarquia visual e a cena certa embaixo de cada frase. O formato faceless mais silencioso e um dos que mais retêm quando o texto tem ritmo. Use para histórias, listas e identificação sem voz.","q":"Criadores faceless • Iniciantes","i":":**\n• O conteúdo (história, lista, ideia)\n• As cenas de fundo disponíveis (b-roll do #107, imagens, produto)\n• Duração alvo","c":"Atue como um roteirista de vídeos guiados por texto na tela (o texto é a narrativa; as cenas são o fundo).\n\nRegras do ofício:\n- Cartelas de no máximo 8 palavras; ideias longas se quebram em cartelas encadeadas.\n- Tempo de leitura confortável: ~0,4s por pa
