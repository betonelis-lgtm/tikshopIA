nco canais juntos. Os prompts anteriores criam a FRASE do gancho; este monta a CENA inteira. Use na pré-produção de vídeos importantes ou para diagnosticar vídeos que morrem no início.","q":"Criadores de conteúdo • Criadores faceless • Afiliados • Usuários que trabalham com IA","i":":**\n• O vídeo planejado (conceito + gancho escolhido) OU o vídeo existente a auditar (descreva os 3 primeiros segundos atuais)\n• Formato\n• Recursos de gravação","c":"Atue como um diretor de abertura de vídeo curto. Sua especialidade: os 3 primeiros segundos como um PACOTE de 5 canais simultâneos:\n1. PRIMEIRO QUADRO (o que aparece no frame 1 — antes de qualquer movimento)\n2. MOVIMENTO (a ação em curso nos segundos 0–3; quadro parado = dedo rolando)\n3. TEXTO NA TELA (overlay de até 7 palavras)\n4. PRIMEIRA FALA (as primeiras palavras ditas — se houver voz)\n5. SOM (o áudio de abertura: fala direta, som do produto, trilha)\n\nMODO DE USO: [ESCOLHA: \"PROJETAR abertura nova\" ou \"AUDITAR abertura existente\"]\n\nCONTEXTO:\n- Vídeo: [SE PROJETAR: conceito + gancho escolhido | SE AUDITAR: descreva exatamente o que acontece nos 3 primeiros segundos do vídeo atual]\n- Formato: [COM ROSTO / SEM ROSTO]\n- Recursos: [O QUE CONSIGO FILMAR]\n\nSE PROJETAR, entregue:\n1. Tabela com os 5 canais preenchidos para 3 VERSÕES diferentes da abertura (mesmo gancho, execuções distintas).\n2. Para cada versão: o risco dela (por que pode falhar) em 1 frase.\n3. REGRAS DE OURO aplicadas: o produto ou a cena-chave visível no frame 1; movimento já em curso (nunca começar parado); texto e fala complementares (não repetidos); nada de logo, vinheta ou \"oi gente\".\n4. A versão recomendada para gravar primeiro, com justificativa.\n\nSE AUDITAR, entregue:\n1. Diagnóstico canal por canal: o que os 3 segundos atuais fazem em cada um dos 5 canais e onde está o vazamento de atenção.\n2. Os 2 problemas mais graves, em ordem.\n3. A reconstrução: os 5 canais reescritos para a mesma ideia de vídeo, aproveitando o material que já tenho quando possível.\n4. O que regravar vs o que se resolve na edição (corte, texto, som).\n\nEm ambos os modos: não sugira nada infilmável com meus recursos.","e":"de preenchimento (modo auditar):**\n• Vídeo: review da air fryer; abre comigo sentada dizendo \"oi gente, hoje eu vou falar sobre...\"; produto aparece só no segundo 8; sem texto na tela; trilha genérica\n• Formato: com rosto\n• Recursos: celular, minha cozinha","u":"1. Use o modo PROJETAR nos vídeos do seu plano de teste; o modo AUDITAR em qualquer vídeo publicado com queda de retenção no início.\n2. Grave as 3 versões da abertura na mesma sessão — são segundos de gravação e viram teste A/B.\n3. A tabela de 5 canais vira seu checklist permanente de abertura.\n4. Este prompt fecha o módulo: frase (prompts anteriores) + cena (este) = gancho completo.","p":"ChatGPT"},{"n":"054","t":"Hooks de Prova Social","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos que abrem com evidência de outras pessoas: avaliações, quantidade de vendas visível na plataforma, comentários recebidos, reposição de estoque. Mecanismo: se muitos aprovaram, o risco percebido despenca. Com a trava mais rígida do módulo: todo dado social precisa ser verificável por você — prova social inventada não é copy, é fraude.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto\n• Dados sociais que você VERIFICOU (nº de avaliações e nota visíveis na página, vendas exibidas pela plataforma, comentários que recebeu, \"frases de ouro\" do Prompt #011)","c":"Atue como um copywriter de ganchos de prova social para social commerce. O mecanismo: a aprovação alheia reduz o risco percebido — \"tanta gente não pode estar errada\".\n\nREGRA ABSOLUTA: só use os dados que EU verificar e informar. Proibido inventar números de vendas, avaliações, \"esgotamentos\" ou depoimentos. Se um dado que informei for vago (\"muitas avaliações\"), o gancho deve ser igualmente qualitativo — nunca invente precisão. Marque todo número com [CONFIRMAR NA DATA DA PUBLICAÇÃO], porque esses dados mudam.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Dados sociais verificados: [EX.: 4,8 estrelas com 2.300 avaliações visíveis na página; a plataforma exibe \"10 mil+ vendidos\"; recebi 40+ comentários perguntando o link]\n- Frases reais de avaliações (opcional): [COLE AS \"FRASES DE OURO\" DO PROMPT #011]\n- Público: [PÚBLICO]\n\nGere 12 ganchos usando estas 4 fórmulas (3 de cada), identificando a fórmula:\n\n1. NÚMERO NA MESA: o dado verificado como abertura (\"2.300 pessoas avaliaram isso antes de mim\" [CONFIRMAR]).\n2. VOZ DO COMPRADOR: abrir lendo/mostrando uma avaliação real na tela (\"'chorei quando vi funcionando' — fui testar se era exagero\").\n3. PRESSÃO DO PRÓPRIO PÚBLICO: os comentários recebidos como motivo do vídeo (\"vocês não pararam de pedir — testei\").\n4. CETICISMO CONTRA A MULTIDÃO: eu duvidando da prova social e verificando (\"não acreditei nas 5 estrelas. Aí ele chegou\").\n\nRegras:\n- Para a fórmula 2, use apenas as frases reais que colei, e indique que a avaliação deve APARECER NA TELA (print real) — mostrar é mais forte que citar.\n- Até 12 palavras por gancho (a leitura da avaliação na fórmula 2 pode exceder).\n\nDepois:\nHIERARQUIA DE PROVA: ordene os 4 tipos de prova que forneci do mais ao menos persuasivo PARA O MEU público, justificando em 1 frase cada — para eu saber qual dado liderar.","e":"de preenchimento:**\n• Produto: mop giratório\n• Dados: 4,7 estrelas / 1.850 avaliações na página; \"5 mil+ vendidos\" exibido pela plataforma; 30 comentários pedindo link no meu último vídeo\n• Frases: \"minha faxina caiu pela metade\", \"durou mais que os 3 anteriores juntos\"\n• Público: quem faz a própria faxina","u":"1. Tire prints dos dados no dia da publicação — são sua evidência e seu material de tela.\n2. Rode o Prompt #011 antes: as avaliações reais são o melhor insumo deste gancho.\n3. \"Ceticismo contra a multidão\" combina prova social com a textura UGC (#048) — a dupla mais crível do módulo.\n4. Reconfirme os números se republicar o vídeo semanas depois.","p":"Multiplataforma"},{"n":"055","t":"Roteiro de 15 Segundos","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Criar um roteiro de 15 segundos com UMA ideia só: um gancho, uma prova, um CTA — e nada mais. O formato mais difícil de escrever (cortar dói) e o mais barato de testar. O prompt inclui a \"lista de cortes\": tudo o que ficou de fora e vira outro vídeo. Use para testes rápidos de ângulo e produtos de impacto visual imediato.","q":"Afiliados • Iniciantes • Criadores faceless","i":":**\n• Produto\n• A ÚNICA ideia central do vídeo (uma dor, uma prova ou um benefício)\n• Gancho escolhido (Módulo 4)\n• Formato","c":"Atue como um roteirista de vídeo ultracurto para social commerce. Especialidade: 15 segundos, uma ideia só.\n\nRegra de arquitetura do 15s:\n- 0–2s: GANCHO (frase + cena simultâneos)\n- 2–11s: UMA prova visual (a ideia central demonstrada, sem desvios)\n- 11–15s: CTA curto\nSe qualquer segundo elemento (segunda dor, segundo benefício, contexto extra) tentar entrar, ele deve ser CORTADO e anotado na lista de cortes.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Ideia central ÚNICA deste vídeo: [UMA dor, prova ou benefício — apenas um]\n- Gancho escolhido: [COLE O GANCHO]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue:\n\n1. ROTEIRO em tabela com as colunas:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO (como executar a cena)\nRegras: fala total de no máximo 35 palavras (15s não comporta mais); a prova visual deve ser contínua (sem cortar no meio do momento de prova); o produto visível já no segundo 0–2.\n\n2. LISTA DE CORTES\nTudo que você teve vontade de incluir e não coube — cada item anotado como semente de OUTRO vídeo de 15s.\n\n3. VERSÃO SEM FALA\nO mesmo roteiro adaptado para funcionar mudo (texto na tela + ação), porque parte do público assiste sem som.\n\n4. TESTE DO SEGUNDO 11\nConfirme: se o vídeo terminasse no segundo 11 (antes do CTA), a ideia central já estaria provada? Se não, o roteiro está errado — reescreva.","e":"de preenchimento:**\n• Produto: abridor de potes antiderrapante\n• Ideia central: abre pote emperrado em 2 segundos sem força\n• Gancho: \"o pote que ninguém da casa abriu\" (cena: pote na mão, careta de esforço)\n• Formato: sem rosto (mãos)","u":"1. Se você não consegue nomear a ideia central em uma frase, o vídeo não é de 15s — vá para o #056.\n2. A \"lista de cortes\" é metade do valor: 1 conceito bem cortado gera 3–4 vídeos de 15s.\n3. Confira a \"versão sem fala\" na edição — legendas e overlay resolvem o público no mudo.\n4. 15s é o formato ideal para a matriz de teste do Prompt #022: barato, rápido, comparável.","p":"ChatGPT"},{"n":"056","t":"Roteiro de 30 Segundos","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Criar o roteiro do formato padrão da venda em vídeo curto: 30 segundos com gancho, dor/contexto, prova, benefício traduzido e CTA — a unidade completa de persuasão. O prompt inclui o \"checkpoint dos 15s\": o que precisa ter acontecido até a metade para o espectador ficar. É o formato-base do seu plano de testes.","q":"Afiliados • Criadores de conteúdo • Vendedores • Criadores faceless","i":":**\n• Produto\n• Conceito do vídeo (Módulo 3)\n• Gancho (Módulo 4)\n• Dor + benefício principais\n• Formato e tom","c":"Atue como um roteirista de vídeos de 30 segundos para social commerce — o formato padrão da conversão em vídeo curto.\n\nArquitetura obrigatória do 30s:\n- 0–3s: GANCHO (frase + cena)\n- 3–8s: DOR ou CONTEXTO (o espectador se reconhece)\n- 8–20s: PROVA (o produto resolvendo, em ação contínua — o coração do vídeo)\n- 20–26s: BENEFÍCIO TRADUZIDO (o que muda na vida, não a característica)\n- 26–30s: CTA\nCHECKPOINT DOS 15s: na metade do vídeo, o espectador já deve ter visto o produto EM AÇÃO. Se a prova começa depois dos 15s, a estrutura está errada.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Conceito do vídeo: [COLE O CONCEITO DO MÓDULO 3]\n- Gancho: [COLE]\n- Dor principal: [COLE]\n- Benefício principal: [COLE]\n- Formato e tom: [COM/SEM ROSTO + TOM DO PERFIL]\n\nEntregue:\n\n1. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nRegras: fala natural no meu tom (máx. ~70 palavras no total); nenhum bloco de fala acima de 2 frases seguidas; a cena muda no mínimo a cada 4 segundos (quadro parado sangra retenção).\n\n2. VALIDAÇÃO DO CHECKPOINT\nConfirme em 1 frase o que o espectador viu até o segundo 15 — e corrija o roteiro se a prova estiver atrasada.\n\n3. DUAS ALTERNATIVAS DE CTA\nUma suave (curiosidade/vitrine) e uma direta (urgência honesta, sem escassez inventada) — para eu testar.\n\n4. PLANO DE FILMAGEM\nLista das cenas em ordem de GRAVAÇÃO (agrupadas por cenário/setup), diferente da ordem de edição — para eu filmar tudo em uma sessão.","e":"de preenchimento:**\n• Produto: dispenser de detergente com base\n• Conceito: problema→solução, encenação \"detergente escorrendo na pia\"\n• Gancho: \"sua pia também vive melada embaixo do detergente?\"\n• Dor: sujeira acumulada embaixo do frasco\n• Benefício: pia limpa sem esforço extra\n• Formato: sem rosto, tom direto","u":"1. Traga os insumos prontos dos Módulos 3 e 4 — este prompt monta, não inventa.\n2. Grave pela ordem do \"plano de filmagem\", edite pela ordem do roteiro.\n3. Publique as duas versões de CTA em vídeos alternados e compare cliques.\n4. Quando um 30s funcionar, gere variações dele no Prompt #069 antes de criar do zero.","p":"ChatGPT"},{"n":"057","t":"Roteiro de 60 Segundos","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Criar roteiros de 60 segundos com re-ganchos: acima de 30s, a atenção precisa ser recapturada a cada ~15 segundos, ou o vídeo vira maratona de abandono. O prompt estrutura o minuto em atos com micro-ganchos internos e um loop aberto que só fecha no fim. Use apenas quando o conteúdo JUSTIFICA o minuto — teste, história, aula. O prompt inclui o veto: se a ideia cabe em 30s, ele manda encurtar.","q":"Criadores de conteúdo • Afiliados • Criadores faceless","i":":**\n• Produto\n• Conceito (teste, storytelling, educativo, review completo)\n• Por que este conteúdo precisa de 60s\n• Gancho + material disponível\n• Formato e tom","c":"Atue como um roteirista de vídeos de 60 segundos para social commerce. Premissa: 60 segundos são um PRIVILÉGIO que o conteúdo precisa justificar — e uma responsabilidade de retenção que exige engenharia.\n\nTESTE DE ADMISSÃO (faça antes de roteirizar): avalie se o conceito abaixo realmente precisa de 60s. Se couber em 30s sem perder a essência, DIGA ISSO e entregue a versão de 30s no lugar. Só prossiga com 60s se houver justificativa (processo com etapas, arco de história, teste com marcos de tempo, aula com passos).\n\nArquitetura do 60s aprovado:\n- 0–3s: GANCHO + LOOP ABERTO (uma promessa que só se resolve no final — o seguro de retenção)\n- 3–15s: ATO 1 (contexto/dor/setup)\n- 15s: RE-GANCHO 1 (virada, surpresa ou pergunta que renova a atenção)\n- 15–35s: ATO 2 (desenvolvimento/prova principal)\n- 35s: RE-GANCHO 2 (\"e aqui vem a parte que ninguém espera...\")\n- 35–52s: ATO 3 (clímax: resultado, veredito ou passo final — fecha o loop do início)\n- 52–60s: RESOLUÇÃO + CTA\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Conceito: [COLE — teste/história/aula/review]\n- Por que precisa de 60s: [JUSTIFIQUE]\n- Gancho: [COLE]\n- Material/fatos disponíveis: [O QUE TENHO GRAVADO OU POSSO GRAVAR]\n- Formato e tom: [COM/SEM ROSTO + TOM]\n\nEntregue:\n\n1. VEREDITO DO TESTE DE ADMISSÃO (60s ou 30s, com justificativa em 1 frase)\n\n2. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nMarque na tabela, em destaque, o LOOP ABERTO, o RE-GANCHO 1 e o RE-GANCHO 2.\n\n3. MAPA DE RETENÇÃO\nPara cada ato: qual é o motivo específico de o espectador ficar até o ato seguinte (1 frase por ato). Se algum ato não tiver motivo, reescreva-o.\n\n4. CORTE DE EMERGÊNCIA\nIndique os 10 segundos que eu cortaria primeiro se a retenção real mostrar queda — o plano B já pronto para a versão 50s.","e":"de preenchimento:**\n• Produto: garrafa térmica\n• Conceito: teste de 24h de gelo com termômetro (Prompt #034)\n• Por que 60s: os marcos de tempo (0h, 8h, 16h, 24h) são a prova\n• Gancho: \"coloquei um termômetro aqui dentro. Volta em 24h comigo\"\n• Material: filmagens dos 4 marcos\n• Formato: sem rosto, tom de experimento","u":"1. Aceite o veredito do teste de admissão — a maioria das ideias infladas para 60s renderia dois 30s melhores.\n2. Grave os re-ganchos com energia renovada (são novas aberturas, não continuações).\n3. Compare a curva de retenção real com o \"mapa de retenção\": onde caiu, ali está o ato fraco.\n4. O \"corte de emergência\" transforma análise em ação imediata — use com o Módulo 10.","p":"Claude"},{"n":"058","t":"Roteiro UGC","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Transformar o conceito UGC (Prompt #035) e o gancho UGC (Prompt #048) em um roteiro de fala espontânea: não um texto para decorar, mas um mapa de beats — os pontos por onde a fala passa — com as frases-âncora exatas e liberdade no meio. É a única forma de roteirizar UGC sem matar a naturalidade que define o formato.","q":"Criadores de conteúdo • Afiliados • Iniciantes","i":":**\n• Produto e experiência real\n• Conceito UGC escolhido (Prompt #035)\n• Gancho UGC (Prompt #048)\n• Suas expressões de fala","c":"Atue como um roteirista de UGC. Princípio central: UGC roteirizado palavra por palavra deixa de ser UGC. Seu roteiro é um MAPA DE BEATS — pontos obrigatórios de passagem — com apenas 3 frases-âncora fixas; todo o resto é falado com as palavras do momento.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Minha experiência real: [COLE]\n- Conceito UGC: [COLE DO PROMPT #035 — situação, pretexto, cenário]\n- Gancho: [COLE DO PROMPT #048]\n- Minhas expressões de fala: [COLE — ex.: \"gente do céu\", \"vou ser sincera\"]\n\nEntregue:\n\n1. MAPA DE BEATS em tabela:\nTEMPO APROX. | BEAT (o ponto a comunicar, em 1 frase minha de referência — NÃO para decorar) | O QUE ESTOU FAZENDO EM CENA | NOTA DE ENTREGA (tom, pausa, olhar)\nBeats obrigatórios do UGC: gancho → contexto pessoal (por que estou falando disso) → a dor como eu vivia → o momento da virada → 1 detalhe específico que dá verdade → a ressalva honesta (o \"mas\" que humaniza) → onde encontrar (CTA de amiga, não de vendedor).\n\n2. AS 3 FRASES-ÂNCORA\nAs únicas frases fixas: o gancho, o detalhe específico e o CTA. Escritas com MINHAS expressões, em fala natural com respiração real.\n\n3. A RESSALVA\nFormule a ressalva honesta a partir da minha experiência (o detalhe imperfeito que aumenta a credibilidade). Se minha experiência não tiver nenhuma, pergunte — não invente, e não permita UGC sem ressalva.\n\n4. INSTRUÇÃO DE GRAVAÇÃO\n5 direções práticas: gravar em take único olhando os beats de relance, refazer no máximo 2 vezes (a 3ª gravação já soa ensaiada), manter tropeços naturais de fala, e as demais adequadas ao meu conceito.\n\nRegra final: se qualquer beat soar como locução de anúncio, reescreva-o como áudio de WhatsApp para uma amiga.","e":"de preenchimento:**\n• Produto: chaleira elétrica com temperatura\n• Experiência: café não queima mais; demorei 2 dias para entender os botões\n• Conceito: \"na cozinha, esperando a água, resolvi contar\"\n• Gancho: \"gente, eu jurava que chaleira era tudo igual\"\n• Expressões: \"gente\", \"juro\", \"tipo assim\"","u":"1. Leia o mapa 2 vezes, largue o papel, grave olhando só os beats de relance.\n2. Respeite o limite de 2 regravações — a imperfeição do take 1 costuma ser o take certo.\n3. A ressalva é inegociável: UGC sem \"mas\" é comercial disfarçado, e o público fareja.\n4. Rode este prompt para cada conceito do Prompt #035 — mesmo produto, várias conversas.","p":"ChatGPT"},{"n":"059","t":"Roteiro de Review","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Converter a estrutura de review do Prompt #025 em roteiro cena a cena com o veredito antecipado: a conclusão vem primeiro (retenção), a justificativa depois — cada critério com sua prova visual, o contra honesto com tempo de tela digno, e o \"para quem é/não é\" como fechamento. Use com a análise do #025 pronta.","q":"Criadores de conteúdo • Afiliados • Vendedores","i":":**\n• Produto\n• Análise do Prompt #025 (critérios, vereditos, o contra, para quem é/não é)\n• Duração alvo (30 ou 60s)\n• Formato e tom","c":"Atue como um roteirista de reviews em vídeo curto. Estrutura obrigatória do review que retém: VEREDITO PRIMEIRO (\"vale ou não vale — e agora te explico por quê\"), justificativa depois. O espectador que já sabe a conclusão fica para entender o raciocínio; o que espera a conclusão até o fim, abandona.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Minha análise de review: [COLE DO PROMPT #025: critérios, veredito por critério, o contra honesto, para quem é/não é]\n- Duração alvo: [30s / 60s]\n- Formato e tom: [COM/SEM ROSTO + TOM]\n\nEntregue:\n\n1. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nArquitetura: veredito em 3s → experiência-relâmpago (há quanto tempo uso, 3–5s) → 2 ou 3 critérios com PROVA VISUAL cada (o critério falado ENQUANTO a prova aparece — nunca critério em tela vazia) → O CONTRA com no mínimo 4 segundos de tela (contra escondido em meio segundo é desonestidade disfarçada) → para quem é / para quem NÃO é → CTA condicional (\"se você é X, o link está na vitrine\").\nSe a duração for 30s: máximo 2 critérios + contra. Se 60s: até 4 critérios + contra, com re-gancho antes do contra (\"mas tem uma coisa que ninguém fala...\").\n\n2. MAPA DE PROVAS\nPara cada critério do roteiro: exatamente o que filmar como prova (cena, ângulo, o que o espectador precisa VER para acreditar sem eu pedir).\n\n3. O SEGUNDO DO CONTRA\nJustifique em 2 frases a posição do contra no roteiro (nem cedo demais — derruba o vídeo — nem no último segundo — parece escondido).\n\n4. VERSÃO COMENTÁRIO FIXADO\nUm resumo do veredito em até 200 caracteres para eu fixar nos comentários (quem chega pelo comentário também é audiência).\n\nRegra: use APENAS os vereditos e o contra da minha análise. Não amplifique elogios nem suavize o contra.","e":"de preenchimento:**\n• Produto: air fryer compacta 3L\n• Análise: batata 5/5, frango 3/5 (resseca se passar), limpeza 5/5; contra: cesto pequeno para 2 pessoas; é para quem mora só; não é para famílias\n• Duração: 30s\n• Formato: com rosto, tom direto","u":"1. Sem o Prompt #025 rodado, não use este — roteiro de review sem análise vira opinião solta.\n2. Filme o \"mapa de provas\" antes de gravar as falas: a prova manda no texto, não o contrário.\n3. Cronometre o contra na edição: 4 segundos mínimos, de verdade.\n4. Fixe a \"versão comentário\" ao publicar — reviews geram busca nos comentários.","p":"Multiplataforma"},{"n":"060","t":"Roteiro de Demonstração","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Transformar o plano de demonstração do Prompt #024 em roteiro onde a imagem manda e a fala obedece: o money shot nos primeiros segundos, a sequência de provas sem cortes traiçoeiros, e a narração escrita POR CIMA das cenas (nunca o contrário). Use com o plano do #024 em mãos.","q":"Afiliados • Vendedores • Criadores faceless","i":":**\n• Produto\n• Plano de demonstração (Prompt #024: money shot, ordem, condições de credibilidade)\n• Duração alvo\n• Formato","c":"Atue como um roteirista de vídeos de demonstração. Hierarquia obrigatória deste formato: a IMAGEM é o argumento; a fala apenas guia o olhar e traduz o que a prova significa. Escreva primeiro a coluna visual, depois a narração por cima — nunca uma narração que exige imagens para ilustrá-la.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Plano de demonstração: [COLE DO PROMPT #024: money shot, ordem de demonstração, condições de credibilidade]\n- Duração alvo: [15s / 30s / 60s]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue:\n\n1. ROTEIRO em tabela (construído do visual para a fala):\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nRegras: prévia do money shot nos segundos 0–3 (a versão completa vem depois — a prévia é o gancho); o money shot completo em PLANO CONTÍNUO, sem corte no meio (corte no momento de prova = desconfiança); a fala nunca descreve o que a tela já mostra (\"olha, estou despejando a água\" é proibido — a fala adiciona: significado, contexto, número verificado).\n\n2. PARTITURA DE SILÊNCIO\nMarque no roteiro de 1 a 2 momentos SEM fala nenhuma — onde a prova visual fala sozinha (com som ambiente do produto, se houver). Justifique a posição.\n\n3. NÚMEROS NA TELA\nSe o meu plano incluir dados verificáveis (tempo, quantidade), posicione-os como overlay no momento exato da prova — e marque [CONFIRMAR] os que precisam de verificação minha.\n\n4. TRÊS FINAIS\nO mesmo roteiro com 3 fechamentos diferentes: CTA direto, pergunta de engajamento, e loop (\"e amanhã eu testo com X\") — para eu variar entre publicações da mesma demonstração.","e":"de preenchimento:**\n• Produto: mop giratório\n• Plano: money shot = mop saindo seco da água escura; ordem = torção → giro 360 → cantos; credibilidade = plano contínuo, sujeira real\n• Duração: 30s\n• Formato: sem rosto","u":"1. Confira se a coluna visual funciona MUDA — demonstração boa convence sem áudio.\n2. Respeite a partitura de silêncio na edição: o impulso de preencher tudo com fala é inimigo do formato.\n3. Grave o money shot 3 vezes em take contínuo e escolha o melhor — é a cena do vídeo.\n4. Use os \"três finais\" para republicar a mesma demonstração como 3 vídeos ao longo do mês.","p":"ChatGPT"},{"n":"061","t":"Roteiro de Unboxing","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Converter o plano de unboxing do Prompt #026 em roteiro com curva de expectativa: a pergunta do vídeo instalada no início, as revelações em ordem crescente, os closes sensoriais marcados no tempo e o veredito que fecha a pergunta. Use com a caixa ainda fechada, se possível.","q":"Criadores de conteúdo • Afiliados • Iniciantes","i":":**\n• Produto\n• Plano do Prompt #026 (pergunta do vídeo, ordem de revelações, momentos sensoriais)\n• Duração alvo\n• Formato","c":"Atue como um roteirista de unboxing para social commerce. O roteiro de unboxing administra uma única moeda: EXPECTATIVA. Cada cena deve aumentar ou pagar expectativa — cena que não faz nenhum dos dois é corte.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Plano do unboxing: [COLE DO PROMPT #026: pergunta do vídeo, ordem das revelações, momentos sensoriais, veredito]\n- Duração alvo: [30s / 60s]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue:\n\n1. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nArquitetura: instalar a PERGUNTA DO VÍDEO nos 3 primeiros segundos (com a caixa fechada em cena) → revelações na ordem do plano, cada uma com 1 reação curta e específica (proibido \"que legal!\" genérico — a reação nomeia o que surpreendeu) → os momentos sensoriais como CLOSES marcados no tempo (som/textura/peso em primeiro plano) → o item-surpresa com pausa de 1 segundo antes (micro-suspense) → VEREDITO que responde a pergunta do vídeo com honestidade.\nMarque na tabela cada cena com [+EXPECTATIVA] ou [PAGA EXPECTATIVA].\n\n2. FALAS DE REAÇÃO\nEscreva as reações específicas de cada revelação a partir do meu plano (a reação certa nomeia o detalhe: \"esse acrílico é mais grosso do que parece no anúncio\").\n\n3. SOM EM PRIMEIRO PLANO\nIndique 2 momentos para deixar o som do unboxing sozinho (rasgo, clique, velcro) sem fala nem trilha — o ASMR involuntário do formato.\n\n4. PLANO B DO VEREDITO MORNO\nSe minha impressão final for \"ok, mas nada demais\": como roteirizar esse veredito de forma honesta E interessante (a decepção parcial bem contada retém tanto quanto o entusiasmo).","e":"de preenchimento:**\n• Produto: kit organizador de maquiagem\n• Plano: pergunta = \"isso aguenta o peso real de maquiagem?\"; ordem = flanela → divisórias → bandejas; sensorial = clique do encaixe; veredito com teste de peso\n• Duração: 60s\n• Formato: sem rosto","u":"1. Grave a abertura da caixa em take único ANTES de ver o roteiro final — impressão real não se regrava (o plano do #026 já preparou o que capturar).\n2. Edite conforme a tabela, conferindo o saldo de expectativa cena a cena.\n3. As falas de reação podem ser regravadas em voice-over depois, com a emoção real da memória fresca.\n4. Veredito morno? Use o plano B — não infle. O público lembra de quem foi honesto no unboxing.","p":"ChatGPT"},{"n":"062","t":"Roteiro de Storytelling","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Transformar a história estruturada (Prompt #031) e a abertura in media res (Prompt #050) em roteiro narrativo cena a cena: o arco emocional distribuído no tempo, os detalhes de verdade preservados, o produto entrando como coadjuvante da virada — e a camada visual que acompanha a narração. Use para os vídeos de conexão do seu plano.","q":"Criadores de conteúdo • Afiliados • Iniciantes","i":":**\n• História estruturada (Prompt #031)\n• Abertura escolhida (Prompt #050)\n• Duração alvo\n• Formato (falando para câmera / narração sobre cenas)","c":"Atue como um roteirista de narrativa pessoal para vídeo curto. Regras do formato: a história é a MINHA, real, e os detalhes concretos que dão verdade são intocáveis; o produto é coadjuvante da virada, nunca herói mágico; e cada cena tem uma função emocional declarada.\n\nCONTEXTO:\n- Minha história estruturada: [COLE DO PROMPT #031]\n- Abertura escolhida: [COLE DO PROMPT #050]\n- Duração alvo: [30s / 60s]\n- Formato: [FALANDO PARA A CÂMERA / NARRAÇÃO SOBRE CENAS]\n\nEntregue:\n\n1. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | FUNÇÃO EMOCIONAL DA CENA (tensão / identificação / alívio / virada / resolução)\nArquitetura: abertura in media res → contexto mínimo (1 frase) → aprofundamento da situação com OS DETALHES REAIS marcados como [DETALHE-VERDADE] → ponto baixo ou virada → entrada do produto (como ferramenta que eu encontrei, com a naturalidade de quem conta como foi) → a mudança concreta → fechamento com espelho (\"se você também...\") + CTA suave.\n\n2. CAMADA VISUAL\nSe meu formato for NARRAÇÃO SOBRE CENAS: liste o que filmar/mostrar para cada trecho (reencenação simples, objetos da história, fotos reais se eu tiver). Se for FALANDO PARA CÂMERA: indique 2 pontos para cortar para um insert visual (a história não sustenta 60s de rosto parado).\n\n3. RITMO DA VOZ\nMarque no roteiro: 1 pausa dramática (onde e por quanto tempo), 1 aceleração (o trecho corrido de propósito) e a mudança de tom na virada — narrativa é música.\n\n4. TESTE DO CINISMO\nReleia o roteiro como o espectador mais cético: aponte a frase que ele chamaria de \"historinha de vendedor\" — e reescreva-a mais seca. (Quanto maior a emoção da história, mais seca deve ser a menção ao produto.)","e":"de preenchimento:**\n• História: entrevista perdida por camisa não encontrada → organizador comprado às 2h → rotina mudou\n• Abertura: \"perdi a entrevista por causa de uma camisa. Deixa eu explicar\"\n• Duração: 60s\n• Formato: narração sobre cenas","u":"1. Os [DETALHE-VERDADE] são inegociáveis na edição — corte qualquer coisa antes deles.\n2. Grave a narração de pé, contando (não lendo): o corpo muda a voz.\n3. Aplique o \"teste do cinismo\" antes de publicar, sempre — é o controle de qualidade do formato.\n4. Histórias que geram comentários pessoais (\"comigo foi igual\") indicam material para série (Prompt #037).","p":"Claude"},{"n":"063","t":"Roteiro Problema → Solução","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Transformar a encenação escolhida no Prompt #027 em roteiro completo do formato mais clássico da venda: a dor encenada com precisão de tempo, a agitação em uma frase, a virada com o produto JÁ resolvendo e a prova-espelho que fecha o ciclo. O roteiro divide o tempo na proporção do formato: mais problema do que os iniciantes têm coragem de deixar.","q":"Afiliados • Criadores de conteúdo • Criadores faceless • Vendedores","i":":**\n• Produto\n• Encenação escolhida + linha de agitação + virada (Prompt #027)\n• Duração alvo\n• Formato","c":"Atue como um roteirista do formato problema→solução para vídeo curto. Proporção obrigatória do formato: aproximadamente 40% do tempo no PROBLEMA (encenação + agitação), 45% na SOLUÇÃO EM AÇÃO, 15% no fechamento. O erro clássico é correr do problema — e sem problema sentido, a solução não vale nada.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Encenação escolhida: [COLE DO PROMPT #027: a cena do problema]\n- Linha de agitação: [COLE]\n- Virada: [COLE: a cena de transição]\n- Duração alvo: [15s / 30s]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue:\n\n1. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nArquitetura com a proporção aplicada à minha duração: encenação do problema desde o segundo 0 (a cena JÁ acontecendo, sem introdução) → linha de agitação sobre a cena → VIRADA: o produto entra em ação no mesmo quadro/contexto do problema (nunca em cena separada e limpa — a continuidade é a prova) → solução em ação contínua → PROVA-ESPELHO: o quadro final refaz o quadro inicial, resolvido (mesmo ângulo, mesmo lugar) → CTA.\n\n2. CRONÔMETRO DO PROBLEMA\nConfirme os segundos exatos dedicados ao problema e valide a proporção. Se o problema ficou com menos de 35% do tempo, reescreva — e explique em 1 frase por que a pressa custaria conversão.\n\n3. CONTINUIDADE\nListe os 3 elementos de continuidade entre a cena-problema e a cena-solução (mesmo cenário, mesma luz, mesmo objeto) que devo garantir na gravação — é a continuidade que torna a prova crível.\n\n4. VERSÃO SEM FALA\nA tabela adaptada para overlay + ação apenas (o formato problema→solução é o que melhor funciona mudo — parte do público vai assistir assim).","e":"de preenchimento:**\n• Produto: suporte de tampa de panela\n• Encenação: tampa pingando no balcão, mão procurando onde apoiar\n• Agitação: \"todo dia, duas vezes por dia, a mesma sujeira\"\n• Virada: tampa encaixando no suporte com a panela ainda no fogo\n• Duração: 30s\n• Formato: sem rosto","u":"1. Grave problema e solução na MESMA sessão, sem mexer no cenário — a continuidade da seção 3 depende disso.\n2. Resista à tentação de encurtar o problema na edição; o cronômetro existe por isso.\n3. A prova-espelho é a cena mais importante depois do gancho: mesmo ângulo, capriche.\n4. Formato validado? Gere variações trocando a encenação (Prompt #027 tem outras 4 prontas).","p":"ChatGPT"},{"n":"064","t":"Roteiro Comparativo","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Transformar o placar do Prompt #029 em roteiro de duelo com regras claras: apresentação dos dois lados em condições idênticas, alternância A/B com ritmo, o ponto em que a alternativa vence (obrigatório) e o veredito \"depende de você\". Use com os fatos verificados dos dois lados.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto e alternativa (categoria/método, sem marcas de terceiros)\n• Placar do Prompt #029 (eixos, vencedores, evidências)\n• Duração alvo\n• Formato","c":"Atue como um roteirista de vídeos comparativos. Regras do duelo justo: os dois lados apresentados em condições idênticas e visíveis; a alternativa vence em pelo menos um round (está no meu placar — use); nada de marcas de terceiros nomeadas; e o veredito final é condicional (\"depende do seu caso\"), nunca absoluto.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Alternativa (método/categoria): [COLE]\n- Placar verificado: [COLE DO PROMPT #029: eixos, vencedor por eixo, evidência visual possível]\n- Duração alvo: [30s / 60s]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue:\n\n1. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nArquitetura: gancho de duelo com os DOIS lados no quadro desde o segundo 1 → declaração das condições do teste em 1 frase (\"mesma sujeira, mesmo tempo\") → rounds alternados A/B (para 30s: 2 rounds; para 60s: 3–4 rounds com re-gancho no meio), cada round com a evidência visual do meu placar e o vencedor declarado no overlay → O ROUND DA ALTERNATIVA (o eixo em que ela vence, apresentado sem pressa — é ele que compra a credibilidade de todo o resto) → veredito condicional: \"escolha X se..., escolha Y se...\" → CTA condicional.\n\n2. PLACAR NA TELA\nDesenhe o sistema de placar visual (ex.: cantos da tela com pontos acumulando por round) — o dispositivo que mantém o espectador contando junto até o fim.\n\n3. SIMETRIA DE GRAVAÇÃO\nChecklist para filmar os dois lados em condições idênticas (mesmo enquadramento, mesma luz, mesma \"dificuldade\") — qualquer assimetria visível vira acusação nos comentários.\n\n4. RESPOSTA PRONTA\nCom base no meu placar, escreva 2 respostas curtas para os questionamentos mais prováveis nos comentários (do Prompt #029, seção de contestações) — para eu responder rápido e por cima.","e":"de preenchimento:**\n• Produto: escova elétrica de limpeza\n• Alternativa: escova manual comum\n• Placar: tempo (elétrica vence, cronômetro), custo (manual vence), esforço (elétrica), autonomia (manual — sem carga)\n• Duração: 60s\n• Formato: sem rosto","u":"1. Filme com a \"simetria de gravação\" ao lado — a justiça precisa ser visível, não declarada.\n2. Não corte o round da alternativa na edição: é o seu certificado de honestidade.\n3. O placar visual segura retenção sozinho — invista os minutos de edição nele.\n4. Fixe uma das \"respostas prontas\" como comentário se o questionamento aparecer.","p":"ChatGPT"},{"n":"065","t":"Roteiro de Teste","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Transformar o protocolo do Prompt #034 em roteiro documental: o critério de sucesso declarado na câmera antes do teste, os marcos de tempo como capítulos, o momento de verificação em plano contínuo e o veredito — positivo ou negativo — roteirizado dos dois jeitos. Use após executar (ou durante) o teste real.","q":"Criadores de conteúdo • Afiliados • Vendedores","i":":**\n• Produto e teste executado (protocolo do Prompt #034)\n• O material registrado (marcos, medições)\n• O resultado real (se o teste já terminou)\n• Duração alvo e formato","c":"Atue como um roteirista de vídeos-experimento (formato documental de teste). As três leis do formato: o CRITÉRIO DE SUCESSO é declarado na câmera ANTES do teste começar (é o contrato com o espectador); os MARCOS DE TEMPO são mostrados com evidência (relógio, data, contador); e o VEREDITO respeita o resultado real — sem maquiagem.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Teste executado: [COLE O PROTOCOLO DO PROMPT #034: o que foi testado, condições, critério de sucesso definido antes]\n- Material registrado: [O QUE FILMEI EM CADA MARCO]\n- Resultado real: [O QUE ACONTECEU — ou \"teste em andamento\"]\n- Duração alvo e formato: [30s / 60s + COM/SEM ROSTO]\n\nEntregue:\n\n1. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nArquitetura: gancho com a promessa do produto em xeque (\"dizem que isso aguenta X — vamos ver\") → DECLARAÇÃO DO CRITÉRIO na câmera (\"se acontecer Y, passou; se não, reprovou\") → marcos de tempo em sequência acelerada, cada um com sua evidência de tempo no overlay → re-gancho antes do marco final (\"e aí veio a hora da verdade\") → VERIFICAÇÃO em plano contínuo (o momento da medição/conferência, sem corte) → veredito + o que isso significa para quem pensa em comprar.\n\n2. DOIS VEREDITOS PRONTOS\nRoteirize o bloco final DUAS vezes: versão APROVADO (entusiasmo contido + para quem vale) e versão REPROVADO/PARCIAL (o resultado seco + contexto justo + \"não recomendo para X\" quando aplicável). Vou usar a que o resultado real mandar.\n\n3. EVIDÊNCIA DE TEMPO\nPara cada marco: como provar visualmente que o tempo passou de verdade (relógio na cena, data no celular, luz do dia mudando) — a credibilidade do formato mora aí.\n\n4. CORTE PARA SÉRIE\nIndique como fatiar este mesmo material em episódios diários (dia 1, dia 2...) para o formato série (Prompt #037), com o gancho de continuação de cada episódio.","e":"de preenchimento:**\n• Produto: garrafa térmica\n• Teste: 24h de gelo, critério = ainda ter gelo sólido às 24h, termômetro nos marcos\n• Material: filmagens 0h/8h/16h/24h com termômetro\n• Resultado: gelo presente às 24h, água a 4°C\n• Duração: 60s, sem rosto","u":"1. Se o teste ainda não começou, grave a declaração do critério HOJE — ela não pode ser gravada depois do resultado (o público percebe).\n2. Use o veredito que o resultado real mandar. Sem exceção.\n3. A \"evidência de tempo\" é o detalhe que separa experimento de encenação — não pule.\n4. Material de teste rende dois formatos: o vídeo-resumo (este roteiro) e a série diária (seção 4).","p":"ChatGPT"},{"n":"066","t":"Roteiro de Depoimento","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Roteirizar o seu depoimento pessoal: o relato em primeira pessoa da mudança que o produto trouxe na SUA vida — mais emocional que o review (que avalia por critérios) e mais estruturado que o UGC (que é textura de conversa). Com a regra dura do formato: depoimento é seu e verdadeiro, ou não existe — este prompt se recusa a fabricar depoimentos de terceiros.","q":"Criadores de conteúdo • Afiliados • Vendedores","i":":**\n• Produto\n• Sua situação antes, o que mudou de fato, há quanto tempo usa\n• O momento específico em que você percebeu a mudança\n• Duração alvo e formato","c":"Atue como um roteirista de depoimentos pessoais em vídeo. Definições do formato: depoimento é o relato em PRIMEIRA PESSOA de uma mudança REAL vivida por quem fala. Regras absolutas: (1) só roteirizo o depoimento da pessoa que está preenchendo este prompt, com os fatos que ela informar; (2) NUNCA crio depoimentos fictícios de \"clientes\" ou terceiros — depoimento inventado é fraude; (3) a mudança relatada não pode ser ampliada além do informado.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Minha situação antes: [COMO ERA]\n- O que mudou de fato: [SEJA ESPECÍFICO E HONESTO — mudanças modestas são válidas]\n- Há quanto tempo uso: [TEMPO]\n- O momento em que percebi a mudança: [A CENA ESPECÍFICA — ex.: \"quando visitei minha mãe e não levei o remédio de dor\"]\n- Duração alvo e formato: [30s / 60s + FALANDO PARA CÂMERA / NARRAÇÃO]\n\nEntregue:\n\n1. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nArquitetura do depoimento: abrir pelo MOMENTO DA PERCEPÇÃO (a cena específica em que notei a mudança — não pelo produto) → como era antes, em 2 detalhes concretos → a mudança nomeada com o tamanho REAL dela (o roteiro deve soar contido: entusiasmo desproporcional destrói depoimento) → o tempo de uso como lastro (\"faz X meses\") → a ponte para o espectador (\"se a sua situação é parecida...\") → CTA suave.\n\n2. CALIBRAGEM DE TAMANHO\nCompare a mudança que informei com a linguagem do roteiro, frase a frase: aponte qualquer palavra que amplifica além do relato (ex.: eu disse \"melhorou\" e o texto diz \"transformou\") — e corrija.\n\n3. O DETALHE QUE ANCORA\nIdentifique no meu relato o detalhe mais específico e mundano (o remédio não levado, o alarme desligado) e garanta que ele está no centro do roteiro — é ele que faz o depoimento soar vivido.\n\n4. DIFERENÇA DECLARADA\nEm 2 frases no final do vídeo ou na legenda: como sinalizar com transparência que sou afiliado/divulgador (verificar no app a forma exigida pela plataforma) — depoimento verdadeiro convive bem com transparência comercial; é a combinação das duas coisas que gera confiança.","e":"de preenchimento:**\n• Produto: almofada de apoio lombar\n• Antes: dor no fim de todo expediente, pausas para alongar de hora em hora\n• Mudou: a dor diminuiu bastante nos dias de uso; não sumiu\n• Tempo: 2 meses\n• Momento: sexta-feira em que terminei o expediente e percebi que não tinha pensado nas costas o dia todo\n• Duração: 30s, falando para câmera","u":"1. Preencha \"o que mudou\" sem inflar — a seção 2 vai comparar seu relato com o texto, e o roteiro só é bom se passar nela.\n2. Grave olhando para a lente como quem conta para uma pessoa, não para uma audiência.\n3. A transparência de afiliado (seção 4) não é opcional: verifique a exigência atual no app e cumpra.\n4. Depoimento + review do mesmo produto (Prompt #059) formam um par forte com semanas de distância.","p":"Claude"},{"n":"067","t":"Roteiro para Criador Iniciante","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Criar um roteiro desenhado para quem trava na frente da câmera: frases curtas que não exigem decoreba, gravação em blocos independentes (errou, regrava SÓ o bloco), direções de câmera explícitas e um aquecimento anti-travamento. Não é um formato de vídeo — é qualquer formato, adaptado para quem está começando. Use nos seus 10 primeiros vídeos.","q":"Iniciantes","i":":**\n• Produto e ideia do vídeo\n• Sua maior dificuldade (travar, esquecer, vergonha, voz)\n• Duração alvo\n• Formato","c":"Atue como um diretor paciente de criadores de primeira viagem. Sua missão: um roteiro que uma pessoa SEM experiência consegue gravar hoje, sem travar. Princípios: nenhuma fala com mais de 10 palavras; gravação em BLOCOS independentes (cada bloco = um take separado — errou, regrava só ele); toda cena com direção explícita (onde olhar, o que fazer com as mãos, quando respirar); e zero dependência de carisma — a estrutura carrega o vídeo.\n\nCONTEXTO:\n- Produto e ideia do vídeo: [DESCREVA]\n- Minha maior dificuldade: [TRAVO / ESQUEÇO O TEXTO / VERGONHA DA VOZ / NÃO SEI PARA ONDE OLHAR / OUTRA]\n- Duração alvo: [15s / 30s]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue:\n\n1. ROTEIRO EM BLOCOS em tabela:\nBLOCO | TEMPO | FALA (máx. 10 palavras por frase) | O QUE FAÇO EM CENA (mãos, olhar, movimento — explícito) | DICA DE GRAVAÇÃO DO BLOCO\nCada bloco deve ser gravável isoladamente e emendar no corte com o seguinte. Máximo de 5 blocos.\n\n2. ADAPTAÇÃO À MINHA DIFICULDADE\nAjuste específico para o meu problema: se TRAVO → blocos ainda menores + a técnica de falar em movimento; se ESQUEÇO → o texto vira 3 palavras-chave por bloco coladas atrás do celular; se VERGONHA DA VOZ → versão do roteiro com menos fala e mais texto na tela; se NÃO SEI PARA ONDE OLHAR → marcação de olhar por bloco (lente / produto / lente).\n\n3. AQUECIMENTO DE 2 MINUTOS\n3 passos antes de gravar: falar o bloco 1 três vezes sem gravar, gravar um take \"de lixo\" assumido (o take que existe para ser ruim), e só então o take valendo.\n\n4. RÉGUA DE \"BOM O BASTANTE\"\nCritérios objetivos para eu PARAR de regravar (áudio audível + fala completa + produto visível = publica). Vídeo de iniciante não compete com o da criadora profissional — compete com o vídeo que você não publicou.\n\n5. O QUE MELHORAR NO PRÓXIMO\nAponte 1 única habilidade para eu focar no vídeo seguinte (uma por vez — não cinco).","e":"de preenchimento:**\n• Produto e ideia: organizador de cabos, demonstração simples na mesa\n• Dificuldade: travo e regravo 20 vezes\n• Duração: 15s\n• Formato: com rosto","u":"1. Siga o aquecimento — o \"take de lixo\" desarma o perfeccionismo melhor que qualquer conselho.\n2. Respeite a régua de \"bom o bastante\": publicar 5 vídeos ok ensina mais que polir 1.\n3. Use este prompt nos 10 primeiros vídeos; depois, migre para os roteiros padrão do módulo.\n4. A habilidade única da seção 5 vira sua meta do próximo vídeo — uma de cada vez.","p":"ChatGPT"},{"n":"068","t":"Roteiro Faceless","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Criar roteiros onde a coluna visual é a protagonista: para vídeos sem rosto, com a narração (ou o texto na tela) escrita depois e por cima das cenas. Consome as ideias do Prompt #036 e as duplas de gancho do #049, e entrega o roteiro no subformato escolhido — mãos, POV, texto na tela ou narração + b-roll. Use como roteirista-padrão do seu perfil faceless.","q":"Criadores faceless • Afiliados • Usuários que trabalham com IA","i":":**\n• Produto e ideia (Prompt #036)\n• Dupla de gancho cena+overlay (Prompt #049)\n• Subformato\n• Duração alvo e recurso de voz","c":"Atue como um roteirista de vídeos faceless. Método obrigatório: escreva PRIMEIRO a coluna visual completa (a sequência de cenas que conta a história sozinha, sem som), e SÓ DEPOIS adicione narração/texto por cima. Um roteiro faceless que não funciona mudo está errado.\n\nCONTEXTO:\n- Produto e ideia: [COLE DO PROMPT #036]\n- Gancho (dupla cena+overlay): [COLE DO PROMPT #049]\n- Subformato: [MÃOS+PRODUTO / POV / TEXTO NA TELA / NARRAÇÃO+B-ROLL]\n- Duração alvo: [15s / 30s / 60s]\n- Voz: [MINHA VOZ / VOZ DE IA / SEM VOZ]\n\nEntregue:\n\n1. COLUNA VISUAL PRIMEIRO\nA sequência de cenas numerada, com tempo, descrevendo APENAS o que aparece (ação, ângulo, movimento de câmera possível com celular). Valide: essa sequência sozinha, muda, conta a ideia? Se não, corrija antes de prosseguir.\n\n2. ROTEIRO COMPLETO em tabela:\nTEMPO | CENA (da coluna visual) | NARRAÇÃO (se houver voz) | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO DE FILMAGEM (altura da câmera, apoio, luz)\nRegras por subformato: MÃOS → as mãos entram em quadro já em ação, unhas/pele como estão (real vende); POV → a câmera na altura dos olhos, movimentos suaves, objetos manipulados como o espectador manipularia; TEXTO NA TELA → o texto é a narrativa: cada cartela com ritmo de leitura confortável (mín. 1,5s por cartela curta); NARRAÇÃO+B-ROLL → a narração NUNCA descreve a cena (adiciona contexto/significado), e cada frase da narração tem sua cena correspondente.\nSe a voz for de IA: escreva a narração com frases curtas e pontuação exagerada (vírgulas e pontos guiam a entonação da voz sintética) e inclua a nota: verificar no app as regras atuais de rotulagem de conteúdo gerado por IA.\n\n3. ÂNCORA DE ATENÇÃO POR CENA\nPara cada cena, nomeie o elemento que segura o olhar sem rosto (movimento, transformação, close, contraste) — cena sem âncora é cena que perde o dedo.\n\n4. PACOTE DE SESSÃO\nAgrupe o que filmar numa única sessão (por cenário e setup), incluindo os planos extras de segurança (2 ângulos do momento-chave).","e":"de preenchimento:**\n• Produto e ideia: umidificador com LED — POV \"chegando do trabalho e ligando o canto de descompressão\"\n• Gancho: cena = mão ligando o umidificador no escuro, névoa subindo / overlay = \"meu ritual das 19h\"\n• Subformato: POV\n• Duração: 30s\n• Voz: sem voz","u":"1. Não pule a validação da coluna visual muda — é o teste de qualidade do formato inteiro.\n2. Filme o \"pacote de sessão\" completo, incluindo os planos de segurança: refilmagem em faceless custa remontar o cenário.\n3. Voz de IA: gere 2 versões da narração e escolha a de entonação menos robótica; e confira a exigência de rotulagem no app.\n4. Este roteiro alimenta também o Módulo 8, se você for gerar as cenas com IA de vídeo.","p":"ChatGPT"},{"n":"069","t":"Gerador de 10 Variações de um Roteiro","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Pegar um roteiro que funcionou e gerar 10 variações sistemáticas — cada uma mudando UMA variável (gancho, ângulo, público, formato, duração, ordem, tom) e mantendo o resto. É a máquina de escala do módulo: quando algo mostra sinal, você não cria do zero — você varia com método. Use com os dados do Módulo 10 na mão.","q":"Afiliados • Criadores de conteúdo • Criadores faceless • Usuários que trabalham com IA","i":":**\n• O roteiro original completo\n• Os sinais dele (retenção, comentários, cliques — o que você observou)\n• O que você SUSPEITA que fez funcionar","c":"Atue como um engenheiro de variações de conteúdo. Método: variação científica — cada variação muda UMA variável do roteiro original e preserva todo o resto, para que o desempenho comparado revele O QUE importa. Variação que muda três coisas ao mesmo tempo não ensina nada.\n\nCONTEXTO:\n- Roteiro original (completo): [COLE A TABELA DO ROTEIRO]\n- Sinais que ele deu: [RETENÇÃO APROXIMADA, COMENTÁRIOS RECORRENTES, CLIQUES — o que observei]\n- Minha hipótese do que funcionou: [EX.: \"acho que foi o gancho de confissão\" ou \"não sei\"]\n\nEntregue:\n\n1. DIAGNÓSTICO\nCom base nos sinais e no roteiro, liste as 3 hipóteses mais prováveis do que carregou o vídeo (rotule como HIPÓTESE). Se os sinais forem insuficientes, diga o que observar antes de escalar.\n\n2. DEZ VARIAÇÕES em tabela:\nNº | VARIÁVEL ALTERADA (apenas uma) | O QUE MUDA EXATAMENTE | O QUE PERMANECE | O QUE ESTA VARIAÇÃO TESTA\nDistribua as variáveis: 2 variações de GANCHO (mantendo corpo idêntico), 2 de ÂNGULO/DOR, 1 de PÚBLICO-ALVO, 1 de FORMATO (ex.: de demonstração para POV), 1 de DURAÇÃO (a versão cortada), 1 de ORDEM (a prova antes do problema), 1 de TOM, 1 de CTA.\n\n3. AS 3 PRIMEIRAS COMPLETAS\nEscreva por extenso (tabela completa de roteiro: TEMPO | TELA | FALA | TEXTO | DIREÇÃO) as 3 variações mais alinhadas ao diagnóstico — prontas para gravar.\n\n4. ORDEM DE PUBLICAÇÃO\nSequência e espaçamento sugeridos para publicar as variações sem canibalizar (dias de intervalo, alternância com outros conteúdos), e o que comparar entre cada par original×variação.\n\n5. REGRA DE PARADA\nQuando parar de variar este roteiro (sinais de fadiga do formato no meu perfil) e voltar a criar do zero.","e":"de preenchimento:**\n• Roteiro original: [tabela do 30s do dispenser de detergente]\n• Sinais: retenção boa até o s20, caiu no CTA; 14 comentários \"onde compra?\"\n• Hipótese: o gancho de identificação carregou; o CTA está fraco","u":"1. Só use com roteiro que deu sinal real — variar vídeo morto é multiplicar o zero.\n2. Uma variável por variação: é a regra que transforma publicação em experimento.\n3. Publique na ordem sugerida e anote os resultados no registro do Prompt #022.\n4. Este prompt + Módulo 10 formam o ciclo de escala do método inteiro: analisar → variar → publicar → analisar.","p":"Claude"},{"n":"070","t":"Roteiro de Resposta a Comentário","m":5,"mn":"ROTEIROS DE VÍDEOS","o":"Roteirizar o formato nativo de responder um comentário em vídeo: o comentário na tela como gancho pronto, a resposta direta nos primeiros segundos e a prova em seguida. É o formato de maior conversão por esforço — quem pergunta já está interessado, e quem assiste vê a pergunta que teria feito. Use semanalmente com os comentários reais do seu perfil.","q":"Afiliados • Vendedores • Criadores de conteúdo • Criadores faceless","i":":**\n• O comentário real (copiado exato)\n• O produto e a resposta verdadeira à pergunta\n• Se você tem como PROVAR a resposta em vídeo\n• Duração alvo e formato","c":"Atue como um roteirista do formato \"resposta a comentário\" (o vídeo que abre com o comentário fixado na tela). As leis do formato: o comentário É o gancho (não crie outro por cima); a resposta direta chega nos primeiros 5 segundos (enrolar para responder é o erro fatal do formato); e a prova visual vem logo atrás da resposta. Tom obrigatório: tratar quem perguntou com respeito absoluto — inclusive o cético e o irônico. A audiência julga o criador pela forma como responde.\n\nCONTEXTO:\n- Comentário real (exato): [COLE O COMENTÁRIO]\n- Produto: [PRODUTO]\n- A resposta verdadeira: [RESPONDA A PERGUNTA COM HONESTIDADE — inclusive se a resposta for desfavorável ao produto]\n- Posso provar em vídeo?: [SIM — COMO / NÃO]\n- Duração alvo e formato: [15s / 30s + COM/SEM ROSTO]\n\nEntregue:\n\n1. CLASSIFICAÇÃO DO COMENTÁRIO\nDÚVIDA PRÁTICA / CETICISMO / OBJEÇÃO DE COMPRA / PROVOCAÇÃO LEVE — e o ajuste de tom para cada caso (dúvida → direto e útil; ceticismo → prova sem deboche; objeção → honestidade sobre limites; provocação → humor leve sem humilhar).\n\n2. ROTEIRO em tabela:\nTEMPO | O QUE APARECE NA TELA | FALA/NARRAÇÃO | TEXTO NA TELA (máx. 7 palavras) | DIREÇÃO\nArquitetura: comentário na tela + leitura/aceno a ele (0–3s) → RESPOSTA DIRETA em uma frase (3–5s) → prova visual da resposta (se marquei SIM) ou explicação honesta com contexto (se NÃO) → complemento útil que antecipa a próxima pergunta provável → convite a novas perguntas + CTA leve.\nSe a resposta verdadeira for desfavorável (\"não, ele não faz isso\"), o roteiro assume a resposta sem rodeio e delimita para quem o produto ainda vale — credibilidade compra mais que a venda perdida.\n\n3. PRÓXIMAS PERGUNTAS\nPreveja as 2 perguntas que este vídeo vai gerar nos comentários — cada uma é o próximo vídeo deste formato (a série que se autoalimenta).\n\n4. RESPOSTA ESCRITA GÊMEA\nA resposta em texto (até 250 caracteres) para eu também responder o comentário original por escrito, linkando que \"respondi em vídeo\" — os dois canais se reforçam.","e":"de preenchimento:**\n• Comentário: \"aposto que isso não aguenta uma semana kkk\"\n• Produto: suporte veicular magnético\n• Resposta verdadeira: uso há 6 meses, aguentou; mas com capinha muito grossa perde força\n• Posso provar: sim — filmar o suporte com data do pedido + teste de trepidação\n• Duração: 30s, sem rosto","u":"1. Garimpe 1 comentário por semana para este formato — priorize os que se repetem (dúvida repetida = vídeo garantido).\n2. Responda em até 48h do comentário: o formato vive de conversa quente.\n3. As \"próximas perguntas\" da seção 3 vão para a fila do formato — é a série mais barata do seu calendário.\n4. Ceticismo respondido com prova e respeito converte a audiência inteira, não só quem perguntou.","p":"ChatGPT"},{"n":"071","t":"Criador de CTA","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Gerar uma biblioteca de CTAs por objetivo e temperatura: clique na vitrine, seguir, comentar, salvar, assistir de novo — cada um com versões suave, média e direta. Com a regra que protege sua conta: urgência só quando for real, e nenhuma promessa que o produto não cumpre. Use uma vez por produto e reaproveite no módulo inteiro.","q":"Afiliados • Vendedores • Criadores de conteúdo • Iniciantes","i":":**\n• Produto\n• Público e tom do perfil\n• Objetivo principal (venda, seguidores, engajamento)\n• Fatos de urgência reais, se existirem (promoção confirmada, estoque)","c":"Atue como um copywriter de CTAs (chamadas para ação) para social commerce.\n\nRegras obrigatórias:\n- Urgência só com fato real que eu informar (\"promoção até sexta\" apenas se eu confirmar). Escassez inventada (\"últimas unidades!\" sem verificação) é proibida — além de antiética, gera denúncia e devolução.\n- Nenhum CTA pode prometer resultado que o produto não garante.\n- CTA é uma frase de fala natural no meu tom, não um slogan gritado.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Público e tom: [PÚBLICO + TOM DO PERFIL]\n- Objetivo principal: [VENDA / SEGUIDORES / ENGAJAMENTO / MISTO]\n- Fatos de urgência reais (se houver): [EX.: promoção confirmada até dia X / nenhum]\n\nEntregue a biblioteca no seguinte formato:\n\n1. CTAs DE CLIQUE (vitrine/carrinho) — 3 versões:\n- SUAVE (curiosidade: \"deixei o link na vitrine pra quem quiser ver\")\n- MÉDIA (benefício + direção: \"se a sua pia vive assim, o link tá na vitrine\")\n- DIRETA (ação clara + urgência real quando houver)\n\n2. CTAs DE SEGUIR — 3 versões, cada uma ancorada num MOTIVO concreto para seguir (a série, a trilha, os testes semanais) — \"me segue pra mais\" não é motivo.\n\n3. CTAs DE COMENTÁRIO — 3 versões com pergunta específica de resposta fácil (1 palavra ou escolha A/B).\n\n4. CTAs DE SALVAMENTO — 2 versões para conteúdo de utilidade (\"salva pra hora que a gordura vencer você\").\n\n5. CTA CONDICIONAL — 2 versões do formato \"se você é X, então Y\" (o CTA que filtra e converte melhor em vídeo de review e comparativo).\n\n6. TABELA DE USO\nFormato × CTA recomendado: demonstração → clique direto; educativo → salvar + seguir; storytelling → condicional suave; UGC → clique suave. Adapte à minha lista.\n\n7. ANTI-CTAs\n3 CTAs comuns no nicho que eu NÃO devo usar (clichês queimados ou promessas arriscadas), com o motivo.","e":"de preenchimento:**\n• Produto: mop giratório\n• Público e tom: quem faz a própria faxina; tom de amiga direta\n• Objetivo: venda\n• Urgência real: nenhuma","u":"1. Gere a biblioteca 1 vez por produto e cole os CTAs nos roteiros do Módulo 5 conforme a tabela de uso.\n2. Alterne suave/média/direta entre vídeos e compare cliques — CTA também se testa.\n3. Nunca \"empreste\" a urgência de um vídeo antigo: reconfirme o fato antes de reusar.\n4. Os CTAs de comentário alimentam a estratégia do Prompt #079.","p":"ChatGPT"},{"n":"072","t":"Criador de Legendas","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Criar legendas que trabalham em três frentes: a primeira linha que segura (é o que aparece antes do \"...mais\"), as palavras-chave que ajudam a busca dentro da plataforma, e o CTA escrito que complementa o falado. Inclui a abordagem sensata de hashtags — sem prometer alcance por hashtag, porque ninguém pode prometer isso. Use para cada vídeo publicado.","q":"Afiliados • Criadores de conteúdo • Criadores faceless • Iniciantes","i":":**\n• O vídeo (roteiro ou resumo do que acontece)\n• Produto e nicho\n• Termos que seu público buscaria\n• CTA escolhido (Prompt #071)","c":"Atue como um copywriter de legendas para vídeo curto de social commerce. A legenda tem 3 funções, nesta ordem de prioridade:\n1. PRIMEIRA LINHA: as primeiras ~5 palavras aparecem truncadas no feed — são um segundo gancho, não um resumo.\n2. BUSCA: pessoas pesquisam dentro da plataforma; a legenda deve conter, em linguagem natural, os termos que meu público digitaria.\n3. CONVERSÃO: o CTA escrito complementa (não repete) o CTA falado do vídeo.\n\nRegras:\n- Não invente dados de alcance de hashtags nem prometa desempenho. Hashtags são organização e contexto, não mágica.\n- A legenda deve ler como gente, não como lista de palavras-chave.\n\nCONTEXTO:\n- O vídeo: [COLE O ROTEIRO OU RESUMA O QUE ACONTECE]\n- Produto e nicho: [PRODUTO + NICHO]\n- Termos que meu público buscaria: [EX.: \"como limpar rejunte\", \"organização de cozinha pequena\"]\n- CTA escolhido: [COLE DO PROMPT #071]\n\nEntregue:\n\n1. TRÊS LEGENDAS COMPLETAS (curta ~100 caracteres, média ~200, longa ~350), cada uma com:\n- Primeira linha-gancho (marcada, com a versão truncada de 5 palavras entre parênteses para eu validar)\n- Corpo com os termos de busca integrados naturalmente\n- CTA escrito\nVarie o mecanismo da primeira linha entre as três: identificação, curiosidade e benefício.\n\n2. BLOCO DE HASHTAGS\n6 a 10 hashtags em 3 camadas: nicho amplo (2–3), subnicho específico (3–4), produto/formato (2–3). Sem hashtags genéricas de volume (#fyp e similares) como estratégia — se incluir alguma, explique o porquê. Marque o bloco como PONTO DE PARTIDA para eu ajustar observando o que criadores do meu nicho usam.\n\n3. PERGUNTA-ÂNCORA\n1 pergunta para encerrar a legenda que estimula comentário específico (integrada, não colada no fim).\n\n4. VERSÃO PARA REPOSTAGEM\n1 legenda alternativa com outra primeira linha e outro ângulo, para quando eu republicar o vídeo ou usar em variação (Prompt #069) — legenda repetida em vídeo repetido desperdiça o teste.","e":"de preenchimento:**\n• Vídeo: demonstração do dispenser de detergente resolvendo a pia melada\n• Produto e nicho: dispenser com base / cozinha e organização\n• Termos: \"pia organizada\", \"detergente escorrendo\", \"utilidades de cozinha\"\n• CTA: \"se a sua pia vive assim, o link tá na vitrine\"","u":"1. Valide a versão truncada da primeira linha — é o que 90% do feed vai ler.\n2. Ajuste o bloco de hashtags observando seu nicho por 1 semana; depois padronize as suas camadas fixas.\n3. Guarde a \"versão para repostagem\" junto do roteiro: você vai precisar dela no Módulo 10.\n4. A pergunta-âncora conversa com a pergunta-semente do Prompt #052 — não use as duas iguais no mesmo vídeo.","p":"ChatGPT"},{"n":"073","t":"Criador de Descrição de Produto","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Escrever a descrição de produto da loja (título, bullets e texto) para vendedores da TikTok Shop: clara, escaneável, honesta e construída sobre a ficha técnica real — com as especificações que reduzem devolução (medidas, material, o que NÃO vem na caixa). Afiliados também usam: uma boa descrição gera os argumentos do vídeo. Use com os dados reais do produto em mãos.","q":"Vendedores • Afiliados (como fonte de argumentos)","i":":**\n• Ficha técnica real (medidas, material, voltagem, o que acompanha)\n• Público e principal dor que o produto resolve\n• Dúvidas frequentes de compradores (se já vende)\n• Palavras que o público usa para buscar esse tipo de produto","c":"Atue como um redator de páginas de produto para social commerce, especializado em descrições que vendem E reduzem devolução (as duas coisas juntas — descrição que só vende e frustra gera devolução, avaliação ruim e conta penalizada).\n\nRegras obrigatórias:\n- Use APENAS os dados da ficha técnica que vou fornecer. Não invente medidas, materiais, certificações ou capacidades.\n- Se algum dado essencial para a decisão de compra estiver faltando na minha ficha (medida, voltagem, compatibilidade), liste-o em PENDÊNCIAS antes de escrever.\n- Proibido superlativos vazios (\"o melhor\", \"revolucionário\") e promessas de resultado garantido.\n\nCONTEXTO:\n- Ficha técnica real: [COLE TUDO: medidas, material, cores, voltagem, itens inclusos, capacidade]\n- Público e dor principal: [QUEM COMPRA E POR QUÊ]\n- Dúvidas frequentes de compradores: [SE JÁ VENDO, COLE AS PERGUNTAS RECEBIDAS]\n- Termos de busca do público: [COMO ELES CHAMAM ESSE PRODUTO]\n\nEntregue:\n\n1. PENDÊNCIAS (se houver dados faltando — pare aqui até eu completar)\n\n2. TÍTULO DO PRODUTO — 3 opções de até 60 caracteres: [tipo de produto] + [atributo decisivo] + [termo de busca do público]. Sem emoji em excesso, sem TUDO EM CAIXA ALTA.\n\n3. ABERTURA (2–3 linhas): a dor e a solução em linguagem do público — o trecho que aparece antes do \"ver mais\".\n\n4. BULLETS DE DECISÃO (5–7): cada bullet = 1 benefício + o dado técnico que o sustenta (\"Cabe em pia pequena — base de 12x12cm\"). Ordene do mais decisivo ao complementar.\n\n5. BLOCO ANTI-DEVOLUÇÃO: especificações completas em lista seca + \"o que vem na caixa\" + \"o que NÃO vem\" (se aplicável) + 1 linha de expectativa realista sobre o ponto que mais gera frustração neste tipo de produto.\n\n6. PERGUNTAS RESPONDIDAS: se forneci dúvidas de compradores, responda as 3 mais frequentes em 1 linha cada, para incluir na descrição.\n\n7. VERSÃO PARA O AFILIADO: um resumo de 5 linhas com os argumentos mais fortes da descrição, para criadores que forem promover o produto usarem nos vídeos.","e":"de preenchimento:**\n• Ficha: dispenser 380ml, ABS + inox, 12x12x18cm, base para esponja, sem pilha, acompanha adesivo de fixação\n• Público: quem tem pia pequena e odeia meleca de detergente\n• Dúvidas: \"precisa parafusar?\", \"cabe detergente de qualquer marca?\"\n• Termos: \"dispenser detergente\", \"porta detergente e esponja\"","u":"1. Resolva as PENDÊNCIAS antes de publicar — dado faltando na página vira pergunta repetida e venda perdida.\n2. O bloco anti-devolução não é pessimismo: é o que protege sua nota de vendedor.\n3. Afiliado: rode este prompt com a ficha do produto que você promove e use a \"versão para o afiliado\" como base de argumentos (alimenta o #074).\n4. Atualize a descrição quando as dúvidas dos compradores mudarem — ela é documento vivo.","p":"Multiplataforma"},{"n":"074","t":"Gerador de Argumentos de Venda","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Construir o arsenal de argumentos de um produto: os racionais (dados, comparações), os emocionais (dores e desejos), os de prova (experiência, avaliações) e os de reversão de risco — cada um com sua fonte verificada e o contexto onde funciona melhor. É o documento-mestre de copy do produto: roteiros, legendas e respostas bebem dele. Use uma vez por produto, no início do teste.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto e ficha/benefícios verificados\n• Mapa de dores e públicos (Prompts #007 e #008)\n• Provas disponíveis (sua experiência, avaliações do #011, dados da página)\n• Preço e condições reais","c":"Atue como um estrategista de argumentação de vendas para social commerce. Sua tarefa: construir o ARSENAL completo de argumentos deste produto — organizado, verificado e pronto para eu sacar o argumento certo no contexto certo.\n\nRegra de lastro: todo argumento deve apontar sua FONTE entre os dados que forneci (ficha, minha experiência, avaliações, página do produto). Argumento sem fonte não entra no arsenal. Se identificar um argumento potencialmente forte que me falta verificar, liste-o em \"ARGUMENTOS A VERIFICAR\" — separado do arsenal.\n\nCONTEXTO:\n- Produto e dados verificados: [FICHA + BENEFÍCIOS CONFIRMADOS]\n- Dores e públicos: [COLE DOS PROMPTS #007 E #008]\n- Provas disponíveis: [MINHA EXPERIÊNCIA + AVALIAÇÕES REAIS + DADOS VISÍVEIS NA PÁGINA]\n- Preço e condições reais: [PREÇO, FRETE, GARANTIA — o que estiver confirmado]\n\nEntregue o arsenal em 4 categorias:\n\n1. ARGUMENTOS RACIONAIS (4–6): lógica, números e comparações de custo/tempo — cada um com: o argumento em 1 frase de fala natural + fonte + onde brilha (review, comparativo, resposta a cético).\n\n2. ARGUMENTOS EMOCIONAIS (4–6): a dor sentida e o desejo por trás — cada um com: a frase na linguagem do público + a dor/desejo de origem + onde brilha (gancho, storytelling, UGC).\n\n3. ARGUMENTOS DE PROVA (3–5): experiência própria, avaliações, dados sociais visíveis — cada um com: como apresentar (mostrar > afirmar) + fonte exata + onde brilha.\n\n4. ARGUMENTOS DE REVERSÃO DE RISCO (2–4): o que reduz o medo de errar a compra (preço acessível, garantia SE confirmada, demonstração transparente das limitações) — sem inventar políticas de devolução: se eu não confirmei a política, o argumento não existe.\n\nDepois:\n\n5. TOP 3 DO PRODUTO: os 3 argumentos mais fortes do arsenal inteiro, com justificativa de 1 frase — os que devem aparecer nos primeiros vídeos.\n\n6. ARGUMENTO PROIBIDO: identifique 1 argumento tentador que este produto NÃO sustenta (pela ficha ou pelas avaliações) e que eu devo me proibir de usar.\n\n7. ARGUMENTOS A VERIFICAR (se houver).","e":"de preenchimento:**\n• Produto: escova alisadora cerâmica\n• Dados: aquece em 60s (testei), 3 temperaturas, bivolt\n• Dores/públicos: pressa de manhã / economia vs. salão; mulheres 25–40\n• Provas: uso há 1 mês; 4,6★ com 1.200 avaliações; \"me economiza 40 min\" (avaliação real)\n• Preço: R$ 89 confirmado hoje","u":"1. Rode no início do teste do produto e salve o arsenal junto do plano (Prompt #022).\n2. Ao escrever qualquer roteiro ou legenda, escolha do arsenal — não improvise argumento novo sem fonte.\n3. O \"argumento proibido\" é vacina: anote-o visível.\n4. Atualize o arsenal quando novas avaliações e comentários chegarem (mensal).","p":"Claude"},{"n":"075","t":"Transformador de Características em Benefícios","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Traduzir a ficha técnica em linguagem de ganho: cada característica passa pela cadeia \"característica → o que permite → o que muda na vida\" — o exercício mais básico e mais negligenciado do copy de produto. \"Motor de 1200W\" não vende; \"puxa o pelo do sofá em uma passada\" vende. Use com a ficha real; o mapa completo de benefícios por camadas vem no #076.","q":"Afiliados • Vendedores • Iniciantes","i":":**\n• Ficha técnica / lista de características reais\n• Público e contexto de uso","c":"Atue como um tradutor de características em benefícios — o exercício central do copywriting de produto.\n\nMétodo obrigatório, característica por característica, em 3 passos:\nCARACTERÍSTICA (o dado técnico) → VANTAGEM (o que esse dado permite fazer) → BENEFÍCIO (o que muda na vida do público, na linguagem dele, em situação concreta).\n\nRegras:\n- Traduza APENAS as características que vou fornecer. Não adicione capacidades.\n- O benefício final deve ser específico e situado (\"abre o pote que ninguém da casa abriu\") — proibido terminar em abstração (\"mais praticidade\").\n- Se uma característica não gerar benefício relevante para o MEU público, diga isso (\"irrelevante para este público — não usar como argumento\") em vez de forçar.\n\nCONTEXTO:\n- Características reais: [COLE A FICHA / LISTA]\n- Público: [PÚBLICO]\n- Contexto de uso: [ONDE/QUANDO O PRODUTO ENTRA NA ROTINA]\n\nEntregue:\n\n1. TABELA DE TRADUÇÃO\nCARACTERÍSTICA | VANTAGEM | BENEFÍCIO (em fala natural do público) | FORÇA PARA ESTE PÚBLICO (alta/média/baixa/irrelevante)\n\n2. O BENEFÍCIO-CAMPEÃO\nO benefício de força mais alta, reescrito em 3 versões: como gancho, como linha de legenda e como bullet de descrição.\n\n3. TRADUÇÃO VISUAL\nPara os 3 benefícios mais fortes: como MOSTRAR cada um em vídeo em vez de falar (a cena de 3 segundos que prova o benefício).\n\n4. TESTE DO \"E DAÍ?\"\nReleia cada benefício da tabela perguntando \"e daí?\" — se a resposta não for autoevidente para o público, a tradução parou na vantagem. Corrija os que falharem e mostre a correção.","e":"de preenchimento:**\n• Características: aquece em 60s; placas de cerâmica; 3 temperaturas; bivolt; cabo giratório 360°\n• Público: mulheres com rotina corrida de manhã\n• Contexto: arrumação antes do trabalho, viagens","u":"1. Rode com a ficha REAL (da página do produto ou da caixa) — tradução de ficha inventada é castelo na areia.\n2. A coluna \"força\" evita o erro clássico: argumentar a característica que só importa para o fabricante.\n3. As \"traduções visuais\" vão direto para os roteiros de demonstração (#060).\n4. Terminou aqui? O #076 expande este resultado em camadas e por público.","p":"ChatGPT"},{"n":"076","t":"Gerador de Benefícios (mapa completo)","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Expandir a tradução do #075 em um mapa de benefícios em 4 camadas — funcional, emocional, social e de identidade — cruzado com cada público do produto. É onde aparecem os benefícios escondidos que a concorrência não usa (\"não é o tempo que ele economiza; é não começar o dia irritada\"). Use depois do #075, para produtos que você vai trabalhar por semanas.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Tabela de tradução do Prompt #075\n• Públicos mapeados (Prompt #008)\n• Avaliações reais (Prompt #011, se tiver)","c":"Atue como um estrategista de benefícios para social commerce. Sua tarefa: expandir benefícios já traduzidos em um MAPA de 4 camadas, cruzado por público — revelando os benefícios que ninguém no nicho está usando.\n\nAs 4 camadas:\n1. FUNCIONAL — o que o produto faz (a base, já traduzida no material que vou colar)\n2. EMOCIONAL — o que a pessoa SENTE com o problema resolvido (alívio, orgulho, paz)\n3. SOCIAL — o que muda diante dos outros (a casa que pode receber visita, o presente que acerta)\n4. IDENTIDADE — quem a pessoa passa a ser aos próprios olhos (\"sou alguém que se organiza\")\n\nRegras:\n- Construa as camadas 2–4 como DERIVAÇÕES plausíveis da camada 1 e das avaliações reais — nunca como promessas do produto. A linguagem correta é a do público sentindo, não a do produto garantindo (\"você vai se sentir X\" é proibido; \"aquela sensação de X\" é permitido).\n- Se eu fornecer avaliações reais, ancore as camadas emocionais no que os compradores de fato escreveram.\n\nCONTEXTO:\n- Tradução do #075: [COLE A TABELA]\n- Públicos: [COLE DO PROMPT #008]\n- Avaliações reais (opcional): [COLE DO PROMPT #011]\n\nEntregue:\n\n1. MAPA DE BENEFÍCIOS em tabela:\nCAMADA | BENEFÍCIO | PÚBLICO EM QUE MAIS RESSOA | FONTE/ÂNCORA (característica de origem ou avaliação real) | JÁ EXPLORADO NO NICHO? (comum / pouco visto — com base no que eu descrever da concorrência, ou marque \"verificar\")\n\n2. OS ESCONDIDOS\nOs 3 benefícios de camada 2–4 com maior potencial e menor uso aparente — os ângulos de diferenciação. Para cada um: o gancho que ele gera e o formato de vídeo onde brilha.\n\n3. MATRIZ PÚBLICO × BENEFÍCIO-LÍDER\nPara cada público do meu mapa: qual benefício deve LIDERAR a comunicação com ele (e qual nunca usar com ele).\n\n4. LINHA VERMELHA\nAponte onde a camada emocional/identidade começaria a virar promessa terapêutica ou de vida (\"esse produto vai te dar autoestima\") — o limite que meu conteúdo não deve cruzar.","e":"de preenchimento:**\n• Tradução: [tabela do #075 da escova alisadora]\n• Públicos: rotina corrida 25–40; mães de adolescentes\n• Avaliações: \"chego no trabalho me sentindo arrumada\", \"minha filha parou de brigar com o espelho\"","u":"1. Este prompt sem o #075 antes gera abstração — respeite a ordem.\n2. Os \"escondidos\" são seus ângulos de teste prioritários: leve-os à matriz do #022.\n3. A matriz público × benefício-líder evita o vídeo genérico que fala com todos e toca ninguém.\n4. Releia a \"linha vermelha\" quando o produto for de beleza, saúde ou bem-estar — é onde a tentação mora.","p":"Claude"},{"n":"077","t":"Quebrador de Objeções","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Transformar as objeções reais do seu público (comentários, avaliações negativas, dúvidas repetidas) em respostas honestas com prova — incluindo o passo que quase todo mundo pula: verificar se a objeção é verdadeira. Objeção procedente se responde com transparência e delimitação de público, não com contorno. Use com material real coletado; sem objeções reais, não use.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto\n• Objeções reais coletadas (comentários, avaliações do #011, perguntas)\n• O que você sabe/verificou sobre cada uma\n• Sua experiência com o produto","c":"Atue como um especialista em tratamento de objeções para social commerce. Método obrigatório em 3 etapas para CADA objeção:\n\nETAPA 1 — VEREDITO DE VERDADE: a objeção é PROCEDENTE (o produto tem mesmo essa limitação), PARCIAL (verdadeira em condições específicas) ou IMPROCEDENTE (mal-entendido ou expectativa errada)? Use apenas o que eu verificou. Se eu não souber, classifique como \"VERIFICAR\" — não se responde objeção sem saber a verdade dela.\n\nETAPA 2 — RESPOSTA HONESTA:\n- PROCEDENTE → assumir + delimitar (\"verdade, o cesto é pequeno — por isso eu só recomendo para quem mora sozinho\"). Nunca contornar o que é verdade.\n- PARCIAL → a condição exata (\"resseca SE passar de 15 min — no tempo certo, não\").\n- IMPROCEDENTE → corrigir com respeito e prova, sem ridicularizar quem levantou.\n\nETAPA 3 — PROVA: como demonstrar a resposta visualmente (o vídeo, a cena ou o print que encerra a discussão).\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Objeções reais coletadas: [COLE COMENTÁRIOS, AVALIAÇÕES NEGATIVAS E DÚVIDAS — texto original]\n- O que verifiquei sobre cada uma: [SEU CONHECIMENTO REAL]\n- Minha experiência: [RESUMO]\n\nEntregue:\n\n1. TABELA DE OBJEÇÕES\nOBJEÇÃO (texto original) | VEREDITO (com base no que informei) | RESPOSTA EM FALA NATURAL (1–2 frases no meu tom) | PROVA VISUAL | ONDE USAR (vídeo dedicado #070 / trecho de roteiro / resposta escrita / legenda)\n\n2. A OBJEÇÃO-MESTRA\nA objeção que, respondida bem, derruba as outras por tabela — e o conceito do vídeo dedicado a ela.\n\n3. PRÉ-QUEBRA\nPara as 2 objeções mais frequentes: a frase de 1 linha que ANTECIPA a objeção dentro dos próximos roteiros, antes de ela ser levantada (\"já vou avisando: não é para famílias grandes\") — quem antecipa a objeção fica com a credibilidade dela.\n\n4. OBJEÇÕES \"VERIFICAR\"\nListe o que preciso testar/confirmar antes de responder, com o mini-teste de cada uma.\n\n5. A QUE NÃO SE RESPONDE\nSe houver objeção procedente e ELIMINATÓRIA (o produto realmente não serve para aquele uso), a resposta é dizer isso e não vender para aquele perfil. Identifique se existe alguma no meu material.","e":"de preenchimento:**\n• Produto: air fryer 3L\n• Objeções: \"não cabe nada\", \"gasta muita luz\", \"comida fica seca\"\n• Verifiquei: cabe para 1–2 pessoas (medi); consumo não medi; frango resseca se passar de 15 min\n• Experiência: 3 semanas de uso diário","u":"1. Colete objeções por 1–2 semanas antes de rodar — objeção imaginada gera resposta para pergunta que ninguém fez.\n2. As \"VERIFICAR\" viram testes do Prompt #034 — e o teste vira conteúdo.\n3. Coloque as pré-quebras nos roteiros novos: é a forma mais elegante de usar este prompt.\n4. A seção 5 existe por um motivo: vender para o público errado devolve em avaliação ruim o que rendeu em comissão.","p":"Multiplataforma"},{"n":"078","t":"Gerador de Respostas Estratégicas a Comentários de Venda","m":6,"mn":"COPYWRITING E CONVERSÃO","o":"Criar seu manual de respostas para os comentários que decidem vendas: \"onde compra?\", \"qual o preço?\", \"funciona mesmo?\", \"vale a pena?\" — cada tipo com resposta que converte sem parecer robô de vendas, no seu tom, com as regras da conversa pública (todo mundo lê a resposta, não só quem perguntou). Substitui tempo de digitação por consistência. Use uma vez por produto e responda em minutos, não horas.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto e onde está o link (vitrine, carrinho do vídeo)\n• Comentários de venda que você já recebe (cole exemplos reais)\n• Seu tom\n• Fatos confirmados (preço atual, prazo, variações)","c":"Atue como um especialista em conversão por comentários no social commerce. Premissa: o comentário é público — cada resposta é lida por dezenas de pessoas indecisas, não só por quem perguntou. Responder bem UM comentário vende para a audiência inteira.\n\nRegras:\n- Toda resposta no MEU tom, em fala natural — proibido resposta-template com cara de robô (\"Olá! Agradecemos o contato 😊\").\n- Fatos (preço, prazo, medida) apenas os que eu confirmar; se o fato muda com o tempo (preço), a resposta aponta para onde ver o valor atual em vez de cravar número.\n- Nunca prometer resultado garantido nem inventar urgência.\n- Respostas curtas: 1 a 3 linhas. Comentário não é e-mail.\n\nCONTEXTO:\n- Produto e onde está o link: [PRODUTO + VITRINE/CARRINHO]\n- Comentários reais que recebo: [COLE EXEMPLOS]\n- Meu tom: [DESCREVA]\n- Fatos confirmados: [PREÇO ATUAL, VARIAÇÕES, O QUE MAIS ESTIVER CONFIRMADO]\n\nEntregue o manual com respostas prontas (2 variações cada, para eu alternar) para os 8 tipos de comentário de venda:\n\n1. \"ONDE COMPRA?\" — resposta que direciona ao link + 1 micro-argumento (não só \"na vitrine\").\n2. \"QUAL O PREÇO?\" — direcionamento ao valor atual na vitrine + ancoragem honesta se houver fato (\"na faixa de X quando comprei
