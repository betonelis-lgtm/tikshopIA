riais que prendem e o que destacar da embalagem ao primeiro uso. Unboxing sem plano vira \"abri uma caixa\" — este prompt cria a curva de curiosidade. Use quando o produto chegar.","q":"Criadores de conteúdo • Afiliados • Iniciantes","i":":**\n• Produto\n• O que vem na caixa (itens, acessórios)\n• O que te surpreendeu (positiva ou negativamente) ao abrir\n• Público","c":"Atue como um diretor de conteúdo especializado em vídeos de unboxing para social commerce. Seu princípio: unboxing é uma narrativa de EXPECTATIVA → REVELAÇÃO → VEREDITO, não uma abertura de caixa.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- O que vem na caixa: [LISTE TODOS OS ITENS]\n- O que me surpreendeu ao abrir (bom ou ruim): [DESCREVA]\n- Público: [PÚBLICO]\n\nEntregue no seguinte formato:\n\n1. A PERGUNTA DO VÍDEO\nTodo unboxing que retém responde a uma pergunta implícita (ex.: \"isso vale mesmo R$ X?\", \"é tão pequeno quanto parece?\", \"veio tudo o que prometem?\"). Defina a melhor pergunta para ESTE produto e público.\n\n2. ORDEM DAS REVELAÇÕES\nSequência dos itens da caixa, do menos ao mais interessante, com o item-surpresa posicionado estrategicamente. Para cada item: 1 frase do que destacar.\n\n3. MOMENTOS SENSORIAIS\n4 detalhes de textura, som, peso ou encaixe que valem close (som do velcro, peso na mão, clique do encaixe) — especifique quais deste produto.\n\n4. GANCHO DE ABERTURA\n3 opções de abertura que criam a expectativa da \"pergunta do vídeo\" nos primeiros 3 segundos (ex.: mostrar o preço antes de abrir; mostrar a caixa amassada; ler uma avaliação duvidosa antes de abrir).\n\n5. VEREDITO DE FECHAMENTO\nComo fechar respondendo a pergunta do vídeo com honestidade — incluindo o que fazer se a resposta for \"mais ou menos\" (isso também retém e gera comentários).\n\n6. CHECKLIST DE FILMAGEM\nO que capturar ANTES de abrir a caixa (não dá para reabrir!): lista objetiva de planos e closes.\n\nBaseie-se apenas nos itens e impressões que informei. Não invente conteúdo da caixa.","e":"de preenchimento:**\n• Produto: kit organizador de maquiagem acrílico\n• Na caixa: 3 bandejas, divisórias avulsas, flanela, manual\n• Surpresa: acrílico mais grosso que esperava; veio com película protetora chata de tirar\n• Público: mulheres que têm maquiagem espalhada","u":"1. Rode o prompt ANTES de abrir a caixa se possível (preencha \"o que vem\" pela descrição do anúncio) — a seção 6 evita perder cenas irrecuperáveis. Depois de abrir, rode de novo com as impressões reais.\n2. Grave a abertura inteira sem cortes; edite depois.\n3. Leve para o Prompt #061 (Roteiro de Unboxing) para as falas e tempos.\n4. A \"pergunta do vídeo\" vira o texto de capa e a primeira linha da legenda.","p":"ChatGPT"},{"n":"027","t":"Problema → Solução","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Desenvolver o conceito do formato mais clássico da venda por vídeo: encenar a dor de forma reconhecível, agitá-la e revelar o produto como saída. O prompt gera 5 encenações diferentes do problema — porque a força deste formato está na cena do problema, não na do produto. Use com produtos que resolvem dor concreta.","q":"Afiliados • Criadores de conteúdo • Criadores faceless • Vendedores","i":":**\n• Produto\n• Ranking de dores (Prompt #007)\n• Público\n• Formato","c":"Atue como um roteirista-conceitual especializado no formato problema→solução para vídeo curto. Seu princípio: o espectador só valoriza a solução na medida em que SENTIU o problema. A cena do problema é 70% do trabalho.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Dores mapeadas (em ordem de força): [COLE O RANKING DE DORES]\n- Público: [PÚBLICO]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue no seguinte formato:\n\n1. CINCO ENCENAÇÕES DO PROBLEMA\nPara as dores mais fortes, crie 5 cenas de abertura DIFERENTES que encenam o problema de forma visual e imediata (o espectador reconhece a situação em 2 segundos, sem explicação). Para cada uma:\n- Descrição da cena (o que aparece no quadro)\n- Por que o público se reconhece nela\n- Nível de drama: REALISTA (dia a dia cru) ou EXAGERADO-CÔMICO (caricatura proposital) — varie entre as 5\n\n2. LINHA DE AGITAÇÃO\nPara cada encenação, 1 frase falada ou em texto de tela que aprofunda a dor antes da solução (ex.: consequência, frequência, custo acumulado). Sem catastrofismo falso: a agitação deve ser verdadeira.\n\n3. A VIRADA\nDefina o momento de transição problema→produto: a regra é revelar o produto JÁ RESOLVENDO (em ação), nunca parado. Descreva a cena de virada para cada encenação em 1 frase.\n\n4. PROVA RÁPIDA\nQue evidência visual de 2–3 segundos confirma que o problema morreu? (ligação direta com a cena do problema: se abriu com pia entupida de louça, fecha com a pia vazia).\n\n5. RANKING DE TESTE\nOrdene as 5 encenações por potencial de identificação imediata, justificando em 1 frase. As 2 primeiras viram vídeos de teste.\n\nNão atribua ao produto capacidade de resolver dores que ele não resolve pela função informada.","e":"de preenchimento:**\n• Produto: suporte de panela de vidro para tampa\n• Dores: \"tampa suja o balcão inteiro\", \"não tenho onde apoiar a colher\", \"cozinha pequena, sem espaço\"\n• Público: quem cozinha todo dia em cozinha pequena\n• Formato: sem rosto","u":"1. Grave a cena do problema com o mesmo capricho da cena do produto — é ela que segura a retenção.\n2. Teste uma encenação REALISTA e uma EXAGERADA-CÔMICA do mesmo produto: públicos reagem diferente, e você aprende qual é o seu.\n3. Leve a encenação escolhida para o Prompt #063 (Roteiro Problema → Solução).\n4. As \"linhas de agitação\" também funcionam como hooks — guarde-as para o Módulo 4.","p":"ChatGPT"},{"n":"028","t":"Antes e Depois","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Planejar um contraste antes/depois forte e honesto: o que registrar no \"antes\", como maximizar o contraste visual sem falsificar, e o checklist para capturar os dois momentos de forma comparável. Use com produtos de transformação visível (limpeza, organização, beleza, reparo).","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\n• Produto\n• Que transformação real ele produz (e em quanto tempo)\n• Onde você vai aplicar (situação real disponível)\n• Público","c":"Atue como um diretor de conteúdo especializado em vídeos de transformação (antes/depois) para social commerce.\n\nRegra inegociável: o antes e o depois devem ser REAIS e do MESMO objeto/situação, sem truques de edição, iluminação enganosa ou resultados encenados. Transformação falsa é fraude contra o espectador — e morre nos comentários.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Transformação real que ele produz: [DESCREVA O QUE MUDA E EM QUANTO TEMPO]\n- Situação real onde vou aplicar: [DESCREVA — ex.: fogão com gordura de 2 semanas]\n- Público: [PÚBLICO]\n\nEntregue no seguinte formato:\n\n1. O CONTRASTE CENTRAL\nDefina em 1 frase qual é o contraste que o vídeo entrega (sujo→limpo, caos→ordem, opaco→brilhante, 20min→2min). Se a transformação real for fraca para vídeo, diga isso e sugira uma situação de aplicação mais expressiva (real, não forjada).\n\n2. COMO REGISTRAR O \"ANTES\"\nChecklist do antes: mesmos ângulos que serão usados no depois, iluminação comparável, detalhe em close do pior ponto, contexto que prova que é real (ambiente ao redor). Especifique para a minha situação.\n\n3. A TRANSIÇÃO\n3 formas de transição adequadas a vídeo curto (corte seco no match cut, passagem do produto pela tela, timelapse do processo), indicando a melhor para meu caso e por quê. O processo deve aparecer pelo menos parcialmente — depois sem processo parece truque.\n\n4. COMO REGISTRAR O \"DEPOIS\"\nChecklist espelhado do antes (mesmos ângulos e closes), mais 1 plano de \"prova de vida\" (ex.: passar o dedo, luz rasante, uso real do espaço).\n\n5. HONESTIDADE QUE FORTALECE\nIndique o que mostrar mesmo não sendo perfeito (ex.: mancha que não saiu 100%, esforço necessário) e como isso AUMENTA a conversão em vez de diminuir.\n\n6. TRÊS VARIAÇÕES\n3 situações diferentes para repetir o formato com o mesmo produto em vídeos futuros.","e":"de preenchimento:**\n• Produto: pasta multiuso de limpeza\n• Transformação: remove gordura queimada em ~3 min de esfregação\n• Situação: grelha do fogão com gordura acumulada\n• Público: quem cuida da casa e odeia esfregar","u":"1. Leia a seção 2 ANTES de limpar/organizar qualquer coisa — o erro clássico é resolver o problema e só então lembrar de filmar o antes.\n2. Grave antes e depois no mesmo horário do dia (luz comparável).\n3. Leve para o Módulo 5 para transformar em roteiro; o contraste central vira o hook.\n4. Guarde os registros brutos: servem para variações futuras (Prompt #117).","p":"Multiplataforma"},{"n":"029","t":"Comparativo","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Estruturar um comparativo justo e útil: produto vs. método antigo, vs. alternativa genérica ou vs. faixa de preço diferente — com eixos de comparação claros e sem depreciar marcas alheias. Use quando o público tem uma alternativa óbvia em mente (\"por que não continuar usando X?\").","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto\n• Contra o que comparar (método antigo / alternativa genérica / versão mais cara ou barata)\n• O que você verificou de cada lado\n• Público","c":"Atue como um especialista em conteúdo comparativo para social commerce.\n\nRegras obrigatórias:\n- Compare com MÉTODOS ou CATEGORIAS (\"o jeito tradicional\", \"modelos comuns de tomada\"), não com marcas nomeadas de terceiros — depreciar marca alheia gera risco legal e de plataforma.\n- O comparativo deve ser JUSTO: a alternativa vence em pelo menos 1 critério, ou o vídeo vira propaganda sem credibilidade.\n- Só use nos critérios o que eu informei ter verificado. Não invente medições.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Comparar contra: [MÉTODO ANTIGO / ALTERNATIVA GENÉRICA / OUTRA FAIXA DE PREÇO — descreva]\n- O que verifiquei de cada lado: [FATOS QUE VOCÊ OBSERVOU/TESTOU DOS DOIS LADOS]\n- Público: [PÚBLICO]\n\nEntregue no seguinte formato:\n\n1. EIXOS DE COMPARAÇÃO\n4 a 6 critérios relevantes para o público (tempo, esforço, custo total, resultado, durabilidade, praticidade), com o vencedor de cada eixo BASEADO no que verifiquei — inclua os eixos onde a alternativa ganha.\n\n2. PLACAR HONESTO\nTabela: Critério | Produto | Alternativa | Vencedor | Evidência visual possível (o que mostrar na tela para provar).\n\n3. A CONCLUSÃO CERTA\nFormule o veredito no formato \"depende de você\": para quem o produto compensa e para quem a alternativa continua sendo a melhor escolha. (Essa honestidade é o que faz o comparativo converter quem realmente é o público.)\n\n4. ESTRUTURA VISUAL\nComo filmar a comparação lado a lado: tela dividida, alternância A/B com mesmo enquadramento, ou disputa cronometrada — indique a melhor para meu caso.\n\n5. RISCO DE COMENTÁRIOS\nAntecipe as 3 contestações mais prováveis nos comentários e como o próprio vídeo pode preveni-las.","e":"de preenchimento:**\n• Produto: escova de limpeza elétrica\n• Contra: escova manual comum\n• Verifiquei: elétrica limpou rejunte em metade do tempo; manual é mais barata e não depende de carga; elétrica pesa mais no braço após 10 min\n• Público: quem faz faxina pesada","u":"1. Teste os DOIS lados de verdade antes de rodar o prompt — comparativo de um lado só é perceptível.\n2. Filme a disputa em condições idênticas (mesma sujeira, mesmo tempo).\n3. Leve para o Prompt #064 (Roteiro Comparativo).\n4. As \"contestações prováveis\" alimentam o Prompt #077 (Quebrador de Objeções).","p":"ChatGPT"},{"n":"030","t":"Conteúdo Educativo","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Criar conteúdo que ensina algo útil de verdade — e no qual o produto entra como ferramenta natural da solução, não como anúncio enxertado. É o formato que constrói autoridade e seguidores, e o melhor caminho para produtos de baixo apelo visual. Use como pilar de valor do seu plano de conteúdo.","q":"Criadores de conteúdo • Afiliados • Criadores faceless","i":":**\n• Nicho e produto\n• O que você sabe ensinar sobre o tema (conhecimento real)\n• Público e nível de conhecimento dele\n• Formato","c":"Atue como um estrategista de conteúdo educativo para social commerce. Seu princípio: o vídeo precisa ser útil MESMO para quem nunca vai comprar — é isso que o algoritmo distribui e que constrói confiança. O produto entra como ferramenta da lição, nunca como o assunto.\n\nCONTEXTO:\n- Nicho: [NICHO]\n- Produto: [PRODUTO]\n- O que eu realmente sei ensinar sobre o tema: [DESCREVA SEU CONHECIMENTO REAL]\n- Público e nível dele: [EX.: iniciantes totais / já entendem o básico]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nRegras:\n- Baseie as lições no conhecimento que informei. Se sugerir algum fato ou técnica além disso, sinalize com [VERIFICAR] para eu confirmar antes de publicar — não posso ensinar errado.\n- O produto deve aparecer em no máximo 20–30% do vídeo, como ferramenta do passo em que é útil.\n\nEntregue no seguinte formato:\n\n1. DEZ TEMAS EDUCATIVOS\n10 ideias de micro-aulas de até 60 segundos, cada uma com: título-curiosidade, a lição central (1 frase), e o momento exato em que o produto entra naturalmente (ou \"não entra neste\" — está permitido e é saudável).\n\n2. ESTRUTURA DA MICRO-AULA\nO esqueleto padrão: promessa da lição (3s) → erro comum (5–10s) → o jeito certo em passos (20–35s) → onde a ferramenta ajuda (5–10s) → recapitulação de 1 frase + CTA suave.\n\n3. O ERRO COMO GANCHO\nPara os 3 melhores temas, formule a abertura no formato \"o erro que quase todo mundo comete\" — o gancho educativo de maior retenção.\n\n4. ESCADA DE PROFUNDIDADE\nOrganize os 10 temas em ordem de nível (básico → avançado) para publicar como trilha, criando motivo para seguir o perfil.\n\n5. TESTE DE UTILIDADE\nUma pergunta-filtro para eu aplicar antes de publicar cada vídeo: \"se eu cortar o produto deste vídeo, ele continua valendo a pena assistir?\" Se não, o vídeo é anúncio disfarçado — refazer.","e":"de preenchimento:**\n• Nicho: plantas em apartamento\n• Produto: kit de irrigação automática\n• Sei ensinar: rega correta por tipo de planta, sinais de excesso de água, luz por cômodo\n• Público: iniciantes que matam plantas sem entender por quê\n• Formato: sem rosto","u":"1. Só liste em \"o que sei ensinar\" aquilo que você domina — a IA vai construir em cima, e erro técnico publicado destrói autoridade.\n2. Confirme todo item marcado [VERIFICAR] antes de gravar.\n3. Publique seguindo a \"escada de profundidade\": ela transforma espectador em seguidor.\n4. Aplique o \"teste de utilidade\" religiosamente — é o que separa este pilar do pilar de produto.","p":"Claude"},{"n":"031","t":"Storytelling","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Transformar suas experiências reais em histórias curtas que carregam o produto: a jornada, o erro, a descoberta, a virada. O prompt minera as suas vivências — não inventa histórias — porque história fabricada quebra na primeira pergunta dos comentários. Use para criar conexão e diferenciar seu perfil.","q":"Criadores de conteúdo • Afiliados • Iniciantes","i":":**\n• Produto\n• Suas experiências reais relacionadas ao problema que o produto resolve\n• Público\n• Formato","c":"Atue como um consultor de storytelling para vídeo curto de social commerce.\n\nRegra central: as histórias devem ser construídas a partir das experiências REAIS que vou relatar. Você pode lapidar, estruturar e cortar — mas não pode inventar fatos, dramas ou resultados que eu não vivi. Autenticidade é o ativo deste formato.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Minhas experiências reais com o problema que ele resolve: [CONTE COM DETALHES: situações, frustrações, momentos específicos, o que mudou]\n- Público: [PÚBLICO]\n- Formato: [COM ROSTO / SEM ROSTO — se sem rosto, a história será narrada sobre imagens]\n\nEntregue no seguinte formato:\n\n1. MINERAÇÃO\nDo meu relato, extraia de 3 a 5 \"veios de história\": momentos específicos com potencial narrativo (um detalhe concreto vale mais que um resumo — \"a visita chegou e a pia estava daquele jeito\" > \"eu tinha problemas com louça\").\n\n2. TRÊS HISTÓRIAS ESTRUTURADAS\nEscolha os 3 melhores veios e estruture cada um em arco de 30–60 segundos:\n- ABERTURA IN MEDIA RES (começar no meio da cena crítica, nunca em \"deixa eu te contar\")\n- CONTEXTO MÍNIMO (1–2 frases)\n- PONTO BAIXO ou VIRADA\n- ONDE O PRODUTO ENTRA (como coadjuvante da virada, não como herói mágico)\n- FECHAMENTO com a mudança concreta + gancho de identificação (\"se você também...\")\n\n3. DETALHES QUE DÃO VERDADE\nPara cada história, aponte 2 detalhes específicos do MEU relato que devem ser mantidos na narração — são eles que fazem soar real.\n\n4. TÍTULO-GANCHO\nPara cada história, 2 opções de primeira frase que criam curiosidade sem clickbait mentiroso.\n\n5. ALERTA DE TOM\nIndique, para o meu caso, o risco de tom a evitar (dramatização excessiva, autopiedade, final \"vendedor demais\") e como calibrar.\n\nSe meu relato for vago demais para extrair cenas concretas, faça-me 3 perguntas para aprofundar antes de estruturar.","e":"de preenchimento:**\n• Produto: organizador de armário modular\n• Experiências: \"mudei de apartamento e vivi 2 meses com roupa em caixas; atrasei para uma entrevista porque não achava a camisa; comprei o organizador por impulso às 2h da manhã; hoje acho tudo em segundos\"\n• Público: quem mora em imóvel pequeno\n• Formato: com rosto","u":"1. Escreva suas experiências como quem conta para um amigo — detalhes bobos incluídos. É deles que saem as melhores cenas.\n2. Grave contando a história, não lendo — use a estrutura como mapa, não como script decorado.\n3. Leve para o Prompt #062 (Roteiro de Storytelling) se quiser o texto cena a cena.\n4. Histórias boas aguentam repostagem em ângulos diferentes: mesma história, foco em outro detalhe.","p":"Claude"},{"n":"032","t":"Conteúdo de Curiosidade","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Criar vídeos de fatos e curiosidades ligados à categoria do produto (\"você sabia que...\") — o formato de alcance amplo que atrai público frio. Com trava de segurança: a IA só pode propor curiosidades verificáveis e deve marcar tudo para checagem, porque curiosidade falsa viralizando é desastre de credibilidade. Use como conteúdo de topo de funil.","q":"Criadores faceless • Criadores de conteúdo • Afiliados","i":":**\n• Nicho e produto\n• Público\n• Curiosidades que você já conhece do tema (opcional)","c":"Atue como um pesquisador de curiosidades para conteúdo de vídeo curto, com compromisso absoluto com a veracidade.\n\nRegras obrigatórias:\n- Proponha apenas curiosidades de conhecimento geral estabelecido e verificável. NADA de estatísticas precisas inventadas, \"estudos mostram\" sem fonte, ou números que você não pode sustentar.\n- Marque TODA curiosidade com [CHECAR ANTES DE PUBLICAR] — eu vou verificar cada uma em fonte confiável antes de gravar.\n- Se não houver curiosidades sólidas suficientes no tema, diga isso em vez de inventar.\n\nCONTEXTO:\n- Nicho: [NICHO]\n- Produto: [PRODUTO]\n- Público: [PÚBLICO]\n- Curiosidades que eu já sei sobre o tema: [OPCIONAL]\n\nEntregue no seguinte formato:\n\n1. DEZ CURIOSIDADES CANDIDATAS\nPara cada uma: a curiosidade em 1–2 frases [CHECAR ANTES DE PUBLICAR], por que surpreende esse público, e onde eu provavelmente consigo verificar (tipo de fonte: enciclopédia, órgão oficial, manual do fabricante, teste que eu mesmo posso fazer).\n\n2. PONTE PARA O PRODUTO\nPara as 5 melhores: como conectar a curiosidade ao produto SEM forçar (a conexão deve ser consequência natural — \"e é por isso que existe...\"). Se a ponte ficar forçada, recomende publicar sem produto, como conteúdo de valor puro.\n\n3. FORMATO DE APRESENTAÇÃO\nO esqueleto do vídeo de curiosidade: pergunta-gancho (3s) → tensão/palpite errado comum (5s) → revelação (10s) → demonstração ou prova visual quando possível (10–15s) → ponte/CTA.\n\n4. CURIOSIDADE TESTÁVEL\nDestaque quais das 10 eu posso PROVAR em vídeo com um teste caseiro (as mais valiosas — prova visual própria não depende de fonte externa e rende mais retenção).\n\n5. LIXEIRA\nListe 3 tipos de \"curiosidade\" comuns neste nicho que circulam mas são mito ou não-verificáveis, para eu nunca usar.","e":"de preenchimento:**\n• Nicho: cozinha\n• Produto: afiador de facas rolante\n• Público: quem cozinha em casa\n• Já sei: faca cega causa mais acidentes que faca afiada","u":"1. Verifique cada curiosidade antes de gravar — sem exceção. Uma curiosidade falsa desmontada nos comentários mancha o perfil inteiro.\n2. Priorize as \"curiosidades testáveis\": prova própria em vídeo vale mais que citação.\n3. Publique parte sem produto (valor puro) — o formato serve para alcance, não só conversão.\n4. Combine com os Hooks de Curiosidade (Prompt #040).","p":"ChatGPT"},{"n":"033","t":"Vídeo de Reação","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Planejar vídeos de reação segura: reagir a comentários do seu próprio perfil, a avaliações públicas do produto, a mitos do nicho ou ao seu próprio conteúdo antigo — sem usar vídeo de terceiros sem autorização (risco de direitos autorais e de remoção). Use para gerar conversa e responder o público em escala.","q":"Criadores de conteúdo • Afiliados • Vendedores","i":":**\n• Produto\n• Material de reação disponível (comentários recebidos, avaliações do produto, mitos que circulam no nicho)\n• Público\n• Formato","c":"Atue como um estrategista de conteúdo de reação para social commerce.\n\nRegra de segurança obrigatória: NÃO proponha reagir a vídeos de outros criadores sem autorização — uso de conteúdo alheio pode violar direitos autorais e regras da plataforma. Trabalhe apenas com: comentários e perguntas do MEU público, avaliações públicas do produto, mitos e frases genéricas do nicho, e meu próprio conteúdo antigo.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Material disponível: [COLE COMENTÁRIOS RECEBIDOS, AVALIAÇÕES DO PRODUTO E/OU MITOS COMUNS DO NICHO]\n- Público: [PÚBLICO]\n- Formato: [COM ROSTO / SEM ROSTO — sem rosto: reação por voz + texto na tela]\n\nEntregue no seguinte formato:\n\n1. SELEÇÃO DO MATERIAL\nDo que forneci, escolha os 6 itens com maior potencial de reação, classificando cada um: CÉTICO (duvida do produto), CURIOSO (pergunta legítima), MITO (crença errada do nicho) ou ELOGIO-PROVA (relato positivo que merece destaque).\n\n2. SEIS CONCEITOS DE REAÇÃO\nPara cada item: como abrir (mostrar o comentário/avaliação na tela), a linha de reação (concordar, demonstrar na prática, corrigir com respeito, ou testar ao vivo) e o desfecho. Regra de tom: nunca ridicularizar quem comentou — o cético de hoje é o comprador de amanhã, e o público julga como você trata as pessoas.\n\n3. REAÇÃO-DEMONSTRAÇÃO\nIdentifique qual dos 6 permite responder com PROVA VISUAL em vez de argumento (ex.: \"duvido que isso aguente peso\" → vídeo pendurando peso). É o subformato mais forte: priorize-o.\n\n4. GERADOR DE CICLO\nComo fechar cada vídeo convidando novas dúvidas/desafios nos comentários — transformando reação em série contínua alimentada pelo próprio público.\n\n5. LIMITES\n2 tipos de comentário que NÃO merecem vídeo de reação (e por quê), para eu não dar palco ao que não ajuda.","e":"de preenchimento:**\n• Produto: suporte veicular magnético\n• Material: \"isso arranha o celular?\", \"ímã estraga a bateria\" (mito), \"caiu na primeira lombada\" (avaliação negativa), \"uso há 6 meses e nunca caiu\"\n• Público: motoristas de app\n• Formato: sem rosto","u":"1. Colete material real: print de comentários seus e avaliações públicas do produto.\n2. Comece pela \"reação-demonstração\" — é a de maior conversão.\n3. Responder ceticismo com respeito + prova é também quebra de objeção: alimente o Prompt #077 com o que descobrir.\n4. Use o \"gerador de ciclo\" para nunca mais ficar sem pauta: o público passa a produzir a sua.","p":"Multiplataforma"},{"n":"034","t":"Vídeo de Teste","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Desenhar experimentos que viram conteúdo: \"testei por 7 dias\", \"levei ao limite\", \"testei o que dizem as avaliações\". O prompt cria o protocolo do teste (o que medir, como registrar) e a narrativa (expectativa → processo → veredito). É o formato de maior credibilidade — porque tem custo real. Use quando puder dedicar tempo de uso ao produto.","q":"Criadores de conteúdo • Afiliados • Vendedores","i":":**\n• Produto e o que ele promete\n• Tempo/recursos disponíveis para o teste\n• Dúvidas que o público tem (comentários, avaliações)\n• Formato","c":"Atue como um designer de experimentos de conteúdo: sua função é transformar promessas de produto em TESTES documentáveis em vídeo.\n\nRegra: o teste deve ser executado de verdade e o resultado publicado seja qual for — inclusive se o produto decepcionar em algo. Veredito comprado não é teste. Prever o desfecho não é permitido: você desenha o protocolo, o resultado quem dá é a realidade.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- O que ele promete (embalagem/anúncio): [LISTE AS PROMESSAS]\n- Tempo e recursos que tenho para testar: [EX.: 7 dias, uso diário]\n- Dúvidas do público que quero responder: [COLE COMENTÁRIOS/AVALIAÇÕES]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue no seguinte formato:\n\n1. CINCO TESTES POSSÍVEIS\nPara cada um: nome-título do teste (chamativo e honesto), a promessa/dúvida que ele verifica, o protocolo em 3–5 passos (condições, duração, o que caracteriza sucesso/fracasso ANTES de começar), e o que registrar em vídeo a cada etapa.\n\n2. RANKING\nOrdene os 5 por: força da dúvida no público × viabilidade com meus recursos × potencial visual do resultado. Recomende por qual começar.\n\n3. NARRATIVA DO TESTE\nEstrutura do vídeo (ou minissérie): declaração do teste e critério de sucesso (5s) → registro do processo com marcos de tempo (dia 1, dia 3...) → momento de verificação na câmera → veredito honesto → para quem vale/não vale.\n\n4. REGISTRO DIÁRIO\nMini-checklist do que filmar/anotar por dia de teste, para o material de edição não faltar no final.\n\n5. PLANO PARA VEREDITO NEGATIVO\nSe o produto falhar no teste: como publicar o resultado de forma justa (contexto, possível mau uso, comparação com expectativa) e por que publicar mesmo assim fortalece o perfil. Incluir: nesse caso, não recomendo a compra — e não fingir o contrário.","e":"de preenchimento:**\n• Produto: garrafa térmica\n• Promete: 24h gelado, 12h quente\n• Tenho: 3 dias, termômetro de cozinha\n• Dúvidas: \"gela mesmo 24h?\", \"aguenta cair?\"\n• Formato: sem rosto","u":"1. Defina o critério de sucesso ANTES de começar (o prompt exige) — é isso que torna o teste crível.\n2. Filme o registro diário mesmo achando repetitivo: os marcos de tempo são a prova.\n3. Um teste de 7 dias rende minissérie (combine com o Prompt #037) + vídeo-resumo.\n4. Veredito honesto negativo custa uma comissão e compra credibilidade para todas as próximas — faça a conta.","p":"ChatGPT"},{"n":"035","t":"Criador de UGC","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Criar conceitos de UGC (conteúdo estilo consumidor real): vídeos que parecem recomendação espontânea de uma pessoa comum, não produção de marca — com o checklist de autenticidade que define o formato (imperfeição controlada, POV, linguagem falada). Use para gerar o estilo de vídeo que mais se mistura ao feed.","q":"Criadores de conteúdo • Afiliados • Iniciantes","i":":**\n• Produto\n• Sua experiência real com ele\n• Público\n• Cenários reais que você tem disponíveis (sua casa, carro, rotina)","c":"Atue como um diretor de UGC (user-generated content) para social commerce. UGC funciona por um motivo: parece uma pessoa real contando para uma amiga, não um anúncio. Sua tarefa é criar conceitos que preservem essa textura.\n\nRegra de honestidade: o UGC deve nascer da minha experiência real com o produto. Recomendação encenada sem uso real é enganosa — e soa falsa na entrega.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Minha experiência real: [COMO USO, O QUE MUDOU, DETALHES]\n- Público: [PÚBLICO]\n- Cenários reais disponíveis: [EX.: minha cozinha, meu carro, minha mesa de trabalho]\n\nEntregue no seguinte formato:\n\n1. CINCO CONCEITOS UGC\nPara cada um: a situação (onde estou, o que estava fazendo quando \"resolvi contar\"), o pretexto da fala (ex.: respondendo uma amiga, mostrando o que chegou, flagra da rotina), a linha-mestra do que digo (baseada na minha experiência), e o cenário real usado.\n\n2. CHECKLIST DE AUTENTICIDADE\n10 marcadores do estilo UGC a manter: câmera na mão ou apoiada improvisada, luz natural, fala espontânea com \"erros\" naturais, ambiente vivido (não arrumado demais), close no produto segurando com a mão, tom de conversa e não de locução, etc. Adapte ao meu caso.\n\n3. O QUE MATA O UGC\n5 sinais de \"anúncio\" que devo evitar: iluminação perfeita, texto decorado, jargão de vendedor, elogio sem ressalva, edição polida demais.\n\n4. FALA-BASE (NÃO DECORAR)\nPara os 2 melhores conceitos: um esqueleto de fala em 4 bullets (contexto → problema que eu tinha → o que mudou → detalhe específico + onde encontrar), para eu falar com minhas palavras por cima.\n\n5. VARIAÇÃO POV\n1 versão de cada conceito em POV puro (câmera como meus olhos, sem rosto) — para eu testar UGC também no formato faceless.","e":"de preenchimento:**\n• Produto: chaleira elétrica com temperatura\n• Experiência: uso todo dia para café passado; acabou o café queimado; detalhe: apito me irritava na antiga\n• Público: quem faz café em casa\n• Cenários: minha cozinha pequena, home office","u":"1. Grave a fala SEM decorar — leia os 4 bullets, largue o papel, fale. Errar palavra e se corrigir é feature, não bug.\n2. Use o checklist da seção 2 como conferência antes de gravar; o da seção 3, antes de publicar.\n3. UGC combina com os Hooks para UGC (Prompt #048) e o Roteiro UGC (Prompt #058).\n4. Para a versão com IA (avatar UGC), veja o Prompt #094 — mas o UGC real é sempre o padrão-ouro.","p":"ChatGPT"},{"n":"036","t":"Conteúdo sem Aparecer","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Gerar conceitos de vídeo executáveis 100% sem rosto para um produto específico: mãos + produto, POV, texto na tela, narração sobre b-roll. Este prompt trabalha a ideação; a produção técnica de cada formato faceless está detalhada no Módulo 9. Use se você não aparece e sente que isso limita suas ideias.","q":"Criadores faceless • Iniciantes • Afiliados","i":":**\n• Produto\n• Recursos (tem o produto em mãos? narra com sua voz? usa voz de IA?)\n• Público e dores\n• O que você já testou em faceless","c":"Atue como um diretor criativo especializado em conteúdo faceless de social commerce. Restrição absoluta: NENHUMA ideia pode exigir rosto humano em cena. Mãos, POV, objetos, texto e voz são os instrumentos.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Recursos: [TENHO O PRODUTO EM MÃOS? NARRO COM MINHA VOZ / VOZ DE IA / SEM VOZ?]\n- Público e dores principais: [COLE]\n- Já testei em faceless: [FORMATOS/IDEIAS JÁ FEITOS ou \"nada ainda\"]\n\nEntregue no seguinte formato:\n\n1. DOZE IDEIAS FACELESS\nDistribua entre os 4 subformatos (3 ideias cada):\n- MÃOS + PRODUTO (demonstração tátil)\n- POV (câmera como olhos do espectador vivendo a situação)\n- TEXTO NA TELA (narrativa escrita sobre cenas do produto)\n- NARRAÇÃO + B-ROLL (voz conduz, imagens ilustram)\nPara cada ideia: o que acontece no vídeo (2 frases), a dor/desejo atacado, e a \"âncora de atenção\" (o elemento visual que substitui a função do rosto de prender o olhar — movimento, transformação, close inusitado).\n\n2. COMPENSANDO A FALTA DO ROSTO\nO rosto humano gera conexão automática; sem ele, a conexão vem de outro lugar. Aponte, para o MEU produto, os 3 substitutos mais fortes (ex.: voz com personalidade, situação ultra-reconhecível, satisfação visual/ASMR do produto em uso).\n\n3. RANKING DE EXECUÇÃO\nOrdene as 12 ideias por facilidade com MEUS recursos e destaque as 3 primeiras a produzir.\n\n4. ARMADILHA DO GENÉRICO\nO maior risco do faceless é parecer qualquer perfil. Aponte 3 escolhas específicas (do Prompt #019, se eu fornecer minha identidade) que devo repetir em TODOS os vídeos para construir reconhecimento sem rosto.","e":"de preenchimento:**\n• Produto: umidificador de ar com LED\n• Recursos: tenho em mãos, narro com minha voz\n• Público: quem trabalha em home office com ar seco\n• Já testei: 2 vídeos de mãos + produto","u":"1. Rode este prompt por produto; a estratégia geral do perfil faceless é o Prompt #019.\n2. Comece pelo subformato mais fácil do ranking e domine um antes de espalhar.\n3. Para produzir cada ideia, use o prompt de produção correspondente no Módulo 9.\n4. Preencha a \"armadilha do genérico\" com seus elementos de identidade e confira a cada publicação.","p":"ChatGPT"},{"n":"037","t":"Criador de Série de Vídeos","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Transformar um produto (ou tema) em uma série episódica — \"testando por 7 dias\", \"1 problema por dia\", \"arrumando a casa cômodo por cômodo\" — com loop de retenção entre episódios que dá motivo para seguir o perfil. Série é a forma mais barata de multiplicar conteúdo: um conceito, muitos vídeos. Use quando encontrar um formato que funcionou.","q":"Criadores de conteúdo • Criadores faceless • Afiliados","i":":**\n• Produto ou tema da série\n• Um vídeo/conceito que já funcionou (se houver)\n• Público\n• Capacidade de produção semanal","c":"Atue como um showrunner de séries de vídeo curto para social commerce. Sua especialidade: transformar um conceito em episódios com continuidade que constrói o hábito de acompanhar o perfil.\n\nCONTEXTO:\n- Produto ou tema: [PRODUTO/TEMA]\n- Conceito que já funcionou (se houver): [DESCREVA O VÍDEO E OS SINAIS]\n- Público: [PÚBLICO]\n- Capacidade: [VÍDEOS POR SEMANA]\n\nEntregue no seguinte formato:\n\n1. TRÊS CONCEITOS DE SÉRIE\nPara cada um: nome da série (curto e repetível como bordão), a premissa (1 frase), por que rende múltiplos episódios sem esgotar, e o vínculo com o produto (protagonista da série ou ferramenta recorrente).\n\n2. SÉRIE ESCOLHIDA — ESTRUTURA\nPara o melhor dos 3 conceitos:\n- Lista dos 8 primeiros episódios (título-gancho + o que acontece, 1 frase cada)\n- Ordem estratégica (episódio 1 deve funcionar sozinho para quem nunca viu o perfil)\n- Duração e frequência recomendadas para minha capacidade\n\n3. LOOP DE RETENÇÃO\nOs 3 mecanismos de continuidade da série: abertura-padrão que situa novatos em 2 segundos (\"dia 4 testando...\"), gancho de próximo episódio no fechamento, e elemento recorrente que o público espera (quadro fixo, frase, ritual).\n\n4. EPISÓDIO CORINGA\n1 formato de episódio alimentado pelo público (responder comentário da série, votação do próximo teste) — para a série se sustentar sozinha.\n\n5. CRITÉRIO DE ENCERRAMENTO\nComo saber quando a série deve terminar ou virar temporada nova (sinais de fadiga), e como encerrar convertendo a audiência da série em seguidores do próximo projeto.","e":"de preenchimento:**\n• Produto: kit de organização de cozinha\n• Funcionou: vídeo organizando a gaveta de tampas teve retenção alta e comentários pedindo \"faz a geladeira\"\n• Público: quem quer casa organizada sem tempo\n• Capacidade: 4 vídeos/semana","u":"1. A melhor série nasce de um vídeo que já mostrou sinal — não comece série no escuro se tiver dados.\n2. Grave 2–3 episódios antes de publicar o primeiro: série com buraco de publicação morre.\n3. Use a abertura-padrão IDÊNTICA em todos os episódios — é ela que ensina o público a reconhecer a série.\n4. Comentários pedindo tema (como no exemplo) são o episódio coringa pronto: atenda-os visivelmente.","p":"ChatGPT"},{"n":"038","t":"Conteúdo de Lista (\"Top 5\")","m":3,"mn":"CRIANDO CONTEÚDO QUE VENDE","o":"Criar vídeos de lista e ranking — \"5 coisas que eu não sabia que precisava\", \"3 erros ao comprar X\", \"do pior ao melhor\" — com a decisão estratégica de ONDE o seu produto entra na lista (spoiler: quase nunca em primeiro, e nunca sozinho). Formato de alta retenção pela estrutura de contagem. Use para apresentar o produto em contexto, com menos cara de anúncio.","q":"Afiliados • Criadores faceless • Criadores de conteúdo","i":":**\n• Produto principal\n• Outros itens que você conhece/possui para compor a lista\n• Público\n• Formato","c":"Atue como um roteirista-conceitual especializado em vídeos de lista para social commerce.\n\nPor que listas retêm: a contagem cria compromisso (\"já vi 2 de 5, vou até o fim\") e cada item renova a atenção. Sua tarefa é usar essa mecânica com honestidade: só entram na lista itens que eu realmente conheço ou possuo.\n\nCONTEXTO:\n- Produto principal (o que tem link na vitrine): [PRODUTO]\n- Outros itens que conheço/possuo para compor listas: [LISTE COM 1 FRASE DE EXPERIÊNCIA SOBRE CADA]\n- Público: [PÚBLICO]\n- Formato: [COM ROSTO / SEM ROSTO]\n\nEntregue no seguinte formato:\n\n1. CINCO CONCEITOS DE LISTA\nVarie os tipos: utilidade (\"5 que facilitam X\"), erro (\"3 erros ao...\"), ranking (\"do menos ao mais útil\"), descoberta (\"coisas que eu não sabia que precisava\"), orçamento (\"o que vale e o que não vale até R$ X\"). Para cada conceito: título-gancho, itens da lista (usando o que informei), e a lógica de ordenação.\n\n2. POSICIONAMENTO DO PRODUTO PRINCIPAL\nPara cada conceito, defina a posição do meu produto na contagem e justifique. Regras: nunca abrir a lista com ele (cara de anúncio); posições fortes são a penúltima e a última (\"guardei o melhor\"); em listas de erro, ele entra como a solução de UM erro, não de todos.\n\n3. RITMO DA CONTAGEM\nEstrutura de tempo por item (3–8s cada), com a regra do \"item polêmico\": incluir 1 item discutível de propósito, em posição intermediária, para gerar comentários de discordância — combustível de distribuição.\n\n4. TRANSIÇÕES\n5 fórmulas de passagem entre itens que mantêm o ritmo (\"esse aqui parece bobagem, MAS...\", \"o próximo divide opiniões...\").\n\n5. LISTA REVERSA\n1 versão \"do pior ao melhor\" do melhor conceito — a ordenação de maior retenção, porque o clímax fica no fim. Indique como sinalizar isso no início para o público aguentar a espera.\n\nNão invente experiência com itens que eu não informei conhecer. Se a minha lista de itens for curta demais para um conceito, aponte quantos itens faltam.","e":"de preenchimento:**\n• Produto principal: mini aspirador de mesa\n• Outros itens: organizador de cabos (uso há meses), luminária com clipe (boa, mas esquenta), suporte de notebook (mudou minha postura), mousepad grande (indiferente)\n• Público: quem trabalha em home office\n• Formato: sem rosto","u":"1. Monte seu inventário de itens conhecidos uma vez e reuse em várias listas — é o formato que mais aproveita acervo.\n2. Respeite a regra de posicionamento: lista onde tudo aponta para o seu link é anúncio de 5 itens, e o público sente.\n3. O \"item polêmico\" é para discordância leve (gosto), nunca para informação falsa.\n4. Listas rendem série (Prompt #037): \"top 5 da semana\" é uma das séries mais fáceis de sustentar.","p":"ChatGPT"},{"n":"039","t":"Gerador de 50 Hooks","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Gerar 50 ganchos para um produto, distribuídos em 10 mecanismos diferentes (5 de cada) — o prompt de volume do módulo. O objetivo não é usar os 50: é testar tipos diferentes e descobrir qual mecanismo o SEU público responde. Use ao iniciar o teste de qualquer produto.","q":"Afiliados • Criadores de conteúdo • Iniciantes • Criadores faceless","i":":**\n• Produto\n• Público e dores principais\n• Formato (com ou sem rosto)\n• Tom do perfil","c":"Atue como um especialista em ganchos (hooks) para vídeo curto de social commerce. Gancho, aqui, é a primeira frase falada ou o primeiro texto na tela — a promessa dos 3 primeiros segundos.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Público: [PÚBLICO]\n- Dores/desejos principais: [COLE DO SEU MAPA]\n- Formato: [COM ROSTO / SEM ROSTO]\n- Tom do perfil: [EX.: direto, bem-humorado, técnico]\n\nGere 50 ganchos, sendo 5 de cada mecanismo abaixo. Identifique cada bloco com o nome do mecanismo:\n\n1. CURIOSIDADE (abre uma lacuna de informação e segura a resposta)\n2. PROBLEMA (espelha uma dor que o público reconhece na hora)\n3. TRANSFORMAÇÃO (promete um contraste antes→depois concreto)\n4. BENEFÍCIO (entrega o ganho de forma direta e específica)\n5. DESCOBERTA (posiciona como achado/segredo que estou compartilhando)\n6. PERGUNTA DIRETA (interpela o espectador na segunda pessoa)\n7. POLÊMICA LEVE (opinião discutível que provoca reação — sem mentira, sem ódio)\n8. NÚMERO/ESPECIFICIDADE (dado concreto que gera credibilidade imediata)\n9. NEGAÇÃO/CONTRASTE (\"não compre X antes de...\", \"pare de fazer Y\")\n10. CENA/AÇÃO (descreve o que deve estar acontecendo no quadro no segundo 1 — para o gancho ser visual, não falado)\n\nRegras:\n- Máximo de 12 palavras por gancho (exceto o mecanismo 10, que descreve cena).\n- Nenhum gancho pode prometer o que o produto não faz nem citar dados inventados (números só se forem verificáveis por mim — marque com [CONFIRMAR] qualquer número que você sugerir).\n- Todos devem soar como fala natural do meu tom, não como slogan de propaganda.\n- Se meu formato for SEM ROSTO, todos devem funcionar como texto na tela ou narração.\n\nAo final, entregue:\nGRADE DE TESTE: monte uma tabela sugerindo 5 ganchos (de mecanismos DIFERENTES) para os meus 5 primeiros vídeos de teste, com 1 frase sobre o que cada teste me ensina.","e":"de preenchimento:**\n• Produto: escova secadora\n• Público: mulheres com pouco tempo de manhã\n• Dores: \"acordo 1h mais cedo por causa do cabelo\", \"chapinha resseca\"\n• Formato: com rosto\n• Tom: amiga direta","u":"1. Gere os 50 e marque os 10 que mais soam como você — os outros 40 são estoque.\n2. Siga a \"grade de teste\": 5 vídeos, 5 mecanismos diferentes, mesmo produto.\n3. O mecanismo do vídeo com melhor retenção inicial indica qual prompt especialista deste módulo aprofundar.\n4. Guarde a lista: ganchos não usados servem para variações futuras (Prompt #117).","p":"ChatGPT"},{"n":"040","t":"Hooks de Curiosidade","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos baseados em lacuna de informação: abrir uma pergunta na cabeça do espectador e segurar a resposta o suficiente para ele ficar. É o mecanismo de maior alcance em público frio — e o de maior risco de clickbait. O prompt inclui a trava: a resposta prometida precisa existir no vídeo, cedo.","q":"Criadores de conteúdo • Afiliados • Criadores faceless","i":":**\n• Produto\n• O que o vídeo vai efetivamente mostrar/revelar\n• Público","c":"Atue como um especialista em ganchos de curiosidade para vídeo curto. O mecanismo: criar uma lacuna de informação — o espectador percebe que não sabe algo que quer saber — e prometer o fechamento da lacuna no vídeo.\n\nRegra anti-clickbait: cada gancho só é válido se a resposta existir de verdade no vídeo e chegar em até 15 segundos. Curiosidade sem entrega destrói a retenção e a confiança.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- O que o vídeo vai revelar/mostrar de fato: [DESCREVA A ENTREGA REAL]\n- Público: [PÚBLICO]\n\nGere 15 ganchos de curiosidade usando estas 5 fórmulas (3 de cada), identificando a fórmula:\n\n1. PERGUNTA QUE COÇA: uma pergunta que o público nunca se fez mas quer responder assim que ouve.\n2. METADE DA INFORMAÇÃO: começar a contar e parar no ponto exato (\"o motivo de X é...\" e corta para o vídeo).\n3. RESULTADO SEM CAUSA: mostrar/afirmar o resultado surpreendente antes de explicar como (\"isso aqui não lava há 30 dias — e olha o estado\").\n4. QUEBRA DE EXPECTATIVA: afirmar o oposto do que o público assume (\"o problema não é o que você pensa\").\n5. PROIBIDO ESPIAR: sinalizar que algo vai acontecer no fim (\"espera o resultado do lado direito\").\n\nPara cada gancho, adicione entre parênteses: em que segundo do vídeo a lacuna se fecha (com base na entrega real que informei).\n\nDepois:\nRANKING: os 3 ganchos com melhor relação curiosidade × honestidade da entrega, justificados em 1 frase.\nVERSÃO TEXTO NA TELA: reescreva os 3 do ranking em versão de até 7 palavras para overlay.","e":"de preenchimento:**\n• Produto: limpador de tela em espuma\n• Entrega real: a espuma remove marca de dedo em 1 passada, mostrado aos 6s\n• Público: quem vive com a TV/notebook engordurado","u":"1. Preencha \"a entrega real\" com precisão — é ela que impede o clickbait.\n2. Confira o \"segundo em que a lacuna fecha\": acima de 15s, encurte o vídeo, não o gancho.\n3. Combine com Conteúdo de Curiosidade (Prompt #032): mecanismo igual, formato inteiro.\n4. Teste 2 fórmulas diferentes no mesmo vídeo (A/B) antes de eleger sua favorita.","p":"Multiplataforma"},{"n":"041","t":"Hooks de Problema","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos de reconhecimento de dor: o espectador se vê na primeira frase (\"isso sou eu\") e fica para ver a saída. É o mecanismo que mais converte — porque filtra exatamente quem tem o problema que o produto resolve. Alimente-o com as dores reais dos Prompts #007 e #011.","q":"Afiliados • Vendedores • Criadores de conteúdo • Criadores faceless","i":":**\n• Produto\n• Ranking de dores (Prompt #007) e frases de clientes (Prompt #011, se tiver)\n• Público","c":"Atue como um copywriter especializado em ganchos de identificação de dor para vídeo curto. O mecanismo: espelhar a experiência do espectador com tanta precisão que ele pensa \"isso sou eu\" antes do segundo 3.\n\nRegra: a precisão vem do CONCRETO. \"Cansada da bagunça\" não espelha ninguém; \"a gaveta que você empurra com o joelho para fechar\" espelha. Use as dores e frases reais que vou fornecer.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Dores mapeadas (em ordem): [COLE O RANKING DO PROMPT #007]\n- Frases reais de clientes (se tiver): [COLE AS \"FRASES DE OURO\" DO PROMPT #011]\n- Público: [PÚBLICO]\n\nGere 15 ganchos de problema usando estas 5 fórmulas (3 de cada), identificando a fórmula:\n\n1. FLAGRANTE: descrever o momento exato da dor em detalhe cênico (\"aquela hora que a sacola rasga no meio da escada\").\n2. SEGUNDA PESSOA: interpelar direto (\"você também finge que não vê o rejunte do banheiro?\").\n3. CONFISSÃO: assumir a dor em primeira pessoa (\"eu escondia a pia quando chegava visita\").\n4. FREQUÊNCIA: expor a repetição da dor (\"terceira vez ESSA SEMANA que isso acontece\").\n5. CUSTO INVISÍVEL: nomear o que a dor rouba sem a pessoa perceber (\"você perde 20 minutos por dia procurando isso\" — números só com base no que eu informar, senão troque por custo qualitativo).\n\nPara cada gancho, indique entre parênteses qual dor da minha lista ele ataca.\n\nDepois:\nPAR PERFEITO: para os 3 melhores ganchos, descreva em 1 frase a imagem que deve estar na tela enquanto o gancho é dito — gancho de dor sem a cena da dor perde metade da força.","e":"de preenchimento:**\n• Produto: organizador de tampas de panela\n• Dores: \"avalanche ao abrir o armário\", \"nunca acho a tampa certa\", \"vergonha do armário aberto na visita\"\n• Frases: \"desisti de fechar direito, só encosto a porta\"\n• Público: quem cozinha todo dia","u":"1. Este prompt é tão bom quanto o mapa de dores que você colar — rode #007 e #011 antes.\n2. Grave a cena da dor descrita no \"par perfeito\" junto com o gancho falado.\n3. Ganchos de confissão funcionam especialmente em UGC (Prompt #048) — cruze os dois.\n4. O gancho que gerar comentários \"sou eu\" em peso indica a dor para centrar a próxima leva de vídeos.","p":"ChatGPT"},{"n":"042","t":"Hooks de Transformação","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos que prometem um contraste antes→depois mensurável: \"de X para Y\", \"em Z minutos\", \"sem W\". O mecanismo é a promessa de delta visível — e só funciona com transformações que o vídeo realmente mostra. Use com produtos de resultado visual (par natural do Prompt #028).","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\n• Produto\n• A transformação REAL que você registrou (o que mudou, em quanto tempo, com quanto esforço)\n• Público","c":"Atue como um copywriter de ganchos de transformação para vídeo curto. O mecanismo: prometer um DELTA concreto (estado A → estado B) que o vídeo prova visualmente.\n\nRegra inegociável: só posso prometer a transformação que EU registrei de verdade. Não infle tempo, resultado ou facilidade. Se a transformação real for modesta, o gancho honesto é o modesto — e você compensa na especificidade.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Transformação real registrada: [O QUE MUDOU, EM QUANTO TEMPO, COM QUANTO ESFORÇO — seja exato]\n- Público: [PÚBLICO]\n\nGere 12 ganchos de transformação usando estas 4 fórmulas (3 de cada), identificando a fórmula:\n\n1. DELTA SECO: estado A → estado B sem enfeite (\"isso era o fogão às 14h. Isso é às 14h10\").\n2. TEMPO COMPRIMIDO: a transformação ancorada na duração real (\"o que 8 minutos fizeram com esse sofá\").\n3. SEM O CUSTO ESPERADO: transformação + negação do sacrifício presumido (\"ficou assim sem esfregar\" — apenas se for verdade no meu registro).\n4. DESAFIO À DESCRENÇA: convidar o ceticismo antes da prova (\"você vai achar que é outro tapete. Não é\").\n\nRegras adicionais:\n- Todo número (minutos, dias, quantidade) deve vir do meu registro; se sugerir outro, marque [CONFIRMAR].\n- Para cada gancho, indique entre parênteses o plano visual dos 2 primeiros segundos (o \"antes\" precisa aparecer imediatamente — gancho de transformação com tela vazia morre).\n\nDepois:\nTESTE DE ENTREGA: para os 3 melhores, confirme em 1 frase que o vídeo consegue provar a promessa com o material que registrei. Se algum não conseguir, descarte-o explicitamente.","e":"de preenchimento:**\n• Produto: pasta de limpeza multiuso\n• Transformação real: grelha com gordura de 2 semanas ficou limpa em 6 min, esfregando leve com esponja\n• Público: quem odeia faxina pesada","u":"1. Registre a transformação ANTES de gerar os ganchos (checklist do Prompt #028) — o gancho nasce do material, não o contrário.\n2. Grave o \"antes\" com o enquadramento indicado nos parênteses.\n3. \"Sem o custo esperado\" é a fórmula que mais converte E a que mais exige honestidade — só use com lastro.\n4. Compare com Hooks de Benefício (#043): transformação promete o contraste; benefício promete o estado final. Teste os dois.","p":"Multiplataforma"},{"n":"043","t":"Hooks de Benefício","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos de promessa direta de ganho: sem mistério, sem antes/depois — o valor na cara (\"seu café quente até o fim do home office\"). O mecanismo é clareza + especificidade; o risco é a genericidade (\"facilite sua vida\" não é gancho). O prompt força concretude em cada frase.","q":"Afiliados • Vendedores • Iniciantes","i":":**\n• Produto\n• Lista de benefícios reais (Prompt #076, se já tiver, ou descreva)\n• Público e contexto de uso","c":"Atue como um copywriter de ganchos de benefício direto para vídeo curto. O mecanismo: entregar o ganho na primeira frase, com tanta especificidade que o espectador visualiza a própria vida com o produto.\n\nRegra central: benefício genérico é invisível. Proibido: \"facilita sua vida\", \"praticidade\", \"revolucionário\", \"indispensável\". Todo gancho precisa de pelo menos UM elemento concreto: situação, momento do dia, número real, sentido físico (cheiro, som, toque) ou pessoa específica.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Benefícios reais: [LISTE O QUE O PRODUTO EFETIVAMENTE PROPORCIONA]\n- Público: [PÚBLICO]\n- Contextos de uso: [ONDE/QUANDO O PRODUTO ENTRA NA ROTINA]\n\nGere 12 ganchos de benefício usando estas 4 fórmulas (3 de cada), identificando a fórmula:\n\n1. CENA DO GANHO: o benefício encenado num momento específico da rotina (\"acordar e o café já estar na temperatura certa\").\n2. BENEFÍCIO + PARA QUEM: o ganho endereçado a uma pessoa específica (\"quem trabalha 8h sentado precisa saber disso\").\n3. GANHO ESCONDIDO: o benefício secundário que ninguém anuncia (\"todo mundo compra pelo X; eu fiquei pelo Y\").\n4. TRADUÇÃO FÍSICA: o benefício descrito por um sentido (\"o som da tampa vedando é a parte que ninguém te conta\").\n\nRegras adicionais:\n- Números só se estiverem nos benefícios que informei; caso contrário, marque [CONFIRMAR].\n- Cada gancho em no máximo 12 palavras.\n- Para cada gancho, indique entre parênteses qual benefício da minha lista ele traduz.\n\nDepois:\nFILTRO DO BANAL: releia os 12 e elimine você mesmo os que qualquer produto concorrente poderia usar igual. Entregue a lista final enxuta (mínimo 8) e explique em 1 frase por que os eliminados eram fracos.","e":"de preenchimento:**\n• Produto: garrafa térmica 1L com infusor\n• Benefícios: mantém gelado 24h, cabe no porta-copos, infusor para frutas, boca larga para gelo\n• Público: quem passa o dia fora de casa\n• Contextos: carro, trabalho, academia","u":"1. Rode o Transformador de Características em Benefícios (#075) antes, se ainda não tiver a lista — entrada melhor, gancho melhor.\n2. O \"filtro do banal\" embutido é o diferencial deste prompt: confie nele.\n3. \"Ganho escondido\" rende os melhores comentários (\"verdade! ninguém fala disso\").\n4. Ganchos de benefício funcionam especialmente como primeira linha de LEGENDA — reaproveite no Prompt #072.","p":"ChatGPT"},{"n":"044","t":"Hooks de Descoberta","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos de achado compartilhado: você (criador) encontrou algo que o público ainda não conhece e está contando \"por dentro\" — o mecanismo do \"achadinho\", da exclusividade, do segredo revelado. Diferente da curiosidade (#040), que abre uma lacuna sobre o conteúdo, a descoberta posiciona VOCÊ como quem garimpou. Use para produtos pouco conhecidos ou usos inesperados.","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\n• Produto\n• Como você realmente descobriu/encontrou o produto (história real)\n• O que ele tem de pouco conhecido\n• Público","c":"Atue como um copywriter de ganchos de \"descoberta\" para social commerce. O mecanismo: o criador como garimpeiro — \"eu achei, testei, e vou te contar antes de todo mundo\". O espectador fica pela sensação de acesso antecipado.\n\nRegras de honestidade:\n- A história de descoberta deve ser a REAL que vou informar (não invente \"achei por acaso\" se eu recebi da loja, por exemplo — nesse caso, a transparência vira o próprio gancho).\n- Proibido fabricar escassez ou exclusividade falsas (\"quase ninguém sabe\" só se for plausível pelo que informei).\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Como descobri de verdade: [CONTE A HISTÓRIA REAL]\n- O que ele tem de pouco conhecido: [FUNÇÃO, USO OU EXISTÊNCIA]\n- Público: [PÚBLICO]\n\nGere 12 ganchos de descoberta usando estas 4 fórmulas (3 de cada), identificando a fórmula:\n\n1. GARIMPO: a descoberta como achado pessoal (\"garimpei isso num canto da TikTok Shop e preciso contar\").\n2. USO SECRETO: o produto conhecido, a função ignorada (\"todo mundo usa pra X; ninguém sabe que faz Y\" — apenas se Y for real).\n3. ARREPENDIMENTO INVERTIDO: \"por que ninguém me contou isso antes\" (a dor de ter vivido sem).\n4. CÍRCULO INTERNO: compartilhar como quem conta para amigos próximos (\"vou te contar antes que todo mundo descubra\").\n\nRegras adicionais:\n- Cada gancho em até 12 palavras.\n- Para cada gancho, indique entre parênteses o tom de entrega (sussurrado/cúmplice, empolgado, confessional) — descoberta é 50% texto, 50% entrega.\n\nDepois:\nPONTE DE PROVA: para os 3 melhores, indique o que mostrar na tela logo após o gancho para provar que a descoberta vale (a descoberta prometida e não provada vira frustração).","e":"de preenchimento:**\n• Produto: fatiador de legumes 4 em 1\n• Como descobri: vi nos comentários de outro vídeo alguém mencionando, fui atrás\n• Pouco conhecido: a lâmina extra que faz espiral, escondida na base\n• Público: quem cozinha e não sabia que isso existia","u":"1. Conte a descoberta verdadeira — inclusive se for \"recebi para testar\": transparência declarada gera mais confiança que falso acaso.\n2. Grave a entrega no tom indicado nos parênteses; teste o mesmo gancho em tons diferentes.\n3. Combine com o Prompt #046 (produtos desconhecidos): descoberta é o mecanismo natural deles.\n4. \"Uso secreto\" só com função real e demonstrável — a prova vem logo atrás.","p":"Multiplataforma"},{"n":"045","t":"Hooks para Produtos de Baixo Preço","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos que usam o preço como protagonista: a surpresa do custo-benefício (\"isso custa MENOS que um lanche\"), a âncora de comparação e a compra sem culpa. Mecanismo: quebra da expectativa de valor. Com trava: preço muda — o prompt trabalha com faixas e exige confirmação do valor no dia da publicação.","q":"Afiliados • Vendedores • Iniciantes","i":":**\n• Produto\n• Faixa de preço atual (confira antes)\n• O que produtos \"equivalentes\" mais caros custam (se você verificou)\n• Público","c":"Atue como um copywriter de ganchos baseados em preço para social commerce. O mecanismo: a distância entre o valor percebido e o preço real gera a reação \"só isso?!\" — e a compra por impulso vive nessa distância.\n\nRegras obrigatórias:\n- Preços mudam. Use a FAIXA que vou informar e marque todo gancho com preço explícito com [CONFIRMAR PREÇO NO DIA DA PUBLICAÇÃO].\n- Comparações de preço só com âncoras que eu verifiquei ou com âncoras do cotidiano (um lanche, uma pizza) — nunca com números inventados de concorrentes.\n- Proibido \"de R$X por R$Y\" se eu não confirmar que a promoção é real: falsa promoção é enganosa.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Faixa de preço atual: [EX.: entre R$ 25 e R$ 35]\n- Âncoras que verifiquei (opcional): [EX.: versão de marca famosa custa ~R$ 120]\n- Público: [PÚBLICO]\n\nGere 12 ganchos usando estas 4 fórmulas (3 de cada), identificando a fórmula:\n\n1. ÂNCORA DO COTIDIANO: preço traduzido em algo banal (\"custa menos que o açaí de sexta\").\n2. EXPECTATIVA INVERTIDA: parecer caro e não ser (\"todo mundo acha que paguei caro nisso\").\n3. CONTA DE PADARIA: o custo diluído no uso (\"deu menos de X centavos por dia\" — calcule apenas com a faixa informada, e marque [CONFIRMAR]).\n4. RISCO ZERO PERCEBIDO: o preço como permissão para testar (\"pelo preço, testei sem medo — e olha no que deu\").\n\nRegras adicionais:\n- Até 12 palavras por gancho.\n- Para cada gancho, indique entre parênteses o momento de REVELAR o preço no vídeo: no gancho (âncora imediata) ou segurado para o meio (curiosidade) — varie.\n\nDepois:\nALERTA DE TOM: em 3 frases, explique como usar preço baixo sem desvalorizar o produto (barato ≠ vagabundo) — e reescreva 1 gancho que tenha caído nessa armadilha, se houver.","e":"de preenchimento:**\n• Produto: mini prensa de sanduíche\n• Faixa: R$ 40–50\n• Âncora verificada: sanduicheira de marca conhecida ~R$ 150\n• Público: estudantes e quem mora sozinho","u":"1. Confirme o preço na vitrine no dia de publicar — gancho com preço desatualizado gera comentário destruidor (\"tá R$ 70, mentiroso\").\n2. Prefira faixa (\"menos de R$ 50\") a valor exato: envelhece melhor.\n3. \"Risco zero percebido\" é o gancho de conversão para público cético — combine com prova no vídeo.\n4. Reuse as âncoras na legenda e nos comentários fixados (Módulo 6).","p":"ChatGPT"},{"n":"046","t":"Hooks para Produtos Desconhecidos","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos para produtos que o público nunca viu e não sabe que existem — onde o desafio é duplo: capturar atenção E explicar o que é, em segundos. Mecanismo: o estranhamento (\"que objeto é esse?\") ou o problema-primeiro (a dor conhecida apresenta a solução desconhecida). Use com produtos inovadores ou de nicho.","q":"Afiliados • Criadores de conteúdo • Criadores faceless","i":":**\n• Produto (com descrição visual detalhada — a IA precisa \"ver\" o objeto)\n• O problema conhecido que ele resolve\n• Público","c":"Atue como um copywriter especializado em lançar produtos desconhecidos em vídeo curto. O desafio: o espectador não busca esse produto, não reconhece esse produto e não sente falta dele. Você tem 3 segundos para criar o interesse do zero.\n\nExistem dois caminhos — use os dois:\nCAMINHO A (OBJETO-ENIGMA): explorar o estranhamento visual do produto (\"que diabo é isso?\") e revelar a função como resposta.\nCAMINHO B (PROBLEMA-PRIMEIRO): abrir pela dor que o público JÁ conhece e apresentar o produto como a solução que ele não sabia que existia.\n\nCONTEXTO:\n- Produto: [DESCRIÇÃO VISUAL DETALHADA — forma, tamanho, aparência]\n- Problema conhecido que resolve: [A DOR QUE O PÚBLICO JÁ SENTE]\n- Público: [PÚBLICO]\n\nGere 12 ganchos (6 de cada caminho), identificando o caminho:\n\nCAMINHO A — fórmulas: adivinhação (\"ninguém acerta pra que isso serve\"), uso em cena sem explicação (descreva a ação intrigante do segundo 1), preço-mistério (\"paguei R$X nisso e não me arrependo — espera pra ver o que faz\" [CONFIRMAR PREÇO]).\n\nCAMINHO B — fórmulas: dor + existência (\"existe um jeito de nunca mais X, e quase ninguém conhece\" — se plausível), arrependimento (\"passei anos fazendo X na mão; esse troço custa Y\" [CONFIRMAR]), pergunta-ponte (\"por que ninguém me mostrou isso antes de eu [DOR]?\").\n\nRegras:\n- No caminho A, o gancho DEVE indicar entre parênteses a cena exata do segundo 1 (o objeto em ação intrigante) — o enigma é visual, o texto só amplifica.\n- A revelação da função deve chegar em até 10 segundos: enigma longo demais vira abandono.\n- Não exagere a novidade (\"único no mundo\") sem que eu confirme.\n\nDepois:\nDIAGNÓSTICO: com base na descrição visual do produto, qual caminho tende a funcionar melhor para ELE (objeto visualmente intrigante → A; objeto banal com função surpreendente → B)? Justifique em 2 frases.","e":"de preenchimento:**\n• Produto: argola de silicone com hastes que segura sacolas no guidão/mão sem cortar os dedos\n• Problema: sacola de mercado cortando os dedos\n• Público: quem vai ao mercado a pé","u":"1. Capriche na descrição visual — o diagnóstico A/B depende de a IA \"enxergar\" o objeto.\n2. Siga o diagnóstico final, mas teste pelo menos 1 gancho de cada caminho: o público decide.\n3. A revelação em até 10s é regra dura: cronometre na edição.\n4. Combine com Hooks de Descoberta (#044) — desconhecido + achado é dupla natural.","p":"ChatGPT"},{"n":"047","t":"Hooks para Produtos em Tendência","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos que surfam a familiaridade de um produto que o público já viu circulando: \"o famosinho\", \"testei o viral\", \"vale o hype?\". Mecanismo: reconhecimento + posicionamento (aderir, verificar ou contrariar a tendência). Com trava: você só pode chamar de \"viral\" o que constatou de fato circulando — o prompt exige sua evidência.","q":"Afiliados • Criadores de conteúdo • Vendedores","i":":**\n• Produto\n• Evidência da tendência que VOCÊ constatou (quantos vídeos viu, onde, o que dizem)\n• Sua experiência real com o produto\n• Público","c":"Atue como um copywriter de ganchos para produtos em tendência no social commerce. O mecanismo: o espectador já viu o produto passar no feed — o gancho ativa esse reconhecimento e oferece um posicionamento novo sobre ele.\n\nRegra de verdade: só posso chamar de \"viral\"/\"famoso\" o que EU constatei circulando (vou fornecer a evidência). Se minha evidência for fraca, diga isso e sugira tratar como produto desconhecido (outro tipo de gancho).\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Evidência da tendência que constatei: [EX.: vi 8+ vídeos diferentes esta semana, aparece no meu feed direto, amigos comentando]\n- Minha experiência real com ele: [TESTEI? O QUE ACHEI?]\n- Público: [PÚBLICO]\n\nHá três posicionamentos possíveis frente à tendência — gere 4 ganchos de cada (12 no total), identificando o posicionamento:\n\n1. VERIFICADOR (\"comprei o viral para você não precisar\"): eu testo o hype e entrego o veredito. Fórmulas: julgamento suspenso (\"o famosinho chegou — será?\"), gasto assumido (\"gastei R$X no que todo mundo tá mostrando\" [CONFIRMAR PREÇO]).\n\n2. TRADUTOR (\"por que isso está em todo lugar\"): eu explico o fenômeno. Fórmulas: explicação prometida (\"o real motivo de você ver isso toda hora\"), bastidor (\"o detalhe que os vídeos virais não mostram\" — apenas se houver detalhe real da minha experiência).\n\n3. CONTRARIANTE (\"calma antes de comprar\"): eu freio o impulso com honestidade. Fórmulas: ressalva (\"o viral é bom, MAS ninguém te conta isso\"), público errado (\"se você é X, NÃO compre o famosinho\" — baseado na minha experiência real).\n\nRegras:\n- Todo veredito, ressalva ou bastidor deve sair da MINHA experiência informada — nada inventado.\n- Até 12 palavras por gancho.\n\nDepois:\nJANELA DE TEMPO: em 3 frases, explique por que ganchos de tendência têm validade curta e como saber (pelo meu próprio feed) quando o ciclo passou — e qual posicionamento envelhece melhor (dica: o contrariante).","e":"de preenchimento:**\n• Produto: copo térmico com canudo que todo mundo está mostrando\n• Evidência: 10+ vídeos no meu feed em 5 dias, colegas de trabalho com o copo\n• Experiência: uso há 2 semanas; mantém gelado mesmo, mas o canudo junta resíduo\n• Público: quem vive com o copo na mão","u":"1. Sem evidência real de tendência, volte ao Prompt #046 — fingir hype que não existe soa falso na hora.\n2. O posicionamento CONTRARIANTE diferencia num mar de vídeos iguais e constrói autoridade — use se sua experiência sustentar.\n3. Aja rápido: tendência tem janela. Priorize esses vídeos no calendário da semana.\n4. O veredito do \"verificador\" alimenta um review completo depois (Prompt #025).","p":"ChatGPT"},{"n":"048","t":"Hooks para UGC","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos com textura de conversa real — os que abrem um vídeo UGC sem soar como abertura de vídeo: começam no meio do assunto, como uma amiga que não aguentou e precisou contar. Mecanismo: quebra do padrão \"anúncio\" nos primeiros segundos. Use junto com o Prompt #035.","q":"Criadores de conteúdo • Afiliados • Iniciantes","i":":**\n• Produto\n• Sua experiência real\n• Como você fala de verdade (expressões suas, gírias, jeito)\n• Público","c":"Atue como um diretor de UGC especializado em aberturas que soam humanas. O teste de qualidade: se a frase pudesse abrir um comercial, ela está errada. Se pudesse abrir um áudio de WhatsApp para uma amiga, está certa.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Minha experiência real: [O QUE VIVI COM O PRODUTO]\n- Como eu falo de verdade: [SUAS EXPRESSÕES, GÍRIAS, VÍCIOS DE FALA — ex.: \"gente\", \"juro\", \"tipo assim\"]\n- Público: [PÚBLICO]\n\nGere 12 ganchos UGC usando estas 4 texturas (3 de cada), identificando a textura:\n\n1. MEIO DA CONVERSA: começar como se a câmera tivesse ligado no meio de um papo (\"...e foi aí que eu descobri que o problema nunca foi a panela\").\n2. URGÊNCIA DE CONTAR: a pessoa que não segurou a novidade (\"para tudo que eu preciso te mostrar uma coisa\").\n3. RELUTÂNCIA SINCERA: quem não queria gostar/indicar e se rendeu (\"eu jurava que isso era besteira de internet\").\n4. RESPOSTA IMAGINÁRIA: responder a uma pergunta que \"alguém fez\" (\"me perguntaram se isso funciona mesmo — senta que lá vem\").\n\nRegras:\n- Use MINHAS expressões informadas dentro dos ganchos (é isso que os torna meus).\n- Frases com respiração de fala: contrações, reticências, ordem coloquial. Proibido: qualquer construção de locutor.\n- Cada gancho deve nascer da minha experiência real informada.\n- Para cada gancho, indique entre parênteses a cena UGC de fundo (onde estou, o que estou fazendo — cozinha bagunçada, carro, closet).\n\nDepois:\nTESTE DO ÁUDIO DE WHATSAPP: releia os 12 e marque com ⚠️ qualquer um que soaria estranho num áudio para uma amiga. Reescreva os marcados.","e":"de preenchimento:**\n• Produto: sérum facial\n• Experiência: uso há 1 mês, melhorou textura, demorei a ver resultado nas 2 primeiras semanas\n• Como falo: \"gente do céu\", \"óbvio que\", \"vou ser sincera\"\n• Público: mulheres 25–40 céticas com skincare de internet","u":"1. Informe seu jeito de falar de verdade — é o ingrediente que nenhum concorrente copia.\n2. Grave os ganchos falando, não lendo; o texto é mapa, não script.\n3. A textura \"relutância sincera\" é a mais forte para público cético.\n4. Emende com o esqueleto de fala do Prompt #035 — gancho UGC + corpo UGC.","p":"ChatGPT"},{"n":"049","t":"Hooks para Vídeos Faceless","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos para vídeos sem rosto, onde a captura é feita por outro par: ação visual do segundo 1 + texto na tela. Este prompt não gera frases soltas — gera DUPLAS (cena + overlay) que trabalham juntas, porque no faceless a imagem é o gancho e o texto é o amplificador. Use com o Módulo 9.","q":"Criadores faceless • Afiliados • Usuários que trabalham com IA","i":":**\n• Produto\n• Recursos visuais disponíveis (produto em mãos, cenas que consegue filmar)\n• Dores do público\n• Subformato faceless (mãos, POV, b-roll, texto na tela)","c":"Atue como um diretor de ganchos para vídeos faceless. Princípio: sem rosto humano, quem prende o olhar no segundo 1 é o MOVIMENTO/AÇÃO na tela; o texto overlay direciona a interpretação. Gancho faceless é sempre uma DUPLA: cena + texto.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- O que consigo filmar: [EX.: minhas mãos usando o produto, minha cozinha, POV das minhas tarefas]\n- Dores do público: [COLE]\n- Subformato: [MÃOS+PRODUTO / POV / NARRAÇÃO+B-ROLL / TEXTO NA TELA]\n\nGere 12 duplas de gancho usando estes 4 mecanismos visuais (3 de cada), identificando o mecanismo:\n\n1. AÇÃO INTERROMPIDA: a cena abre no meio de um movimento que exige conclusão (mão despejando algo, objeto caindo, zíper abrindo) + texto que contextualiza a dor ou promessa.\n2. ERRO EM CENA: o quadro mostra algo visivelmente errado/incômodo (bagunça, mancha, objeto quebrado em uso) + texto de identificação (\"sua gaveta também é assim?\").\n3. SATISFAÇÃO IMEDIATA: abrir direto no momento mais visualmente prazeroso do produto (encaixe perfeito, limpeza saindo, organização pronta se revelando) + texto de curiosidade ou benefício.\n4. CONTAGEM/PROMESSA GRÁFICA: abrir com elemento gráfico que estrutura o vídeo (\"3 usos que ninguém conhece — nº 3 é o melhor\") + cena do produto em ação por trás.\n\nPara cada dupla, entregue:\n- CENA (o que exatamente está acontecendo no quadro nos segundos 0–2, filmável com meus recursos)\n- TEXTO OVERLAY (máx. 7 palavras — na tela, texto longo não é lido)\n- [se meu subformato tiver narração] PRIMEIRA FRASE FALADA (pode diferir do overlay — voz e texto se complementam, não se repetem)\n\nDepois:\nREGRA DOS 7 PALAVRAS: confirme que nenhum overlay passou de 7 palavras; encurte os que passaram.\nPRIORIDADE: indique as 3 duplas mais fáceis de filmar HOJE com meus recursos.","e":"de preenchimento:**\n• Produto: dispenser de detergente com base para esponja\n• Consigo filmar: minhas mãos, minha pia (com louça real)\n• Dores: \"detergente escorrendo pela pia\", \"esponja largada molhando tudo\"\n• Subformato: mãos + produto, sem narração","u":"1. Escolha o subformato antes (Prompt #019/#036) — as duplas são desenhadas para ele.\n2. Filme as 3 duplas prioritárias numa sessão só; o gancho faceless se testa barato.\n3. Overlay passou de 7 palavras na edição? Corte palavras, não diminua a fonte.\n4. Voz e texto diferentes (quando houver narração) dobram a informação sem dobrar o tempo — use.","p":"ChatGPT"},{"n":"050","t":"Hooks de Storytelling","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar aberturas in media res para vídeos de história: começar dentro da cena crítica, no ponto de maior tensão, sem preâmbulo. Mecanismo: o espectador cai no meio de algo já acontecendo e fica para entender. Par natural do Prompt #031 — use as histórias mineradas lá.","q":"Criadores de conteúdo • Afiliados • Iniciantes","i":":**\n• A história real (do Prompt #031 ou contada aqui)\n• Produto e onde ele entra\n• Público","c":"Atue como um roteirista de aberturas narrativas para vídeo curto. Técnica central: IN MEDIA RES — abrir dentro da cena, no momento de maior tensão ou estranheza, e deixar o contexto para depois. Proibido: \"deixa eu te contar uma história\", \"tudo começou quando\", \"oi gente, hoje vou falar\".\n\nCONTEXTO:\n- Minha história real: [COLE A HISTÓRIA — de preferência estruturada pelo Prompt #031]\n- Produto e onde ele entra na história: [PRODUTO + PAPEL NA VIRADA]\n- Público: [PÚBLICO]\n\nPrimeiro:\n1. MAPA DE TENSÃO\nIdentifique na minha história os 3 momentos de maior tensão/estranheza/vergonha — os pontos onde a abertura pode \"cair\".\n\n2. NOVE ABERTURAS IN MEDIA RES\nPara cada um dos 3 momentos, escreva 3 aberturas (9 no total) usando estas técnicas (1 de cada por momento):\n- FALA DA CENA: abrir com o diálogo/pensamento exato daquele momento (\"'você não ia chegar mais cedo?' — e eu travada no closet\").\n- DETALHE FÍSICO: abrir pelo detalhe sensorial concreto (\"o barulho da campainha e a pia daquele jeito\").\n- CONSEQUÊNCIA PRIMEIRO: abrir pelo resultado e voltar (\"perdi a entrevista por causa de uma camisa. Deixa eu explicar\").\n\n3. PONTE DE CONTEXTO\nPara as 3 melhores aberturas, escreva a frase seguinte — a que entrega o contexto mínimo em 1 linha sem matar o ritmo.\n\nRegras:\n- Tudo deve sair da MINHA história real: não adicione dramas, pessoas ou fatos.\n- Até 15 palavras por abertura (histórias toleram um pouco mais que ganchos secos).\n- Indique entre parênteses o que está na TELA durante cada abertura (a cena reencenada, foto real da época, ou eu falando para a câmera).","e":"de preenchimento:**\n• História: atrasei para entrevista porque morava entre caixas pós-mudança e não achava a camisa; comprei organizador às 2h da manhã de raiva; hoje acho tudo\n• Produto: organizador modular — entra na virada\n• Público: quem mora em imóvel pequeno","u":"1. Rode o Prompt #031 antes — história estruturada gera aberturas melhores.\n2. Grave a mesma história com 2 aberturas diferentes e compare a retenção dos 5 primeiros segundos.\n3. A \"ponte de contexto\" é o que evita o abandono do segundo 5: não improvise essa frase.\n4. Aberturas por \"fala da cena\" pedem entrega atuada — ensaie o tom.","p":"Claude"},{"n":"051","t":"Hooks de Comparação","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos de duelo: \"X ou Y?\", \"parei de usar X no dia em que...\", \"a diferença que ninguém te mostra\". Mecanismo: o cérebro não resiste a um versus — a comparação anunciada cria expectativa de veredito. Par natural do Prompt #029, com a mesma regra: categorias e métodos, nunca marcas de terceiros nomeadas.","q":"Afiliados • Vendedores • Criadores de conteúdo","i":":**\n• Produto\n• Contra o que compara (método antigo / alternativa genérica / faixa de preço)\n• O que você verificou dos dois lados (Prompt #029)\n• Público","c":"Atue como um copywriter de ganchos comparativos para vídeo curto. O mecanismo: anunciar um duelo cria a expectativa de um vencedor — e o espectador fica para o veredito.\n\nRegras:\n- Comparar com MÉTODOS e CATEGORIAS (\"o jeito antigo\", \"as versões baratas em geral\"), nunca com marcas de terceiros nomeadas.\n- O duelo anunciado deve existir no vídeo, com os dois lados mostrados — gancho de comparação sem comparação real é clickbait.\n- Vereditos e diferenças apenas com base no que eu verifiquei.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Comparado com: [MÉTODO ANTIGO / ALTERNATIVA GENÉRICA / OUTRA FAIXA — descreva]\n- O que verifiquei dos dois lados: [COLE — de preferência do Prompt #029]\n- Público: [PÚBLICO]\n\nGere 12 ganchos usando estas 4 fórmulas (3 de cada), identificando a fórmula:\n\n1. DUELO DECLARADO: o versus explícito com veredito prometido (\"esponja de R$2 contra isso aqui — o resultado me irritou\").\n2. ABANDONO: a troca como história (\"o dia em que aposentei o rodo comum\").\n3. DIFERENÇA ESCONDIDA: prometer o detalhe que separa os dois (\"a diferença aparece no 3º dia — ninguém mostra isso\").\n4. DEFESA DO ANTIGO: começar defendendo a alternativa para surpreender (\"o jeito antigo funciona. Mas tem um custo que ninguém soma\").\n\nRegras adicionais:\n- Até 12 palavras.\n- Para cada gancho, indique entre parênteses a cena de abertura (idealmente os DOIS lados no quadro desde o segundo 1 — o duelo visual instala o gancho antes da fala).\n\nDepois:\nCHECAGEM DE JUSTIÇA: aponte qualquer gancho que prometa um massacre unilateral e reescreva-o admitindo o ponto forte do outro lado — comparação justa retém o cético, que é quem mais compra depois.","e":"de preenchimento:**\n• Produto: escova elétrica de limpeza\n• Comparado com: escova manual comum\n• Verifiquei: elétrica limpou rejunte na metade do tempo; manual é mais barata e não depende de carga\n• Público: quem faz faxina pesada","u":"1. Rode o Prompt #029 antes: os ganchos precisam dos fatos verificados de lá.\n2. Coloque os dois objetos no quadro desde o início — o gancho visual chega antes do falado.\n3. \"Defesa do antigo\" é o gancho que desarma o cético; use quando os comentários duvidarem.\n4. O veredito \"depende de você\" do Prompt #029 vale também aqui: honestidade no fim sustenta o gancho do início.","p":"Multiplataforma"},{"n":"052","t":"Hooks para Estimular Comentários","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Criar ganchos desenhados para gerar conversa: divisão de opinião legítima, lacuna para o público completar, pergunta com resposta pessoal. Comentário é o sinal de engajamento que mais alimenta distribuição — e este prompt o provoca sem rage bait, sem mentira e sem pergunta vazia (\"e vocês, o que acham?\" não conta).","q":"Criadores de conteúdo • Afiliados • Criadores faceless","i":":**\n• Produto e nicho\n• Divisões de opinião reais que existem no seu nicho\n• Público","c":"Atue como um estrategista de engajamento para vídeo curto. Objetivo: ganchos que fazem o espectador PRECISAR responder — porque tem opinião formada, experiência própria ou discordância legítima.\n\nRegras éticas obrigatórias:\n- Proibido rage bait (irritar de propósito com absurdo), desinformação provocativa e polêmica ofensiva.\n- A divisão de opinião deve ser REAL e leve (gosto, hábito, time A vs time B) — nunca fabricada nem sobre temas sensíveis.\n- Pergunta genérica no fim do vídeo não é estratégia; o estímulo deve estar no GANCHO, estruturando o vídeo inteiro.\n\nCONTEXTO:\n- Produto: [PRODUTO]\n- Nicho: [NICHO]\n- Divisões de opinião reais do meu nicho: [EX.: lava a louça antes da lava-louças ou não; café coado vs cápsula]\n- Público: [PÚBLICO]\n\nGere 12 ganchos usando estes 4 mecanismos (3 de cada), identificando o mecanismo:\n\n1. TIME A vs TIME B: forçar a escolha de lado numa divisão real (\"existem dois tipos de pessoa: quem lava antes e quem confia\").\n2. OPINIÃO ASSUMIDA: declarar uma posição discutível (e defensável) minha (\"vou falar: esponja dupla face deveria ser aposentada\").\n3. COMPLETE A FRASE: estrutura com lacuna que o público preenche (\"a coisa mais inútil da sua cozinha é ______ — a minha era isso aqui\").\n4. CONFISSÃO CONVOCATÓRIA: assumir um hábito \"errado\" e perguntar quem mais (\"eu uso a mesma tábua pra tudo. Me julga ou me entende?\").\n\nRegras adicionais:\n- Para cada gancho, indique entre parênteses a PERGUNTA-SEMENTE para eu fixar nos comentários (o primeiro comentário meu que abre a conversa).\n- Até 12 palavras por gancho.\n\nDepois:\nPLANO DE COLHEITA: em 4 frases, o que fazer com os comentários gerados — responder cedo, fixar o melhor, e transformar os mais repetidos em pauta (vídeo de reação, Prompt #033).","e":"de preenchimento:**\n• Produto: escorredor de louça dobrável\n• Nicho: cozinha/organização\n• Divisões reais: louça no escorredor à mostra vs guardada na hora; lavar conforme usa vs acumular\n• Público: quem cuida da própria casa","u":"1. Liste divisões que EXISTEM no seu nicho — a IA estrutura, mas a polêmica legítima vem da sua vivência.\n2. Publique e responda os primeiros comentários em minutos: conversa gera conversa.\n3. Use a \"pergunta-semente\" como comentário fixado — ela dobra a taxa de resposta.\n4. Execute o \"plano de colheita\": comentário repetido é pauta validada de graça.","p":"ChatGPT"},{"n":"053","t":"Criador dos Primeiros 3 Segundos","m":4,"mn":"GANCHOS E RETENÇÃO","o":"Projetar (ou auditar) o pacote completo dos 3 primeiros segundos: primeiro quadro, movimento, texto na tela, primeira fala e som — os ci
